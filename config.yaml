proxy-groups:
- name: AI
  type: fallback
  interval: 300
  include-all: true
  exclude-filter: 🇷🇺|Russia|Россия|Беларусь|Казахстан
- name: PROXY
  type: url-test
  interval: 300
  include-all: true
  exclude-filter: 🇷🇺|Russia|Россия|Kazakhstan
- name: PROXY-RU
  type: url-test
  interval: 60
  include-all: true
  filter: 🇷🇺|Russia|Россия
- name: YOUTUBE
  type: url-test
  interval: 30
  proxies:
  - PROXY-RU
  - PROXY
- name: INSTAGRAM
  type: fallback
  proxies:
  - PROXY
  - PROXY-RU
rules:
- DOMAIN-KEYWORD,4pda,PROXY
- DOMAIN-SUFFIX,ip.wtf,PROXY
- RULE-SET,telegram,PROXY
- RULE-SET,trae,PROXY
- RULE-SET,tik-tok,PROXY
- RULE-SET,whatsapp,PROXY
- RULE-SET,google-ai,PROXY

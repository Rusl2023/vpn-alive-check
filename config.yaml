# Mihomo Config (ssclash)
# Generated: 2026-06-21 02:17 UTC
# Proxies: 34

mode: rule
tproxy-port: 7894
tun:
  enable: true
  device: clash-tun
  stack: gvisor
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
ipv6: false
log-level: warning
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
external-ui: ./ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  default-nameserver:
  - 9.9.9.9
  - 149.112.112.112
  nameserver:
  - https://dns.quad9.net/dns-query
  - https://dns10.quad9.net/dns-query
  nameserver-policy:
    +.lan: system
    '*.lan': system
    msftconnecttest.com: system
    msftncsi.com: system
    kion.ru: system
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
  - '*.4pda.to'
  - '*.4pda.ws'
  - ip.wtf
  - '*.ip.wtf'
  - workspace.turns.goog
  - '*.workspace.turns.goog'
  - meet.turns.goog
  - '*.meet.turns.goog'
  - meet.google.com
  - '*.meet.google.com'
keep-alive-idle: 15
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
routing-mark: 2
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080
      - 8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.lan
  - +.msftncsi.com
  - +.openwrt.org
  - +.vsean.net
  - cudy.net

name: Check Alive White-List Proxies for RF BS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: alive-whitelist-bs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run filter + real TCP check
        run: |
          python3 << 'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os
          import re
          import socket
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          import requests

          OUTPUT_DIR = "githubmirror"
          OUTPUT_FILE = os.path.join(OUTPUT_DIR, "alive_whitelist_bs.txt")
          MAX_WORKERS = 40
          MAX_FINAL = 50
          TCP_TIMEOUT = 4.0

          # Только те источники, в которых у тебя были живые ключи
          CONFIG_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
          ]

          # Приоритетные SNI для белых списков
          PREFERRED_SNI = {
              "max.ru", "yandex.ru", "ya.ru", "dzen.ru",
              "ozon.ru", "www.ozon.ru", "vk.com", "stats.vk-portal.net",
              "queuev4.vk.com", "ok.ru", "mail.ru"
          }

          def download(url: str) -> str:
              try:
                  r = requests.get(url, timeout=12, headers={"User-Agent": "Mozilla/5.0"})
                  if r.status_code == 200:
                      return r.text
              except Exception:
                  pass
              return ""

          def resolve_ip(host: str):
              try:
                  return socket.gethostbyname(host)
              except Exception:
                  return None

          def parse_link(link: str):
              try:
                  original = link.strip()
                  if not original.startswith("vless://"):
                      return None

                  clean = original.split("#")[0].strip()
                  u = urllib.parse.urlparse(clean)
                  if u.scheme != "vless" or not u.hostname or not u.username:
                      return None

                  q = urllib.parse.parse_qs(urllib.parse.unquote(u.query))
                  security = (q.get("security") or ["none"])[0].lower()
                  flow = (q.get("flow") or [""])[0].lower()
                  net = (q.get("type") or ["tcp"])[0].lower()
                  sni = (q.get("sni") or [""])[0].lower().strip()
                  pbk = (q.get("pbk") or [""])[0]
                  port = int(u.port) if u.port else 443

                  # Предпочитаем Reality + Vision + TCP
                  is_reality = (security == "reality" and "vision" in flow and net in ("tcp", "raw"))
                  is_ws = (net == "ws" and security in ("tls", "none"))

                  if not (is_reality or is_ws):
                      return None

                  if is_reality and (not pbk or len(pbk) < 20):
                      return None

                  score = 50
                  if is_reality:
                      score += 40
                      if sni in PREFERRED_SNI:
                          score += 20
                  if is_ws:
                      score += 15

                  return {
                      "link": clean,
                      "host": u.hostname,
                      "port": port,
                      "sni": sni or u.hostname,
                      "uuid": u.username,
                      "type": "reality" if is_reality else "ws",
                      "score": score,
                      "key": f"{u.username}|{u.hostname}|{port}"
                  }
              except Exception:
                  return None

          def tcp_check(host: str, port: int) -> bool:
              try:
                  with socket.create_connection((host, port), timeout=TCP_TIMEOUT):
                      return True
              except Exception:
                  return False

          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)

              all_raw = []
              for url in CONFIG_URLS:
                  text = download(url)
                  found = re.findall(r"vless://[^\s<>\"']+", text, re.IGNORECASE)
                  print(f"[+] {url.split('/')[-1]}: {len(found)}")
                  all_raw.extend(found)

              unique_raw = list(dict.fromkeys(all_raw))
              print(f"[✓] unique raw: {len(unique_raw)}")

              candidates = []
              seen_keys = set()
              for link in unique_raw:
                  cfg = parse_link(link)
                  if cfg and cfg["key"] not in seen_keys:
                      seen_keys.add(cfg["key"])
                      candidates.append(cfg)

              print(f"[✓] after parse: {len(candidates)}")

              # Резолвим IP и убираем дубли по IP+Port
              alive = []
              seen_ips = set()

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
                  # Сначала проверяем TCP
                  futs = {pool.submit(tcp_check, c["host"], c["port"]): c for c in candidates}
                  for fut in as_completed(futs):
                      cfg = futs[fut]
                      try:
                          if fut.result():
                              ip = resolve_ip(cfg["host"])
                              if ip:
                                  ip_key = f"{ip}|{cfg['port']}"
                                  if ip_key not in seen_ips:
                                      seen_ips.add(ip_key)
                                      cfg["ip"] = ip
                                      alive.append(cfg)
                      except Exception:
                          pass

              print(f"[✓] TCP alive + unique IP: {len(alive)}")

              # Сортировка
              alive.sort(key=lambda x: (-x["score"], x["host"]))
              final = alive[:MAX_FINAL]

              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              header = [
                  "# profile-title: Alive RF BS (only working sources)",
                  "# profile-update-interval: 1",
                  f"# Updated: {now}",
                  f"# Count: {len(final)}",
                  "# Sources: igareck + zieng2 + VOID + whoahaow",
                  "# Deduplicated by UUID+Host+Port and by IP",
                  "# TCP port checked",
                  ""
              ]

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(header))
                  for c in final:
                      tag = f"#{c['type'].upper()}|{c['sni'].replace('.', '_')}"
                      f.write(c["link"] + tag + "\n")

              print(f"[✓] Saved {len(final)} keys → {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/alive_whitelist_bs.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update alive_whitelist_bs.txt (only 4 working sources) $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

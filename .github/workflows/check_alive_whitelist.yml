name: Check Alive Keys for Karing (Top 150 Best)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: karing-alive-keys
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Validate and collect TOP keys
        run: |
          python3 << 'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os
          import re
          import socket
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          import requests

          OUTPUT_DIR = "githubmirror"
          OUTPUT_FILE = os.path.join(OUTPUT_DIR, "karing_alive_keys.txt")
          MAX_WORKERS = 60
          MAX_OUTPUT_KEYS = 150  # !!! ОГРАНИЧЕНИЕ: сохраняем только топ-150 лучших !!!

          SUBSCRIPTION_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/coloramamoe/vless-parser/main/githubmirror/ru-sni-best-vless.txt",
              "https://raw.githubusercontent.com/coloramamoe/vless-parser/main/githubmirror/whitelist-vless.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/ru_configs.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/verified_configs.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/sashalsk/v2ray/main/v2_config.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/Config.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt"
          ]

          def download(url: str) -> str:
              try:
                  r = requests.get(url, timeout=10, headers={"User-Agent": "Karing/1.2.25.2802 platform/android"})
                  if r.status_code == 200:
                      return r.text
              except Exception:
                  pass
              return ""

          def validate_link(link: str):
              try:
                  link = link.strip()
                  if not link or link.startswith('#'):
                      return None

                  if link.startswith('vless://'):
                      return validate_vless(link)
                  elif link.startswith('hysteria2://') or link.startswith('hy2://'):
                      return validate_hysteria2(link)
                  elif link.startswith('trojan://'):
                      return validate_trojan(link)
                  return None
              except Exception:
                  return None

          def validate_vless(link: str):
              try:
                  base = link.split('#')[0]
                  match = re.match(r'vless://([^@]+)@([^:]+):(\d+)', base)
                  if not match:
                      return None
                  
                  uuid, host, port = match.groups()
                  port = int(port)
                  
                  try:
                      socket.gethostbyname(host)
                  except Exception:
                      return None
                  
                  params_str = link.split('?', 1)[1].split('#')[0] if '?' in link else ""
                  params_dict = urllib.parse.parse_qs(urllib.parse.unquote(params_str))
                  
                  security = params_dict.get('security', ['none'])[0]
                  sni = params_dict.get('sni', [host])[0]
                  flow = params_dict.get('flow', [''])[0]
                  
                  config_type = "Reality" if security == 'reality' else "TLS" if security == 'tls' else "Plain"
                  
                  score = 50
                  if security == 'reality' and 'vision' in flow:
                      score = 100
                  elif security == 'tls':
                      score = 80
                  
                  white_domains = ['yandex.ru', 'dzen.ru', 'max.ru', 'ozon.ru', 'vk.com', 'mail.ru', 'wb.ru', 'tbank.ru', 'sberbank.ru', '4subnodes', 'apicdn', 'cloudflare']
                  if any(sni.endswith(d) or d in sni for d in white_domains):
                      score += 20
                  
                  name = link.split('#')[-1] if '#' in link else "VLESS"
                  return {'link': link, 'host': host, 'port': port, 'config_type': config_type, 'sni': sni, 'score': score, 'name': name}
              except Exception:
                  return None

          def validate_hysteria2(link: str):
              try:
                  base = link.split('#')[0]
                  match = re.match(r'hysteria2://([^@]+)@([^:]+):(\d+)', base)
                  if not match: return None
                  host, port = match.group(2), int(match.group(3))
                  try: socket.gethostbyname(host)
                  except Exception: return None
                  return {'link': link, 'host': host, 'port': port, 'config_type': 'Hysteria2', 'sni': host, 'score': 70, 'name': 'Hysteria2'}
              except Exception:
                  return None

          def validate_trojan(link: str):
              try:
                  base = link.split('#')[0]
                  match = re.match(r'trojan://([^@]+)@([^:]+):(\d+)', base)
                  if not match: return None
                  host, port = match.group(2), int(match.group(3))
                  try: socket.gethostbyname(host)
                  except Exception: return None
                  return {'link': link, 'host': host, 'port': port, 'config_type': 'Trojan', 'sni': host, 'score': 60, 'name': 'Trojan'}
              except Exception:
                  return None

          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)
              all_links = []
              
              for url in SUBSCRIPTION_URLS:
                  text = download(url)
                  links = re.findall(r'(vless://[^\s<>"]+|hysteria2://[^\s<>"]+|trojan://[^\s<>"]+)', text)
                  all_links.extend(links)
              
              print(f"[✓] Total raw links found: {len(all_links)}")
              
              validated = []
              seen = set()
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                  for item in executor.map(validate_link, all_links):
                      if item and item['link'] not in seen:
                          seen.add(item['link'])
                          validated.append(item)
              
              print(f"[✓] Valid unique links: {len(validated)}")
              
              # Сортируем по убыванию скора (лучшие первые)
              validated.sort(key=lambda x: -x['score'])
              
              # !!! БЕРЕМ ТОЛЬКО ТОП-150 !!!
              final_keys = validated[:MAX_OUTPUT_KEYS]
              print(f"[✓] Selected TOP {len(final_keys)} keys for output.")
              
              # Печатаем первые 3 ключа в лог, чтобы ты видел, что они есть
              print("\n--- PREVIEW OF FIRST 3 KEYS ---")
              for k in final_keys[:3]:
                  print(f"Score: {k['score']} | {k['config_type']} | {k['sni']}")
              print("---------------------------------\n")

              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              repo = os.environ.get('GITHUB_REPOSITORY', 'user/repo')
              
              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write(f"# Karing Alive Keys (TOP {MAX_OUTPUT_KEYS})\n")
                  f.write(f"# Updated: {now}\n")
                  f.write(f"# Filtered from {len(validated)} valid keys. Only highest score (Reality/White SNI/CDN) kept.\n")
                  f.write(f"# Raw URL for Karing: https://raw.githubusercontent.com/{repo}/main/{OUTPUT_FILE}\n")
                  f.write("#" + "="*60 + "\n\n")
                  
                  for item in final_keys:
                      tag = f"#{item['config_type']}|{item['sni'].replace('.', '_')}|Score:{item['score']}"
                      clean_link = item['link'].rsplit('#', 1)[0] if '#' in item['link'] else item['link']
                      f.write(clean_link + tag + "\n")
              
              print(f"[✓] Successfully saved {len(final_keys)} keys to {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/karing_alive_keys.txt || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update top 150 alive keys for Karing $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
          

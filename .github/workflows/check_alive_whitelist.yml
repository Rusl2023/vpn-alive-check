name: Check Alive White-List Proxies for RF BS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: alive-whitelist
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run filter (Reality + good WS)
        run: |
          python3 << 'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os
          import re
          import socket
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          import requests

          OUTPUT_DIR = "githubmirror"
          OUTPUT_FILE = os.path.join(OUTPUT_DIR, "alive_whitelist_bs.txt")
          MAX_WORKERS = 40
          TCP_TIMEOUT = 5
          MAX_FINAL = 60

          CONFIG_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/coloramamoe/vless-parser/main/githubmirror/ru-sni-best-vless.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/ru_configs.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/verified_configs.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
          ]

          WHITE_SNI = {
              "max.ru", "yandex.ru", "ya.ru", "dzen.ru",
              "www.ozon.ru", "ozon.ru",
              "stats.vk-portal.net", "queuev4.vk.com", "vk.com",
              "login.vk.com", "ok.ru",
          }

          def download(url: str) -> str:
              try:
                  r = requests.get(url, timeout=14, headers={"User-Agent": "Mozilla/5.0"})
                  if r.status_code == 200:
                      return r.text
              except Exception:
                  pass
              return ""

          def parse_link(link: str):
              try:
                  original = link.strip()
                  clean = original.split("#")[0].strip()
                  u = urllib.parse.urlparse(clean)
                  if u.scheme != "vless" or not u.hostname or not u.username:
                      return None

                  q = urllib.parse.parse_qs(u.query)
                  net = (q.get("type") or ["tcp"])[0].lower()
                  security = (q.get("security") or ["none"])[0].lower()
                  sni = (q.get("sni") or [""])[0].lower().strip()
                  host = (q.get("host") or [""])[0].lower().strip()
                  flow = (q.get("flow") or [""])[0].lower()
                  pbk = (q.get("pbk") or [""])[0]
                  sid = (q.get("sid") or [""])[0]
                  port = int(u.port) if u.port else 443
                  path = (q.get("path") or ["/"])[0]

                  # ===== Reality (высокий приоритет) =====
                  if security == "reality" and net == "tcp" and "vision" in flow:
                      if sni in WHITE_SNI and pbk and len(pbk) > 20:
                          return {
                              "type": "reality",
                              "link": clean,
                              "host": u.hostname,
                              "port": port,
                              "sni": sni,
                              "uuid": u.username,
                              "key": f"{u.username}|{u.hostname}|{port}|reality",
                              "score": 100 if sni in ("max.ru", "yandex.ru", "ya.ru") else 80
                          }

                  # ===== Хороший WS + TLS (то, что у тебя реально работало) =====
                  if net == "ws" and security in ("tls", "none"):
                      # Требуем нормальный host или sni
                      good_host = host or sni
                      if good_host and len(good_host) > 5 and "." in good_host:
                          # Бонус если похоже на CDN / 4subnodes
                          bonus = 30 if "4subnodes" in good_host or "apicdn" in good_host else 0
                          return {
                              "type": "ws",
                              "link": clean,
                              "host": u.hostname,
                              "port": port,
                              "sni": sni or host,
                              "uuid": u.username,
                              "key": f"{u.username}|{u.hostname}|{port}|ws",
                              "score": 70 + bonus
                          }

                  return None
              except Exception:
                  return None

          def tcp_check(host: str, port: int) -> bool:
              try:
                  with socket.create_connection((host, port), timeout=TCP_TIMEOUT):
                      return True
              except Exception:
                  return False

          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)

              all_raw = []
              for url in CONFIG_URLS:
                  text = download(url)
                  found = re.findall(r"vless://[^\s<>\"']+", text, re.IGNORECASE)
                  print(f"[+] {url.split('/')[-1]}: {len(found)}")
                  all_raw.extend(found)

              unique_raw = list(dict.fromkeys(all_raw))
              print(f"[✓] unique raw: {len(unique_raw)}")

              candidates = []
              seen = set()
              for link in unique_raw:
                  cfg = parse_link(link)
                  if cfg and cfg["key"] not in seen:
                      seen.add(cfg["key"])
                      candidates.append(cfg)

              print(f"[✓] after filter (Reality+WS): {len(candidates)}")

              alive = []
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
                  futures = {pool.submit(tcp_check, c["host"], c["port"]): c for c in candidates}
                  for fut in as_completed(futures):
                      cfg = futures[fut]
                      try:
                          if fut.result():
                              alive.append(cfg)
                      except Exception:
                          pass

              print(f"[✓] TCP alive: {len(alive)}")

              # Сортировка: сначала высокий score, потом Reality выше WS
              alive.sort(key=lambda x: (-x["score"], 0 if x["type"] == "reality" else 1))

              final = alive[:MAX_FINAL]

              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              header = [
                  "# profile-title: Alive BS (Reality + working WS)",
                  "# profile-update-interval: 1",
                  f"# Updated: {now}",
                  f"# Count: {len(final)}",
                  "# Includes: Reality (white SNI + Vision) + clean WS+TLS",
                  "# Based on real user feedback: WS from 4subnodes-style worked",
                  "",
              ]

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(header))
                  for c in final:
                      # Добавляем понятный комментарий
                      tag = f"#{c['type'].upper()}|{c['sni']}"
                      f.write(c["link"] + tag + "\n")

              print(f"[✓] Saved {len(final)} keys → {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/alive_whitelist_bs.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Fix: include working WS + Reality $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

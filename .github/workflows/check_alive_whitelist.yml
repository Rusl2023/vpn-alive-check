name: Check Alive White-List Proxies for RF BS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: alive-whitelist-bs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run hybrid filter (Reality + working WS)
        run: |
          python3 << 'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os
          import re
          import socket
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          import requests

          OUTPUT_DIR = "githubmirror"
          OUTPUT_FILE = os.path.join(OUTPUT_DIR, "alive_whitelist_bs.txt")
          MAX_WORKERS = 45
          MAX_FINAL = 55

          # Самые сильные источники под РФ
          CONFIG_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/coloramamoe/vless-parser/main/githubmirror/ru-sni-best-vless.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/ru_configs.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/verified_configs.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
          ]

          WHITE_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"

          BASE_WHITE_SNI = {
              "yandex.ru", "ya.ru", "dzen.ru", "max.ru",
              "ozon.ru", "www.ozon.ru", "wb.ru", "www.wildberries.ru",
              "vk.com", "m.vk.com", "vk.ru", "stats.vk-portal.net",
              "queuev4.vk.com", "userapi.com", "login.vk.com",
              "ok.ru", "mail.ru", "sberbank.ru", "tbank.ru",
              "avito.ru", "gosuslugi.ru", "rzd.ru"
          }

          def get_white_snis():
              snis = set(BASE_WHITE_SNI)
              try:
                  r = requests.get(WHITE_SNI_URL, timeout=10)
                  if r.status_code == 200:
                      for line in r.text.splitlines():
                          d = line.strip().lower()
                          if d and not d.startswith("#") and "." in d:
                              snis.add(d)
                  print(f"[+] White SNI loaded: {len(snis)}")
              except Exception as e:
                  print(f"[-] hxehex fail, using base: {e}")
              return snis

          def download(url: str) -> str:
              try:
                  r = requests.get(url, timeout=12, headers={"User-Agent": "Mozilla/5.0"})
                  if r.status_code == 200:
                      return r.text
              except Exception:
                  pass
              return ""

          def parse_link(link: str, white_snis: set):
              try:
                  original = link.strip()
                  if not original.startswith("vless://"):
                      return None

                  clean = original.split("#")[0].strip()
                  u = urllib.parse.urlparse(clean)
                  if u.scheme != "vless" or not u.hostname or not u.username:
                      return None

                  q = urllib.parse.parse_qs(urllib.parse.unquote(u.query))
                  security = (q.get("security") or ["none"])[0].lower()
                  flow = (q.get("flow") or [""])[0].lower()
                  net = (q.get("type") or ["tcp"])[0].lower()
                  sni = (q.get("sni") or [""])[0].lower().strip()
                  host_param = (q.get("host") or [""])[0].lower().strip()
                  pbk = (q.get("pbk") or [""])[0]
                  port = int(u.port) if u.port else 443

                  # === 1. Reality (высокий приоритет) ===
                  if security == "reality" and net in ("tcp", "raw") and "vision" in flow:
                      if pbk and len(pbk) >= 20:
                          sni_ok = any(sni == w or sni.endswith("." + w) for w in white_snis)
                          if sni_ok:
                              score = 100 if sni in ("max.ru", "yandex.ru", "ya.ru", "dzen.ru") else 85
                              return {
                                  "type": "reality",
                                  "link": clean,
                                  "host": u.hostname,
                                  "port": port,
                                  "sni": sni,
                                  "uuid": u.username,
                                  "key": f"{u.username}|{u.hostname}|{port}|r",
                                  "score": score
                              }

                  # === 2. Качественный WS + TLS (то, что у тебя реально работало) ===
                  if net == "ws" and security in ("tls", "none"):
                      good_name = host_param or sni or u.hostname
                      if good_name and "." in good_name and len(good_name) > 6:
                          # Бонус за стиль 4subnodes / CDN
                          bonus = 25 if any(x in good_name for x in ("4subnodes", "apicdn", "cdn", "cloud")) else 0
                          return {
                              "type": "ws",
                              "link": clean,
                              "host": u.hostname,
                              "port": port,
                              "sni": sni or host_param or u.hostname,
                              "uuid": u.username,
                              "key": f"{u.username}|{u.hostname}|{port}|w",
                              "score": 70 + bonus
                          }

                  return None
              except Exception:
                  return None

          def dns_ok(host: str) -> bool:
              try:
                  socket.gethostbyname(host)
                  return True
              except Exception:
                  return False

          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)
              white_snis = get_white_snis()

              all_raw = []
              for url in CONFIG_URLS:
                  text = download(url)
                  found = re.findall(r"vless://[^\s<>\"']+", text, re.IGNORECASE)
                  print(f"[+] {url.split('/')[-1]}: {len(found)}")
                  all_raw.extend(found)

              unique_raw = list(dict.fromkeys(all_raw))
              print(f"[✓] unique raw: {len(unique_raw)}")

              candidates = []
              seen = set()
              for link in unique_raw:
                  cfg = parse_link(link, white_snis)
                  if cfg and cfg["key"] not in seen:
                      seen.add(cfg["key"])
                      candidates.append(cfg)

              print(f"[✓] after filter: {len(candidates)}")

              alive = []
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
                  futs = {pool.submit(dns_ok, c["host"]): c for c in candidates}
                  for fut in as_completed(futs):
                      cfg = futs[fut]
                      try:
                          if fut.result():
                              alive.append(cfg)
                      except Exception:
                          pass

              print(f"[✓] DNS alive: {len(alive)}")

              alive.sort(key=lambda x: (-x["score"], 0 if x["type"] == "reality" else 1, x["host"]))
              final = alive[:MAX_FINAL]

              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              header = [
                  "# profile-title: Alive RF BS (Reality + working WS)",
                  "# profile-update-interval: 1",
                  f"# Updated: {now}",
                  f"# Count: {len(final)}",
                  "# Reality (white SNI + Vision) + clean WS+TLS",
                  "# Based on real user tests: WS of 4subnodes-style worked on MTS/Megafon",
                  "# DNS-checked. Final test only on your mobile data.",
                  ""
              ]

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(header))
                  for c in final:
                      tag = f"#{c['type'].upper()}|{c['sni'].replace('.', '_')}"
                      f.write(c["link"] + tag + "\n")

              print(f"[✓] Saved {len(final)} keys → {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/alive_whitelist_bs.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Hybrid update: Reality + working WS $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

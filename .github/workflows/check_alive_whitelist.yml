name: Check Alive Keys for Karing (No TCP Check)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: karing-alive-keys
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Validate and collect keys (No TCP check)
        run: |
          python3 << 'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os
          import re
          import socket
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          import requests

          OUTPUT_DIR = "githubmirror"
          OUTPUT_FILE = os.path.join(OUTPUT_DIR, "karing_alive_keys.txt")
          MAX_WORKERS = 60

          # Твои источники (только рабочие списки)
          SUBSCRIPTION_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/coloramamoe/vless-parser/main/githubmirror/ru-sni-best-vless.txt",
              "https://raw.githubusercontent.com/coloramamoe/vless-parser/main/githubmirror/whitelist-vless.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/ru_configs.txt",
              "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/verified_configs.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/sashalsk/v2ray/main/v2_config.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/Config.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt"
          ]

          def download(url: str) -> str:
              try:
                  r = requests.get(url, timeout=10, headers={
                      "User-Agent": "Karing/1.2.25.2802 platform/android"
                  })
                  if r.status_code == 200:
                      return r.text
              except Exception as e:
                  print(f"[-] Failed to download {url.split('/')[-1]}: {e}")
              return ""

          def validate_link(link: str):
              """Проверяет только формат ссылки и DNS, БЕЗ TCP"""
              try:
                  link = link.strip()
                  if not link or link.startswith('#'):
                      return None

                  # Поддерживаемые протоколы
                  if link.startswith('vless://'):
                      return validate_vless(link)
                  elif link.startswith('hysteria2://') or link.startswith('hy2://'):
                      return validate_hysteria2(link)
                  elif link.startswith('trojan://'):
                      return validate_trojan(link)
                  elif link.startswith('vmess://'):
                      return validate_vmess(link)
                  else:
                      return None
              except Exception:
                  return None

          def validate_vless(link: str):
              try:
                  # Парсинг vless://UUID@HOST:PORT?params#name
                  if '#' in link:
                      base, name = link.rsplit('#', 1)
                  else:
                      base, name = link, "VLESS"
                  
                  if '?' in base:
                      url_part, params = base.split('?', 1)
                  else:
                      url_part, params = base, ""
                  
                  # vless://UUID@HOST:PORT
                  match = re.match(r'vless://([^@]+)@([^:]+):(\d+)', url_part)
                  if not match:
                      return None
                  
                  uuid, host, port = match.groups()
                  port = int(port)
                  
                  # Быстрая DNS проверка (не TCP!)
                  try:
                      socket.gethostbyname(host)
                  except:
                      return None  # Домен не резолвится
                  
                  # Извлекаем параметры
                  params_dict = urllib.parse.parse_qs(params)
                  security = params_dict.get('security', ['none'])[0]
                  sni = params_dict.get('sni', [host])[0]
                  flow = params_dict.get('flow', [''])[0]
                  
                  # Определяем тип для сортировки
                  config_type = "Reality" if security == 'reality' else "TLS" if security == 'tls' else "Plain"
                  
                  # Приоритет для Reality и белых SNI
                  score = 100
                  if security == 'reality' and 'vision' in flow:
                      score = 100
                  elif security == 'tls':
                      score = 80
                  else:
                      score = 50
                  
                  # Бонус за CDN/белые домены
                  white_domains = ['yandex.ru', 'dzen.ru', 'max.ru', 'ozon.ru', 'vk.com', 'mail.ru']
                  if any(sni.endswith(d) for d in white_domains):
                      score += 20
                  
                  return {
                      'link': link,
                      'host': host,
                      'port': port,
                      'type': 'vless',
                      'config_type': config_type,
                      'sni': sni,
                      'score': score,
                      'name': name
                  }
              except:
                  return None

          def validate_hysteria2(link: str):
              try:
                  # hysteria2://password@host:port?params#name
                  clean = link.split('#')[0]
                  match = re.match(r'hysteria2://([^@]+)@([^:]+):(\d+)', clean)
                  if not match:
                      return None
                  
                  password, host, port = match.groups()
                  port = int(port)
                  
                  try:
                      socket.gethostbyname(host)
                  except:
                      return None
                  
                  return {
                      'link': link,
                      'host': host,
                      'port': port,
                      'type': 'hysteria2',
                      'config_type': 'Hysteria2',
                      'sni': host,
                      'score': 70,
                      'name': 'Hysteria2'
                  }
              except:
                  return None

          def validate_trojan(link: str):
              try:
                  clean = link.split('#')[0]
                  match = re.match(r'trojan://([^@]+)@([^:]+):(\d+)', clean)
                  if not match:
                      return None
                  
                  password, host, port = match.groups()
                  port = int(port)
                  
                  try:
                      socket.gethostbyname(host)
                  except:
                      return None
                  
                  return {
                      'link': link,
                      'host': host,
                      'port': port,
                      'type': 'trojan',
                      'config_type': 'Trojan',
                      'sni': host,
                      'score': 60,
                      'name': 'Trojan'
                  }
              except:
                  return None

          def validate_vmess(link: str):
              try:
                  # vmess://base64(json)
                  import base64
                  import json
                  
                  b64 = link.replace('vmess://', '')
                  # Добавляем паддинг если нужно
                  b64 += '=' * (4 - len(b64) % 4) if len(b64) % 4 else ''
                  
                  config = json.loads(base64.b64decode(b64).decode('utf-8'))
                  host = config.get('add', '')
                  port = config.get('port', 443)
                  
                  if not host:
                      return None
                  
                  try:
                      socket.gethostbyname(host)
                  except:
                      return None
                  
                  return {
                      'link': link,
                      'host': host,
                      'port': int(port),
                      'type': 'vmess',
                      'config_type': 'VMess',
                      'sni': config.get('host', host),
                      'score': 50,
                      'name': 'VMess'
                  }
              except:
                  return None

          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)
              
              all_links = []
              
              # Скачиваем все подписки
              for url in SUBSCRIPTION_URLS:
                  print(f"[+] Downloading {url.split('/')[-1]}...")
                  text = download(url)
                  
                  # Извлекаем все ссылки
                  links = re.findall(r'(vless://[^\s<>"]+|hysteria2://[^\s<>"]+|trojan://[^\s<>"]+|vmess://[^\s<>"]+)', text)
                  print(f"    Found {len(links)} links")
                  all_links.extend(links)
              
              print(f"\n[✓] Total raw links: {len(all_links)}")
              
              # Валидируем и дедуплицируем
              validated = []
              seen = set()
              
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                  results = list(executor.map(validate_link, all_links))
                  
                  for item in results:
                      if item and item['link'] not in seen:
                          seen.add(item['link'])
                          validated.append(item)
              
              print(f"[✓] Valid unique links: {len(validated)}")
              
              # Сортируем по score (лучшие primero)
              validated.sort(key=lambda x: -x['score'])
              
              # Генерируем output
              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              
              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write(f"# Karing Alive Keys - Updated {now}\n")
                  f.write(f"# Total: {len(validated)}\n")
                  f.write(f"# Format: Subscription for Karing app\n")
                  f.write(f"# Note: Test with your mobile data (MTS/Megafon) for BS bypass\n")
                  f.write("#" + "="*60 + "\n\n")
                  
                  for item in validated:
                      # Добавляем метку с типом и SNI для удобства
                      tag = f"#{item['config_type']}|{item['sni'].replace('.', '_')}|Score:{item['score']}"
                      if '#' in item['link']:
                          link = item['link'].rsplit('#', 1)[0] + tag
                      else:
                          link = item['link'] + tag
                      f.write(link + "\n")
              
              print(f"[✓] Saved {len(validated)} keys to {OUTPUT_FILE}")
              print(f"\n[INFO] Next steps:")
              print(f"1. Add this subscription to Karing:")
              print(f"   https://raw.githubusercontent.com/{os.environ.get('GITHUB_REPOSITORY', 'user/repo')}/main/{OUTPUT_FILE}")
              print(f"2. Use URL-Test group with 30-60s interval")
              print(f"3. Test on mobile data (disable WiFi)")
              print(f"4. Green keys = working, Red keys = blocked in your region")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/karing_alive_keys.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update alive keys for Karing $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

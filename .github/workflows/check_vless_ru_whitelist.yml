name: Check VLESS RU Whitelist + Reality Vision (Fixed)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ru-whitelist-enhanced
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest
        run: git pull origin ${{ steps.branch.outputs.name }} --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan VLESS Enhanced
        id: scan
        run: |
          python3 <<'EOF'
          import os
          import socket
          import urllib.parse
          import requests
          import random
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import time

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"

          print("Loading RU whitelist...")
          ru_sni = set()
          try:
              r = requests.get(RU_SNI_URL, timeout=20, headers=headers)
              ru_sni = set(x.strip().lower() for x in r.text.splitlines()
                           if x.strip() and not x.startswith("#"))
              print("Whitelist loaded:", len(ru_sni))
          except Exception as e:
              print("Whitelist load error:", e)

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]

          dns_cache = {}
          seen = set()
          lock = Lock()
          counters = {
              "total": 0, "sni": 0, "sec": 0, "flow": 0, "fp": 0, 
              "pbk": 0, "sid": 0, "network": 0, "ping": 0
          }

          # ✅ Из ваших примеров + статья
          ALLOWED_FPS = {"chrome", "firefox", "safari", "ios", "android", "qq", "edge", "360"}

          def resolve(host):
              if not host or host in dns_cache:
                  return dns_cache.get(host)
              try:
                  ip = socket.gethostbyname(host)
                  dns_cache[host] = ip
                  return ip
              except:
                  dns_cache[host] = None
                  return None

          def tcp_ping(host, port):
              """ОРИГИНАЛЬНЫЙ TCP пинг"""
              try:
                  s = socket.create_connection((host, port), timeout=1.5)
                  s.close()
                  return True
              except:
                  return False

          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless":
                      return None
                  
                  q = urllib.parse.parse_qs(u.query)
                  d = {
                      "link": link.strip(),
                      "host": u.hostname or "",
                      "port": int(u.port or 443),
                      "sni": (q.get("sni", [""])[0] or "").lower(),
                      "security": (q.get("security", [""])[0] or "").lower(),
                      "flow": (q.get("flow", [""])[0] or "").lower(),
                      "network": (q.get("type", ["tcp"])[0] or "").lower(),
                      "fp": (q.get("fp", [""])[0] or "").lower(),
                      "pbk": q.get("pbk", [""])[0] or "",
                      "sid": (q.get("sid", [""])[0] or "").lower()
                  }
                  return d
              except:
                  return None

          print("Downloading configs...")
          lines = []
          for url in URLS:
              try:
                  r = requests.get(url, timeout=25, headers=headers)
                  lines += r.text.splitlines()
                  print(f"Loaded {len(r.text.splitlines())} from {url}")
              except Exception as e:
                  print(f"Failed: {url} - {e}")

          vless = [l.strip() for l in lines if l.startswith("vless://")]
          print(f"Total VLESS: {len(vless)}")
          random.shuffle(vless)

          MAX_PER_FILE = 400
          BATCH_SIZE = 1000
          results = []

          def check_enhanced(link):
              counters["total"] += 1
              d = parse_vless(link)
              if not d or not d["host"]:
                  return None

              # 🔥 ФИЛЬТРЫ ПО ПРЯДКУ ПРИОРИТЕТА (из статьи + ваши примеры)

              # 1. RU Whitelist SNI
              if d["sni"] not in ru_sni:
                  with lock: counters["sni"] += 1
                  return None

              # 2. Reality security
              if d["security"] != "reality":
                  with lock: counters["sec"] += 1
                  return None

              # 3. Vision flow
              if d["flow"] != "xtls-rprx-vision":
                  with lock: counters["flow"] += 1
                  return None

              # 4. TCP network
              if d["network"] != "tcp":
                  with lock: counters["network"] += 1
                  return None

              # 5. uTLS fingerprint (из ваших рабочих примеров)
              if d["fp"] not in ALLOWED_FPS:
                  with lock: counters["fp"] += 1
                  return None

              # 6. Reality pbk (≥40 символов, смягчили)
              if len(d["pbk"]) < 40:
                  with lock: counters["pbk"] += 1
                  return None

              # 7. shortId (≥4 hex символа)
              if len(d["sid"]) < 4 or not re.match(r'^[0-9a-fA-F]{4,16}$', d["sid"]):
                  with lock: counters["sid"] += 1
                  return None

              # 8. DNS resolve + TCP ping (оригинальная логика)
              if not resolve(d["host"]):
                  return None
              if not tcp_ping(d["host"], d["port"]):
                  with lock: counters["ping"] += 1
                  return None

              # 9. Антидубликат
              key = (d["host"], d["port"], d["sni"])
              with lock:
                  if key in seen:
                      return None
                  seen.add(key)

              print(f"✅ LIVE: {d['host']}:{d['port']} | SNI:{d['sni'][:30]}... | FP:{d['fp']}")
              return d["link"]

          print("🔥 Enhanced scanning...")
          start_time = time.time()
          
          for i in range(0, len(vless), BATCH_SIZE):
              batch = vless[i:i+BATCH_SIZE]
              print(f"Batch {i//BATCH_SIZE + 1}/{(len(vless)-1)//BATCH_SIZE + 1}")
              
              with ThreadPoolExecutor(max_workers=30) as ex:
                  futures = [ex.submit(check_enhanced, l) for l in batch]
                  for f in as_completed(futures):
                      r = f.result()
                      if r:
                          results.append(r)

          elapsed = time.time() - start_time
          
          print("\n📊 STATS:")
          for k, v in counters.items():
              print(f"  {k}: {v}")
          print(f"⏱️  Time: {elapsed:.1f}s | Live: {len(results)}")

          # 🔥 СТАРЫЕ ПАПКИ! ПЕРЕЗАПИСЫВАЕМ СУЩЕСТВУЮЩИЕ
          os.makedirs("githubmirror", exist_ok=True)
          os.makedirs("githubmirror/enhanced_ru_whitelist", exist_ok=True)

          # Удаляем ВСЕ старые файлы
          existing = [f for f in os.listdir("githubmirror/enhanced_ru_whitelist")
                      if f.startswith("26_ru_whitelist_") or f.startswith("ru_vision_")]

          file_counter = 0
          for i in range(0, len(results), MAX_PER_FILE):
              file_counter += 1
              filename = f"26_ru_whitelist_{file_counter:02d}.txt"  # ⭐ ОРИГИНАЛЬНЫЕ ИМЕНА
              path = os.path.join("githubmirror/enhanced_ru_whitelist", filename)
              with open(path, "w", encoding='utf-8') as f:
                  for link in results[i:i+MAX_PER_FILE]:
                      f.write(link + "\n")  # ✅ ОДИН КЛЮЧ НА СТРОКУ

          # Удаляем лишние старые файлы
          for f in existing:
              try:
                  idx = int(re.search(r'(\d+)', f).group(1))
                  if idx > file_counter:
                      os.remove(os.path.join("githubmirror/enhanced_ru_whitelist", f))
              except:
                  pass

          total_live = len(results)
          print(f"🎉 FINAL: {total_live} RU Vision keys ({file_counter} files)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"count={total_live}", file=f)
              print(f"files={file_counter}", file=f)
              print(f"time={elapsed:.1f}", file=f)
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if [ -z "$(git status --porcelain githubmirror/)" ]; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          # Show what's being committed
          echo "📦 Changes to commit:"
          git status --short githubmirror/
          
          # Add and commit
          git add githubmirror/
          git commit -m "Update RU whitelist: ${{ steps.scan.outputs.count }} valid configs (${{ steps.scan.outputs.files }} files)"
          
          # Try to push with retries
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Push attempt $i/$MAX_RETRIES..."
            
            # Pull latest changes
            git pull --rebase origin ${{ steps.branch.outputs.branch }} || true
            
            # Try to push
            if git push origin ${{ steps.branch.outputs.branch }}; then
              echo "✅ Successfully pushed changes"
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "⏳ Push failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          echo "❌ Failed to push after $MAX_RETRIES attempts"
          exit 1

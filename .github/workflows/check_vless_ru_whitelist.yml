name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2

      - name: Check VLESS servers (Reality Vision + GeoIP + ASN + Filters)
        id: check_alive
        run: |
          python - <<'EOF'
          import os
          import time
          import socket
          import urllib.parse
          import requests
          import uuid
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import geoip2.database

          # ====== Настройки ======
          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/1.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/23.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/24.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/25.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://bp.wl.free.nf/confs/wl.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist%20%E2%84%962.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]
          RU_SNI_WHITELIST_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/refs/heads/main/whitelist.txt"

          TIMEOUT = 0.6
          CHECK_COUNT = 5
          MAX_LATENCY = 600
          MAX_WORKERS = 120

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          if not os.path.exists(COUNTRY_DB) or not os.path.exists(ASN_DB):
              print("[WARN] GeoLite2 DB not found")
              exit(0)

          reader_country = geoip2.database.Reader(COUNTRY_DB)
          reader_asn = geoip2.database.Reader(ASN_DB)

          # ====== RU SNI whitelist ======
          def load_ru_sni_whitelist():
              try:
                  r = requests.get(RU_SNI_WHITELIST_URL, timeout=20)
                  r.raise_for_status()
                  items = set(line.strip().lower() for line in r.text.splitlines() if line.strip() and not line.startswith("#"))
                  print(f"[INFO] Loaded RU SNI whitelist: {len(items)} entries")
                  return items
              except Exception as e:
                  print(f"[ERROR] Failed to load RU SNI whitelist: {e}")
                  return set()

          RU_SNI_WHITELIST = load_ru_sni_whitelist()
          if not RU_SNI_WHITELIST:
              print("[WARN] Empty RU SNI whitelist, exiting")
              exit(0)

          # ====== Проверка потока ======
          def is_valid_flow(link):
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)
              flow = q.get("flow", [""])[0]
              return flow == "xtls-rprx-vision" and "xhttp" not in flow

          # ====== Проверка страны (не RU) ======
          def geo_country(host):
              try:
                  ip = socket.gethostbyname(host)
                  country = reader_country.country(ip).country.iso_code
                  return country != "RU", country
              except:
                  return False, "??"

          # ====== Проверка ASN (не российский) ======
          RU_ASN_NUMBERS = {12389, 3215, 8359, 20309, 20485}
          RU_ASN_KEYWORDS = ("rostelecom", "mts", "megafon", "beeline", "tele2", "yandex", "mail.ru", "rt")

          def is_not_ru_asn(host):
              try:
                  ip = socket.gethostbyname(host)
                  r = reader_asn.asn(ip)
                  asn = r.autonomous_system_number
                  org = (r.autonomous_system_organization or "").lower()
                  if asn in RU_ASN_NUMBERS:
                      return False
                  if any(k in org for k in RU_ASN_KEYWORDS):
                      return False
                  return True
              except:
                  return False

          # ====== TCP ping ======
          def tcp_ping(host, port):
              try:
                  t = time.time()
                  s = socket.create_connection((host, port), timeout=TIMEOUT)
                  s.close()
                  return int((time.time() - t) * 1000)
              except:
                  return None

          def median(lst):
              lst = sorted(lst)
              n = len(lst)
              return lst[n//2] if n % 2 == 1 else (lst[n//2-1]+lst[n//2])//2

          # ====== Флаг страны ======
          def flag(code):
              try:
                  return "".join(chr(0x1F1E6 + ord(c.upper()) - ord('A')) for c in code)
              except:
                  return "🏳️"

          # ====== Разбор VLESS ссылки ======
          def parse_vless(link):
              try:
                  link = link.strip().replace(" ", "")
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  port = 443
                  if u.netloc and ":" in u.netloc:
                      try:
                          port = int(u.netloc.rsplit(":", 1)[1])
                      except:
                          pass
                  fp = q.get("fp", [""])[0].lower()
                  uid = u.username
                  try:
                      uuid.UUID(uid)
                  except:
                      return None
                  if u.hostname is None:
                      return None
                  sni = q.get("sni", [""])[0].lower()
                  tag = u.fragment or ""
                  tag = re.sub(r"[^\w\-]", "", tag)
                  return {
                      "link": f"{link}#{tag}" if tag else link,
                      "host": u.hostname,
                      "port": port,
                      "security": q.get("security", [""])[0],
                      "sni": sni,
                      "flow": q.get("flow", [""])[0],
                      "fp": fp
                  }
              except:
                  return None

          # ====== Проверка VLESS с фильтрацией ======
          def check_vless(link):
              d = parse_vless(link)
              if not d: return None
              if d["security"] != "reality": return None
              if d["fp"] != "chrome": return None
              if d["port"] not in (80, 443): return None
              if not d["sni"] or d["sni"] not in RU_SNI_WHITELIST: return None
              if not is_valid_flow(d["link"]): return None
              geo_ok, country = geo_country(d["host"])
              if not geo_ok: return None
              if not is_not_ru_asn(d["host"]): return None
              pings = []
              for _ in range(CHECK_COUNT):
                  p = tcp_ping(d["host"], d["port"])
                  if p is None or p > MAX_LATENCY:
                      return None
                  pings.append(p)
              latency = median(pings)
              return latency, d

          # ====== Загрузка ссылок ======
          lines = []
          for url in URLS:
              try:
                  r = requests.get(url, timeout=20)
                  r.raise_for_status()
                  cleaned = [l.replace(" ", "") for l in r.text.splitlines()]
                  lines.extend(cleaned)
              except:
                  pass

          vless_links = [l.strip() for l in lines if l.strip().startswith("vless://")]

          # ====== Проверка и сбор результатов ======
          results = []
          seen_keys = set()
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as exe:
              futures = {exe.submit(check_vless, v): v for v in vless_links}
              for f in as_completed(futures):
                  r = f.result()
                  if not r:
                      continue
                  latency, d = r
                  key_id = (d["host"], d["port"], d["sni"])
                  if key_id in seen_keys:
                      continue
                  seen_keys.add(key_id)
                  display_name = f"RUSL86 | {flag(geo_country(d['host'])[1])} | {d['host']}"
                  link_with_name = d["link"].split("#")[0] + f"#{display_name}"
                  results.append((latency, link_with_name))

          results.sort(key=lambda x: x[0])

          os.makedirs("githubmirror", exist_ok=True)
          with open("githubmirror/26_ru_whitelist.txt", "w") as f:
              for _, link in results:
                  f.write(link + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"count={len(results)}\n")

          print(f"[DONE] unique alive servers: {len(results)}")
          EOF

      - name: Commit and push result
        if: steps.check_alive.outputs.count != '0'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_ru_whitelist.txt
          git diff --cached --quiet || git commit -m "Update RU whitelist VLESS (Reality Vision, GeoIP, Ports 80/443)"
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} HEAD:main

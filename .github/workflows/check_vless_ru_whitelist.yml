name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest
        run: git pull origin ${{ steps.branch.outputs.name }} --rebase || true

      - name: Download GeoLite
        run: |
          mkdir -p geolite2
          curl -L -o geolite2/GeoLite2-Country.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-Country.mmdb || true
          curl -L -o geolite2/GeoLite2-ASN.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-ASN.mmdb || true
          ls -la geolite2 || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2

      - name: Scan VLESS
        id: scan
        run: |
          python3 <<'EOF'
          import os, socket, urllib.parse, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import geoip2.database

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          country_reader = None
          asn_reader = None

          if os.path.exists(COUNTRY_DB) and os.path.exists(ASN_DB):
              try:
                  country_reader = geoip2.database.Reader(COUNTRY_DB)
                  asn_reader = geoip2.database.Reader(ASN_DB)
              except:
                  pass

          headers = {"User-Agent": "Mozilla/5.0"}

          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt",
                       "https://raw.githubusercontent.com/ndsphub/proxy-list/main/proxies/megafon.txt",
                       "https://api.proxyscrape.com/v2/?request=getproxies&protocol=socks5&country=ru"
          ru_sni = set()
          try:
              r = requests.get(RU_SNI_URL, timeout=20, headers=headers)
              ru_sni = set(x.strip().lower() for x in r.text.splitlines() if x.strip() and not x.startswith("#"))
          except:
              pass

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/EbrahimFakhrahmani/free-v2ray-configs/main/configs/vless.txt",
              "https://raw.githubusercontent.com/MrPooyaX/IranProxy/main/Sub1.txt",
              "https://raw.githubusercontent.com/zealis/v2ray-subscription/master/vless.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/26.txt"
          ]

          dns_cache = {}
          geo_cache = {}
          asn_cache = {}
          seen = set()
          lock = Lock()

          def resolve(host):
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
              except:
                  ip = None
              dns_cache[host] = ip
              return ip

          def not_ru_geo(host):
              if not country_reader:
                  return True
              if host in geo_cache:
                  return geo_cache[host]
              ip = resolve(host)
              if not ip:
                  return False
              try:
                  ok = country_reader.country(ip).country.iso_code != "RU"
              except:
                  ok = False
              geo_cache[host] = ok
              return ok

          def not_ru_asn(host):
              if not asn_reader:
                  return True
              if host in asn_cache:
                  return asn_cache[host]
              ip = resolve(host)
              if not ip:
                  return False
              try:
                  org = asn_reader.asn(ip).autonomous_system_organization.lower()
                  bad = {"rostelecom","mts","megafon","beeline","tele2","yandex"}
                  ok = not any(x in org for x in bad)
              except:
                  ok = True
              asn_cache[host] = ok
              return ok

          def tcp_ping(host, port):
              try:
                  s = socket.create_connection((host, port), 1)
                  s.close()
                  return True
              except:
                  return False

          def parse(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless":
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      "link": link.strip(),
                      "host": u.hostname,
                      "port": int(u.port or 443),
                      "sni": q.get("sni", [""])[0].lower(),
                      "security": q.get("security", [""])[0]
                  }
              except:
                  return None

          lines = []
          for url in URLS:
              try:
                  r = requests.get(url, timeout=20, headers=headers)
                  lines += r.text.splitlines()
              except:
                  pass

          vless = [l for l in lines if l.startswith("vless://")]

          def check(link):
              d = parse(link)
              if not d:
                  return None
              if d["sni"] not in ru_sni:
                  return None
              if not not_ru_geo(d["host"]):
                  return None
              if not not_ru_asn(d["host"]):
                  return None
              if not tcp_ping(d["host"], d["port"]):
                  return None
              if d["security"] not in ("reality","tls"):
                  return None

              key = (d["host"], d["port"], d["sni"])
              with lock:
                  if key in seen:
                      return None
                  seen.add(key)

              return d["link"]

          results = []
          with ThreadPoolExecutor(max_workers=80) as ex:
              futures = [ex.submit(check, l) for l in vless[:6000]]
              for f in as_completed(futures):
                  r = f.result()
                  if r:
                      results.append(r)

          os.makedirs("githubmirror", exist_ok=True)
          path = "githubmirror/26_ru_whitelist.txt"

          with open(path, "w", encoding="utf-8") as f:
              for l in results:
                  f.write(l + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={len(results)}\n")

          print("LIVE:", len(results))
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add githubmirror/26_ru_whitelist.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU whitelist update: ${{ steps.scan.outputs.count }}"
          git push origin ${{ steps.branch.outputs.name }}

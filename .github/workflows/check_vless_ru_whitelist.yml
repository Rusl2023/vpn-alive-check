name: Check RU Whitelist Reality Vision
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: RU Whitelist Scanner
        id: check_alive
        run: |
          python3 -c "
          import os
          import urllib.parse
          import requests
          import socket
          
          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          OUTPUT_FILE = 'githubmirror/26_ru_whitelist.txt'
          TOP_LIMIT = 250
          
          # Загружаем SNI whitelist
          sni_list = set()
          try:
              r = requests.get('https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt', timeout=10, headers=HEADERS)
              sni_list = set(l.strip().lower() for l in r.text.splitlines() if l.strip() and not l.startswith('#'))
              print(f'SNI loaded: {len(sni_list)} entries')
          except Exception as e:
              print(f'SNI load failed: {e}')
          
          def check_sni(sni):
              if not sni:
                  return True
              s = sni.lower()
              return s in sni_list or any(s.endswith(a[1:]) for a in sni_list if a.startswith('*.'))
          
          def parse_line(line):
              if not line or not line.startswith('vless://'):
                  return None
              try:
                  u = urllib.parse.urlparse(line.strip())
                  if not u.hostname:
                      return None
                  
                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni', [''])[0].strip()
                  typ = q.get('type', [''])[0].lower().strip()
                  
                  # Фильтры: xHTTP, gRPC, HTTP, reality
                  if typ and typ not in {'grpc', 'http', 'xhttp'}:
                      return None
                  
                  # Reality Vision
                  if q.get('security', [''])[0].lower() == 'reality':
                      flow = q.get('flow', [''])[0].lower()
                      if 'vision' not in flow:
                          return None
                  
                  if sni and not check_sni(sni):
                      return None
                  
                  return line.strip()
              except:
                  return None
          
          SOURCES = [
              'https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt',
              'https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt',
              'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt',
              'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt',
              'https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt',
              'https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub'
          ]
          
          links = []
          print('Scanning sources...')
          
          for i, url in enumerate(SOURCES, 1):
              try:
                  print(f'Scanning {i}/{len(SOURCES)}: {url.split(\"/\")[-1]}')
                  r = requests.get(url, timeout=20, headers=HEADERS)
                  r.raise_for_status()
                  
                  for line in r.text.splitlines():
                      if len(links) >= TOP_LIMIT:
                          break
                          
                      parsed = parse_line(line)
                      if parsed:
                          links.append(parsed)
                          
                  print(f'Found {len([l for l in links if url in l])} from {url.split(\"/\")[-1]}')
                  
              except Exception as e:
                  print(f'Source {i} failed: {str(e)[:50]}')
                  continue
          
          # Создаем директорию и пишем файл
          os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
          with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
              for link in links[:TOP_LIMIT]:
                  f.write(link + '\n')
          
          print(f'TOTAL FOUND: {len(links)} VLESS keys')
          
          # Выводим в GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'count={len(links)}\n')
              f.write(f'has_changes=true\n')
          
          exit(0)
          "
        continue-on-error: true

      - name: Commit Changes
        if: steps.check_alive.outputs.count != '0'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "RU-Whitelist-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add githubmirror/26_ru_whitelist.txt || true
          
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          
          git commit -m "🔄 RU Whitelist: ${{ steps.check_alive.outputs.count }} VLESS keys" || exit 0
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} HEAD:main || exit 0
          echo "✅ Pushed ${{ steps.check_alive.outputs.count }} keys"

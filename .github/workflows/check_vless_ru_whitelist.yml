name: Check VLESS RU Whitelist + Reality + TCP ping (MAX WORKING)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ru-whitelist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch
        id: branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest changes
        run: |
          git pull origin ${{ steps.branch.outputs.branch }} --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan VLESS configs (MAX WORKING FILTER)
        id: scan
        run: |
          python3 <<'EOF'
          import os
          import socket
          import urllib.parse
          import requests
          import random
          import ipaddress
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock

          MAX_WORKERS = 30
          TIMEOUT = 2.0          # увеличен для стабильности
          MAX_PER_FILE = 500     # больше ключей в одном файле

          HEADERS = {"User-Agent": "Mozilla/5.0"}

          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"
          RU_IP_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/ipwhitelist.txt"
          RU_CIDR_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt"

          ALLOWED_FINGERPRINTS = {
              "chrome", "firefox", "safari", "ios", "android",
              "edge", "360", "qq", "random", "randomized"
          }

          CONFIG_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",
              "https://raw.githubusercontent.com/RUNoName/V.O.I.D-VPN_Bypass/refs/heads/main/configs/url_work.txt"
          ]

          dns_cache = {}
          seen_configs = set()
          stats_lock = Lock()

          stats = {
              "filtered_security": 0,
              "filtered_fp": 0,
              "filtered_ping": 0,
              "filtered_sni": 0,
              "duplicates": 0,
              "valid": 0
          }

          def load_list(url):
              try:
                  r = requests.get(url, timeout=20, headers=HEADERS)
                  r.raise_for_status()
                  return {line.strip().lower() for line in r.text.splitlines() if line.strip() and not line.startswith("#")}
              except:
                  return set()

          def load_cidr_list(url):
              cidrs = []
              try:
                  r = requests.get(url, timeout=20, headers=HEADERS)
                  r.raise_for_status()
                  for line in r.text.splitlines():
                      line = line.strip()
                      if line and not line.startswith("#"):
                          try:
                              cidrs.append(ipaddress.ip_network(line))
                          except:
                              pass
              except:
                  pass
              return cidrs

          def ip_in_cidrs(ip, cidrs):
              try:
                  ip_obj = ipaddress.ip_address(ip)
                  return any(ip_obj in net for net in cidrs)
              except:
                  return False

          def download_configs():
              all_lines = []
              for url in CONFIG_URLS:
                  try:
                      r = requests.get(url, timeout=25, headers=HEADERS)
                      r.raise_for_status()
                      all_lines.extend(r.text.splitlines())
                  except:
                      pass
              return [l.strip() for l in all_lines if l.strip().startswith("vless://")]

          def resolve_hostname(hostname):
              if hostname in dns_cache:
                  return dns_cache[hostname]
              try:
                  ip = socket.gethostbyname(hostname)
                  dns_cache[hostname] = ip
                  return ip
              except:
                  dns_cache[hostname] = None
                  return None

          def tcp_ping_test(host, port):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(TIMEOUT)
                  result = sock.connect_ex((host, port))
                  sock.close()
                  return result == 0
              except:
                  return False

          def parse_vless_config(link):
              try:
                  parsed = urllib.parse.urlparse(link.strip())
                  query = urllib.parse.parse_qs(parsed.query)
                  return {
                      "link": link.strip(),
                      "host": parsed.hostname,
                      "port": int(parsed.port or 443),
                      "sni": query.get("sni", [""])[0].lower(),
                      "security": query.get("security", [""])[0].lower(),
                      "flow": query.get("flow", [""])[0].lower(),
                      "fp": query.get("fp", [""])[0].lower()
                  }
              except:
                  return None

          def validate_config(config, sni_wl, ip_wl, cidr_wl):
              if not config or not config["host"]:
                  return None

              # 1. Только Reality
              if config["security"] != "reality":
                  with stats_lock:
                      stats["filtered_security"] += 1
                  return None

              # 2. Разрешённый fingerprint
              if config["fp"] not in ALLOWED_FINGERPRINTS:
                  with stats_lock:
                      stats["filtered_fp"] += 1
                  return None

              # 3. TCP ping (отсекаем мёртвые)
              ip = resolve_hostname(config["host"])
              if not ip or not tcp_ping_test(ip, config["port"]):
                  with stats_lock:
                      stats["filtered_ping"] += 1
                  return None

              # 4. Белый список SNI / IP / CIDR
              if not (
                  config["sni"] in sni_wl or
                  ip in ip_wl or
                  ip_in_cidrs(ip, cidr_wl)
              ):
                  with stats_lock:
                      stats["filtered_sni"] += 1
                  return None

              # 5. Дедупликация
              key = (config["host"], config["port"], config["sni"])
              with stats_lock:
                  if key in seen_configs:
                      stats["duplicates"] += 1
                      return None
                  seen_configs.add(key)
                  stats["valid"] += 1

              return config["link"]

          def main():
              sni_wl = load_list(RU_SNI_URL)
              ip_wl = load_list(RU_IP_URL)
              cidr_wl = load_cidr_list(RU_CIDR_URL)

              cfgs = download_configs()
              random.shuffle(cfgs)
              results = []

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                  futures = [ex.submit(validate_config, parse_vless_config(l), sni_wl, ip_wl, cidr_wl) for l in cfgs]
                  for f in as_completed(futures):
                      r = f.result()
                      if r:
                          results.append(r)

              os.makedirs("githubmirror", exist_ok=True)
              file_counter = 0
              for i in range(0, len(results), MAX_PER_FILE):
                  file_counter += 1
                  with open(f"githubmirror/26_ru_whitelist_{file_counter:02d}.txt", "w") as f:
                      f.write("\n".join(results[i:i+MAX_PER_FILE]))

              # Статистика в лог
              print(f"✅ VALID KEYS: {stats['valid']}")
              print(f"   filtered_security: {stats['filtered_security']}")
              print(f"   filtered_fp: {stats['filtered_fp']}")
              print(f"   filtered_ping: {stats['filtered_ping']}")
              print(f"   filtered_sni: {stats['filtered_sni']}")
              print(f"   duplicates: {stats['duplicates']}")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  print(f"count={len(results)}", file=f)
                  print(f"files={file_counter}", file=f)

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "RU whitelist updated (MAX WORKING keys)"
          git push

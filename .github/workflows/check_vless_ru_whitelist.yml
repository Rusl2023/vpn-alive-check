name: Check VLESS RU Whitelist + Reality security + xtls-rprx-vision + TCP ping
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
concurrency:
  group: ru-whitelist
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect branch
        id: branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
      - name: Pull latest changes
        run: |
          git pull origin ${{ steps.branch.outputs.branch }} --rebase || true
          echo "Current branch: ${{ steps.branch.outputs.branch }}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Scan VLESS configs
        id: scan
        run: |
          python3 <<'EOF'
          import os
          import socket
          import urllib.parse
          import requests
          import random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import time

          MAX_WORKERS = 30
          TIMEOUT = 1.5
          MAX_PER_FILE = 400
          BATCH_SIZE = 1000

          HEADERS = {"User-Agent": "Mozilla/5.0"}
          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"

          ALLOWED_FINGERPRINTS = {
              "chrome", "firefox", "safari", "ios", "android",
              "edge", "360", "qq", "random", "randomized"
          }

          # Sources for VLESS configs
          CONFIG_URLS = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",
              "https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/vl.txt",
              "https://raw.githubusercontent.com/STR97/STRUGOV/refs/heads/main/STR",
              "https://raw.githubusercontent.com/STR97/STRUGOV/refs/heads/main/STR.BYPASS",
              "https://raw.githubusercontent.com/STR97/STRUGOV/refs/heads/main/CUSTOM",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/subs/sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/BlackList.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/1.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/all_extracted_configs.txt",
              "https://raw.githubusercontent.com/10ium/ScrapeAndCategorize/refs/heads/main/output_configs/Vless.txt",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/Barabama/FreeNodes/refs/heads/main/nodes/yudou66.txt",
              "https://raw.githubusercontent.com/DiDiten/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Kolandone/v2raycollector/refs/heads/main/vless.txt",
              "https://raw.githubusercontent.com/Mahdi0024/ProxyCollector/master/sub/proxies.txt",
              "https://raw.githubusercontent.com/MrMohebi/xray-proxy-grabber-telegram/master/collected-proxies/row-url/all.txt",
              "https://raw.githubusercontent.com/MrTelepathic/v2ray-sub/refs/heads/main/configs.txt",
              "https://raw.githubusercontent.com/Rayan-Config/C-Sub/refs/heads/main/configs/proxy.txt",
              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/refs/heads/main/all_configs.txt",
              "https://raw.githubusercontent.com/mehran1404/Sub_Link/refs/heads/main/V2RAY-Sub.txt",
              "https://raw.githubusercontent.com/mermeroo/Loon/refs/heads/main/all.nodes.txt",
              "https://raw.githubusercontent.com/miladtahanian/V2RayCFGDumper/main/config.txt",
              "https://raw.githubusercontent.com/moneyfly1/collectSub/refs/heads/main/config_all_merged_nodes.txt",
              "https://raw.githubusercontent.com/teknovpnhub/v2ray-subscription/refs/heads/main/servers.txt",
              "https://raw.githubusercontent.com/xyfqzy/free-nodes/main/nodes/v2ray.txt",
              "https://raw.githubusercontent.com/youfoundamin/V2rayCollector/main/mixed_iran.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/refs/heads/main/AllConfigsSub.txt",
              "https://raw.githubusercontent.com/Firmfox/Proxify/refs/heads/main/v2ray_configs/mixed/subscription-1.txt",
              "https://raw.githubusercontent.com/Firmfox/Proxify/refs/heads/main/v2ray_configs/mixed/subscription-2.txt",
              "https://raw.githubusercontent.com/Farid-Karimi/Config-Collector/refs/heads/main/mixed_iran.txt",
              "https://raw.githubusercontent.com/MhdiTaheri/V2rayCollector_Py/refs/heads/main/sub/Mix/mix.txt",
              "https://raw.githubusercontent.com/liketolivefree/kobabi/main/sub.txt",
              "https://raw.githubusercontent.com/liketolivefree/kobabi/main/sub_all.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub1.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub2.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub3.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub4.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub5.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub6.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub7.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub8.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub9.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub10.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub11.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub12.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub13.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Sub14.txt",
              "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/ir/all.txt",
              "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/ir/vless.txt"
          ]


          dns_cache = {}
          seen_configs = set()
          stats_lock = Lock()
          stats = {
              "total": 0,
              "filtered_sni": 0,
              "filtered_security": 0,
              "filtered_flow": 0,
              "filtered_fp": 0,
              "filtered_ping": 0,
              "duplicates": 0,
              "valid": 0
          }

          def load_ru_whitelist():
              try:
                  response = requests.get(RU_SNI_URL, timeout=20, headers=HEADERS)
                  response.raise_for_status()
                  return {line.strip().lower() for line in response.text.splitlines() if line.strip() and not line.startswith("#")}
              except:
                  return set()

          def download_configs():
              all_lines = []
              for url in CONFIG_URLS:
                  try:
                      r = requests.get(url, timeout=25, headers=HEADERS)
                      r.raise_for_status()
                      all_lines.extend(r.text.splitlines())
                  except:
                      pass
              return [l.strip() for l in all_lines if l.strip().startswith("vless://")]

          def resolve_hostname(hostname):
              if hostname in dns_cache:
                  return dns_cache[hostname]
              try:
                  ip = socket.gethostbyname(hostname)
                  dns_cache[hostname] = ip
                  return ip
              except:
                  dns_cache[hostname] = None
                  return None

          def tcp_ping_test(host, port):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(TIMEOUT)
                  result = sock.connect_ex((host, port))
                  sock.close()
                  return result == 0
              except:
                  return False

          def parse_vless_config(link):
              try:
                  parsed = urllib.parse.urlparse(link.strip())
                  query = urllib.parse.parse_qs(parsed.query)
                  return {
                      "link": link.strip(),
                      "host": parsed.hostname,
                      "port": int(parsed.port or 443),
                      "sni": query.get("sni", [""])[0].lower(),
                      "security": query.get("security", [""])[0].lower(),
                      "flow": query.get("flow", [""])[0].lower(),
                      "fp": query.get("fp", [""])[0].lower()
                  }
              except:
                  return None

          def validate_config(config, ru_whitelist):
              if not config or not config["host"]:
                  return None

              # 🔥 НОВЫЙ ФИЛЬТР: только порт 443
              if config["port"] != 443:
                  return None

              if config["sni"] not in ru_whitelist:
                  with stats_lock: stats["filtered_sni"] += 1
                  return None

              if config["security"] != "reality":
                  with stats_lock: stats["filtered_security"] += 1
                  return None

              if config["flow"] != "xtls-rprx-vision":
                  with stats_lock: stats["filtered_flow"] += 1
                  return None

              if config["fp"] not in ALLOWED_FINGERPRINTS:
                  with stats_lock: stats["filtered_fp"] += 1
                  return None

              ip = resolve_hostname(config["host"])
              if not ip:
                  return None

              if not tcp_ping_test(ip, config["port"]):
                  with stats_lock: stats["filtered_ping"] += 1
                  return None

              key = (config["host"], config["port"], config["sni"])
              with stats_lock:
                  if key in seen_configs:
                      stats["duplicates"] += 1
                      return None
                  seen_configs.add(key)
                  stats["valid"] += 1

              return config["link"]

          def main():
              wl = load_ru_whitelist()
              cfgs = download_configs()
              random.shuffle(cfgs)
              results = []

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                  futures = []
                  for l in cfgs:
                      c = parse_vless_config(l)
                      if c:
                          futures.append(ex.submit(validate_config, c, wl))
                  for f in as_completed(futures):
                      r = f.result()
                      if r:
                          results.append(r)

              os.makedirs("githubmirror", exist_ok=True)

              file_counter = 0
              for i in range(0, len(results), MAX_PER_FILE):
                  file_counter += 1
                  with open(f"githubmirror/26_ru_whitelist_{file_counter:02d}.txt", "w") as f:
                      f.write("\n".join(results[i:i+MAX_PER_FILE]))

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  print(f"count={len(results)}", file=f)
                  print(f"files={file_counter}", file=f)

          if __name__ == "__main__":
              main()
          EOF
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "RU whitelist updated"
          git push

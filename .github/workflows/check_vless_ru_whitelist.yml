name: VLESS RU Reality Clean Filter

on:
  schedule:
    - cron: '0 */3 * * *'  # ИСПРАВЛЕНО: каждые 3 часа вместо каждый час
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install requests geoip2

      - name: Download GeoLite databases
        run: |
          mkdir -p geolite2
          curl -L -o geolite2/GeoLite2-Country.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-Country.mmdb
          curl -L -o geolite2/GeoLite2-ASN.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-ASN.mmdb

      - name: Run VLESS Reality filter
        id: scan
        run: |
          python3 << 'EOF'
          import os
          import sys
          import socket
          import requests
          import urllib.parse
          import geoip2.database
          import random
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          start_time = time.time()
          socket.setdefaulttimeout(3)

          GITHUB_OUTPUT = os.environ.get("GITHUB_OUTPUT")
          if not GITHUB_OUTPUT:
              print("ERROR: GITHUB_OUTPUT not found")
              sys.exit(1)

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          try:
              country_reader = geoip2.database.Reader(COUNTRY_DB)
              asn_reader = geoip2.database.Reader(ASN_DB)
              print("✓ GeoIP databases loaded")
          except Exception as e:
              print(f"✗ GeoIP load failed: {e}")
              sys.exit(1)

          # Allowed constants
          FP_ALLOWED = {"chrome","firefox","safari","ios","android","edge","360","qq","random","randomized"}
          PORT_ALLOWED = {80,443,8443}
          TYPE_ALLOWED = {"tcp","grpc","xhttp"}

          # Load RU SNI whitelist
          try:
              ru_sni_resp = requests.get(
                  "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt",
                  timeout=20
              )
              ru_sni = set(line.strip().lower() for line in ru_sni_resp.text.splitlines() if line.strip() and not line.startswith("#"))
              print(f"✓ Loaded {len(ru_sni)} RU SNI domains")
          except Exception as e:
              print(f"✗ Failed to load RU SNI: {e}")
              sys.exit(1)

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
              "https://raw.githubusercontent.com/ts-sf/fly/main/v2",
              "https://raw.githubusercontent.com/aiboboxx/v2rayfree/main/v2",
              "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/ermaozi01/free_clash_vpn/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray_config.txt",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://bp.wl.free.nf/confs/wl.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist 2.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]

          # Resolve host
          dns_cache = {}
          geo_cache = {}
          asn_cache = {}

          def resolve(host):
              if not host:
                  return None
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
              except:
                  ip = None
              dns_cache[host] = ip
              return ip

          def not_ru_ip(ip):
              if not ip:
                  return False
              # country
              if ip in geo_cache:
                  country_ok = geo_cache[ip]
              else:
                  try:
                      country_ok = country_reader.country(ip).country.iso_code != "RU"
                  except:
                      country_ok = False
                  geo_cache[ip] = country_ok
              if not country_ok:
                  return False
              # ASN
              if ip in asn_cache:
                  asn_ok = asn_cache[ip]
              else:
                  try:
                      org = asn_reader.asn(ip).autonomous_system_organization.lower()
                      bad_orgs = ["yandex","rostelecom","mts","megafon","beeline","timeweb","selectel","vk","cloud","ru-","russian"]
                      asn_ok = not any(b in org for b in bad_orgs)
                  except:
                      asn_ok = False
                  asn_cache[ip] = asn_ok
              return asn_ok

          # Parse VLESS
          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      "host": u.hostname,
                      "port": int(u.port or 0),
                      "pbk": q.get("pbk", [""])[0],
                      "sid": q.get("sid", [""])[0],
                      "sni": q.get("sni", [""])[0].lower(),
                      "fp": q.get("fp", [""])[0],
                      "type": q.get("type", ["tcp"])[0],
                      "flow": q.get("flow", [""])[0],
                      "sec": q.get("security", [""])[0],
                      "insecure": q.get("insecure", [""])[0],
                      "raw": link.strip()
                  }
              except:
                  return None

          # Check validity
          def is_valid(cfg):
              if not cfg["host"]:
                  return False
              if cfg["sec"] != "reality":
                  return False
              if cfg["fp"] not in FP_ALLOWED:
                  return False
              if not cfg["pbk"] or len(cfg["pbk"]) < 30:
                  return False
              if not cfg["sid"]:
                  return False
              if cfg["sni"] not in ru_sni:
                  return False
              if cfg["port"] not in PORT_ALLOWED:
                  return False
              if cfg["insecure"] == "true":
                  return False
              if cfg["type"] not in TYPE_ALLOWED:
                  return False
              if cfg["type"] == "tcp" and cfg["flow"] != "xtls-rprx-vision":
                  return False
              ip = resolve(cfg["host"])
              if not ip or not not_ru_ip(ip):
                  return False
              # TCP ping
              try:
                  s = socket.create_connection((cfg["host"], cfg["port"]), 2)
                  s.close()
              except:
                  return False
              return True

          # Collect all lines
          all_lines = []
          for url in URLS:
              try:
                  resp = requests.get(url, timeout=30, stream=True)
                  for line in resp.iter_lines():
                      if line and line.startswith(b"vless://"):
                          all_lines.append(line.decode("utf-8"))
                  print(f"{url} → {len([l for l in all_lines[-500:] if l.startswith('vless://')])} links")
              except Exception as e:
                  print(f"{url} ERROR {e}")

          print(f"Total links fetched: {len(all_lines)}")
          random.shuffle(all_lines)

          # Validate
          valid_configs = []
          seen_keys = set()
          with ThreadPoolExecutor(max_workers=40) as executor:
              futures = {executor.submit(parse_vless, l): l for l in all_lines}
              for future in as_completed(futures):
                  cfg = future.result()
                  if not cfg:
                      continue
                  if not is_valid(cfg):
                      continue
                  ip = resolve(cfg["host"])
                  key = f"{ip}:{cfg['port']}:{cfg['pbk']}"
                  if key in seen_keys:
                      continue
                  seen_keys.add(key)
                  valid_configs.append(cfg["raw"])

          # Split into files by 400
          os.makedirs("githubmirror", exist_ok=True)
          MAX_PER_FILE = 400
          file_counter = 1
          for i in range(0, len(valid_configs), MAX_PER_FILE):
              file_path = f"githubmirror/26_ru_whitelist_{file_counter:02d}.txt"
              with open(file_path, "w") as f:
                  for cfg in valid_configs[i:i+MAX_PER_FILE]:
                      f.write(cfg + "\n")
              print(f"Saved {file_path} ({len(valid_configs[i:i+MAX_PER_FILE])} keys)")
              file_counter += 1

          count = len(valid_configs)
          exec_time = time.time() - start_time
          print(f"✓ RESULT: {count} valid configs in {exec_time:.1f}s")

          with open(GITHUB_OUTPUT, "a") as f:
              f.write(f"count={count}\nfiles={file_counter-1}\n")

          country_reader.close()
          asn_reader.close()
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add githubmirror/26_ru_whitelist_*.txt || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: ${{ steps.scan.outputs.count }} RU Reality configs"
            git push

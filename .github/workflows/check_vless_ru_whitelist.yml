name: VLESS RU Reality Clean Filter
on:
  schedule:
    - cron: '0 */3 * * *'  # ИСПРАВЛЕНО: каждые 3 часа вместо каждый час
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests geoip2

      - name: Download GeoLite databases
        run: |
          mkdir -p geolite2
          curl -L -o geolite2/GeoLite2-Country.mmdb \
            https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-Country.mmdb
          curl -L -o geolite2/GeoLite2-ASN.mmdb \
            https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-ASN.mmdb

      - name: Run VLESS Reality filter
        id: scan
        run: |
          python3 << 'EOF'
          import requests
          import urllib.parse
          import socket
          import os
          import random
          import geoip2.database
          from concurrent.futures import ThreadPoolExecutor
          
          print("Starting VLESS RU Reality filter...")
          
          # Initialize databases
          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"
          
          try:
              country_reader = geoip2.database.Reader(COUNTRY_DB)
              asn_reader = geoip2.database.Reader(ASN_DB)
              print("GeoIP databases loaded successfully")
          except Exception as e:
              print(f"Failed to load GeoIP databases: {e}")
              exit(1)
          
          # Allowed parameters
          FP_ALLOWED = {
              "chrome", "firefox", "safari", "ios", "android",
              "edge", "360", "qq", "random", "randomized"
          }
          PORT_ALLOWED = {80, 443, 8443}
          
          # Russian SNI whitelist - ЧИСТЫЕ URL!
          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"
          
          try:
              ru_sni_response = requests.get(RU_SNI_URL, timeout=20)
              ru_sni = set(ru_sni_response.text.splitlines())
              print(f"Loaded {len(ru_sni)} Russian SNI domains")
          except Exception as e:
              print(f"Failed to load RU SNI whitelist: {e}")
              exit(1)
          
          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
              "https://raw.githubusercontent.com/ts-sf/fly/main/v2",
              "https://raw.githubusercontent.com/aiboboxx/v2rayfree/main/v2",
              "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/ermaozi01/free_clash_vpn/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray_config.txt",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://bp.wl.free.nf/confs/wl.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist 2.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]

          
          def resolve_hostname(host):
              try:
                  return socket.gethostbyname(host)
              except:
                  return None
          
          def is_non_russian_ip(ip, country_reader, asn_reader):
              try:
                  country_info = country_reader.country(ip)
                  if country_info.country.iso_code == "RU":
                      return False
                  
                  asn_info = asn_reader.asn(ip)
                  org = asn_info.autonomous_system_organization.lower()
                  bad_providers = [
                      "yandex", "rostelecom", "mts", "megafon", 
                      "beeline", "timeweb", "selectel", "vk"
                  ]
                  if any(provider in org for provider in bad_providers):
                      return False
                  return True
              except:
                  return False
          
          def parse_vless_url(link):
              try:
                  parsed = urllib.parse.urlparse(link)
                  if not parsed.scheme == "vless":
                      return None
                  query_params = urllib.parse.parse_qs(parsed.query)
                  return {
                      "raw": link.strip(),
                      "host": parsed.hostname,
                      "port": int(parsed.port or 0),
                      "pbk": query_params.get("pbk", [""])[0],
                      "sid": query_params.get("sid", [""])[0],
                      "sni": query_params.get("sni", [""])[0].lower(),
                      "fp": query_params.get("fp", [""])[0],
                      "type": query_params.get("type", ["tcp"])[0],
                      "flow": query_params.get("flow", [""])[0],
                      "sec": query_params.get("security", [""])[0],
                      "insecure": query_params.get("insecure", [""])[0]
                  }
              except:
                  return None
          
          def is_valid_config(config, ru_sni, country_reader, asn_reader):
              if config["sec"] != "reality":
                  return False
              if config["fp"] not in FP_ALLOWED:
                  return False
              if not config["pbk"] or len(config["pbk"]) < 30:
                  return False
              if not config["sid"]:
                  return False
              if not config["sni"] or config["sni"] not in ru_sni:
                  return False
              if config["port"] not in PORT_ALLOWED:
                  return False
              if config["insecure"] == "true":
                  return False
              if config["type"] == "tcp" and config["flow"] != "xtls-rprx-vision":
                  return False
              if config["type"] not in ("tcp", "grpc", "xhttp"):
                  return False
              
              ip = resolve_hostname(config["host"])
              if not ip or not is_non_russian_ip(ip, country_reader, asn_reader):
                  return False
              
              try:
                  sock = socket.create_connection((config["host"], config["port"]), timeout=1.5)
                  sock.close()
              except:
                  return False
              
              return True
          
          # Collect VLESS links
          print("Fetching configs from sources...")
          all_lines = []
          for i, url in enumerate(URLS, 1):
              try:
                  print(f"Fetching {i}/{len(URLS)}: {url}")
                  response = requests.get(url, timeout=20)
                  lines = response.text.splitlines()
                  all_lines.extend(lines)
                  print(f"  Got {len(lines)} lines")
              except Exception as e:
                  print(f"  Failed: {e}")
          
          vless_links = [line for line in all_lines if line.startswith("vless://")]
          print(f"Total VLESS links found: {len(vless_links)}")
          
          if not vless_links:
              print("No VLESS links found, exiting")
              print("count=0")
              exit(0)
          
          random.shuffle(vless_links)
          
          # Process configs
          print("Filtering and testing configs...")
          seen_configs = set()
          valid_configs = []
          
          with ThreadPoolExecutor(max_workers=30) as executor:
              parsed_configs = list(executor.map(parse_vless_url, vless_links[:1000]))  # Limit to first 1000
              
              for config in parsed_configs:
                  if not config:
                      continue
                  if not is_valid_config(config, ru_sni, country_reader, asn_reader):
                      continue
                  
                  ip = resolve_hostname(config["host"])
                  if not ip:
                      continue
                  
                  dedupe_key = f"{ip}:{config['port']}:{config['pbk']}"
                  if dedupe_key in seen_configs:
                      continue
                  
                  seen_configs.add(dedupe_key)
                  valid_configs.append(config["raw"])
          
          # Save results
          os.makedirs("githubmirror", exist_ok=True)
          output_file = "githubmirror/ru_reality_clean.txt"
          with open(output_file, "w") as f:
              for config in valid_configs:
                  f.write(config + "\n")
          
          total_count = len(valid_configs)
          print(f"TOTAL VALID RU REALITY CONFIGS: {total_count}")
          
          # Set output for GitHub Actions
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={total_count}\n")
          EOF

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add githubmirror/ru_reality_clean.txt || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update RU Reality VLESS ({{ steps.scan.outputs.count }} configs)"
            git push
          fi

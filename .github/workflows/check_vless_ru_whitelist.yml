name: Check RU Whitelist Reality Vision
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: RU Whitelist Scanner
        id: check_alive
        run: |
          python3 -c "
          import os, time, socket, urllib.parse, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          
          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          MAX_WORKERS = 30
          TIMEOUT = 3.0
          TOP_LIMIT = 250
          OUTPUT_FILE = 'githubmirror/26_ru_whitelist.txt'
          
          def load_sni_whitelist():
              try:
                  resp = requests.get('https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt', timeout=10, headers=HEADERS)
                  return set(l.strip().lower() for l in resp.text.splitlines() if l.strip() and not l.startswith('#'))
              except:
                  return set()
          
          RU_SNI = load_sni_whitelist()
          
          def sni_ok(sni):
              s = sni.lower()
              return s in RU_SNI or any(s.endswith(a[1:]) for a in RU_SNI if a.startswith('*.'))
          
          def is_cdn(host):
              try:
                  ip = socket.gethostbyname(host)
                  cdn_kws = {'cloudflare','amazon','google','microsoft','akamai','fastly'}
                  ru_kws = {'rostelecom','mts','megafon','beeline','tele2','yandex'}
                  org = socket.getaddrinfo(host, None)[0][3].lower()
                  return any(kw in org for kw in cdn_kws) and not any(kw in org for kw in ru_kws)
              except:
                  return False
          
          def ping_ok(host, port):
              try:
                  s = socket.socket()
                  s.settimeout(TIMEOUT)
                  return s.connect_ex((host, port)) == 0
              except:
                  return False
          
          def parse_vless(line):
              if not line.startswith('vless://'):
                  return None
              try:
                  u = urllib.parse.urlparse(line)
                  if not u.hostname:
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  
                  port = 443
                  if ':' in u.netloc:
                      port = int(u.netloc.rsplit(':', 1)[1])
                  
                  sni = q.get('sni', [''])[0].lower()
                  if not sni:
                      sni = u.hostname
                  
                  typ = q.get('type', [''])[0].lower()
                  sec = q.get('security', [''])[0].lower()
                  flow = q.get('flow', [''])[0].lower()
                  
                  if typ and typ not in {'grpc', 'http', 'xhttp'}:
                      return None
                  if sec == 'reality' and 'vision' not in flow:
                      return None
                  if sni and not sni_ok(sni):
                      return None
                  if not is_cdn(u.hostname):
                      return None
                  if not ping_ok(u.hostname, port):
                      return None
                  
                  return line.strip()
              except:
                  return None
          
          SOURCES = [
              'https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt',
              'https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt',
              'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt',
              'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt',
              'https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt',
              'https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub',
              'https://raw.githubusercontent.com/ts-sf/fly/main/v2',
              'https://raw.githubusercontent.com/aiboboxx/v2rayfree/main/v2',
              'https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray',
              'https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt',
              'https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless',
              'https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt'
          ]
          
          all_links = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=15, headers=HEADERS, stream=True)
                  for line in resp.iter_lines(decode_unicode=True):
                      if line:
                          parsed = parse_vless(line.decode() if isinstance(line, bytes) else line)
                          if parsed:
                              all_links.append(parsed)
                              if len(all_links) >= TOP_LIMIT:
                                  break
                  if len(all_links) >= TOP_LIMIT:
                      break
              except:
                  continue
          
          os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
          with open(OUTPUT_FILE, 'w') as f:
              for link in all_links:
                  f.write(link + '\n')
          
          has_changes = len(all_links) > 0
          print(f'Found {len(all_links)} keys')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'count={len(all_links)}\n')
              f.write(f'has_changes={str(has_changes).lower()}\n')
          "
        continue-on-error: true

      - name: Commit Changes
        if: steps.check_alive.outputs.has_changes == 'true' && steps.check_alive.outputs.count != '0'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "RU-Whitelist-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add githubmirror/26_ru_whitelist.txt || true
          
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          
          git commit -m "Update RU Whitelist: ${{ steps.check_alive.outputs.count }} keys"
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} HEAD:main
          echo "✅ Pushed ${{ steps.check_alive.outputs.count }} keys"

name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest
        run: git pull origin ${{ steps.branch.outputs.name }} --rebase || true

      - name: Download GeoLite
        run: |
          mkdir -p geolite2
          curl -L -o geolite2/GeoLite2-Country.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-Country.mmdb || true
          curl -L -o geolite2/GeoLite2-ASN.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-ASN.mmdb || true
          ls -la geolite2 || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2

      - name: Scan VLESS RU WHITELIST ONLY
        id: scan
        run: |
          python3 <<'EOF'
          import os
          import socket
          import urllib.parse
          import requests
          import time
          import random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import geoip2.database

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          country_reader = None
          asn_reader = None

          if os.path.exists(COUNTRY_DB) and os.path.exists(ASN_DB):
              try:
                  country_reader = geoip2.database.Reader(COUNTRY_DB)
                  asn_reader = geoip2.database.Reader(ASN_DB)
              except:
                  pass

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          RU_SNI_URLS = [
              "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt",
              "https://raw.githubusercontent.com/ndsphub/proxy-list/main/proxies/megafon.txt",
              "https://raw.githubusercontent.com/ssrsub/ssr/master/V2Ray.txt",
              "https://raw.githubusercontent.com/aleskxyz/reality-ezpz/main/sni_ru.txt"
          ]
          
          ru_sni = set()
          print("Loading RU operator whitelists...")
          for url in RU_SNI_URLS:
              try:
                  print(f"RU SNI: {url}")
                  r = requests.get(url, timeout=15, headers=headers)
                  new_sni = [x.strip().lower() for x in r.text.splitlines() if x.strip() and not x.startswith("#")]
                  ru_sni.update(new_sni)
                  print(f"Added {len(new_sni)} RU SNI")
                  time.sleep(random.uniform(0.5, 1.2))
              except Exception as e:
                  print(f"RU SNI failed: {e}")
                  continue

          print(f"TOTAL RU WHITELIST SNI: {len(ru_sni)}")

          URLS = [
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/MrPooyaX/IranProxy/main/Sub1.txt",
              "https://raw.githubusercontent.com/zealis/v2ray-subscription/master/vless.txt",
              "https://raw.githubusercontent.com/whitel41/white_list/main/vless.txt"
          ]

          dns_cache = {}
          geo_cache = {}
          asn_cache = {}
          seen = set()
          lock = Lock()

          def resolve(host):
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
              except:
                  ip = None
              dns_cache[host] = ip
              return ip

          def is_not_ru_geo(host):
              if not country_reader:
                  return False
              if host in geo_cache:
                  return geo_cache[host]
              ip = resolve(host)
              if not ip:
                  return False
              try:
                  is_ru = country_reader.country(ip).country.iso_code == "RU"
                  ok = not is_ru
              except:
                  ok = False
              geo_cache[host] = ok
              return ok

          def is_not_ru_asn(host):
              if not asn_reader:
                  return False
              if host in asn_cache:
                  return asn_cache[host]
              ip = resolve(host)
              if not ip:
                  return False
              try:
                  org = asn_reader.asn(ip).autonomous_system_organization.lower()
                  ru_asns = {
                      "rostelecom", "mts", "megafon", "beeline", "veon", "tele2",
                      "mgts", "ttk", "yaroslavl", "trans telecom", "ertelecom"
                  }
                  is_ru_asn = any(asn in org for asn in ru_asns)
                  ok = not is_ru_asn
              except:
                  ok = False
              asn_cache[host] = ok
              return ok

          def tcp_ping(host, port):
              try:
                  s = socket.create_connection((host, port), timeout=2.5)
                  s.close()
                  return True
              except:
                  return False

          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless":
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get("sni", [""])[0].lower()
                  return {
                      "link": link.strip(),
                      "host": u.hostname,
                      "port": int(u.port or 443),
                      "sni": sni,
                      "security": q.get("security", [""])[0]
                  }
              except:
                  return None

          print("Downloading RU-focused VLESS...")
          lines = []
          for i, url in enumerate(URLS):
              try:
                  print(f"RU {i+1}/{len(URLS)}: {url}")
                  r = requests.get(url, timeout=20, headers=headers)
                  new_lines = [l.strip() for l in r.text.splitlines() if l.strip()]
                  lines.extend(new_lines)
                  print(f"RU: {len(new_lines)} lines")
                  time.sleep(random.uniform(0.3, 1.0))
              except Exception as e:
                  print(f"RU failed: {e}")
                  continue

          vless = list(set([l for l in lines if l.startswith("vless://")]))
          print(f"VLESS candidates: {len(vless)}")

          def check_ru_whitelist(link):
              d = parse_vless(link)
              if not d or not d["host"]:
                  return None
              
              if not d["sni"] or d["sni"] not in ru_sni:
                  return None
              
              if not is_not_ru_geo(d["host"]):
                  return None
              
              if not is_not_ru_asn(d["host"]):
                  return None
              
              if not tcp_ping(d["host"], d["port"]):
                  return None
              
              if d["security"] not in ("reality", "tls"):
                  return None

              key = (d["host"], d["port"], d["sni"])
              with lock:
                  if key in seen:
                      return None
                  seen.add(key)

              return d["link"]

          print("RU WHITELIST SCAN...")
          results = []
          with ThreadPoolExecutor(max_workers=100) as ex:
              futures = [ex.submit(check_ru_whitelist, l) for l in vless[:8000]]
              for i, f in enumerate(as_completed(futures), 1):
                  if i % 150 == 0:
                      print(f"Checked {i}/{len(futures)} ({len(results)} RU-live)")
                  r = f.result()
                  if r:
                      results.append(r)

          print(f"RU WHITELIST LIVE: {len(results)}")

          os.makedirs("githubmirror", exist_ok=True)
          path = "githubmirror/26_ru_whitelist.txt"
          timestamp = time.strftime("%Y-%m-%d %H:%M:%S UTC")
          
          with open(path, "w", encoding="utf-8") as f:
              f.write(f"# RU WHITELIST VLESS Reality/TLS\n")
              f.write(f"# Updated: {timestamp}\n")
              f.write(f"# RU Live keys: {len(results)}\n")
              f.write(f"# RU SNI whitelist: {len(ru_sni)}\n")
              f.write(f"# Filters: NON-RU Geo + NON-RU ASN + TCP\n\n")
              for l in results:
                  f.write(l + "\n")

          with open("ru_debug.txt", "w") as f:
              f.write(f"RU SNI whitelist: {len(ru_sni)}\n")
              f.write(f"VLESS total: {len(vless)}\n")
              f.write(f"RU LIVE: {len(results)}\n")
              f.write(f"Sample SNI: {list(ru_sni)[:5]}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={len(results)}\n")
              f.write(f"ru_sni={len(ru_sni)}\n")
              f.write(f"total_vless={len(vless)}\n")

          print("RU WHITELIST RESULTS:")
          print(f"RU SNI: {len(ru_sni)}")
          print(f"VLESS: {len(vless)}")
          print(f"RU LIVE: {len(results)}")
          EOF

      - name: RU Debug Info
        run: |
          echo "RU WHITELIST DEBUG:"
          cat ru_debug.txt || echo "No debug"
          echo "--- RU OUTPUT ---"
          head -15 githubmirror/26_ru_whitelist.txt || echo "No RU file"
          echo "--- GIT ---"
          git status

      - name: Commit RU Whitelist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add githubmirror/26_ru_whitelist.txt ru_debug.txt || true

          if git diff --staged --quiet; then
            echo "RU whitelist up to date"
            exit 0
          fi

          echo "RU whitelist updated!"
          git commit -m "RU WHITELIST: ${{ steps.scan.outputs.count }} LIVE keys
RU SNI: ${{ steps.scan.outputs.ru_sni }}
VLESS: ${{ steps.scan.outputs.total_vless }}
$(cat ru_debug.txt || echo '')"
          
          git push origin ${{ steps.branch.outputs.name }}
          echo "RU whitelist pushed!"

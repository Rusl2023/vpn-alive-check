          def is_valid_flow(link):
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)
              flow = q.get("flow", [""])[0]
              return flow == "xtls-rprx-vision" and "xhttp" not in flow

          def geo_country(host):
              try:
                  ip = socket.gethostbyname(host)
                  country = reader_country.country(ip).country.iso_code
                  return None if country == "RU" else country
              except:
                  return None

          def tcp_ping(host, port):
              try:
                  t = time.time()
                  s = socket.create_connection((host, port), timeout=TIMEOUT)
                  s.close()
                  return int((time.time() - t) * 1000)
              except:
                  return None

          def median(lst):
              lst = sorted(lst)
              return lst[len(lst)//2]

          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  q = urllib.parse.parse_qs(u.query)
                  port = 443
                  if u.netloc and ":" in u.netloc:
                      try:
                          port = int(u.netloc.rsplit(":", 1)[1].strip())
                      except:
                          port = 443
                  return {"link": link.strip(), "host": u.hostname, "port": port,
                          "security": q.get("security", [""])[0],
                          "sni": q.get("sni", [""])[0],
                          "flow": q.get("flow", [""])[0]}
              except:
                  return None

          def check_vless(link):
              try:
                  d = parse_vless(link)
                  if not d or d["security"] != "reality":
                      return None
                  if not d["sni"] or d["sni"] not in RU_SNI_WHITELIST:
                      return None
                  if not is_valid_flow(d["link"]):
                      return None
                  if not geo_country(d["host"]):
                      return None
                  pings = []
                  for _ in range(CHECK_COUNT):
                      p = tcp_ping(d["host"], d["port"])
                      if p is None or p > MAX_LATENCY:
                          return None
                      pings.append(p)
                  return median(pings), d
              except:
                  return None

          lines = []
          for url in URLS:
              try:
                  lines.extend(requests.get(url, timeout=20).text.splitlines())
              except:
                  pass

          vless_links = [l.strip() for l in lines if l.strip().startswith("vless://")]

          results = []
          seen = set()
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as exe:
              for f in as_completed([exe.submit(check_vless, v) for v in vless_links]):
                  r = f.result()
                  if not r:
                      continue
                  latency, d = r
                  key = (d["host"], d["port"], d["sni"], d["flow"])
                  if key in seen:
                      continue
                  seen.add(key)
                  results.append((latency, d["link"]))

          results.sort(key=lambda x: x[0])
          os.makedirs("githubmirror", exist_ok=True)
          with open("githubmirror/26_ru_whitelist.txt", "w") as f:
              for _, link in results:
                  f.write(link + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"count={len(results)}\n")
          print(f"[DONE] unique alive servers: {len(results)}")
          EOF

      - name: Commit and push result
        if: steps.check_alive.outputs.count != '0'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_ru_whitelist.txt
          git diff --cached --quiet || git commit -m "Update RU whitelist VLESS (deduplicated)"
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} HEAD:main

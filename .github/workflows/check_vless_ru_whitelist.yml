name: VLESS RU Reality Clean Filter

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests geoip2

      - name: Run VLESS Reality filter
        id: scan
        run: |
          python3 << 'EOF'
          import os
          import sys
          import socket
          import requests
          import urllib.parse
          import geoip2.database
          import random
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          start_time = time.time()
          socket.setdefaulttimeout(3)
          GITHUB_OUTPUT = os.environ.get("GITHUB_OUTPUT")

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          try:
              country_reader = geoip2.database.Reader(COUNTRY_DB)
              asn_reader = geoip2.database.Reader(ASN_DB)
              print("GeoIP loaded from repository")
          except Exception as e:
              print(f"GeoIP load failed: {e}")
              sys.exit(1)

          FP_ALLOWED = {"chrome","firefox","safari","ios","android","edge","360","qq","random","randomized"}
          PORT_ALLOWED = {80,443,8443}
          TYPE_ALLOWED = {"tcp","grpc","xhttp"}

          # Load RU whitelist
          try:
              r = requests.get(
                  "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt",
                  timeout=30
              )
              ru_sni = {
                  line.strip().lower()
                  for line in r.text.splitlines()
                  if line.strip() and not line.startswith("#")
              }
              print(f"Loaded {len(ru_sni)} RU SNI domains")
          except Exception as e:
              print(f"Whitelist load failed: {e}")
              sys.exit(1)
              
          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
              "https://raw.githubusercontent.com/ts-sf/fly/main/v2",
              "https://raw.githubusercontent.com/aiboboxx/v2rayfree/main/v2",
              "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/ermaozi01/free_clash_vpn/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray_config.txt",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://bp.wl.free.nf/confs/wl.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist 2.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]

          dns_cache = {}
          geo_cache = {}
          asn_cache = {}

          def resolve(host):
              if not host:
                  return None
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
              except:
                  ip = None
              dns_cache[host] = ip
              return ip

          def not_ru_ip(ip):
              if not ip:
                  return False

              if ip in geo_cache:
                  return geo_cache[ip]

              try:
                  country = country_reader.country(ip).country.iso_code
                  if country == "RU":
                      geo_cache[ip] = False
                      return False
              except:
                  geo_cache[ip] = False
                  return False

              try:
                  org = asn_reader.asn(ip).autonomous_system_organization.lower()
                  bad_orgs = ["yandex","rostelecom","mts","megafon","beeline","selectel","timeweb","vk","ru-"]
                  if any(b in org for b in bad_orgs):
                      geo_cache[ip] = False
                      return False
              except:
                  geo_cache[ip] = False
                  return False

              geo_cache[ip] = True
              return True

          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      "host": u.hostname,
                      "port": int(u.port or 0),
                      "pbk": q.get("pbk", [""])[0],
                      "sid": q.get("sid", [""])[0],
                      "sni": q.get("sni", [""])[0].lower(),
                      "fp": q.get("fp", [""])[0],
                      "type": q.get("type", ["tcp"])[0],
                      "flow": q.get("flow", [""])[0],
                      "sec": q.get("security", [""])[0],
                      "insecure": q.get("insecure", [""])[0],
                      "raw": link.strip()
                  }
              except:
                  return None

          def is_valid(cfg):
              if not cfg["host"]:
                  return False
              if cfg["sec"] != "reality":
                  return False
              if cfg["fp"] not in FP_ALLOWED:
                  return False
              if not cfg["pbk"] or not cfg["sid"]:
                  return False
              if cfg["sni"] not in ru_sni:
                  return False
              if cfg["port"] not in PORT_ALLOWED:
                  return False
              if cfg["insecure"] == "true":
                  return False
              if cfg["type"] not in TYPE_ALLOWED:
                  return False
              if cfg["type"] == "tcp" and cfg["flow"] != "xtls-rprx-vision":
                  return False

              ip = resolve(cfg["host"])
              if not ip or not not_ru_ip(ip):
                  return False

              try:
                  s = socket.create_connection((cfg["host"], cfg["port"]), 2)
                  s.close()
              except:
                  return False

              return True

          all_lines = []

          for url in URLS:
              try:
                  r = requests.get(url, timeout=60)
                  count = 0
                  for line in r.text.splitlines():
                      if line.startswith("vless://"):
                          all_lines.append(line.strip())
                          count += 1
                  print(f"{url} fetched {count} links")
              except Exception as e:
                  print(f"{url} error {e}")

          print(f"Total fetched: {len(all_lines)}")
          random.shuffle(all_lines)

          valid = []
          seen = set()

          with ThreadPoolExecutor(max_workers=60) as executor:
              futures = [executor.submit(parse_vless, l) for l in all_lines]

              for f in as_completed(futures):
                  cfg = f.result()
                  if not cfg:
                      continue
                  if not is_valid(cfg):
                      continue

                  ip = resolve(cfg["host"])
                  key = f"{ip}:{cfg['port']}:{cfg['pbk']}"

                  if key in seen:
                      continue

                  seen.add(key)
                  valid.append(cfg["raw"])

          os.makedirs("githubmirror", exist_ok=True)

          # удалить старые файлы
          for f in os.listdir("githubmirror"):
              if f.startswith("26_ru_whitelist_"):
                  os.remove(os.path.join("githubmirror", f))

          MAX_PER_FILE = 400
          file_index = 1

          for i in range(0, len(valid), MAX_PER_FILE):
              filename = f"githubmirror/26_ru_whitelist_{file_index:02d}.txt"
              with open(filename, "w") as f:
                  f.write("\n".join(valid[i:i+MAX_PER_FILE]))
              print(f"Saved {filename}")
              file_index += 1

          count = len(valid)
          exec_time = time.time() - start_time
          print(f"Final valid configs: {count} in {exec_time:.1f}s")

          if GITHUB_OUTPUT:
              with open(GITHUB_OUTPUT, "a") as f:
                  f.write(f"count={count}\n")

          country_reader.close()
          asn_reader.close()
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add githubmirror/26_ru_whitelist_*.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "update: ${{ steps.scan.outputs.count }} RU Reality configs"
            git push
          fi

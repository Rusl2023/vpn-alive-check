name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest
        run: git pull origin ${{ steps.branch.outputs.name }} --rebase || true

      - name: Download GeoLite
        run: |
          mkdir -p geolite2
          curl -L -o geolite2/GeoLite2-Country.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-Country.mmdb || true
          curl -L -o geolite2/GeoLite2-ASN.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-ASN.mmdb || true
          ls -la geolite2 || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2

      - name: Scan VLESS
        id: scan
        run: |
          python3 <<'EOF'
          import os, socket, urllib.parse, requests, random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import geoip2.database

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          country_reader = None
          asn_reader = None

          if os.path.exists(COUNTRY_DB) and os.path.exists(ASN_DB):
              try:
                  country_reader = geoip2.database.Reader(COUNTRY_DB)
                  asn_reader = geoip2.database.Reader(ASN_DB)
              except:
                  pass

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"
          ru_sni = set()
          try:
              r = requests.get(RU_SNI_URL, timeout=20, headers=headers)
              ru_sni = set(x.strip().lower() for x in r.text.splitlines() if x.strip() and not x.startswith("#"))
              print(f"RU SNI whitelist loaded: {len(ru_sni)} domains")
          except Exception as e:
              print(f"Failed to load RU SNI: {e}")

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/sub/sub_merge_base64.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
              "https://raw.githubusercontent.com/ts-sf/fly/main/v2",
              "https://raw.githubusercontent.com/aiboboxx/v2rayfree/main/v2",
              "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/ermaozi01/free_clash_vpn/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray_config.txt",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://bp.wl.free.nf/confs/wl.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist%20%E2%84%962.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]

          dns_cache = {}
          geo_cache = {}
          asn_cache = {}
          seen = set()
          lock = Lock()

          def resolve(host):
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
              except:
                  ip = None
              dns_cache[host] = ip
              return ip

          def not_ru_geo(host):
              if not country_reader:
                  return True
              if host in geo_cache:
                  return geo_cache[host]
              ip = resolve(host)
              if not ip:
                  return False
              try:
                  ok = country_reader.country(ip).country.iso_code != "RU"
              except:
                  ok = False
              geo_cache[host] = ok
              return ok

          def not_ru_asn(host):
              if not asn_reader:
                  return True
              if host in asn_cache:
                  return asn_cache[host]
              ip = resolve(host)
              if not ip:
                  return False
              try:
                  org = asn_reader.asn(ip).autonomous_system_organization.lower()
                  bad = {"rostelecom","mts","megafon","beeline","tele2","yandex"}
                  ok = not any(x in org for x in bad)
              except:
                  ok = True
              asn_cache[host] = ok
              return ok

          def tcp_ping(host, port):
              try:
                  s = socket.create_connection((host, port), timeout=1.5)
                  s.close()
                  return True
              except:
                  return False

          def parse(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless":
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      "link": link.strip(),
                      "host": u.hostname,
                      "port": int(u.port or 443),
                      "sni": q.get("sni", [""])[0].lower(),
                      "security": q.get("security", [""])[0]
                  }
              except:
                  return None

          print("Downloading VLESS configs...")
          lines = []
          for i, url in enumerate(URLS, 1):
              try:
                  print(f"Fetching {i}/{len(URLS)}: {url}")
                  r = requests.get(url, timeout=25, headers=headers)
                  lines += r.text.splitlines()
                  print(f"  Got {len(r.text.splitlines())} lines")
              except Exception as e:
                  print(f"  Failed: {e}")

          print(f"Total lines: {len(lines)}")
          vless = [l for l in lines if l.startswith("vless://")]
          print(f"Total VLESS found: {len(vless)}")

          # Рандомизируем для лучшей выборки
          random.shuffle(vless)
          print("Starting full batch processing...")

          MAX_PER_FILE = 400        # ← ИЗМЕНЕНО: 400 ключей на файл
          BATCH_SIZE = 2000
          file_counter = 1
          all_results = []
          
          sni_count = 0
          geo_count = 0
          asn_count = 0
          ping_count = 0
          security_count = 0

          def check(link):
              nonlocal sni_count, geo_count, asn_count, ping_count, security_count
              d = parse(link)
              if not d:
                  return None
              
              if d["sni"] not in ru_sni:
                  sni_count += 1
                  return None
              
              if not not_ru_geo(d["host"]):
                  geo_count += 1
                  return None
              
              if not not_ru_asn(d["host"]):
                  asn_count += 1
                  return None
              
              if not tcp_ping(d["host"], d["port"]):
                  ping_count += 1
                  return None
              
              if d["security"] not in ("reality","tls"):
                  security_count += 1
                  return None

              key = (d["host"], d["port"], d["sni"])
              with lock:
                  if key in seen:
                      return None
                  seen.add(key)

              return d["link"]

          # Полная обработка батчами
          for i in range(0, len(vless), BATCH_SIZE):
              batch = vless[i:i+BATCH_SIZE]
              print(f"Processing batch {i//BATCH_SIZE + 1}/{(len(vless)+BATCH_SIZE-1)//BATCH_SIZE} ({len(batch)} links)")
              
              batch_results = []
              try:
                  with ThreadPoolExecutor(max_workers=40) as ex:
                      futures = [ex.submit(check, l) for l in batch]
                      for f in as_completed(futures, timeout=180):
                          r = f.result()
                          if r:
                              batch_results.append(r)
              except Exception as e:
                  print(f"Batch error: {e}")
              
              all_results.extend(batch_results)
              print(f"  Batch live: {len(batch_results)}")
              
              # Создаём файлы по MAX_PER_FILE (400)
              while len(all_results) >= MAX_PER_FILE:
                  file_path = f"githubmirror/26_ru_whitelist_{file_counter:02d}.txt"
                  os.makedirs("githubmirror", exist_ok=True)
                  with open(file_path, "w", encoding="utf-8") as f:
                      for live_key in all_results[:MAX_PER_FILE]:
                          f.write(live_key + "\n")
                  print(f"Created {file_path}: {MAX_PER_FILE} keys")
                  all_results = all_results[MAX_PER_FILE:]
                  file_counter += 1

          # Финальный файл
          if all_results:
              file_path = f"githubmirror/26_ru_whitelist_{file_counter:02d}.txt"
              os.makedirs("githubmirror", exist_ok=True)
              with open(file_path, "w", encoding="utf-8") as f:
                  for live_key in all_results:
                      f.write(live_key + "\n")
              print(f"Created {file_path}: {len(all_results)} keys")

          # Статистика
          total_files = file_counter - 1
          total_live = sum(len(open(f"githubmirror/26_ru_whitelist_{i:02d}.txt").readlines()) 
                          for i in range(1, file_counter) 
                          if os.path.exists(f"githubmirror/26_ru_whitelist_{i:02d}.txt"))
          print(f"\n=== FINAL STATS ===")
          print(f"Total VLESS processed: {len(vless)}")
          print(f"RU SNI filtered: {sni_count}")
          print(f"RU Geo filtered: {geo_count}")
          print(f"RU ASN filtered: {asn_count}")
          print(f"Ping failed: {ping_count}")
          print(f"Security filtered: {security_count}")
          print(f"TOTAL LIVE KEYS: {total_live}")
          print(f"Files created: {total_files}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={total_live}\n")
              f.write(f"files={total_files}\n")

          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add githubmirror/26_ru_whitelist_*.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU whitelist update: ${{ steps.scan.outputs.count }} keys in ${{ steps.scan.outputs.files }} files (400/file)"
          git push origin ${{ steps.branch.outputs.name }}

name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      count: ${{ steps.check_alive.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests geoip2 --no-cache-dir

      - name: Check VLESS
        id: check_alive
        run: |
          python - <<'EOF'
          import os,sys,socket,urllib.parse,requests,time,json
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import geoip2.database,geoip2.errors

          print("🚀 VLESS RU Whitelist Scanner v3.0")
          
          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"
          
          if not os.path.exists(COUNTRY_DB) or not os.path.exists(ASN_DB):
              print("❌ GeoLite2 DB missing"); sys.exit(0)
              
          country_reader = geoip2.database.Reader(COUNTRY_DB)
          asn_reader = geoip2.database.Reader(ASN_DB)

          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/refs/heads/main/whitelist.txt"
          ru_sni = set()
          try:
              r = requests.get(RU_SNI_URL, timeout=15)
              ru_sni = set(l.strip().lower() for l in r.text.splitlines() if l.strip() and not l.startswith('#'))
              print(f"✅ RU SNI: {len(ru_sni)}")
          except: 
              print("❌ RU SNI fail"); sys.exit(0)

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/EbrahimFakhrahmani/free-v2ray-configs/main/configs/vless.txt",
              "https://raw.githubusercontent.com/MrPooyaX/IranProxy/main/Sub1.txt",
              "https://raw.githubusercontent.com/zealis/v2ray-subscription/master/vless.txt"
          ]

          dns_cache = {}
          geo_cache = {}
          asn_cache = {}

          def resolve_host(host):
              if host in dns_cache: return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
                  dns_cache[host] = ip
                  return ip
              except: 
                  dns_cache[host] = None
                  return None

          def not_ru_geo(host):
              if host in geo_cache: return geo_cache[host]
              ip = resolve_host(host)
              if not ip: return False
              try:
                  country = country_reader.country(ip).country.iso_code
                  result = country != "RU"
                  geo_cache[host] = result
                  return result
              except: 
                  geo_cache[host] = False
                  return False

          def not_ru_asn(host):
              if host in asn_cache: return asn_cache[host]
              ip = resolve_host(host)
              if not ip: return True
              try:
                  org = asn_reader.asn(ip).autonomous_system_organization.lower()
                  ru_asns = {"rostelecom","mts","megafon","beeline","tele2","yandex","rt"}
                  result = not any(asn in org for asn in ru_asns)
                  asn_cache[host] = result
                  return result
              except: 
                  asn_cache[host] = True
                  return True

          def tcp_ping(host,port=443,timeout=1):
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.settimeout(timeout)
                  s.connect((host,port))
                  s.close()
                  return True
              except: return False

          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless": return None
                  q = urllib.parse.parse_qs(u.query)
                  
                  port = 443
                  if u.netloc and ":" in u.netloc:
                      port = int(u.netloc.rsplit(":",1)[1])
                  
                  return {
                      "link": link.strip(),
                      "host": u.hostname,
                      "port": port,
                      "security": q.get("security",[""])[0],
                      "flow": q.get("flow",[""])[0],
                      "sni": q.get("sni",[""])[0].lower(),
                      "fp": q.get("fp",[""])[0]
                  }
              except: return None

          print("📥 Загрузка...")
          all_lines = []
          for url in URLS:
              try:
                  r = requests.get(url, timeout=20)
                  all_lines.extend(r.text.splitlines())
                  print(f"  {url.split('/')[-1]}: {len(r.text.splitlines())} строк")
              except: pass

          vless_links = [l for l in all_lines if l.strip().startswith("vless://")]
          print(f"📊 Всего VLESS: {len(vless_links)}")

          results = []
          seen = set()
          MAX_WORKERS = 100

          def check_server(link):
              d = parse_vless(link)
              if not d: return None
              
              if d["sni"] not in ru_sni: return None
              if not not_ru_geo(d["host"]): return None
              if not not_ru_asn(d["host"]): return None
              if not tcp_ping(d["host"], d["port"]): return None
              
              tag = ""
              if d["security"] == "reality":
                  tag = f"R-{d['port']}"
              elif d["security"] == "tls":
                  tag = f"T-{d['port']}"
              else: return None
              
              key = (d["host"], d["port"], d["sni"])
              if key in seen: return None
              
              return {
                  "link": d["link"] + f"#{tag}",
                  "host": d["host"],
                  "port": d["port"],
                  "sni": d["sni"]
              }

          print(f"🔍 Проверка {len(vless_links)} ссылок...")
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = [executor.submit(check_server, link) for link in vless_links]
              for future in as_completed(futures):
                  result = future.result()
                  if result:
                      results.append(result)
                      print(f"✅ LIVE: {result['host']}:{result['port']} sni={result['sni'][:30]}...")

          os.makedirs("githubmirror", exist_ok=True)
          final_links = [r["link"] for r in results]
          
          with open("githubmirror/26_ru_whitelist.txt", "w") as f:
              for link in final_links: 
                  f.write(link + "\n")
          
          stats = f"""📊 СТАТИСТИКА {time.strftime('%Y-%m-%d %H:%M')}
Всего строк: {len(all_lines)}
VLESS ссылок: {len(vless_links)}
RU SNI проверено: {len([l for l in vless_links if parse_vless(l) and parse_vless(l)["sni"] in ru_sni])}
🔥 LIVE ключей: {len(final_links)}
DNS: {len(dns_cache)} GeoIP: {len(geo_cache)} ASN: {len(asn_cache)}
---
ТОП КЛЮЧИ:
"""
          for i, r in enumerate(results[:20], 1):
              stats += f"{i}. {r['host']}:{r['port']} {r['sni'][:40]}...\n"

          with open("githubmirror/ru_stats.txt", "w") as f:
              f.write(stats)

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"count={len(final_links)}\n")
          
          print(f"🎉 НАЙДЕНО: {len(final_links)} LIVE ключей!")
          EOF

      - name: Commit & Push
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/
          if git diff --staged --quiet; then
            echo "Нет новых ключей"
          else
            git commit -m "🔥 RU Whitelist: ${{ steps.check_alive.outputs.count }} LIVE ключей"
            git push origin main
          fi

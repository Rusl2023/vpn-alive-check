              'BR': '🇧🇷BR', 'BS': '🇧🇸BS', 'BT': '🇧🇹BT', 'BV': '🇧🇻BV', 'BW': '🇧🇼BW', 'BY': '🇧🇾BY',
              'BZ': '🇧🇿BZ', 'CA': '🇨🇦CA', 'CC': '🇨🇨CC', 'CD': '🇨🇩CD', 'CF': '🇨🇫CF', 'CG': '🇨🇬CG',
              'CH': '🇨🇭CH', 'CI': '🇨🇮CI', 'CK': '🇨🇰CK', 'CL': '🇨🇱CL', 'CM': '🇨🇲CM', 'CN': '🇨🇳CN',
              'CO': '🇨🇴CO', 'CR': '🇨🇷CR', 'CU': '🇨🇺CU', 'CV': '🇨🇻CV', 'CW': '🇨🇼CW', 'CX': '🇨🇽CX',
              'CY': '🇨🇾CY', 'CZ': '🇨🇿CZ', 'DE': '🇩🇪DE', 'DJ': '🇩🇯DJ', 'DK': '🇩🇰DK', 'DM': '🇩🇲DM',
              'DO': '🇩🇴DO', 'DZ': '🇩🇿DZ', 'EC': '🇪🇨EC', 'EE': '🇪🇪EE', 'EG': '🇪🇬EG', 'EH': '🇪🇭EH',
              'ER': '🇪🇷ER', 'ES': '🇪🇸ES', 'ET': '🇪🇹ET', 'FI': '🇫🇮FI', 'FJ': '🇫🇯FJ', 'FK': '🇫🇰FK',
              'FM': '🇫🇲FM', 'FO': '🇫🇴FO', 'FR': '🇫🇷FR', 'GA': '🇬🇦GA', 'GB': '🇬🇧GB', 'GD': '🇬🇩GD',
              'GE': '🇬🇪GE', 'GF': '🇬🇫GF', 'GG': '🇬🇬GG', 'GH': '🇬🇭GH', 'GI': '🇬🇮GI', 'GL': '🇬🇱GL',
              'GM': '🇬🇲GM', 'GN': '🇬🇳GN', 'GP': '🇬🇵GP', 'GQ': '🇬🇶GQ', 'GR': '🇬🇷GR', 'GS': '🇬🇸GS',
              'GT': '🇬🇹GT', 'GU': '🇬🇺GU', 'GW': '🇬🇼GW', 'GY': '🇬🇾GY', 'HK': '🇭🇰HK', 'HM': '🇭🇲HM',
              'HN': '🇭🇳HN', 'HR': '🇭🇷HR', 'HT': '🇭🇹HT', 'HU': '🇭🇺HU', 'ID': '🇮🇩ID', 'IE': '🇮🇪IE',
              'IL': '🇮🇱IL', 'IM': '🇮🇲IM', 'IN': '🇮🇳IN', 'IO': '🇮🇴IO', 'IQ': '🇮🇶IQ', 'IR': '🇮🇷IR',
              'IS': '🇮🇸IS', 'IT': '🇮🇹IT', 'JE': '🇯🇪JE', 'JM': '🇯🇲JM', 'JO': '🇯🇴JO', 'JP': '🇯🇵JP',
              'KE': '🇰🇪KE', 'KG': '🇰🇬KG', 'KH': '🇰🇭KH', 'KI': '🇰🇮KI', 'KM': '🇰🇲KM', 'KN': '🇰🇳KN',
              'KP': '🇰🇵KP', 'KR': '🇰🇷KR', 'KW': '🇰🇼KW', 'KY': '🇰🇾KY', 'KZ': '🇰🇿KZ', 'LA': '🇱🇦LA',
              'LB': '🇱🇧LB', 'LC': '🇱🇨LC', 'LI': '🇱🇮LI', 'LK': '🇱🇰LK', 'LR': '🇱🇷LR', 'LS': '🇱🇸LS',
              'LT': '🇱🇹LT', 'LU': '🇱🇺LU', 'LV': '🇱🇻LV', 'LY': '🇱🇾LY', 'MA': '🇲🇦MA', 'MC': '🇲🇨MC',
              'MD': '🇲🇩MD', 'ME': '🇲🇪ME', 'MF': '🇲🇫MF', 'MG': '🇲🇬MG', 'MH': '🇲🇭MH', 'MK': '🇲🇰MK',
              'ML': '🇲🇱ML', 'MM': '🇲🇲MM', 'MN': '🇲🇳MN', 'MO': '🇲🇴MO', 'MP': '🇲🇵MP', 'MQ': '🇲🇶MQ',
              'MR': '🇲🇷MR', 'MS': '🇲🇸MS', 'MT': '🇲🇹MT', 'MU': '🇲🇺MU', 'MV': '🇲🇻MV', 'MW': '🇲🇼MW',
              'MX': '🇲🇽MX', 'MY': '🇲🇾MY', 'MZ': '🇲🇿MZ', 'NA': '🇳🇦NA', 'NC': '🇳🇨NC', 'NE': '🇳🇪NE',
              'NF': '🇳🇫NF', 'NG': '🇳🇬NG', 'NI': '🇳🇮NI', 'NL': '🇳🇱NL', 'NO': '🇳🇴NO', 'NP': '🇳🇵NP',
              'NR': '🇳🇷NR', 'NU': '🇳🇺NU', 'NZ': '🇳🇿NZ', 'OM': '🇴🇲OM', 'PA': '🇵🇦PA', 'PE': '🇵🇪PE',
              'PF': '🇵🇫PF', 'PG': '🇵🇬PG', 'PH': '🇵🇭PH', 'PK': '🇵🇰PK', 'PL': '🇵🇱PL', 'PM': '🇵🇲PM',
              'PN': '🇵🇳PN', 'PR': '🇵🇷PR', 'PS': '🇵🇸PS', 'PT': '🇵🇹PT', 'PW': '🇵🇼PW', 'PY': '🇵🇾PY',
              'QA': '🇶🇦QA', 'RE': '🇷🇪RE', 'RO': '🇷🇴RO', 'RS': '🇷🇸RS', 'RU': '🇷🇺RU', 'RW': '🇷🇼RW',
              'SA': '🇸🇦SA', 'SB': '🇸🇧SB', 'SC': '🇸🇨SC', 'SD': '🇸🇩SD', 'SE': '🇸🇪SE', 'SG': '🇸🇬SG',
              'SH': '🇸🇭SH', 'SI': '🇸🇮SI', 'SJ': '🇸🇯SJ', 'SK': '🇸🇰SK', 'SL': '🇸🇱SL', 'SM': '🇸🇲SM',
              'SN': '🇸🇳SN', 'SO': '🇸🇴SO', 'SR': '🇸🇷SR', 'SS': '🇸🇸SS', 'ST': '🇸🇹ST', 'SV': '🇸🇻SV',
              'SX': '🇸🇽SX', 'SY': '🇸🇾SY', 'SZ': '🇸🇿SZ', 'TC': '🇹🇨TC', 'TD': '🇹🇩TD', 'TF': '🇹🇫TF',
              'TG': '🇹🇬TG', 'TH': '🇹🇭TH', 'TJ': '🇹🇯TJ', 'TK': '🇹🇰TK', 'TL': '🇹🇱TL', 'TM': '🇹🇲TM',
              'TN': '🇹🇳TN', 'TO': '🇹🇴TO', 'TR': '🇹🇷TR', 'TT': '🇹🇹TT', 'TV': '🇹🇻TV', 'TW': '🇹🇼TW',
              'TZ': '🇹🇿TZ', 'UA': '🇺🇦UA', 'UG': '🇺🇬UG', 'UM': '🇺🇲UM', 'US': '🇺🇸US', 'UY': '🇺🇾UY',
              'UZ': '🇺🇿UZ', 'VA': '🇻🇦VA', 'VC': '🇻🇨VC', 'VE': '🇻🇪VE', 'VG': '🇻🇬VG', 'VI': '🇻🇮VI',
              'VN': '🇻🇳VN', 'VU': '🇻🇺VU', 'WF': '🇼🇫WF', 'WS': '🇼🇸WS', 'YE': '🇾🇪YE', 'YT': '🇾🇹YT',
              'ZA': '🇿🇦ZA', 'ZM': '🇿🇲ZM', 'ZW': '🇿🇼ZW'
          }

          dns_cache = {}
          seen = set()
          lock = Lock()
          counter = 0

          def next_id():
              global counter
              with lock:
                  counter += 1
                  return counter

          def load(url):
              try:
                  return set(requests.get(url, timeout=20).text.lower().split())
              except:
                  return set()

          def load_cidr(url):
              out = []
              try:
                  for l in requests.get(url, timeout=20).text.splitlines():
                      try:
                          out.append(ipaddress.ip_network(l.strip()))
                      except:
                          pass
              except:
                  pass
              return out

          def ip_in(ip, nets):
              try:
                  ip_obj = ipaddress.ip_address(ip)
                  return any(ip_obj in n for n in nets)
              except:
                  return False

          def resolve(h):
              if h in dns_cache:
                  return dns_cache[h]
              try:
                  ip = socket.gethostbyname(h)
                  dns_cache[h] = ip
                  return ip
              except:
                  dns_cache[h] = None
                  return None

          def tcp(ip, port):
              try:
                  s = socket.socket()
                  s.settimeout(TIMEOUT)
                  ok = s.connect_ex((ip, port)) == 0
                  s.close()
                  return ok
              except:
                  return False

          def download_configs():
              out = []
              for u in CONFIG_URLS:
                  try:
                      resp = requests.get(u, timeout=20)
                      out.extend(resp.text.splitlines())
                  except:
                      pass
              return [x.strip() for x in out if x.startswith("vless://")]

          def get_country(ip):
              try:
                  r = country_reader.country(ip)
                  return r.country.iso_code or "??"
              except:
                  return "??"

          def get_flag(cc):
              return FLAGS.get(cc, "🌍" + cc)

          def check_link(link):
              try:
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)

                  # Фильтры
                  if int(u.port or 443) != 443:
                      return None
                  if q.get("flow", [""])[0] != "xtls-rprx-vision":
                      return None
                  if q.get("fp", [""])[0] not in ALLOWED_FP:
                      return None

                  hostname = u.hostname
                  ip = resolve(hostname)
                  if not ip or not tcp(ip, 443):
                      return None

                  sni = q.get("sni", [""])[0].lower()
                  if not (sni in sni_wl or ip in ip_wl or ip_in(ip, cidr_wl)):
                      return None

                  # Дедупликация
                  key = (hostname, u.port or 443, sni)
                  with lock:
                      if key in seen:
                          return None
                      seen.add(key)

                  # Тест через Xray
                  port = random.randint(20000, 40000)
                  ok, exit_ip = run_xray_test(link, port)
                  if not ok:
                      return None

                  # Исключаем RU exit
                  if exit_ip:
                      cc_exit = get_country(exit_ip)
                      if cc_exit == "RU":
                          return None
                      exit_flag = get_flag(cc_exit)
                  else:
                      exit_flag = "🌍??"

                  server_cc = get_country(ip)
                  server_flag = get_flag(server_cc)
                  num = next_id()

                  star = "⭐" if q.get("type", ["tcp"])[0] == "xhttp" else ""

                  name = f"{star}{server_flag}→{num}→{exit_flag} SNI:{q.get('sni',[''])[0]}"

                  base = link.split("#")[0]
                  return base + "#" + name

              except:
                  return None

          def run_xray_test(link, port):
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              cfg = {
                  "inbounds": [{"listen": "127.0.0.1", "port": port, "protocol": "socks"}],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": u.hostname,
                              "port": int(u.port or 443),
                              "users": [{
                                  "id": u.username,
                                  "encryption": "none",
                                  "flow": "xtls-rprx-vision"
                              }]
                          }]
                      },
                      "streamSettings": {
                          "network": q.get("type", ["tcp"])[0],
                          "security": q.get("security", ["tls"])[0],
                          "realitySettings": {
                              "serverName": q.get("sni", [""])[0],
                              "publicKey": q.get("pbk", [""])[0],
                              "shortId": q.get("sid", [""])[0],
                              "fingerprint": q.get("fp", ["chrome"])[0]
                          } if q.get("security", ["tls"])[0] == "reality" else {}
                      }
                  }]
              }

              fn = f"cfg_{port}.json"
              with open(fn, "w") as f:
                  json.dump(cfg, f, indent=2)

              p = subprocess.Popen([XRAY, "run", "-c", fn],
                                   stdout=subprocess.DEVNULL,
                                   stderr=subprocess.DEVNULL)

              time.sleep(2)

              try:
                  code = subprocess.check_output([
                      "curl", "-s", "--max-time", "10",
                      "-x", f"socks5h://127.0.0.1:{port}",
                      "http://www.gstatic.com/generate_204",
                      "-w", "%{http_code}"
                  ]).decode().strip()
                  ok = code in ("200", "204", "403", "429")
              except:
                  ok = False

              exit_ip = None
              if ok:
                  try:
                      exit_ip = subprocess.check_output([
                          "curl", "-s", "--max-time", "8",
                          "-x", f"socks5h://127.0.0.1:{port}",
                          "https://api.ipify.org"
                      ]).decode().strip()
                  except:
                      pass

              p.kill()
              try:
                  os.remove(fn)
              except:
                  pass

              return ok, exit_ip

          # ====================== MAIN ======================
          print("🌍 Geo init...")
          global country_reader
          country_reader = geoip2.database.Reader("GeoLite2-Country.mmdb")

          sni_wl = load(RU_SNI)
          ip_wl = load(RU_IP)
          cidr_wl = load_cidr(RU_CIDR)

          print(f"📥 Загружено whitelist: SNI={len(sni_wl)}, IP={len(ip_wl)}, CIDR={len(cidr_wl)}")

          cfgs = download_configs()
          random.shuffle(cfgs)

          good = []

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
              futures = [ex.submit(check_link, x) for x in cfgs]
              for future in as_completed(futures):
                  result = future.result()
                  if result:
                      good.append(result)

          print(f"✅ FINAL: {len(good)} хороших конфигов")

          os.makedirs("githubmirror", exist_ok=True)

          i = 0
          for n in range(0, len(good), MAX_PER_FILE):
              i += 1
              filename = f"githubmirror/HMAO_Surgutcity_{i:02d}.txt"
              with open(filename, "w") as f:
                  f.write("\n".join(good[n:n + MAX_PER_FILE]))
              print(f"💾 Записано {filename} ({len(good[n:n+MAX_PER_FILE])} строк)")

          country_reader.close()
          EOF

      - name: Commit and Push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add githubmirror/
          git commit -m "RU MAX FINAL update $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push

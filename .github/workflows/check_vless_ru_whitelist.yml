name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN + Network Filter

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ru-whitelist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest
        run: git pull origin ${{ steps.branch.outputs.name }} --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan VLESS
        id: scan
        run: |
          python3 <<'EOF'
          import os
          import socket
          import urllib.parse
          import requests
          import random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock

          headers = {"User-Agent": "Mozilla/5.0"}
          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"

          print("Loading RU whitelist...")
          ru_sni = set()
          try:
              r = requests.get(RU_SNI_URL, timeout=20, headers=headers)
              ru_sni = set(x.strip().lower() for x in r.text.splitlines()
                           if x.strip() and not x.startswith("#"))
              print("Whitelist loaded:", len(ru_sni))
          except Exception as e:
              print("Whitelist load error:", e)

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/vless_configs.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
          ]

          dns_cache = {}
          seen = set()
          lock = Lock()
          counters = {"sni":0, "sec":0, "flow":0, "net":0, "ping":0}

          allowed_networks = ("grpc", "raw", "xhttp", "h2", "ws", "tcp")

          def resolve(host):
              if not host:
                  return None
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
                  dns_cache[host] = ip
                  return ip
              except:
                  dns_cache[host] = None
                  return None

          def tcp_ping(host, port):
              try:
                  s = socket.create_connection((host, port), timeout=1.5)
                  s.close()
                  return True
              except:
                  return False

          def parse(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless":
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      "link": link.strip(),
                      "host": u.hostname,
                      "port": int(u.port or 443),
                      "sni": q.get("sni", [""])[0].lower(),
                      "security": q.get("security", [""])[0].lower(),
                      "flow": q.get("flow", [""])[0].lower(),
                      "network": q.get("type", ["tcp"])[0].lower()
                  }
              except:
                  return None

          print("Downloading configs...")
          lines = []
          for url in URLS:
              try:
                  r = requests.get(url, timeout=25, headers=headers)
                  lines += r.text.splitlines()
                  print("Loaded", len(r.text.splitlines()), "from", url)
              except Exception as e:
                  print("Failed:", url, e)

          vless = [l.strip() for l in lines if l.startswith("vless://")]
          print("Total VLESS:", len(vless))
          random.shuffle(vless)

          MAX_PER_FILE = 400
          BATCH_SIZE = 1000
          results = []

          def check(link):
              d = parse(link)
              if not d or not d["host"]:
                  return None

              if d["sni"] not in ru_sni:
                  with lock: counters["sni"] += 1
                  return None

              if d["security"] != "reality":
                  with lock: counters["sec"] += 1
                  return None

              if d["flow"] != "xtls-rprx-vision":
                  with lock: counters["flow"] += 1
                  return None

              if d["network"] not in allowed_networks:
                  with lock: counters["net"] += 1
                  return None

              if not resolve(d["host"]):
                  return None

              if not tcp_ping(d["host"], d["port"]):
                  with lock: counters["ping"] += 1
                  return None

              key = (d["host"], d["port"], d["sni"])
              with lock:
                  if key in seen:
                      return None
                  seen.add(key)

              return d["link"]

          print("Scanning...")
          for i in range(0, len(vless), BATCH_SIZE):
              batch = vless[i:i+BATCH_SIZE]
              with ThreadPoolExecutor(max_workers=30) as ex:
                  futures = [ex.submit(check, l) for l in batch]
                  for f in as_completed(futures):
                      r = f.result()
                      if r:
                          results.append(r)

          # 🔥 НЕ удаляем папку
          os.makedirs("githubmirror", exist_ok=True)

          # Удаляем только старые whitelist-файлы
          existing = [f for f in os.listdir("githubmirror")
                      if f.startswith("26_ru_whitelist_") and f.endswith(".txt")]

          MAX_PER_FILE = 400
          file_counter = 0

          for i in range(0, len(results), MAX_PER_FILE):
              file_counter += 1
              filename = f"26_ru_whitelist_{file_counter:02d}.txt"
              path = os.path.join("githubmirror", filename)
              with open(path, "w") as f:
                  f.write("\n".join(results[i:i+MAX_PER_FILE]))

          # Удаляем лишние старые whitelist-файлы
          for f in existing:
              index = int(f.split("_")[-1].split(".")[0])
              if index > file_counter:
                  os.remove(os.path.join("githubmirror", f))

          total_live = len(results)
          print("LIVE:", total_live)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"count={total_live}", file=f)
              print(f"files={file_counter}", file=f)
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add githubmirror/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU whitelist: ${{ steps.scan.outputs.count }} keys (${{ steps.scan.outputs.files }} files)"

          for i in 1 2 3; do
            git pull --rebase origin ${{ steps.branch.outputs.name }} && break
            echo "Retry rebase $i..."
            sleep 2
          done

          git push origin ${{ steps.branch.outputs.name }}

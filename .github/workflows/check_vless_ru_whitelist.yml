name: Check VLESS RU Whitelist + Reality Vision + GeoIP + ASN

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      count: ${{ steps.check_alive.outputs.count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GeoLite databases
        run: |
          mkdir -p geolite2
          curl -L -o geolite2/GeoLite2-Country.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-Country.mmdb || true
          curl -L -o geolite2/GeoLite2-ASN.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/main/GeoLite2-ASN.mmdb || true
          ls -la geolite2/ || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 --no-cache-dir

      - name: Check VLESS servers
        id: check_alive
        run: |
          python3 <<'EOF'
          import os, sys, socket, urllib.parse, requests, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import geoip2.database

          print("🚀 Scanner start")

          COUNTRY_DB = "geolite2/GeoLite2-Country.mmdb"
          ASN_DB = "geolite2/GeoLite2-ASN.mmdb"

          if not os.path.exists(COUNTRY_DB) or not os.path.exists(ASN_DB):
              print("⚠️ GeoLite missing, using fallback")
              ru_sni = set()
              sys.exit(0)

          try:
              country_reader = geoip2.database.Reader(COUNTRY_DB)
              asn_reader = geoip2.database.Reader(ASN_DB)
          except:
              print("⚠️ GeoIP readers failed, using fallback")
              ru_sni = set()
              sys.exit(0)

          headers = {"User-Agent": "Mozilla/5.0"}
          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/refs/heads/main/whitelist.txt"

          ru_sni = set()
          try:
              r = requests.get(RU_SNI_URL, timeout=15, headers=headers)
              r.raise_for_status()
              ru_sni = set(l.strip().lower() for l in r.text.splitlines() if l.strip() and not l.startswith('#'))
              print("✅ RU SNI:", len(ru_sni))
          except Exception as e:
              print("⚠️ Whitelist error:", e, "→ using empty whitelist")

          URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/EbrahimFakhrahmani/free-v2ray-configs/main/configs/vless.txt",
              "https://raw.githubusercontent.com/MrPooyaX/IranProxy/main/Sub1.txt",
              "https://raw.githubusercontent.com/zealis/v2ray-subscription/master/vless.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt"
          ]

          dns_cache = {}
          geo_cache = {}
          asn_cache = {}
          seen = set()
          lock = Lock()

          def resolve_host(host):
              if host in dns_cache:
                  return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
                  dns_cache[host] = ip
                  return ip
              except:
                  dns_cache[host] = None
                  return None

          def not_ru_geo(host):
              if host in geo_cache:
                  return geo_cache[host]
              ip = resolve_host(host)
              if not ip:
                  return False
              try:
                  result = country_reader.country(ip).country.iso_code != "RU"
                  geo_cache[host] = result
                  return result
              except:
                  return False

          def not_ru_asn(host):
              if host in asn_cache:
                  return asn_cache[host]
              ip = resolve_host(host)
              if not ip:
                  return True
              try:
                  org = asn_reader.asn(ip).autonomous_system_organization.lower()
                  bad = {"rostelecom","mts","megafon","beeline","tele2","yandex","rt"}
                  result = not any(x in org for x in bad)
                  asn_cache[host] = result
                  return result
              except:
                  return True

          def tcp_ping(host, port):
              try:
                  s = socket.socket()
                  s.settimeout(1)
                  s.connect((host, port))
                  s.close()
                  return True
              except:
                  return False

          def parse_vless(link):
              try:
                  u = urllib.parse.urlparse(link.strip())
                  if u.scheme != "vless":
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  port = int(u.netloc.split(":")[-1]) if ":" in u.netloc else 443
                  return {
                      "link": link.strip(),
                      "host": u.hostname,
                      "port": port,
                      "security": q.get("security", [""])[0],
                      "sni": q.get("sni", [""])[0].lower()
                  }
              except:
                  return None

          all_lines = []
          for url in URLS:
              try:
                  r = requests.get(url, timeout=20, headers=headers)
                  all_lines += r.text.splitlines()
              except:
                  pass

          vless_links = [l for l in all_lines if l.startswith("vless://")]
          print("Total:", len(vless_links))

          def check(link):
              d = parse_vless(link)
              if not d: return None
              if d["sni"] not in ru_sni: return None
              if not not_ru_geo(d["host"]): return None
              if not not_ru_asn(d["host"]): return None
              if not tcp_ping(d["host"], d["port"]): return None
              if d["security"] not in ("reality","tls"): return None

              key = (d["host"], d["port"], d["sni"])
              with lock:
                  if key in seen:
                      return None
                  seen.add(key)

              return d["link"]

          results = []
          with ThreadPoolExecutor(max_workers=60) as ex:
              fut = [ex.submit(check, l) for l in vless_links[:5000]]
              for f in as_completed(fut):
                  r = f.result()
                  if r:
                      results.append(r)

          print("✅ LIVE:", len(results))

          os.makedirs("githubmirror", exist_ok=True)
          with open("githubmirror/26_ru_whitelist.txt","w") as f:
              for l in results:
                  f.write(l+"\n")

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"count={len(results)}\n")
          EOF

      - name: Commit & Push
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/ || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU whitelist: ${{ steps.check_alive.outputs.count }} LIVE" || true
          git pull --rebase origin main || true
          git push || true

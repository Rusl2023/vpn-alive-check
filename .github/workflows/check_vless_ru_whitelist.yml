name: Check VLESS RU Whitelist + Reality security + xtls-rprx-vision + TCP ping

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ru-whitelist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch
        id: branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Pull latest changes
        run: |
          git pull origin ${{ steps.branch.outputs.branch }} --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan VLESS configs
        id: scan
        run: |
          python3 <<'EOF'
          import os
          import socket
          import urllib.parse
          import requests
          import random
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import time

          # Configuration
          MAX_WORKERS = 30
          TIMEOUT = 1.5
          MAX_PER_FILE = 400
          BATCH_SIZE = 1000
          
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          RU_SNI_URL = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"
          
          # Оптимизированные fingerprints на основе статьи #3518
          # Только стабильные браузерные fingerprint'ы, без random/randomized
          ALLOWED_FINGERPRINTS = {
              "chrome", "firefox", "safari", "ios", 
              "edge", "qq", "360"  # Добавлены популярные в РФ
          }
          
          # Разрешенные пути для SpiderX (маскировка handshake)
          ALLOWED_SPX_PATHS = {
              "",  # Пустой тоже допустим
              "/",
              "/login",
              "/api",
              "/index",
              "/gateway",
              "/v1",
              "/v2",
              "/ws",
              "/api/v1",
              "/api/v2"
          }

          # Sources for VLESS configs
          CONFIG_URLS = [
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/refs/heads/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/BlackList.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/ermaozi01/free_clash_vpn/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray_config.txt",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt",
              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt",
              "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt",
              "https://bp.wl.free.nf/confs/wl.txt",
              "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/country/XX.txt",
              "https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/Whitelist.txt",
              "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt",
              "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/1.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/2.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/3.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/4.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/5.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/6.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/7.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/9.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/10.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/11.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/12.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/13.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/14.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/15.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/16.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/17.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/18.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/19.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/20.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/21.txt",
              "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/24.txt",
          ]

          # Global variables
          dns_cache = {}
          seen_configs = set()
          stats_lock = Lock()
          stats = {
              "total": 0,
              "filtered_sni": 0,
              "filtered_security": 0,
              "filtered_flow": 0,
              "filtered_fp": 0,
              "filtered_pbk": 0,
              "filtered_sid": 0,
              "filtered_spx": 0,
              "filtered_ping": 0,
              "duplicates": 0,
              "valid": 0
          }

          def load_ru_whitelist():
              """Load Russian SNI whitelist"""
              print("Loading RU whitelist...")
              try:
                  response = requests.get(RU_SNI_URL, timeout=20, headers=HEADERS)
                  response.raise_for_status()
                  
                  whitelist = set()
                  for line in response.text.splitlines():
                      line = line.strip().lower()
                      if line and not line.startswith("#"):
                          whitelist.add(line)
                  
                  print(f"Whitelist loaded: {len(whitelist)}")
                  return whitelist
              except Exception as e:
                  print(f"Whitelist load error: {e}")
                  return set()

          def download_configs():
              """Download VLESS configs from all sources"""
              all_lines = []
              print("Downloading configs...")
              
              for url in CONFIG_URLS:
                  try:
                      response = requests.get(url, timeout=25, headers=HEADERS)
                      response.raise_for_status()
                      
                      lines = response.text.splitlines()
                      all_lines.extend(lines)
                      print(f"Loaded {len(lines)} from {url}")
                  except Exception as e:
                      print(f"Failed: {url} {str(e)[:50]}")
              
              # Extract VLESS links
              vless_links = [line.strip() for line in all_lines if line.strip().startswith("vless://")]
              print(f"Total VLESS: {len(vless_links)}")
              
              return vless_links

          def resolve_hostname(hostname):
              """Resolve hostname to IP with caching"""
              if not hostname:
                  return None
              
              if hostname in dns_cache:
                  return dns_cache[hostname]
              
              try:
                  ip = socket.gethostbyname(hostname)
                  dns_cache[hostname] = ip
                  return ip
              except socket.gaierror:
                  dns_cache[hostname] = None
                  return None

          def tcp_ping_test(host, port):
              """Simple TCP ping test (оригинальный подход)"""
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(TIMEOUT)
                  result = sock.connect_ex((host, port))
                  sock.close()
                  return result == 0
              except Exception:
                  return False

          def validate_short_id(sid):
              """Validate short ID format (4-16 hex chars)"""
              if not sid:
                  return False
              # Убираем префикс 0x если есть
              sid = sid.lower().replace('0x', '')
              # Проверяем длину и hex-формат
              return 4 <= len(sid) <= 16 and all(c in '0123456789abcdef' for c in sid)

          def validate_public_key(pbk):
              """Validate Reality public key (base64, примерно 40+ символов)"""
              if not pbk:
                  return False
              # Reality public key обычно длиной 40-60 символов в base64
              return len(pbk) >= 40 and re.match(r'^[A-Za-z0-9+/=]+$', pbk) is not None

          def parse_vless_config(link):
              """Parse VLESS config with all Reality parameters"""
              try:
                  parsed = urllib.parse.urlparse(link.strip())
                  
                  if parsed.scheme != "vless":
                      return None
                  
                  query_params = urllib.parse.parse_qs(parsed.query)
                  
                  # Извлекаем все параметры для Reality
                  return {
                      "link": link.strip(),
                      "host": parsed.hostname,
                      "port": int(parsed.port or 443),
                      "sni": query_params.get("sni", [""])[0].lower(),
                      "security": query_params.get("security", [""])[0].lower(),
                      "flow": query_params.get("flow", [""])[0].lower(),
                      "type": query_params.get("type", ["tcp"])[0].lower(),
                      "fp": query_params.get("fp", [""])[0].lower(),
                      "pbk": query_params.get("pbk", [""])[0],  # Public key сервера
                      "sid": query_params.get("sid", [""])[0],  # Short ID (hex)
                      "spx": query_params.get("spx", [""])[0],  # SpiderX path
                      "encryption": query_params.get("encryption", ["none"])[0].lower()
                  }
              except Exception as e:
                  return None

          def validate_config(config, ru_whitelist):
              """Validate config against all criteria"""
              if not config or not config["host"]:
                  return None
              
              # 1. SNI в белом списке РФ
              if config["sni"] not in ru_whitelist:
                  with stats_lock:
                      stats["filtered_sni"] += 1
                  return None
              
              # 2. Security должен быть reality
              if config["security"] != "reality":
                  with stats_lock:
                      stats["filtered_security"] += 1
                  return None
              
              # 3. Flow должен быть xtls-rprx-vision
              if config["flow"] != "xtls-rprx-vision":
                  with stats_lock:
                      stats["filtered_flow"] += 1
                  return None
              
              # 4. Fingerprint должен быть в списке разрешенных (стабильные браузерные)
              if config["fp"] not in ALLOWED_FINGERPRINTS:
                  with stats_lock:
                      stats["filtered_fp"] += 1
                  return None
              
              # 5. Проверка public key (обязателен для Reality)
              if not validate_public_key(config["pbk"]):
                  with stats_lock:
                      stats["filtered_pbk"] += 1
                  return None
              
              # 6. Проверка short ID (4-16 hex символов)
              if not validate_short_id(config["sid"]):
                  with stats_lock:
                      stats["filtered_sid"] += 1
                  return None
              
              # 7. Проверка SpiderX path (если есть)
              if config["spx"] and config["spx"] not in ALLOWED_SPX_PATHS:
                  with stats_lock:
                      stats["filtered_spx"] += 1
                  return None
              
              # 8. Проверка что тип TCP (опционально)
              if config["type"] != "tcp":
                  return None
              
              # 9. Resolve hostname
              ip = resolve_hostname(config["host"])
              if not ip:
                  return None
              
              # 10. TCP ping test
              if not tcp_ping_test(ip, config["port"]):
                  with stats_lock:
                      stats["filtered_ping"] += 1
                  return None
              
              # 11. Check for duplicates
              config_key = (config["host"], config["port"], config["sni"], config["pbk"][:20])
              with stats_lock:
                  if config_key in seen_configs:
                      stats["duplicates"] += 1
                      return None
                  seen_configs.add(config_key)
                  stats["valid"] += 1
              
              return config["link"]

          def save_results(results):
              """Save results to files (оригинальная логика)"""
              # Не удаляем папку
              os.makedirs("githubmirror", exist_ok=True)

              # Получаем список существующих whitelist-файлов
              existing = [f for f in os.listdir("githubmirror")
                         if f.startswith("26_ru_whitelist_") and f.endswith(".txt")]

              file_counter = 0
              total_live = len(results)
              
              print(f"LIVE: {total_live}")

              # Сохраняем новые файлы
              for i in range(0, total_live, MAX_PER_FILE):
                  file_counter += 1
                  filename = f"26_ru_whitelist_{file_counter:02d}.txt"
                  path = os.path.join("githubmirror", filename)
                  with open(path, "w") as f:
                      f.write("\n".join(results[i:i + MAX_PER_FILE]))
                  print(f"Saved {filename} with {len(results[i:i + MAX_PER_FILE])} configs")

              # Удаляем лишние старые whitelist-файлы
              for old_file in existing:
                  try:
                      index = int(old_file.split("_")[-1].split(".")[0])
                      if index > file_counter:
                          os.remove(os.path.join("githubmirror", old_file))
                          print(f"Removed old file: {old_file}")
                  except (ValueError, IndexError):
                      continue
              
              return file_counter, total_live

          def print_statistics():
              """Print detailed statistics"""
              print("\n" + "="*60)
              print("📊 SCAN STATISTICS (с фильтрацией по Reality)")
              print("="*60)
              print(f"📥 Total configs processed: {stats['total']}")
              print(f"❌ Filtered - SNI not in whitelist: {stats['filtered_sni']}")
              print(f"❌ Filtered - Not Reality security: {stats['filtered_security']}")
              print(f"❌ Filtered - Wrong flow: {stats['filtered_flow']}")
              print(f"❌ Filtered - Invalid fingerprint: {stats['filtered_fp']}")
              print(f"❌ Filtered - Missing/invalid public key: {stats['filtered_pbk']}")
              print(f"❌ Filtered - Invalid short ID: {stats['filtered_sid']}")
              print(f"❌ Filtered - Invalid SpiderX path: {stats['filtered_spx']}")
              print(f"❌ Filtered - TCP ping failed: {stats['filtered_ping']}")
              print(f"🔄 Duplicates skipped: {stats['duplicates']}")
              print(f"✅ Valid Reality configs found: {stats['valid']}")
              print("="*60)
              
              if stats['valid'] > 0:
                  survival_rate = (stats['valid'] / stats['total']) * 100
                  print(f"📈 Survival rate: {survival_rate:.2f}%")
              print("="*60)

          def main():
              start_time = time.time()
              
              # Load whitelist
              ru_whitelist = load_ru_whitelist()
              if not ru_whitelist:
                  print("No whitelist loaded, exiting")
                  return
              
              # Download configs
              vless_configs = download_configs()
              if not vless_configs:
                  print("No configs downloaded, exiting")
                  return
              
              # Shuffle for fairness
              random.shuffle(vless_configs)
              stats["total"] = len(vless_configs)
              
              # Process in batches
              results = []
              print("Scanning with Reality validation...")
              
              for batch_start in range(0, len(vless_configs), BATCH_SIZE):
                  batch_end = min(batch_start + BATCH_SIZE, len(vless_configs))
                  batch = vless_configs[batch_start:batch_end]
                  
                  with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                      futures = []
                      for link in batch:
                          config = parse_vless_config(link)
                          if config:
                              futures.append(executor.submit(validate_config, config, ru_whitelist))
                      
                      for future in as_completed(futures):
                          result = future.result()
                          if result:
                              results.append(result)
                  
                  print(f"Progress: {batch_end}/{len(vless_configs)} configs, valid: {len(results)}")

              # Save results
              files_created, total_live = save_results(results)
              
              # Print statistics
              print_statistics()
              
              elapsed = time.time() - start_time
              print(f"Total execution time: {elapsed:.1f} seconds")

              # Set output for GitHub Actions
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  print(f"count={total_live}", file=f)
                  print(f"files={files_created}", file=f)

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add githubmirror/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU whitelist: ${{ steps.scan.outputs.count }} Reality keys (${{ steps.scan.outputs.files }} files)"

          for i in 1 2 3; do
            git pull --rebase origin ${{ steps.branch.outputs.branch }} && break
            echo "Retry rebase $i..."
            sleep 2
          done

          git push origin ${{ steps.branch.outputs.branch }}

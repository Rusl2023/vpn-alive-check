name: RU MAX FILTER (v2.6 WORKING)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install requests geoip2

      - name: Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Run
        run: |
          python3 << 'PY'
          import os,requests,re,socket,subprocess,time,random,json,base64
          from urllib.parse import urlparse,parse_qs,unquote
          from concurrent.futures import ThreadPoolExecutor

          XRAY="./xray"

          CONFIG_URLS=[
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/RUNoName/V.O.I.D-VPN_Bypass/refs/heads/main/configs/url_work.txt"
          ]

          # 🔥 SOFT whitelist
          WL_URL="https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"

          def load_wl():
              try:
                  r=requests.get(WL_URL,timeout=20)
                  return set([x.strip().lower() for x in r.text.splitlines() if "." in x])
              except:
                  return set()

          WL=load_wl()

          def parse(link):
              try:
                  u=urlparse(link.split("#")[0])
                  q=parse_qs(u.query)
                  return {
                      "host":u.hostname,
                      "port":int(u.port or 443),
                      "id":unquote(u.username or ''),
                      "sni":q.get("sni",[""])[0],
                      "pbk":q.get("pbk",[""])[0],
                      "sec":q.get("security",[""])[0],
                      "net":q.get("type",["tcp"])[0]
                  }
              except:
                  return None

          def resolve(h):
              try: return socket.gethostbyname(h)
              except: return None

          def tcp(ip,p):
              try:
                  s=socket.create_connection((ip,p),timeout=3)
                  s.close()
                  return True
              except: return False

          def sni_ok(sni):
              if not sni: return False

              # strict
              if sni in WL:
                  return True

              # subdomain
              for d in WL:
                  if sni.endswith("."+d):
                      return True

              # 🔥 SOFT fallback (очень важно)
              if any(x in sni for x in ["yandex","vk","mail","ozon","sber"]):
                  return True

              return False

          def build(cfg,port):
              return {
                  "inbounds":[{"port":port,"listen":"127.0.0.1","protocol":"socks"}],
                  "outbounds":[{
                      "protocol":"vless",
                      "settings":{"vnext":[{"address":cfg['host'],"port":cfg['port'],
                      "users":[{"id":cfg['id'],"encryption":"none"}]}]},
                      "streamSettings":{
                          "network":cfg['net'],
                          "security":"reality",
                          "realitySettings":{
                              "serverName":cfg['sni'],
                              "publicKey":cfg['pbk'],
                              "fingerprint":"chrome"
                          }
                      }
                  }]
              }

          def test(cfg):
              try:
                  if cfg['sec']!="reality":
                      return None

                  if not sni_ok(cfg['sni']):
                      return None

                  ip=resolve(cfg['host'])
                  if not ip or not tcp(ip,cfg['port']):
                      return None

                  port=random.randint(20000,60000)

                  fname=f"c{port}.json"
                  with open(fname,"w") as f:
                      json.dump(build(cfg,port),f)

                  p=subprocess.Popen([XRAY,"run","-c",fname],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

                  time.sleep(2)

                  try:
                      r=subprocess.run(
                          ["curl","-s","--max-time","6","-x",f"socks5h://127.0.0.1:{port}","https://api.ipify.org"],
                          capture_output=True,text=True
                      )
                      if r.stdout.strip():
                          return cfg
                  except:
                      pass

                  p.kill()
                  os.remove(fname)
              except:
                  pass
              return None

          links=[]
          for u in CONFIG_URLS:
              try:
                  r=requests.get(u,timeout=20)
                  links+=re.findall(r'vless://[^\s]+',r.text)
              except:
                  pass

          links=list(set(links))
          random.shuffle(links)

          results=[]
          with ThreadPoolExecutor(20) as ex:
              for cfg in ex.map(lambda x:test(parse(x)),links):
                  if cfg:
                      results.append(cfg)

          os.makedirs("githubmirror",exist_ok=True)

          out=[]
          for c in results:
              out.append(f"vless://{c['id']}@{c['host']}:{c['port']}?security=reality&sni={c['sni']}#{c['sni']}")

          open("githubmirror/sub.txt","w").write("\n".join(out))
          open("githubmirror/sub64.txt","w").write(base64.b64encode("\n".join(out).encode()).decode())

          print("FOUND:",len(out))
          PY

      - name: Push
        run: |
          git config --global user.name bot
          git config --global user.email bot@bot.com
          git add githubmirror/
          git commit -m "working update" || echo ok
          git push

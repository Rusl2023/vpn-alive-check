name: 2 этап — Final RU VLESS 443 (ipwho + ipapi)

on:
  schedule:
    - cron: '10 */3 * * *'
  workflow_dispatch:

concurrency:
  group: final-white-vless-filter
  cancel-in-progress: true

jobs:
  final-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray
          chmod +x xray

      - name: Prepare input
        run: |
          mkdir -p githubmirror
          cp githubmirror/white-vless-ru-443-live.txt githubmirror/input.txt || true

      - name: Final filter (RU via 2 APIs)
        run: |
          python3 << 'EOF'
          import subprocess, urllib.parse, socket, os, json, base64, time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          XRAY = "./xray"
          INPUT = "githubmirror/input.txt"
          OUT = "githubmirror/final-white-vless-ru-443-live.txt"
          OUT64 = "githubmirror/final-white-vless-ru-443-live-base64.txt"

          def free_port():
              import socket
              s = socket.socket()
              s.bind(('',0))
              p = s.getsockname()[1]
              s.close()
              return p

          def wait_port(port):
              import socket, time
              t = time.time()
              while time.time() - t < 12:
                  try:
                      socket.create_connection(("127.0.0.1", port), 1)
                      return True
                  except:
                      time.sleep(0.2)
              return False

          # ===== RU CHECK =====
          def is_ru_by_api(ip):
              # ipwho.is
              try:
                  r1 = subprocess.check_output(
                      ['curl','-s',f'https://ipwho.is/{ip}'],
                      text=True
                  )
                  if '"country_code":"RU"' not in r1:
                      return False
              except:
                  return False

              # ipapi.co
              try:
                  r2 = subprocess.check_output(
                      ['curl','-s',f'https://ipapi.co/{ip}/country/'],
                      text=True
                  ).strip()
                  if r2 != 'RU':
                      return False
              except:
                  return False

              return True

          def test_proxy(port):
              try:
                  ip = subprocess.check_output(
                      ['curl','-s','--max-time','10',
                       '-x',f'socks5h://127.0.0.1:{port}',
                       'https://api.ipify.org'],
                      text=True
                  ).strip()

                  if not ip:
                      return False

                  # проверка страны через 2 сервиса
                  if not is_ru_by_api(ip):
                      print(f"🚫 NOT RU: {ip}")
                      return False

              except:
                  return False

              # тест Яндекса (оставили)
              try:
                  code = subprocess.check_output(
                      ['curl','-s','--max-time','10',
                       '-x',f'socks5h://127.0.0.1:{port}',
                       '-o','/dev/null','-w','%{http_code}',
                       'https://yandex.ru'],
                      text=True
                  ).strip()

                  if code != '200':
                      print(f"❌ yandex failed: {code}")
                      return False

                  print("✅ yandex OK")

              except:
                  return False

              return True

          if not os.path.exists(INPUT):
              print("❌ No input file")
              exit(1)

          links = [l.strip() for l in open(INPUT) if l.strip().startswith('vless://')]
          print("INPUT:", len(links))

          result = []

          def check(link):
              try:
                  u = urllib.parse.urlparse(link)

                  if not u.hostname:
                      return None

                  port = u.port or 443

                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni',[''])[0] or u.hostname

                  stream = {'network': q.get('type',['tcp'])[0]}

                  sec = q.get('security',['none'])[0]
                  if sec == 'reality' and 'pbk' in q:
                      stream.update({
                          'security':'reality',
                          'realitySettings':{
                              'serverName':sni,
                              'publicKey':q['pbk'][0],
                              'shortId':q.get('sid',[''])[0]
                          }
                      })
                  elif sec == 'tls':
                      stream.update({
                          'security':'tls',
                          'tlsSettings':{'serverName':sni,'allowInsecure':True}
                      })

                  p = free_port()

                  cfg = {
                      "inbounds":[{"listen":"127.0.0.1","port":p,"protocol":"socks"}],
                      "outbounds":[{
                          "protocol":"vless",
                          "settings":{
                              "vnext":[{
                                  "address":u.hostname,
                                  "port":port,
                                  "users":[{"id":u.username,"encryption":"none"}]
                              }]
                          },
                          "streamSettings":stream
                      }]
                  }

                  fn = f"cfg_{p}.json"
                  with open(fn,'w') as f:
                      json.dump(cfg,f)

                  proc = subprocess.Popen([XRAY,'run','-c',fn],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  if not wait_port(p):
                      proc.kill()
                      return None

                  ok = test_proxy(p)

                  proc.terminate()
                  proc.wait(timeout=2)

                  if not ok:
                      return None

                  return link.split('#')[0]

              except:
                  return None

          with ThreadPoolExecutor(max_workers=6) as ex:
              for r in as_completed([ex.submit(check,l) for l in links]):
                  x = r.result()
                  if x:
                      result.append(x)

          result = list(dict.fromkeys(result))

          print("FINAL:", len(result))

          with open(OUT,'w') as f:
              f.write("\n".join(result))

          if result:
              with open(OUT64,'w') as f:
                  f.write(base64.b64encode("\n".join(result).encode()).decode())
          EOF

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add githubmirror/*.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "FINAL RU VLESS 443 (ipwho + ipapi RU check)"
          git pull --rebase origin main || true
          git push origin main || git push --force-with-lease origin main

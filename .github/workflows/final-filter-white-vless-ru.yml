name: 2 этап — Final Balanced RU VLESS 443

on:
  schedule:
    - cron: '10 */3 * * *'
  workflow_dispatch:

concurrency:
  group: final-balanced-vless
  cancel-in-progress: true

jobs:
  final-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: GeoIP
        run: |
          cp geolite2/GeoLite2-*.mmdb ./ 2>/dev/null || echo "Using default GeoIP"

      - name: CIDR
        run: |
          mkdir -p githubmirror
          curl -L -o white-cidr.txt https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt

      - name: Final filter (balanced RU)
        run: |
          python3 << 'EOF'
          import subprocess, urllib.parse, socket, os, json, base64, time, ipaddress
          import geoip2.database
          from concurrent.futures import ThreadPoolExecutor, as_completed

          XRAY = "./xray"
          INPUT = "githubmirror/input.txt"
          OUT = "githubmirror/final.txt"
          OUT64 = "githubmirror/final-base64.txt"

          # ===== GEO =====
          try:
              geo = geoip2.database.Reader('GeoLite2-Country.mmdb')
          except:
              geo = None

          def is_ru_geo(ip):
              if not geo:
                  return False
              try:
                  return geo.country(ip).country.iso_code == 'RU'
              except:
                  return False

          # ===== API CHECK =====
          def is_ru_api(ip):
              # ipwho.is
              try:
                  r = subprocess.check_output(
                      ['curl','-s',f'https://ipwho.is/{ip}'],
                      text=True
                  )
                  if '"country_code":"RU"' in r:
                      return True
              except:
                  pass

              # ipapi.co
              try:
                  r = subprocess.check_output(
                      ['curl','-s',f'https://ipapi.co/{ip}/country/'],
                      text=True
                  ).strip()
                  if r == 'RU':
                      return True
              except:
                  pass

              return False

          def is_ru(ip):
              # ✅ баланс:
              # если хотя бы один источник говорит RU
              return is_ru_geo(ip) or is_ru_api(ip)

          def free_port():
              s = socket.socket()
              s.bind(('',0))
              p = s.getsockname()[1]
              s.close()
              return p

          def wait_port(p):
              t = time.time()
              while time.time()-t < 12:
                  try:
                      socket.create_connection(("127.0.0.1",p),1)
                      return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy(p):
              try:
                  ip = subprocess.check_output(
                      ['curl','-s','--max-time','10',
                       '-x',f'socks5h://127.0.0.1:{p}',
                       'https://api.ipify.org'],
                      text=True
                  ).strip()

                  if not ip:
                      return False

                  if not is_ru(ip):
                      print(f"🚫 NOT RU: {ip}")
                      return False

              except:
                  return False

              # тест Яндекс
              try:
                  code = subprocess.check_output(
                      ['curl','-s','--max-time','10',
                       '-x',f'socks5h://127.0.0.1:{p}',
                       '-o','/dev/null','-w','%{http_code}',
                       'https://yandex.ru'],
                      text=True
                  ).strip()

                  if code != '200':
                      return False

              except:
                  return False

              return True

          if not os.path.exists(INPUT):
              print("No input")
              exit(1)

          links = [l.strip() for l in open(INPUT) if l.startswith('vless://')]

          print("INPUT:", len(links))

          result = []

          def check(link):
              try:
                  u = urllib.parse.urlparse(link)
                  port = u.port or 443

                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni',[''])[0] or u.hostname

                  p = free_port()

                  cfg = {
                      "inbounds":[{"listen":"127.0.0.1","port":p,"protocol":"socks"}],
                      "outbounds":[{
                          "protocol":"vless",
                          "settings":{
                              "vnext":[{
                                  "address":u.hostname,
                                  "port":port,
                                  "users":[{"id":u.username,"encryption":"none"}]
                              }]
                          },
                          "streamSettings":{
                              "network": q.get('type',['tcp'])[0]
                          }
                      }]
                  }

                  fn = f"cfg_{p}.json"
                  with open(fn,'w') as f:
                      json.dump(cfg,f)

                  proc = subprocess.Popen([XRAY,'run','-c',fn],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  if not wait_port(p):
                      proc.kill()
                      return None

                  if not test_proxy(p):
                      proc.terminate()
                      return None

                  proc.terminate()
                  return link.split('#')[0]

              except:
                  return None

          with ThreadPoolExecutor(max_workers=6) as ex:
              for r in as_completed([ex.submit(check,l) for l in links]):
                  x = r.result()
                  if x:
                      result.append(x)

          result = list(dict.fromkeys(result))

          print("FINAL:", len(result))

          with open(OUT,'w') as f:
              f.write("\n".join(result))

          if result:
              with open(OUT64,'w') as f:
                  f.write(base64.b64encode("\n".join(result).encode()).decode())
          EOF

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add githubmirror/final.txt githubmirror/final-base64.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Balanced RU filter"
          git push origin main

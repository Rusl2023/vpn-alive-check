      # 📥 Скачивание и переименование файлов
      - name: 📥 Download & rename files
        run: |
          set +e
          mkdir -p gv-repo/content/master/
          
          # Ассоциативный массив для счётчиков по авторам
          declare -A author_counts
          
          # Читаем URL построчно из heredoc (безопасно для YAML)
          while IFS= read -r url || [ -n "$url" ]; do
            # Пропускаем пустые строки и комментарии
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            
            echo "🔄 Обработка: $url"
            
            # Определяем автора через безопасный regex
            author=""
            if [[ "$url" =~ raw\.githubusercontent\.com/([^/]+)/ ]]; then
              author="${BASH_REMATCH[1]}"
            elif [[ "$url" =~ gitverse\.ru/api/repos/([^/]+)/ ]]; then
              author="${BASH_REMATCH[1]}"
            fi
            
            # Фоллбэк если автор не определён
            if [ -z "$author" ]; then
              echo "⚠️ Не удалось определить автора для: $url"
              author="unknown_$$"
            fi
            
            # Увеличиваем счётчик (безопасно для set -e)
            current_count=${author_counts[$author]:-0}
            current_count=$((current_count + 1))
            author_counts[$author]=$current_count
            
            # Имя файла и путь
            filename="${author}_${current_count}.txt"
            dest_path="gv-repo/content/master/$filename"
            
            # Скачивание с проверкой HTTP-кода
            http_code=$(curl -s -w "%{http_code}" -o "$dest_path" --retry 3 --retry-delay 2 -L "$url" 2>/dev/null || echo "000")
            
            if [ "$http_code" = "200" ] || [ "$http_code" = "304" ]; then
              size=$(stat -c%s "$dest_path" 2>/dev/null || wc -c < "$dest_path" 2>/dev/null || echo "0")
              echo "✅ Скачан: $filename ($size байт, HTTP $http_code)"
            else
              echo "❌ Ошибка скачивания (HTTP $http_code): $url"
              rm -f "$dest_path"
            fi
          done << 'EOF'
https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt
https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt
https://raw.githubusercontent.com/RUNoName/V.O.I.D-VPN_Bypass/refs/heads/main/configs/url_work.txt
https://raw.githubusercontent.com/GoldCaviar/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt
https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt
https://gitverse.ru/api/repos/RUVIPIEN/russian-white-bolt/raw/branch/master/VPNMIRRORS/v2ray/VLESS_Reality_White_3eac2d.txt
https://raw.githubusercontent.com/EtoNeYaProject/EtoNeYaProject.github.io/refs/heads/main/whitelist
https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/main/githubmirror/clean/vless.txt
https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Cable.txt
https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt
EOF
          
          # Статистика
          echo "📁 Файлы в директории:"
          ls -lh gv-repo/content/master/ 2>/dev/null || echo "(пусто)"
          set -e

# .github/workflows/sync-to-gitverse.yml
name: 🔄 Sync to GitVerse

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час
  workflow_dispatch:
    inputs:
      force:
        description: 'Принудительная синхронизация'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-file:
    runs-on: ubuntu-latest
    
    steps:
      # 🔐 1. Отладка: проверяем, что секреты доступны
      - name: 🔍 Debug secrets (удалить после настройки)
        run: |
          echo "USERNAME length: ${#USERNAME}"
          echo "TOKEN length: ${#TOKEN}"
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "❌ ОШИБКА: Секреты пустые! Проверьте Settings → Secrets"
            exit 1
          fi
        env:
          USERNAME: ${{ secrets.GITVERSE_USERNAME }}
          TOKEN: ${{ secrets.GITVERSE_TOKEN }}

      # 2️⃣ Клонируем исходный репозиторий
      - name: 📥 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source-repo

      # 3️⃣ Клонируем GitVerse с явной авторизацией
      - name: 📥 Clone GitVerse repo
        run: |
          # Используем credential.helper для надёжной аутентификации [[58]]
          git config --global credential.helper store
          echo "https://${{ secrets.GITVERSE_USERNAME }}:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          
          git clone --depth 1 \
            "https://gitverse.ru/Rusl2023/Files_2026.git" \
            gitverse-repo
        env:
          GIT_ASKPASS: /bin/echo

      # 4️⃣ Копируем и переименовываем файл
      - name: 📄 Copy & rename file
        run: |
          mkdir -p gitverse-repo/content/master/
          cp "source-repo/githubmirror/26_proxy_subscription_raw.txt" \
             "gitverse-repo/content/master/my_files.txt"
          echo "✅ Файл подготовлен:"
          head -3 "gitverse-repo/content/master/my_files.txt"

      # 5️⃣ Коммит и пуш
      - name: 🚀 Push to GitVerse
        working-directory: gitverse-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add content/master/my_files.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-sync: my_files.txt [${{ github.run_id }}]"
            
            # Пушим — credential.helper подставит токен из ~/.git-credentials
            git push origin HEAD:master
            echo "✅ Успешно!"
          else
            echo "⚠️ Изменений нет"
          fi

      # 6️⃣ Очистка
      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf source-repo gitverse-repo ~/.git-credentials

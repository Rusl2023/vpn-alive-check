name: Sync VPN Config to GitVerse

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository (VPN Alive)
        uses: actions/checkout@v4

      - name: Push file to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          echo "Клонирую целевой репозиторий..."
          # Клонируем с явным указанием токена в URL. Это работает, если у токена есть права.
          git clone https://oauth2:${GITVERSE_TOKEN}@gitverse.ru/Rusl2023/Files_2026.git target_repo
          
          cd target_repo
          
          echo "Обновляю файл my_files.txt..."
          cp ../githubmirror/26_proxy_subscription_raw.txt ./my_files.txt
          
          if [[ -n $(git status -s) ]]; then
            git add my_files.txt
            git commit -m "Автообновление от $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD
          else
            echo "Файл не изменился, пропускаю."
          fi

name: 🔄 Sync to GitVerse

on:
  schedule:
    - cron: '*/15 * * * *'  
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 🔐 Проверка секретов
      - name: 🔍 Validate secrets
        run: |
          if [ -z "${{ secrets.GITVERSE_USERNAME }}" ]]; then
            echo "❌ GITVERSE_USERNAME не найден!"
            exit 1
          fi
          if [ -z "${{ secrets.GITVERSE_TOKEN }}" ]]; then
            echo "❌ GITVERSE_TOKEN не найден!"
            exit 1
          fi
          echo "✅ Секреты загружены успешно"

      # ⚙️ Настраиваем git для больших репозиториев
      - name: ⚙️ Configure git for large repos
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global core.compression 0
          git config --global credential.helper store
          echo "https://${{ secrets.GITVERSE_USERNAME }}:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      # 🌐 Клонируем GitVerse (с retry и sparse checkout)
      - name: 🌐 Clone GitVerse (with retry)
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🔄 Попытка клонирования #$((RETRY_COUNT+1))..."
            
            if git clone --depth 1 --single-branch --branch master \
              --filter=blob:none \
              https://gitverse.ru/Rusl2023/Files_2026.git \
              gv-repo 2>&1; then
              echo "✅ Клонирование успешно!"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "❌ Ошибка клонирования (попытка $RETRY_COUNT из $MAX_RETRIES)"
              rm -rf gv-repo
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ Ждём 10 секунд перед повторной попыткой..."
                sleep 10
              fi
            fi
          done
          
          if [ ! -d "gv-repo" ]; then
            echo "❌ Не удалось клонировать репозиторий после $MAX_RETRIES попыток!"
            exit 1
          fi
        env:
          GIT_ASKPASS: /bin/true

      # 📄 Скачивание файлов
      - name: ✂️ Download & organize
        run: |
          mkdir -p gv-repo/content/master/
          cd gv-repo/content/master/

          urls=(
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt"
            "https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt"
            "https://key.zarazaex.xyz/sub"
            "https://raw.githubusercontent.com/EtoNeYaProject/EtoNeYaProject.github.io/refs/heads/main/whitelist"
            "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/main/githubmirror/26_proxy_subscription_raw.txt"
          )

          declare -A counters

          for url in "${urls[@]}"; do
            repo=$(echo "$url" | awk -F/ '{print $4}')
            counters[$repo]=$((counters[$repo]+1))
            filename="${repo}_${counters[$repo]}.txt"

            echo "⬇️ $url -> $filename"

            # Скачиваем с retry
            for i in 1 2 3; do
              if curl -fsSL --connect-timeout 30 --max-time 120 "$url" -o "$filename"; then
                echo "✅ OK: $(wc -c < "$filename") bytes"
                break
              else
                echo "⚠️ Попытка $i не удалась"
                if [ $i -eq 3 ]; then
                  echo "❌ FAILED: $url"
                  rm -f "$filename"
                fi
                sleep 5
              fi
            done
          done

      # 🎯 Скачиваем готовый Clash-конфиг из ветки generated-config
      - name: 🎯 Download Clash config from generated-config branch
        run: |
          cd gv-repo/content/master/
          
          CLASH_URL="https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/generated-config/output/config.yaml"
          CLASH_FILE="clash_config.yaml"
          
          echo "⬇️ Скачиваем готовый Clash-конфиг..."
          echo "📎 URL: $CLASH_URL"
          
          # Скачиваем с retry
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 120 "$CLASH_URL" -o "$CLASH_FILE"; then
              FILE_SIZE=$(wc -c < "$CLASH_FILE")
              PROXY_COUNT=$(grep -c '^- name:' "$CLASH_FILE" || echo 0)
              
              echo "✅ OK: $FILE_SIZE bytes -> $CLASH_FILE"
              echo ""
              echo "📋 Превью файла (первые 10 строк):"
              head -n 10 "$CLASH_FILE"
              echo ""
              echo "📊 Статистика:"
              echo "   - Прокси-серверов: $PROXY_COUNT"
              echo "   - Размер: $FILE_SIZE байт"
              
              if [ "$FILE_SIZE" -lt 1000 ]; then
                echo "⚠️ WARNING: Файл слишком маленький!"
              fi
              break
            else
              echo "⚠️ Попытка $i не удалась"
              if [ $i -eq 3 ]; then
                echo "❌ Не удалось скачать clash_config.yaml"
                echo "# Ожидание генерации конфига..." > "$CLASH_FILE"
              fi
              sleep 5
            fi
          done

      # 🚀 Коммит и пуш (с retry)
      - name: 💾 Push to GitVerse (with retry)
        working-directory: gv-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          git add content/master/*.txt content/master/clash_config.yaml

          if git diff --staged --quiet; then
            echo "⚪ Изменений нет"
          else
            git commit -m "🤖 Auto-update files [run:${{ github.run_id }}]"
            
            # Пушим с retry
            for i in 1 2 3; do
              echo "🔄 Попытка пуша #$i..."
              if git -c http.extraHeader="Authorization: Bearer ${{ secrets.GITVERSE_TOKEN }}" \
                push origin HEAD:master 2>&1; then
                echo "✅ Пуш успешен!"
                break
              else
                echo "⚠️ Попытка пуша $i не удалась"
                if [ $i -eq 3 ]; then
                  echo "❌ Не удалось запушить после 3 попыток"
                  exit 1
                fi
                sleep 10
              fi
            done
          fi

      # 🧹 Очистка
      - name: 🗑️ Cleanup
        if: always()
        run: rm -rf src gv-repo ~/.git-credentials

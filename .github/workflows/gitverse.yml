# .github/workflows/gitverse.yml
name: 🔄 Sync to GitVerse

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час в 00 минут
  workflow_dispatch:     # Ручной запуск
    inputs:
      debug:
        description: 'Включить отладочный вывод'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 🔐 Проверка секретов (можно удалить после настройки)
      - name: 🔍 Validate secrets
        run: |
          if [ -z "${{ secrets.GITVERSE_USERNAME }}" ]; then
            echo "❌ GITVERSE_USERNAME не найден!"
            exit 1
          fi
          if [ -z "${{ secrets.GITVERSE_TOKEN }}" ]; then
            echo "❌ GITVERSE_TOKEN не найден!"
            exit 1
          fi
          echo "✅ Секреты загружены успешно"

      # 📥 Исходный репозиторий
      - name: 📦 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: src

      # 📥 GitVerse репозиторий с авторизацией
      - name: 🌐 Clone GitVerse
        run: |
          # Настраиваем credential.helper для HTTPS-авторизации [[58]]
          git config --global credential.helper store
          echo "https://${{ secrets.GITVERSE_USERNAME }}:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          
          git clone --depth 1 --branch master \
            https://gitverse.ru/Rusl2023/Files_2026.git \
            gv-repo
        env:
          GIT_ASKPASS: /bin/true

      # 📄 Копирование файла
      - name: ✂️ Copy & rename
        run: |
          mkdir -p gv-repo/content/master/
          cp src/githubmirror/26_proxy_subscription_raw.txt \
             gv-repo/content/master/my_files.txt
          echo "📊 Размер файла: $(wc -c < gv-repo/content/master/my_files.txt) байт"

      # 🚀 Коммит и пуш
      - name: 💾 Push to GitVerse
        working-directory: gv-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add content/master/my_files.txt
          
          if git diff --staged --quiet; then
            echo "⚪ Изменений нет, пуш пропущен"
          else
            git commit -m "🤖 Auto-update: my_files.txt [run:${{ github.run_id }}]"
            git -c http.extraHeader="Authorization: Bearer ${{ secrets.GITVERSE_TOKEN }}" \
              push origin HEAD:master
            echo "✅ Синхронизация завершена!"
          fi

      # 🧹 Очистка
      - name: 🗑️ Cleanup
        if: always()
        run: rm -rf src gv-repo ~/.git-credentials

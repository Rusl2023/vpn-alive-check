name: Sync VPN Config to GitVerse

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час
  workflow_dispatch:      # Ручной запуск

jobs:
  sync-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository (VPN Alive)
        uses: actions/checkout@v4

      - name: Push file to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          echo "=== Клонирование репозитория ==="
          # ИСПРАВЛЕНИЕ: используем Rusl2023 вместо oauth2
          git clone https://Rusl2023:${GITVERSE_TOKEN}@gitverse.ru/Rusl2023/Files_2026.git target_repo
          
          cd target_repo
          
          echo "=== Настройка push URL ==="
          git remote set-url --push origin https://Rusl2023:${GITVERSE_TOKEN}@gitverse.ru/Rusl2023/Files_2026.git
          
          echo "=== Копирование файла ==="
          cp ../githubmirror/26_proxy_subscription_raw.txt ./my_files.txt
          
          echo "=== Коммит и пуш ==="
          if [[ -n $(git status -s) ]]; then
            git add my_files.txt
            git commit -m "Автообновление от $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD
            echo "✅ Файл успешно отправлен на GitVerse!"
          else
            echo "ℹ️ Файл не изменился, пуш не требуется."
          fi

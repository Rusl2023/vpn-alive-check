name: Filter VLESS White RU 443

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: white-vless-check
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 python3-pip
          pip3 install geoip2

      - name: Prepare GeoIP
        run: |
          curl -L -o GeoLite2-Country.mmdb https://git.io/GeoLite2-Country.mmdb

      - name: Filter VLESS
        run: |
          python3 << 'EOF'
          import urllib.parse, socket, glob, base64
          import geoip2.database

          OUT = "white-vless-ru-443-live.txt"
          OUT64 = "white-vless-ru-443-live-base64.txt"

          # ===== GEO =====
          geo = geoip2.database.Reader('GeoLite2-Country.mmdb')

          def is_ru(ip):
              try:
                  return geo.country(ip).country.iso_code == 'RU'
              except:
                  return False

          def flag(cc):
              if not cc or cc == "XX":
                  return "🌐"
              try:
                  return chr(127397 + ord(cc[0])) + chr(127397 + ord(cc[1]))
              except:
                  return "🌐"

          # ===== RESOLVE =====
          def resolve_all(host):
              ips = set()
              try:
                  for res in socket.getaddrinfo(host, None):
                      ips.add(res[4][0])
              except:
                  pass
              return list(ips)

          # ===== LOAD =====
          links = []
          for f in glob.glob('*.txt'):
              for l in open(f):
                  l = l.strip()
                  if l.lower().startswith('vless://'):
                      links.append(l)

          print("TOTAL RAW:", len(links))

          result = []

          for link in links:
              try:
                  u = urllib.parse.urlparse(link)

                  if not u.hostname:
                      continue

                  # только 443
                  port = u.port or 443
                  if port != 443:
                      continue

                  ips = resolve_all(u.hostname)
                  if not ips:
                      continue

                  # ищем RU IP
                  ok_ip = None
                  for ip in ips:
                      if is_ru(ip):
                          ok_ip = ip
                          break

                  if not ok_ip:
                      continue

                  # страна
                  try:
                      cc = geo.country(ok_ip).country.iso_code
                  except:
                      cc = "XX"

                  fl = flag(cc)

                  # SNI
                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni',[''])[0] or u.hostname

                  # оригинал (без изменений)
                  clean = link.split('#')[0]

                  # добавляем метку
                  new_name = f"{fl} RU | SNI: {sni}"

                  final = clean + f"#{new_name}"

                  result.append(final)

              except:
                  continue

          # убираем дубли
          result = list(dict.fromkeys(result))

          print("FINAL:", len(result))

          with open(OUT, 'w') as f:
              f.write("\n".join(result))

          if result:
              with open(OUT64, 'w') as f:
                  f.write(base64.b64encode("\n".join(result).encode()).decode())

          geo.close()
          EOF

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add white-vless-ru-443-live.txt white-vless-ru-443-live-base64.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU VLESS 443"
          git pull --rebase origin main || true
          git push origin main || git push --force-with-lease origin main

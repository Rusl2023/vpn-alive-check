name: Filter VLESS White RU 443 (CIDR + GEO only)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: white-vless-check
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 python3-pip
          pip3 install geoip2

      - name: Prepare data
        run: |
          mkdir -p githubmirror
          curl -L -o white-cidr.txt https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt
          curl -L -o white-cidr-igareck.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt || true

          curl -L -o githubmirror/src1.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt
          curl -L -o githubmirror/src2.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt
          curl -L -o githubmirror/src3.txt https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt

      - name: Filter VLESS
        run: |
          python3 << 'EOF'
          import urllib.parse, os, socket, ipaddress, glob, base64
          import geoip2.database

          OUT = "githubmirror/white-vless-ru-443-live.txt"
          OUT64 = "githubmirror/white-vless-ru-443-live-base64.txt"

          # ===== CIDR =====
          cidrs = []
          for f in ['white-cidr.txt','white-cidr-igareck.txt']:
              if os.path.exists(f):
                  for line in open(f):
                      line = line.strip()
                      if line and not line.startswith('#'):
                          try:
                              cidrs.append(ipaddress.ip_network(line, strict=False))
                          except:
                              pass

          def is_white(ip):
              try:
                  ip_obj = ipaddress.ip_address(ip)
                  return any(ip_obj in net for net in cidrs)
              except:
                  return False

          # ===== GEO =====
          try:
              geo = geoip2.database.Reader('GeoLite2-Country.mmdb')
          except:
              geo = None

          def is_ru(ip):
              if not geo:
                  return True
              try:
                  return geo.country(ip).country.iso_code == 'RU'
              except:
                  return False

          # ===== RESOLVE (IPv4 + IPv6) =====
          def resolve_all(host):
              ips = set()
              try:
                  for res in socket.getaddrinfo(host, None):
                      ips.add(res[4][0])
              except:
                  pass
              return list(ips)

          # ===== LOAD LINKS =====
          links = []
          for f in glob.glob('githubmirror/*.txt'):
              for l in open(f):
                  l = l.strip()
                  if l.lower().startswith('vless://'):
                      links.append(l)

          print("TOTAL RAW:", len(links))

          result = []

          for link in links:
              try:
                  u = urllib.parse.urlparse(link)

                  if not u.hostname:
                      continue

                  # порт
                  port = u.port or 443
                  if port != 443:
                      continue

                  # все IP (v4 + v6)
                  ips = resolve_all(u.hostname)
                  if not ips:
                      continue

                  # проверка: хотя бы один IP подходит
                  ok = False
                  for ip in ips:
                      if is_white(ip) and is_ru(ip):
                          ok = True
                          break

                  if not ok:
                      continue

                  # убираем мусор после #
                  clean = link.split('#')[0]

                  result.append(clean)

              except:
                  continue

          # убираем дубли
          result = list(dict.fromkeys(result))

          print("FINAL:", len(result))

          # ===== SAVE =====
          with open(OUT, 'w') as f:
              f.write("\n".join(result))

          if result:
              with open(OUT64, 'w') as f:
                  f.write(base64.b64encode("\n".join(result).encode()).decode())

          if geo:
              geo.close()
          EOF

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add githubmirror/*.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "RU VLESS 443 (CIDR+GEO only)"
          git pull --rebase origin main || true
          git push origin main || git push --force-with-lease origin main

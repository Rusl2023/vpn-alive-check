name: Filter & Check VLESS White RU 443 (VK/Yandex/Cloud.ru)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: white-vless-check
  cancel-in-progress: true

jobs:
  filter-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install geoip2

      - name: Download Xray
        run: |
          VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/$VER/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: CIDR
        run: |
          mkdir -p githubmirror
          curl -L -o white-cidr.txt https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt
          curl -L -o white-cidr-igareck.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt || true

      - name: Sources
        run: |
          curl -L -o githubmirror/src1.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt
          curl -L -o githubmirror/src2.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt
          curl -L -o githubmirror/src3.txt https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt

      - name: Filter & Check
        run: |
          python3 << 'EOF'
          import subprocess, time, json, urllib.parse, os, socket, ipaddress, base64, glob
          import geoip2.database
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock

          XRAY = "./xray"
          OUT = "githubmirror/white-vless-ru-443-live.txt"
          OUT64 = "githubmirror/white-vless-ru-443-live-base64.txt"

          # ===== CIDR =====
          cidrs = []
          for f in ['white-cidr.txt','white-cidr-igareck.txt']:
              if os.path.exists(f):
                  for line in open(f):
                      line=line.strip()
                      if line and not line.startswith('#'):
                          try:
                              cidrs.append(ipaddress.ip_network(line, strict=False))
                          except:
                              pass

          def is_white(ip):
              try:
                  ip=ipaddress.ip_address(ip)
                  return any(ip in net for net in cidrs)
              except:
                  return False

          # ===== GEO =====
          try:
              geo = geoip2.database.Reader('GeoLite2-Country.mmdb')
          except:
              geo = None

          def is_ru(ip):
              if not geo: return True
              try: return geo.country(ip).country.iso_code == 'RU'
              except: return False

          # ===== HELPERS =====
          def free_port():
              s=socket.socket()
              s.bind(('',0))
              p=s.getsockname()[1]
              s.close()
              return p

          def wait_port(p):
              t=time.time()
              while time.time()-t < 15:
                  try:
                      socket.create_connection(("127.0.0.1",p),1)
                      return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy(p):
              try:
                  ip=subprocess.check_output(
                      ['curl','-s','--max-time','10','-x',f'socks5h://127.0.0.1:{p}','https://api.ipify.org'],
                      text=True).strip()
              except:
                  return False

              if not ip or not is_ru(ip):
                  return False

              try:
                  code=subprocess.check_output(
                      ['curl','-s','--max-time','10','-x',f'socks5h://127.0.0.1:{p}',
                       '-o','/dev/null','-w','%{http_code}','http://www.gstatic.com/generate_204'],
                      text=True).strip()
                  return code == '204'
              except:
                  return False

          # ===== LOAD LINKS =====
          links = []
          for f in glob.glob('githubmirror/*.txt'):
              for l in open(f):
                  l = l.strip()
                  if l.lower().startswith('vless://'):
                      links.append(l)

          print("TOTAL:", len(links))

          alive = []
          lock = Lock()

          def check(link):
              try:
                  u = urllib.parse.urlparse(link)
                  if not u.hostname:
                      return None

                  port = u.port or 443
                  if port != 443:
                      return None

                  ip = socket.gethostbyname(u.hostname)
                  if not is_white(ip):
                      return None

                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni',[''])[0] or u.hostname

                  stream = {'network': q.get('type',['tcp'])[0]}

                  if q.get('security',[''])[0] == 'reality' and 'pbk' in q:
                      stream.update({
                          'security':'reality',
                          'realitySettings':{
                              'serverName':sni,
                              'publicKey':q['pbk'][0],
                              'shortId':q.get('sid',[''])[0]
                          }
                      })
                  elif q.get('security',[''])[0] == 'tls':
                      stream.update({
                          'security':'tls',
                          'tlsSettings':{'serverName':sni,'allowInsecure':True}
                      })

                  p = free_port()

                  cfg = {
                      "inbounds":[{"listen":"127.0.0.1","port":p,"protocol":"socks","settings":{"udp":False}}],
                      "outbounds":[{
                          "protocol":"vless",
                          "settings":{"vnext":[{"address":u.hostname,"port":port,"users":[{"id":u.username,"encryption":"none"}]}]},
                          "streamSettings":stream
                      }]
                  }

                  fn = f"cfg_{p}.json"
                  open(fn,'w').write(json.dumps(cfg))

                  proc = subprocess.Popen([XRAY,'run','-c',fn],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  if not wait_port(p):
                      proc.kill()
                      os.remove(fn)
                      return None

                  ok = test_proxy(p)

                  proc.terminate()
                  proc.wait(timeout=2)
                  os.remove(fn)

                  if not ok:
                      return None

                  return link.split('#')[0]

              except:
                  return None

          with ThreadPoolExecutor(max_workers=8) as ex:
              futures = [ex.submit(check,l) for l in links]
              for f in as_completed(futures):
                  r = f.result()
                  if r:
                      alive.append(r)

          print("LIVE:", len(alive))

          open(OUT,'w').write("\n".join(alive))

          if alive:
              open(OUT64,'w').write(
                  base64.b64encode("\n".join(alive).encode()).decode()
              )

          if geo:
              geo.close()
          EOF

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add githubmirror/*.txt || true

          if git diff --staged --quiet; then exit 0; fi

          git commit -m "RU VLESS 443 LIVE"
          git pull --rebase origin main || true
          git push origin main || git push --force-with-lease origin main

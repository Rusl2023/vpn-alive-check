name: Filter VLESS White RU 443

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: white-vless-check
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 python3-pip
          pip3 install geoip2 requests

      - name: Download GeoIP
        run: |
          curl -L -o GeoLite2-Country.mmdb https://git.io/GeoLite2-Country.mmdb

      - name: Filter VLESS (only VLESS, RU, 443)
        run: |
          python3 << 'EOF'
          import urllib.parse, socket, base64
          import geoip2.database
          import requests

          OUT = "white-vless-ru-443-live.txt"
          OUT64 = "white-vless-ru-443-live-base64.txt"

          SOURCES = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt",
              "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          ]

          geo = geoip2.database.Reader('GeoLite2-Country.mmdb')

          def is_ru(ip):
              try:
                  return geo.country(ip).country.iso_code == 'RU'
              except:
                  return False

          def flag(cc):
              if not cc or cc == "XX":
                  return "🌐"
              try:
                  return chr(127397 + ord(cc[0])) + chr(127397 + ord(cc[1]))
              except:
                  return "🌐"

          def resolve_all(host):
              ips = set()
              try:
                  for res in socket.getaddrinfo(host, None):
                      ips.add(res[4][0])
              except:
                  pass
              return list(ips)

          links = []

          # ===== LOAD DIRECTLY =====
          for url in SOURCES:
              try:
                  r = requests.get(url, timeout=20)
                  for line in r.text.splitlines():
                      line = line.strip()

                      # 🔥 только VLESS
                      if not line.lower().startswith("vless://"):
                          continue

                      links.append(line)
              except:
                  continue

          print("TOTAL RAW:", len(links))

          result = []

          for link in links:
              try:
                  u = urllib.parse.urlparse(link)

                  if not u.hostname:
                      continue

                  # только VLESS (доп. защита)
                  if u.scheme.lower() != "vless":
                      continue

                  # только порт 443
                  port = u.port or 443
                  if port != 443:
                      continue

                  ips = resolve_all(u.hostname)
                  if not ips:
                      continue

                  ok_ip = None
                  for ip in ips:
                      if is_ru(ip):
                          ok_ip = ip
                          break

                  if not ok_ip:
                      continue

                  try:
                      cc = geo.country(ok_ip).country.iso_code
                  except:
                      cc = "XX"

                  fl = flag(cc)

                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni',[''])[0] or u.hostname

                  clean = link.split('#')[0]

                  new_name = f"{fl} RU | SNI: {sni}"

                  final = clean + f"#{new_name}"

                  result.append(final)

              except:
                  continue

          result = list(dict.fromkeys(result))

          print("FINAL:", len(result))

          with open(OUT, 'w') as f:
              f.write("\n".join(result))

          if result:
              with open(OUT64, 'w') as f:
                  f.write(base64.b64encode("\n".join(result).encode()).decode())

          geo.close()
          EOF

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add white-vless-ru-443-live.txt white-vless-ru-443-live-base64.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "VLESS RU 443 only"
          git pull --rebase origin main || true
          git push origin main || git push --force-with-lease origin main

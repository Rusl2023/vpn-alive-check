name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray
        run: |
          python3 <<'EOF'
          import subprocess
          import time
          import json
          import urllib.parse
          import os
          import socket
          import urllib.request

          WORKDIR = os.getcwd()
          XRAY_PATH = os.path.join(WORKDIR, "xray")

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')
          TEST_URL = 'https://api.ipify.org'
          MAX_TOTAL_TIME = 1500

          country_cache = {}

          def get_free_port():
              s = socket.socket()
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port

          def wait_port(host, port, timeout=15):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          return True
                  except:
                      time.sleep(0.5)
              return False

          def exit_ip(port):
              try:
                  out = subprocess.check_output(
                      ['curl','-s','--max-time','6','-x',f'socks5h://127.0.0.1:{port}',TEST_URL],
                      text=True
                  ).strip()
                  return out if out else None
              except:
                  return None

          def country(ip):
              if ip in country_cache:
                  return country_cache[ip]
              try:
                  with urllib.request.urlopen(f'http://ip-api.com/json/{ip}?fields=countryCode', timeout=5) as r:
                      data = json.loads(r.read().decode())
                      cc = data.get("countryCode", "Unknown")
                      country_cache[ip] = cc
                      return cc
              except:
                  return "Unknown"

          if not os.path.exists(INPUT):
              print(f"{INPUT} not found")
              raise SystemExit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.strip().startswith('vless://')]

          print(f"Total links: {len(links)}")
          start_time = time.time()

          for link in links:
              if time.time() - start_time > MAX_TOTAL_TIME:
                  print("Global time limit reached")
                  break

              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              port = get_free_port()

              network = q.get('type', ['tcp'])[0]
              sec = q.get('security', ['none'])[0]
              sni = q.get('sni', [''])[0]
              fingerprint = q.get('fp', ['chrome'])[0]

              # ALPN
              alpn_raw = q.get('alpn', [])
              alpn = alpn_raw[0].split(',') if alpn_raw and alpn_raw[0] else []

              allow_insecure = q.get('allowInsecure', ['0'])[0] == '1'
              path = q.get('path', [''])[0]
              host_header = q.get('host', [''])[0]
              service_name = q.get('serviceName', [''])[0]

              stream = {
                  'network': network
              }

              # REALITY
              if sec == 'reality' and 'pbk' in q:
                  stream['security'] = 'reality'
                  stream['realitySettings'] = {
                      'serverName': sni,
                      'publicKey': q['pbk'][0],
                      'shortId': q.get('sid', [''])[0],
                      'fingerprint': fingerprint
                  }

              # TLS
              elif sec == 'tls':
                  stream['security'] = 'tls'
                  stream['tlsSettings'] = {
                      'serverName': sni,
                      'fingerprint': fingerprint,
                      'alpn': alpn,
                      'allowInsecure': allow_insecure
                  }

              else:
                  stream['security'] = 'none'

              # WS
              if network == 'ws':
                  stream['wsSettings'] = {
                      'path': path,
                      'headers': {}
                  }
                  if host_header:
                      stream['wsSettings']['headers']['Host'] = host_header

              # gRPC
              if network == 'grpc':
                  stream['grpcSettings'] = {
                      'serviceName': service_name
                  }

              # HTTP
              if network == 'http':
                  stream['httpSettings'] = {
                      'path': path,
                      'host': [host_header] if host_header else []
                  }

              cfg = {
                  'inbounds': [{
                      'listen': '127.0.0.1',
                      'port': port,
                      'protocol': 'socks',
                      'settings': {'udp': False}
                  }],
                  'outbounds': [{
                      'protocol': 'vless',
                      'settings': {
                          'vnext': [{
                              'address': u.hostname,
                              'port': u.port or 443,
                              'users': [{
                                  'id': u.username,
                                  'encryption': 'none',
                                  'flow': q.get('flow', [''])[0]
                              }]
                          }]
                      },
                      'streamSettings': stream,
                      'domainStrategy': 'UseIP'
                  }]
              }

              with open('cfg.json', 'w') as f:
                  json.dump(cfg, f)

              p = subprocess.Popen(
                  [XRAY_PATH, 'run', '-c', 'cfg.json'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              if not wait_port("127.0.0.1", port, timeout=15):
                  p.kill()
                  continue

              ip = exit_ip(port)

              p.terminate()
              try:
                  p.wait(timeout=5)
              except:
                  p.kill()

              time.sleep(1)

              print(f"{u.hostname}:{u.port} ({network}/{sec}) -> {ip}")

              if not ip:
                  continue
              if ip == RUNNER_IP:
                  continue
              if country(ip) == 'RU':
                  continue

              with open(OUTPUT_RAW, 'a') as f:
                  f.write(link + '\n')

          # Удаляем временный cfg
          if os.path.exists("cfg.json"):
              os.remove("cfg.json")

          print("Done.")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git reset --hard origin/main

          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git diff --cached --quiet || git commit -m "Update VLESS proxy subscription (raw + base64)"

          git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} HEAD:main

name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3 python3-pip
          python3 -m pip install --upgrade pip
          pip install geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Check VLESS via Xray and build raw subscription (10 threads)
        run: |
          python3 <<'EOF'
          import subprocess
          import time
          import json
          import urllib.parse
          import os
          import geoip2.database
          import socket
          from concurrent.futures import ThreadPoolExecutor, as_completed

          INPUT_FILE = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_FILE = 'githubmirror/26_proxy_subscription_raw.txt'

          THREADS = 10
          BASE_PORT = 1080

          FLAGS = {
              "RU":"🇷🇺","US":"🇺🇸","DE":"🇩🇪","FR":"🇫🇷","NL":"🇳🇱","PL":"🇵🇱",
              "TR":"🇹🇷","FI":"🇫🇮","LV":"🇱🇻","EE":"🇪🇪","NO":"🇳🇴","KZ":"🇰🇿"
          }

          reader = geoip2.database.Reader('geolite2/GeoLite2-Country.mmdb')

          def get_country_flag(host):
              try:
                  ip = socket.gethostbyname(host)
                  return FLAGS.get(reader.country(ip).country.iso_code, '🏳️')
              except:
                  return '🏳️'

          def is_proxy_alive(host, port, timeout=10):
              """Простая TCP проверка подключения"""
              import ssl
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(timeout)
              try:
                  s.connect((host, port))
                  # Если порт 443 — пробуем TLS handshake
                  if port == 443:
                      ctx = ssl.create_default_context()
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                      ctx.wrap_socket(s, server_hostname=host)
                  return True
              except:
                  return False
              finally:
                  s.close()

          def test_proxy(link, idx):
              try:
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  port = BASE_PORT + idx
                  stream_type = q.get('type',['tcp'])[0]

                  cfg = {
                      "inbounds":[{"listen":"127.0.0.1","port":port,"protocol":"socks","settings":{"udp":False}}],
                      "outbounds":[{"protocol":"vless",
                                     "settings":{"vnext":[{"address":u.hostname,"port":u.port or 443,"users":[{"id":u.username,"encryption":"none"}]}]},
                                     "streamSettings":{"network":stream_type}}]
                  }

                  fname = f"cfg_{port}.json"
                  with open(fname,"w") as f:
                      json.dump(cfg,f)

                  p = subprocess.Popen(['./xray','-c',fname],
                                       stdout=subprocess.DEVNULL,
                                       stderr=subprocess.DEVNULL)
                  time.sleep(15)  # буфер запуска Xray

                  alive = is_proxy_alive(u.hostname, u.port or 443)
                  if not alive:
                      p.terminate()
                      time.sleep(1)
                      return None

                  in_flag = get_country_flag(u.hostname)
                  name = f"in {in_flag} RusL {u.hostname}"
                  p.terminate()
                  time.sleep(1)
                  return link.split('#')[0] + '#' + name
              except:
                  return None

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(0)

          with open(INPUT_FILE) as f:
              links = [l.strip() for l in f if l.startswith('vless://')]

          results = []
          with ThreadPoolExecutor(max_workers=THREADS) as ex:
              futures = [ex.submit(test_proxy, link, i) for i, link in enumerate(links)]
              for f in as_completed(futures):
                  r = f.result()
                  if r:
                      results.append(r)

          with open(OUTPUT_FILE,'a') as f:
              for r in results:
                  f.write(r+'\n')

          print("OK proxies:", len(results))
          reader.close()
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git commit -m "Auto update VLESS subscription ($(date -u))" || exit 0
          git pull --rebase origin main || true
          git push

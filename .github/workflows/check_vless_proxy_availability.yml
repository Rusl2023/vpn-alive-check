name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vless-subscription-update
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray (FAST VERSION)
        run: |
          python3 <<'EOF'
          import subprocess
          import time
          import json
          import urllib.parse
          import os
          import threading
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')
          
          TEST_URLS = [
              'https://api.ipify.org?format=text',
              'http://cp.cloudflare.com',
              'https://www.instagram.com/'
          ]
          XRAY = './xray'
          MAX_WORKERS = 8
          
          active_processes = []
          lock = threading.Lock()
          
          def cleanup():
              with lock:
                  for p in active_processes:
                      try:
                          p.terminate()
                          p.wait(timeout=1)
                      except:
                          try:
                              p.kill()
                          except:
                              pass
                  active_processes.clear()
          
          def exit_ip(port):
              for url in TEST_URLS:
                  try:
                      out = subprocess.check_output(
                          ['curl', '-s', '--max-time', '2', '-x', f'socks5h://127.0.0.1:{port}', url],
                          text=True, timeout=3
                      ).strip()
                      if out and len(out) > 5:  # Valid IP
                          return out
                  except:
                      pass
              return None
          
          def is_good_ip(ip):
              if not ip or ip == RUNNER_IP:
                  return False
              # Quick RU IP filtering by prefixes
              ru_prefixes = {'5.', '31.', '37.', '46.', '77.', '78.', '79.', '80.', '81.', '82.', '83.', 
                            '84.', '85.', '86.', '87.', '88.', '89.', '90.', '91.', '92.', '93.', '94.', '95.'}
              return ip[:ip.find('.')+3] not in ru_prefixes
          
          def country(ip):
              try:
                  import urllib.request
                  req = urllib.request.Request(f'https://ipapi.co/{ip}/country/', 
                                               headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=3) as r:
                      return r.read().decode().strip()
              except:
                  return 'Unknown'
          
          def check_one(link):
              cfg_file = None
              process = None
              port = None
              try:
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  
                  # Extract network type
                  network = q.get('type', ['tcp'])[0]
                  if network == 'tcp':
                      network = 'tcp'
                  elif network == 'ws':
                      network = 'ws'
                  elif network == 'grpc':
                      network = 'grpc'
                  
                  stream = {'network': network}
                  sec = q.get('security', ['none'])[0]
                  sni = q.get('sni', [''])[0]
                  
                  if sec == 'reality' and 'pbk' in q:
                      stream['security'] = 'reality'
                      stream['realitySettings'] = {
                          'serverName': sni or u.hostname,
                          'publicKey': q['pbk'][0],
                          'shortId': q.get('sid', [''])[0],
                          'fingerprint': 'chrome'
                      }
                  
                  # Unique port for each thread
                  port_num = 10800 + (hash(link) % 900) + 100
                  port = port_num
                  
                  # Extract host and port
                  host = u.hostname
                  port_num = u.port or 443
                  
                  # Extract user ID
                  user_id = u.username or ''
                  
                  # Extract flow
                  flow = q.get('flow', [''])[0]
                  
                  cfg = {
                      'inbounds': [{
                          'listen': '127.0.0.1',
                          'port': port,
                          'protocol': 'socks',
                          'settings': {'udp': False}
                      }],
                      'outbounds': [{
                          'protocol': 'vless',
                          'settings': {
                              'vnext': [{
                                  'address': host,
                                  'port': port_num,
                                  'users': [{
                                      'id': user_id,
                                      'encryption': 'none',
                                      'flow': flow
                                  }]
                              }]
                          },
                          'streamSettings': stream
                      }]
                  }
                  
                  cfg_file = f'cfg_{abs(hash(link)) % 10000}.json'
                  with open(cfg_file, 'w') as f:
                      json.dump(cfg, f)
                  
                  process = subprocess.Popen(
                      [XRAY, 'run', '-c', cfg_file],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
                  
                  with lock:
                      active_processes.append(process)
                  
                  time.sleep(1.5)  # Faster than 4 sec
                  
                  ip = exit_ip(port)
                  if process:
                      process.terminate()
                      time.sleep(0.3)
                  
                  if ip and is_good_ip(ip):
                      country_code = country(ip)
                      if country_code != 'RU':
                          print(f"⭐ {host}:{port_num} OK {ip} → {country_code}")
                          return link
                      else:
                          print(f"✗ {host}:{port_num} RU {ip}")
                  else:
                      print(f"✗ {host}:{port_num} no IP")
                  
              except Exception as e:
                  print(f"✗ {link[:50]}... error: {str(e)[:50]}")
              finally:
                  if process:
                      try:
                          process.terminate()
                          process.wait(timeout=0.5)
                      except:
                          try:
                              process.kill()
                          except:
                              pass
                  with lock:
                      if process and process in active_processes:
                          try:
                              active_processes.remove(process)
                          except:
                              pass
                  if cfg_file and os.path.exists(cfg_file):
                      try:
                          os.remove(cfg_file)
                      except:
                          pass
              return None
          
          if not os.path.exists(INPUT):
              print(f"Input file {INPUT} not found")
              raise SystemExit(0)
          
          with open(INPUT, 'r') as f:
              links = [l.strip() for l in f if l.strip().startswith('vless://')]
          
          total_links = len(links)
          print(f"TOTAL: {total_links} | workers={MAX_WORKERS}")
          
          # Write header
          with open(OUTPUT_RAW, 'w') as f:
              f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")
          
          alive = []
          start_time = time.time()
          processed = 0
          
          try:
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                  futures = [ex.submit(check_one, link) for link in links]
                  for future in as_completed(futures):
                      processed += 1
                      try:
                          result = future.result(timeout=10)
                          if result:
                              alive.append(result)
                      except Exception as e:
                          print(f"Future error: {e}")
                      
                      if processed % 10 == 0:
                          elapsed = time.time() - start_time
                          print(f"Processed {processed}/{total_links} ({processed/total_links*100:.0f}%) in {elapsed:.0f}s")
                      
                      if time.time() - start_time > 600:  # 10 min max
                          print("MAX TOTAL TIME reached")
                          break
                          
          finally:
              cleanup()
          
          print(f"Done. Alive: {len(alive)}")
          
          if alive:
              with open(OUTPUT_RAW, 'a') as f:
                  f.write('\n'.join(alive) + '\n')
              print(f"Saved {len(alive)} NON-RU proxies")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Debug output
        run: |
          echo "RAW lines:"
          wc -l githubmirror/26_proxy_subscription_raw.txt
          echo "BASE64 size:"
          wc -c githubmirror/26_proxy_subscription_base64.txt
          echo "First 3 lines:"
          head -3 githubmirror/26_proxy_subscription_raw.txt || echo "File empty"

      - name: Commit & push results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git pull --rebase || true
          git add githubmirror/*.txt || true
          if git diff --staged --quiet; then
            echo "❌ No changes to commit"
          else
            git commit -m "Update NON-RU proxy subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || true
            echo "✅ Pushed NON-RU updates"
          fi

name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Check VLESS via Xray
        run: |
          python3 << 'EOF'
          import subprocess, time, json, urllib.parse, os, socket

          WORKDIR = os.getcwd()
          XRAY_PATH = os.path.join(WORKDIR, "xray")

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          TEST_URL = 'https://api.ipify.org'
          MAX_TOTAL_TIME = 1500

          def get_free_port():
              s = socket.socket()
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port

          def wait_port(host, port, timeout=15):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          return True
                  except OSError:
                      time.sleep(0.5)
              return False

          def exit_ip(port):
              try:
                  out = subprocess.check_output(
                      ['curl','-s','--max-time','8',
                       '-x',f'socks5h://127.0.0.1:{port}',TEST_URL],
                      text=True
                  ).strip()
                  return out if out else None
              except:
                  return None

          if not os.path.exists(INPUT):
              print("INPUT file not found")
              raise SystemExit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.strip().startswith('vless://')]

          total = len(links)
          alive = 0

          print(f"TOTAL LINKS: {total}")
          start_time = time.time()

          for link in links:
              if time.time() - start_time > MAX_TOTAL_TIME:
                  print("TIME LIMIT REACHED")
                  break

              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              port = get_free_port()

              raw_type = q.get('type', ['tcp'])[0]
              network = 'http' if raw_type == 'xhttp' else raw_type
              sec = q.get('security', ['none'])[0]
              sni = q.get('sni', [''])[0]
              fingerprint = q.get('fp', ['chrome'])[0]

              stream = {'network': network}

              if sec == 'reality' and 'pbk' in q:
                  stream['security'] = 'reality'
                  stream['realitySettings'] = {
                      'serverName': sni,
                      'publicKey': q['pbk'][0],
                      'shortId': q.get('sid', [''])[0],
                      'fingerprint': fingerprint
                  }
              elif sec == 'tls':
                  stream['security'] = 'tls'
                  stream['tlsSettings'] = {
                      'serverName': sni,
                      'fingerprint': fingerprint,
                      'allowInsecure': True
                  }
              else:
                  stream['security'] = 'none'

              cfg = {
                  'inbounds':[{
                      'listen':'127.0.0.1',
                      'port':port,
                      'protocol':'socks',
                      'settings':{'udp':False}
                  }],
                  'outbounds':[{
                      'protocol':'vless',
                      'settings':{
                          'vnext':[{
                              'address':u.hostname,
                              'port':u.port or 443,
                              'users':[{
                                  'id':u.username,
                                  'encryption':'none',
                                  'flow':q.get('flow',[''])[0]
                              }]
                          }]
                      },
                      'streamSettings':stream
                  }]
              }

              with open('cfg.json','w') as f:
                  json.dump(cfg,f)

              p = subprocess.Popen(
                  [XRAY_PATH,'run','-c','cfg.json'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              if not wait_port("127.0.0.1",port,15):
                  p.kill()
                  continue

              ip = exit_ip(port)

              p.terminate()
              try: p.wait(timeout=5)
              except: p.kill()

              time.sleep(1)

              print(f"{u.hostname}:{u.port or 443} -> {ip}")

              if ip:
                  alive += 1
                  with open(OUTPUT_RAW,'a') as f:
                      f.write(link+'\n')

          if os.path.exists("cfg.json"):
              os.remove("cfg.json")

          print("===================================")
          print(f"TOTAL: {total}")
          print(f"ALIVE: {alive}")
          print(f"ADDED TO FILE: {alive}")
          print("===================================")
          print("DONE")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git reset --hard origin/main

          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git diff --cached --quiet || git commit -m "Update VLESS proxy subscription (raw + base64)"

          git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} HEAD:main

name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq python3 python3-pip
          python3 -m pip install --upgrade pip
          pip install geoip2 requests pysocks

      - name: Download GeoLite database
        run: |
          mkdir -p geoip
          curl -L -o geoip/GeoLite2-Country.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Check VLESS via Xray
        run: |
          python3 <<'EOF'
          import subprocess, time, json, urllib.parse, os, socket, requests, geoip2.database, socks
          from concurrent.futures import ThreadPoolExecutor, as_completed

          INPUT_FILE = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_FILE = 'githubmirror/26_proxy_subscription_raw.txt'
          THREADS = 8
          BASE_PORT = 12000

          FLAGS = {
              'RU':'🇷🇺','US':'🇺🇸','NL':'🇳🇱','DE':'🇩🇪','FR':'🇫🇷',
              'GB':'🇬🇧','CA':'🇨🇦','JP':'🇯🇵','SG':'🇸🇬','PL':'🇵🇱',
              'UA':'🇺🇦','FI':'🇫🇮','SE':'🇸🇪','CH':'🇨🇭','IT':'🇮🇹'
          }

          reader = geoip2.database.Reader('geoip/GeoLite2-Country.mmdb')

          def flag_from_ip(ip):
              try:
                  iso = reader.country(ip).country.iso_code
                  return FLAGS.get(iso, '🏳️')
              except:
                  return '🏳️'

          def get_self_flag():
              try:
                  ip = requests.get("https://api.ipify.org", timeout=10).text.strip()
                  return flag_from_ip(ip)
              except:
                  return '🏳️'

          SELF_FLAG = get_self_flag()

          def get_exit_flag(port):
              try:
                  s = socks.socksocket()
                  s.set_proxy(socks.SOCKS5, "127.0.0.1", port)
                  s.settimeout(10)
                  s.connect(("api.ipify.org", 80))
                  s.send(b"GET / HTTP/1.1\r\nHost: api.ipify.org\r\n\r\n")
                  data = s.recv(4096).decode()
                  ip = data.split("\r\n\r\n")[1].strip()
                  return flag_from_ip(ip)
              except:
                  return None

          def build_config(link, port):
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              network = q.get("type", ["tcp"])[0]
              security = q.get("security", ["none"])[0]
              sni = q.get("sni", [""])[0]

              stream_settings = {
                  "network": network
              }

              if security == "tls":
                  stream_settings["security"] = "tls"
                  stream_settings["tlsSettings"] = {
                      "serverName": sni or u.hostname,
                      "allowInsecure": True
                  }

              return {
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": port,
                      "protocol": "socks",
                      "settings": {"udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": u.hostname,
                              "port": u.port or 443,
                              "users": [{
                                  "id": u.username,
                                  "encryption": "none"
                              }]
                          }]
                      },
                      "streamSettings": stream_settings
                  }]
              }

          def test_proxy(link, idx):
              port = BASE_PORT + idx
              cfg_file = f"cfg_{port}.json"

              try:
                  cfg = build_config(link, port)
                  with open(cfg_file, "w") as f:
                      json.dump(cfg, f)

                  proc = subprocess.Popen(
                      ["./xray", "-c", cfg_file],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  time.sleep(5)

                  exit_flag = get_exit_flag(port)
                  if not exit_flag:
                      proc.kill()
                      return None

                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get("sni", [""])[0] or u.hostname

                  name = f"{SELF_FLAG} → {exit_flag} | SNI: {sni}"

                  proc.kill()
                  return link.split("#")[0] + "#" + name

              except:
                  return None
              finally:
                  if os.path.exists(cfg_file):
                      os.remove(cfg_file)

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(0)

          with open(INPUT_FILE) as f:
              links = [l.strip() for l in f if l.startswith("vless://")]

          results = []
          with ThreadPoolExecutor(max_workers=THREADS) as ex:
              futures = [ex.submit(test_proxy, link, i) for i, link in enumerate(links)]
              for f in as_completed(futures):
                  r = f.result()
                  if r:
                      results.append(r)

          with open(OUTPUT_FILE, "a") as f:
              for r in results:
                  f.write(r + "\n")

          print("Alive proxies:", len(results))
          reader.close()
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git commit -m "Auto update VLESS subscription ($(date -u))" || exit 0
          git pull --rebase origin main || true
          git push
          

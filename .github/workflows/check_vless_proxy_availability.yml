name: Check VLESS proxy availability via Xray

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray (FULL TRANSPORT SUPPORT)
        run: |
          python3 <<'EOF'
          import subprocess, time, json, urllib.parse, os, socket, threading
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from collections import defaultdict

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT = 'githubmirror/26_proxy_subscription_raw.txt'
          XRAY = './xray'
          RUNNER_IP = os.environ.get("RUNNER_IP","")

          MAX_WORKERS = 5          # Увеличил для скорости
          START_TIMEOUT = 8         # Больше времени на запуск Xray
          TEST_TIMEOUT = 10         # Таймаут для curl

          active = []
          lock = threading.Lock()
          stats = defaultdict(int)  # Статистика по транспортам

          def cleanup():
              with lock:
                  for p in active:
                      try:
                          p.terminate()
                          p.wait(timeout=1)
                      except:
                          try: p.kill()
                          except: pass
                  active.clear()

          def free_port():
              s = socket.socket()
              s.bind(('',0))
              p = s.getsockname()[1]
              s.close()
              return p

          def wait_port(port, timeout=START_TIMEOUT):
              t = time.time()
              while time.time()-t < timeout:
                  try:
                      socket.create_connection(("127.0.0.1",port),1).close()
                      return True
                  except:
                      time.sleep(0.3)
              return False

          def parse(link):
              """Парсит VLESS ссылку с поддержкой всех параметров"""
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)
              
              # Определяем транспорт (xhttp и ghttp объединяем)
              net = q.get("type", ["tcp"])[0].lower()
              transport = net
              if net in ['xhttp', 'ghttp']:
                  transport = 'xhttp'  # нормализуем для конфига
              
              return {
                  "host": u.hostname,
                  "port": u.port or 443,
                  "id": u.username,
                  "net": transport,                    # для конфига
                  "orig_net": net,                      # для статистики
                  "sec": q.get("security", ["none"])[0].lower(),
                  "sni": q.get("sni", [""])[0],
                  "pbk": q.get("pbk", [""])[0],
                  "sid": q.get("sid", [""])[0],
                  "fp": q.get("fp", ["chrome"])[0],
                  "path": q.get("path", ["/"])[0],
                  "hosth": q.get("host", [""])[0],
                  "flow": q.get("flow", [""])[0],
                  "svc": q.get("serviceName", [""])[0],
                  "mode": q.get("mode", ["auto"])[0],           # для xhttp
                  "extra": q.get("extra", [""])[0],              # для xhttp
                  "alpn": q.get("alpn", [""])[0],                 # для tls
                  "allow_insecure": q.get("allowInsecure", ["0"])[0] == "1"
              }

          def make_cfg(port, p):
              """Создает конфиг Xray с поддержкой всех транспортов"""
              stream = {}
              
              # --- НАСТРОЙКИ ТРАНСПОРТА ---
              if p["net"] == "xhttp":  # xhttp и ghttp (нормализованы)
                  stream["network"] = "xhttp"
                  stream["xhttpSettings"] = {
                      "path": p["path"],
                      "mode": p["mode"]
                  }
                  if p["hosth"]:
                      stream["xhttpSettings"]["host"] = p["hosth"]
                  if p["extra"]:
                      try:
                          stream["xhttpSettings"]["extra"] = json.loads(p["extra"])
                      except:
                          pass
                          
              elif p["net"] == "http":
                  stream["network"] = "http"
                  stream["httpSettings"] = {"path": p["path"]}
                  if p["hosth"]:
                      stream["httpSettings"]["host"] = [p["hosth"]]
                      
              elif p["net"] == "ws":
                  stream["network"] = "ws"
                  stream["wsSettings"] = {"path": p["path"]}
                  if p["hosth"]:
                      stream["wsSettings"]["headers"] = {"Host": p["hosth"]}
                      
              elif p["net"] == "grpc":
                  stream["network"] = "grpc"
                  stream["grpcSettings"] = {"serviceName": p["svc"] or p["path"]}
                  
              else:  # tcp (по умолчанию)
                  stream["network"] = "tcp"
                  if p["path"] and p["path"] != "/":
                      stream["tcpSettings"] = {
                          "header": {
                              "type": "http",
                              "request": {"path": [p["path"]]}
                          }
                      }
              
              # --- НАСТРОЙКИ БЕЗОПАСНОСТИ ---
              if p["sec"] == "reality" and p["pbk"]:
                  stream["security"] = "reality"
                  stream["realitySettings"] = {
                      "serverName": p["sni"] or p["host"],
                      "publicKey": p["pbk"],
                      "shortId": p["sid"] or "",
                      "fingerprint": p["fp"] or "chrome"
                  }
                  
              elif p["sec"] == "tls":
                  stream["security"] = "tls"
                  stream["tlsSettings"] = {
                      "serverName": p["sni"] or p["host"],
                      "allowInsecure": p["allow_insecure"],
                      "fingerprint": p["fp"] or "chrome"
                  }
                  if p["alpn"]:
                      stream["tlsSettings"]["alpn"] = p["alpn"].split(",")
              
              # --- ПОЛЬЗОВАТЕЛЬ ---
              user = {"id": p["id"], "encryption": "none"}
              if p["flow"]:
                  user["flow"] = p["flow"]

              return {
                  "inbounds": [
                      {
                          "listen": "127.0.0.1",
                          "port": port,
                          "protocol": "socks",
                          "settings": {"udp": False}
                      }
                  ],
                  "outbounds": [
                      {
                          "protocol": "vless",
                          "settings": {
                              "vnext": [
                                  {
                                      "address": p["host"],
                                      "port": p["port"],
                                      "users": [user]
                                  }
                              ]
                          },
                          "streamSettings": stream
                      }
                  ]
              }

          def check(link):
              proc = None
              cfgf = None
              transport = "unknown"
              
              try:
                  p = parse(link)
                  transport = p["orig_net"]  # для статистики сохраняем исходное название
                  port = free_port()
                  
                  # Создаем конфиг
                  cfg = make_cfg(port, p)
                  cfgf = f"cfg_{port}.json"
                  with open(cfgf, "w") as f:
                      json.dump(cfg, f)

                  # Запускаем Xray
                  proc = subprocess.Popen(
                      [XRAY, "run", "-c", cfgf],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  with lock:
                      active.append(proc)

                  # Ждем готовности порта
                  if not wait_port(port):
                      print(f"✗ {p['host']}:{p['port']} [{transport}] timeout")
                      return None

                  # Проверяем IP через прокси
                  try:
                      ip = subprocess.check_output([
                          "curl", "-s", "--max-time", str(TEST_TIMEOUT),
                          "-x", f"socks5h://127.0.0.1:{port}",
                          "https://api.ipify.org"
                      ], text=True).strip()
                  except subprocess.CalledProcessError:
                      ip = None
                  except Exception:
                      ip = None

                  # Проверяем результат
                  if ip and ip != RUNNER_IP:
                      stats[transport] += 1
                      print(f"✅ {p['host']}:{p['port']} [{transport}] → {ip}")
                      return link
                  else:
                      print(f"✗ {p['host']}:{p['port']} [{transport}] no IP")
                      return None

              except Exception as e:
                  print(f"⚠️ {link[:60]}... error: {str(e)[:50]}")
                  return None
              
              finally:
                  # Очистка
                  if proc:
                      try:
                          proc.terminate()
                          proc.wait(timeout=1)
                      except:
                          try: proc.kill()
                          except: pass
                  if cfgf and os.path.exists(cfgf):
                      try: os.remove(cfgf)
                      except: pass

          # Основной код
          if not os.path.exists(INPUT):
              print("❌ Input file not found")
              raise SystemExit(0)

          # Читаем ссылки
          with open(INPUT) as f:
              links = [l.strip() for l in f if l.strip().startswith("vless://")]

          total = len(links)
          print(f"\n{'='*60}")
          print(f"🔍 TOTAL VLESS LINKS: {total}")
          print(f"⚡ WORKERS: {MAX_WORKERS}")
          print(f"{'='*60}\n")

          # Проверяем
          alive = []
          start = time.time()
          
          try:
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                  futures = [ex.submit(check, l) for l in links]
                  for i, f in enumerate(as_completed(futures), 1):
                      r = f.result()
                      if r:
                          alive.append(r)
                      if i % 10 == 0:
                          elapsed = time.time() - start
                          print(f"📊 Progress: {i}/{total} ({i/total*100:.0f}%) in {elapsed:.0f}s")
          finally:
              cleanup()

          elapsed = time.time() - start
          
          # Выводим статистику
          print(f"\n{'='*60}")
          print(f"✅ RESULTS")
          print(f"   • Total: {total}")
          print(f"   • Alive: {len(alive)}")
          print(f"   • Time: {elapsed:.1f}s")
          
          if stats:
              print(f"\n📊 STATS BY TRANSPORT:")
              for t, count in sorted(stats.items(), key=lambda x: x[1], reverse=True):
                  print(f"   • {t}: {count}")
          print(f"{'='*60}\n")

          # Сохраняем результаты
          with open(OUTPUT, "w") as f:
              f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")
              for l in alive:
                  f.write(l + "\n")

          print(f"💾 Saved {len(alive)} working proxies to {OUTPUT}")
          EOF

      - name: Encode Base64
        run: |
          if [ -s githubmirror/26_proxy_subscription_raw.txt ]; then
            if [ $(wc -l < githubmirror/26_proxy_subscription_raw.txt) -gt 1 ]; then
              tail -n +2 githubmirror/26_proxy_subscription_raw.txt | base64 -w 0 > githubmirror/26_proxy_subscription_base64.txt
              COUNT=$(tail -n +2 githubmirror/26_proxy_subscription_raw.txt | wc -l)
              echo "✅ Base64 encoded: $COUNT proxies"
            else
              echo "⚠️ No working proxies"
              : > githubmirror/26_proxy_subscription_base64.txt
            fi
          else
            echo "⚠️ File empty"
            : > githubmirror/26_proxy_subscription_base64.txt
          fi

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add githubmirror/*.txt || true
          if git diff --staged --quiet; then
            echo "❌ No changes to commit"
          else
            git commit -m "Update proxies [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase || true
            git push
            echo "✅ Changes pushed"
          fi

name: Check VLESS proxy availability via Xray (GeoIP)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install requests geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray (parallel, GeoIP only)
        run: |
          python3 <<'EOF'
          import subprocess, json, urllib.parse, os, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import geoip2.database
          import requests

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')
          XRAY_BIN = './xray'
          MAX_WORKERS = 20  # 20 потоков

          COUNTRY_DB = 'geolite2/GeoLite2-Country.mmdb'

          if not os.path.exists(COUNTRY_DB):
              raise SystemExit("GeoLite2-Country.mmdb not found")

          geo_reader = geoip2.database.Reader(COUNTRY_DB)

          TEST_URLS = [
              'https://api.ipify.org',
              'http://cp.cloudflare.com',
              'https://www.instagram.com/'
          ]

          geo_cache = {}

          def get_country_flag(ip):
              if ip in geo_cache:
                  return geo_cache[ip]
              try:
                  c = geo_reader.country(ip).country.iso_code
                  flag = "".join(chr(0x1F1E6 + ord(ch.upper()) - ord('A')) for ch in c)
                  geo_cache[ip] = (c, flag)
                  return c, flag
              except:
                  geo_cache[ip] = ('??', '🏳️')
                  return '??', '🏳️'

          def check_proxy(link):
              try:
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  sec = q.get('security', ['none'])[0]
                  sni = q.get('sni', [''])[0]
                  flow = q.get('flow', [''])[0]
                  fp = q.get('fp', [''])[0].lower()
                  if sec != 'reality' or fp != 'chrome' or flow != 'xtls-rprx-vision':
                      return None

                  port = u.port or 443
                  cfg = {
                      'inbounds':[{'listen':'127.0.0.1','port':1080,'protocol':'socks','settings':{'udp':False}}],
                      'outbounds':[{
                          'protocol':'vless',
                          'settings':{'vnext':[{'address':u.hostname,'port':port,'users':[{'id':u.username,'encryption':'none','flow':flow}]}]},
                          'streamSettings':{
                              'network': q.get('type',['tcp'])[0],
                              'security':'reality',
                              'realitySettings':{
                                  'serverName': sni,
                                  'publicKey': q.get('pbk',[''])[0],
                                  'shortId': q.get('sid',[''])[0],
                                  'fingerprint':'chrome'
                              }
                          }
                      }]
                  }

                  with open('cfg.json','w') as f: json.dump(cfg,f)
                  p = subprocess.Popen([XRAY_BIN,'run','-c','cfg.json'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(1.5)

                  exit_ip = None
                  proxies = {'http':'socks5h://127.0.0.1:1080','https':'socks5h://127.0.0.1:1080'}
                  for url in TEST_URLS:
                      try:
                          r = requests.get(url, proxies=proxies, timeout=3)
                          if r.status_code == 200:
                              exit_ip = r.text.strip()
                              break
                      except: continue

                  p.terminate()
                  time.sleep(0.5)

                  if not exit_ip or exit_ip == RUNNER_IP:
                      return None

                  host_country, host_flag = get_country_flag(u.hostname)
                  exit_country, exit_flag = get_country_flag(exit_ip)

                  # Фильтр только по GeoIP
                  if host_country=='RU' or exit_country=='RU':
                      return None

                  name = f"in {host_flag} Rusl exit {exit_flag} {sni}"
                  return link.split('#')[0] + f"#{name}"
              except:
                  return None

          if not os.path.exists(INPUT):
              raise SystemExit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.startswith('vless://')]

          results = []
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as exe:
              futures = {exe.submit(check_proxy, l): l for l in links}
              for f in as_completed(futures):
                  res = f.result()
                  if res:
                      results.append(res)

          os.makedirs('githubmirror', exist_ok=True)
          with open(OUTPUT_RAW,'w') as f:
              for link in results:
                  f.write(link+'\n')

          print(f"OK proxies: {len(results)}")
          EOF

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/*
          git commit -m "PRO update $(date -u)" || exit 0
          git pull --rebase origin main
          git push

name: Check VLESS proxy availability and build Mihomo config

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  OUTPUT_DIR: githubmirror
  RAW_FILE: githubmirror/26_proxy_subscription_raw.txt
  BASE64_FILE: githubmirror/26_proxy_subscription_base64.txt

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip unzip
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml requests[socks]

      - name: Prepare output directory
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          : > ${{ env.RAW_FILE }}
          : > ${{ env.BASE64_FILE }}

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Download whitelist
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/main/githubmirror/26_ru_whitelist.txt" -o githubmirror/26_ru_whitelist.txt

      - name: Download Mihomo binary
        run: |
          # Получаем последнюю версию Mihomo для Linux amd64, берем только первый URL
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux-amd64") and endswith(".gz")) | .browser_download_url' | head -n1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Could not find download URL"
            exit 1
          fi

          echo "Downloading Mihomo from $DOWNLOAD_URL"
          curl -L -o mihomo.gz "$DOWNLOAD_URL"
          gunzip -f mihomo.gz
          chmod +x mihomo

      - name: Check VLESS via Mihomo and build raw subscription
        env:
          RAW_FILE: ${{ env.RAW_FILE }}
          RUNNER_IP: ${{ env.RUNNER_IP }}
        run: |
          python3 <<'EOF'
          import os, subprocess, time, yaml, urllib.parse, requests
          INPUT, OUTPUT_RAW = 'githubmirror/26_ru_whitelist.txt', os.environ['RAW_FILE']
          RUNNER_IP = os.environ.get('RUNNER_IP', '')
          if not os.path.exists(INPUT): raise SystemExit(0)
          with open(INPUT, encoding='utf-8', errors='ignore') as f:
              links = [l.strip() for l in f if l.startswith('vless://')]
          def check_proxy(link):
              u = urllib.parse.urlparse(link); q = urllib.parse.parse_qs(u.query)
              proxy_name = u.fragment or f'{u.hostname}:{u.port}'
              cfg = {'socks-port': 1080, 'proxies': [{
                  'name': proxy_name, 'type': 'vless', 'server': u.hostname, 'port': int(u.port),
                  'uuid': u.username, 'network': q.get('type', ['tcp'])[0], 'flow': q.get('flow', [''])[0],
                  'tls': True, 'servername': q.get('sni', [''])[0],
                  'reality-opts': {'public-key': q.get('pbk', [''])[0], 'short-id': q.get('sid', [''])[0]},
                  'client-fingerprint': 'chrome'
              }]}
              with open('temp.yaml', 'w', encoding='utf-8') as f: yaml.dump(cfg, f)
              p = subprocess.Popen(['./mihomo', '-f', 'temp.yaml'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(2); valid = False
              try:
                  r = requests.get('https://api.ipify.org', proxies={'http':'socks5h://127.0.0.1:1080','https':'socks5h://127.0.0.1:1080'}, timeout=7)
                  if r.status_code == 200 and r.text.strip() != RUNNER_IP: valid = True
              except: pass
              p.terminate(); p.wait(); time.sleep(0.5); return valid
          for link in links:
              if check_proxy(link):
                  with open(OUTPUT_RAW, 'a', encoding='utf-8') as f: f.write(link + '\n')
          EOF

      - name: Encode subscription to Base64
        run: base64 -w 0 ${{ env.RAW_FILE }} > ${{ env.BASE64_FILE }}

      - name: Generate Mihomo config.yaml
        env:
          RAW_FILE: ${{ env.RAW_FILE }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
        run: |
          python3 <<'EOF'
          import os, json, urllib.parse
          RAW, OUT = os.environ['RAW_FILE'], os.environ['OUTPUT_DIR'] + "/config.yaml"
          proxies, names = [], []
          with open(RAW, encoding='utf-8', errors='ignore') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('vless://'): continue
                  u = urllib.parse.urlparse(line); q = urllib.parse.parse_qs(u.query)
                  name = urllib.parse.unquote(u.fragment or f'{u.hostname}:{u.port}')
                  if name in names: continue
                  names.append(name)
                  proxy = {"name": name, "type": "vless", "server": u.hostname, "port": int(u.port), "uuid": u.username,
                           "network": q.get("type", ["tcp"])[0], "flow": q.get("flow", [""])[0], "tls": True,
                           "servername": q.get("sni", [""])[0], "client-fingerprint": "chrome",
                           "reality-opts": {"public-key": q.get("pbk", [""])[0]}}
                  if "sid" in q: proxy["reality-opts"]["short-id"] = q.get("sid")[0]
                  proxies.append(proxy)
          with open(OUT, "w", encoding="utf-8") as f:
              f.write("proxies:\n")
              for p in proxies:
                  f.write(f"  - name: {json.dumps(p['name'], ensure_ascii=False)}\n")
                  f.write(f"    type: vless\n    server: {p['server']}\n    port: {p['port']}\n")
                  f.write(f"    uuid: {json.dumps(p['uuid'])}\n    network: {json.dumps(p['network'])}\n")
                  f.write(f"    flow: {json.dumps(p['flow'])}\n    tls: true\n")
                  f.write(f"    servername: {json.dumps(p['servername'])}\n    client-fingerprint: chrome\n")
                  f.write(f"    reality-opts:\n      public-key: {json.dumps(p['reality-opts']['public-key'])}\n")
                  if "short-id" in p["reality-opts"]: f.write(f"      short-id: {json.dumps(p['reality-opts']['short-id'])}\n")
              f.write("\nproxy-groups:\n  - name: \"auto\"\n    type: select\n    proxies:\n")
              for n in names: f.write(f"      - {json.dumps(n, ensure_ascii=False)}\n")
              f.write("\nrules:\n  - GEOIP,RU,DIRECT\n  - MATCH,auto\n")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ${{ env.RAW_FILE }} ${{ env.BASE64_FILE }} ${{ env.OUTPUT_DIR }}/config.yaml
          git diff --cached --quiet || (git commit -m "Update VLESS subscription + Mihomo config" && git push origin HEAD:main)

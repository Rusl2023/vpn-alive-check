name: Check VLESS Proxy Availability

on:
  schedule:
    - cron: '*/30 * * * *'  
  workflow_dispatch:

jobs:
  check-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests geoip2

      - name: Download GeoIP database
        run: |
          wget -q https://git.io/GeoLite2-Country.mmdb -O GeoLite2-Country.mmdb

      - name: Download xray
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/download/v1.8.21/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip
          chmod +x xray

      - name: RUN Python filter & checker
        run: |
          python3 << 'PYTHON_EOF'
          import os, socket, urllib.parse, requests, random, ipaddress, subprocess, time, json, base64, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          import geoip2.database

          # --- CONFIGURATION ---
          MAX_WORKERS = 35
          TIMEOUT = 6
          XRAY = "./xray"
          GEO_DB = "GeoLite2-Country.mmdb"


name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -la xray

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Check VLESS via Xray
        run: |
          python3 << 'EOF'
          import subprocess, time, json, urllib.parse, os, socket
          from concurrent.futures import ThreadPoolExecutor, wait, FIRST_COMPLETED
          from threading import Lock
          from datetime import datetime, timezone

          XRAY_PATH = os.path.join(os.getcwd(), "xray")
          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          TEST_URL = 'https://api.ipify.org'
          MAX_WORKERS = 8   # 8 потоков для скорости
          MAX_TOTAL_TIME = 1800  # 30 минут на всё

          alive_links = []
          active_processes = []
          process_lock = Lock()
          print_lock = Lock()
          processed = [0]
          total = 0

          def cleanup():
              with process_lock:
                  for p in active_processes[:]:
                      try: 
                          p.terminate()
                          p.wait(timeout=1)
                      except: 
                          p.kill()
                      if p in active_processes: active_processes.remove(p)

          def get_free_port():
              s = socket.socket()
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port

          def wait_port(port, timeout=12):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          return True
                  except: time.sleep(0.2)
              return False

          def exit_ip(port):
              try:
                  out = subprocess.check_output(
                      ['curl', '-s', '--max-time', '5', '-x', f'socks5h://127.0.0.1:{port}', TEST_URL],
                      text=True, stderr=subprocess.DEVNULL
                  ).strip()
                  return out if out else None
              except: return None

          def check_one(link):
              port = get_free_port()
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              network = 'http' if q.get('type', ['tcp'])[0] == 'xhttp' else q.get('type', ['tcp'])[0]
              sec = q.get('security', ['none'])[0]
              sni = q.get('sni', [''])[0]
              fingerprint = q.get('fp', ['chrome'])[0]

              stream = {'network': network}
              if sec == 'reality' and 'pbk' in q:
                  stream.update({
                      'security': 'reality',
                      'realitySettings': {
                          'serverName': sni, 
                          'publicKey': q['pbk'][0],
                          'shortId': q.get('sid', [''])[0], 
                          'fingerprint': fingerprint
                      }
                  })
              elif sec == 'tls':
                  stream.update({
                      'security': 'tls',
                      'tlsSettings': {
                          'serverName': sni, 
                          'allowInsecure': True, 
                          'fingerprint': fingerprint
                      }
                  })

              cfg = {
                  'inbounds': [{'listen': '127.0.0.1', 'port': port, 'protocol': 'socks', 'settings': {'udp': False}}],
                  'outbounds': [{
                      'protocol': 'vless', 
                      'settings': {'vnext': [{
                          'address': u.hostname, 
                          'port': u.port or 443,
                          'users': [{'id': u.username, 'encryption': 'none', 'flow': q.get('flow', [''])[0]}]
                      }]},
                      'streamSettings': stream
                  }]
              }

              cfg_file = f'cfg_{port}.json'
              with open(cfg_file, 'w') as f: json.dump(cfg, f)

              p = subprocess.Popen([XRAY_PATH, 'run', '-c', cfg_file], 
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              with process_lock: active_processes.append(p)

              result = None
              host = f"{u.hostname}:{u.port or 443}"
              
              if wait_port(port):
                  ip = exit_ip(port)
                  if ip:
                      result = link
                      with print_lock: print(f"✓ {host} -> {ip}")
                  else: 
                      with print_lock: print(f"✗ {host}")
              else: 
                  with print_lock: print(f"✗ {host} timeout")

              try: 
                  p.terminate(); p.wait(timeout=1)
              except: 
                  p.kill()
              with process_lock: 
                  if p in active_processes: active_processes.remove(p)
              try: os.remove(cfg_file)
              except: pass

              processed[0] += 1
              if processed[0] % 20 == 0: 
                  with print_lock: print(f"📊 {processed[0]}/{total}")
              return result

          # Проверки
          if not os.path.exists(XRAY_PATH): 
              print("❌ Xray not found"); raise SystemExit(1)
          if not os.path.exists(INPUT): 
              print("❌ INPUT not found"); raise SystemExit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.strip().startswith('vless://')]
          total = len(links)

          print(f"\n{'='*60}")
          print(f"🔍 TOTAL LINKS: {total} | WORKERS: {MAX_WORKERS} | TIME: {MAX_TOTAL_TIME}s")
          print(f"{'='*60}")

          # ✅ Заголовок в файл
          with open(OUTPUT_RAW, 'w') as f:
              f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")

          start_time = time.time()
          alive_links = []
          
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              # ✅ ВСЕ ключи БЕЗ ЛИМИТА!
              futures = [executor.submit(check_one, link) for link in links]
              
              # Ждём завершения всех
              done, _ = wait(futures, timeout=MAX_TOTAL_TIME, return_when=FIRST_COMPLETED)
              for future in done:
                  try:
                      result = future.result(timeout=1)
                      if result: alive_links.append(result)
                  except: pass

          cleanup()

          # ✅ Записываем живые ключи
          with open(OUTPUT_RAW, 'a') as f:
              for link in alive_links: 
                  f.write(link + '\n')

          elapsed = time.time() - start_time
          print(f"\n{'='*60}")
          print(f"✅ RESULTS | Total: {total} | Alive: {len(alive_links)} | Time: {elapsed:.1f}s")
          print(f"📁 Raw file lines: {len(open(OUTPUT_RAW).readlines())}")
          print(f"{'='*60}\n🎯 DONE")
          EOF

      - name: Encode Base64
        run: |
          RAW="githubmirror/26_proxy_subscription_raw.txt"
          B64="githubmirror/26_proxy_subscription_base64.txt"
          LINES=$(wc -l < "$RAW")
          if [ "$LINES" -gt 1 ]; then
            tail -n +2 "$RAW" | base64 -w 0 > "$B64"
            COUNT=$(tail -n +2 "$RAW" | wc -l)
            echo "✅ Base64: $COUNT proxies | Raw lines: $LINES"
          else
            echo "⚠️ No proxies"
            : > "$B64"
          fi
          ls -la githubmirror/*.txt

      - name: Commit & Push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          RAW="githubmirror/26_proxy_subscription_raw.txt"
          LINES=$(wc -l < "$RAW")
          if [ "$LINES" -gt 1 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add githubmirror/*.txt
            COUNT=$(tail -n +2 "$RAW" | wc -l)
            git diff --cached --quiet || git commit -m "Update $COUNT proxies [$(date +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main || true
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}" HEAD:main
            echo "✅ Pushed: $COUNT proxies"
          else
            echo "⚠️ No proxies to commit"
          fi

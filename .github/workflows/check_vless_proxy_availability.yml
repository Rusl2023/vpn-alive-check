def is_russian_exit(exit_ip):
    if is_ipv6(exit_ip):
        print(f"🚫 IPv6 DETECTED: {exit_ip}")
        return True
    raw_iso = get_raw_iso_country(exit_ip)
    if raw_iso == 'RU':
        print(f"🚫 RU IPv4: {exit_ip}")
        return True
    return False

def test_site(port, url, site_name):
    time.sleep(CURL_DELAY)
    try:
        cmd = [
            'curl', '-s', '--max-time', '10',
            '-x', f'socks5h://127.0.0.1:{port}',
            '-o', '/dev/null', '-w', '%{http_code}', url
        ]
        code = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=12).strip()
        success_codes = ['200','204','301','302','403','429']
        if code in success_codes:
            print(f"✅ {site_name}: {code}")
            return True
        print(f"❌ {site_name}: HTTP {code}")
        return False
    except subprocess.TimeoutExpired:
        print(f"⏰ {site_name}: TIMEOUT (12s)")
        return False
    except Exception:
        print(f"❌ {site_name}: CURL ERROR")
        return False

def test_proxy_robust(port):
    print("⏳ Waiting 3s for Xray stability...")
    time.sleep(3)
    
    exit_ip = None
    for attempt in range(2):
        if exit_ip:
            break
        print(f"🌐 IP test attempt {attempt + 1}/2")
        for i, url in enumerate(IP_TEST_URLS, 1):
            try:
                cmd = ['curl', '-s', '--max-time', '12', '-x', f'socks5h://127.0.0.1:{port}', url]
                ip = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=15).strip()
                if valid_ip(ip) and len(ip) >= 7 and not is_ipv6(ip):
                    exit_ip = ip
                    print(f"🌐 IPv4 [{i}]: {ip}")
                    break
                elif is_ipv6(ip):
                    print(f"🚫 IPv6 blocked: {ip}")
            except:
                print(f"🌐 IP test [{i}] failed")
                continue
        if not exit_ip and attempt == 0:
            print("⏳ Retrying IP test in 2s...")
            time.sleep(2)
    
    if not exit_ip:
        print("❌ No valid IPv4 exit IP after 2 attempts")
        return False, None

    try:
        cmd = ['curl', '-s', '--max-time', '12', '-x', f'socks5h://127.0.0.1:{port}',
               '-o', '/dev/null', '-w', '%{http_code}', 'http://example.com']
        http_code = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=15).strip()
        if http_code != '200':
            print(f"❌ HTTP example.com: {http_code}")
            return False, None
    except:
        print("❌ HTTP example.com: FAILED")
        return False, None

    print("🔥 Testing 3 sites in parallel...")
    with ThreadPoolExecutor(max_workers=3) as site_executor:
        futures = [
            site_executor.submit(test_site, port, TEST_SITES[0], "X.com"),
            site_executor.submit(test_site, port, TEST_SITES[1], "Cloudflare"),
            site_executor.submit(test_site, port, TEST_SITES[2], "Netflix")
        ]
    site_results = []
    for future in futures:
        try:
            result = future.result(timeout=15)
            site_results.append(result)
        except Exception:
            print(f"⚠️ Site test TIMEOUT/ERROR → FAIL")
            site_results.append(False)

    if not all(site_results):
        print("❌ Site tests FAILED (need ALL 3)")
        return False, None

    print("✅ All 3 sites OK!")
    return True, exit_ip

def get_free_port():
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(('', 0))
    port = s.getsockname()[1]
    s.close()
    return port

def wait_port(port, timeout=20):
    print(f"⏳ Waiting for port {port} (20s max)...")
    start = time.time()
    while time.time() - start < timeout:
        try:
            with socket.create_connection(("127.0.0.1", port), timeout=1):
                print(f"✅ Port {port} ready!")
                return True
        except:
            time.sleep(0.2)
    print(f"❌ Port {port} timeout after 20s")
    return False

def check_one(link):
    try:
        port = get_free_port()
        u = urllib.parse.urlparse(link)
        if u.scheme != 'vless':
            return None
            
        q = urllib.parse.parse_qs(u.query)
        sni = q.get('sni', ['unknown'])[0]
        fp = q.get('fp', ['chrome'])[0]
        
        server_ip = resolve(u.hostname)
        server_country = country_from_ip(server_ip)

        network = q.get('type', ['tcp'])[0]
        sec = q.get('security', ['none'])[0]

        stream = {'network': network}
        if sec == 'reality' and 'pbk' in q:
            stream.update({
                'security': 'reality',
                'realitySettings': {
                    'serverName': sni,
                    'publicKey': q['pbk'][0],
                    'shortId': q.get('sid', [''])[0],
                    'fingerprint': fp
                }
            })
        elif sec == 'tls':
            stream.update({
                'security': 'tls',
                'tlsSettings': {
                    'serverName': sni,
                    'allowInsecure': True,
                    'fingerprint': fp
                }
            })

        user = {'id': u.username, 'encryption': 'none'}
        flow = q.get('flow', [''])[0]
        if flow:
            user['flow'] = flow

        cfg = {
            'inbounds': [{
                'listen': '127.0.0.1',
                'port': port,
                'protocol': 'socks',
                'settings': {'udp': False}
            }],
            'outbounds': [{
                'protocol': 'vless',
                'settings': {
                    'vnext': [{
                        'address': u.hostname,
                        'port': int(u.port or 443),
                        'users': [user]
                    }]
                },
                'streamSettings': stream
            }]
        }

        cfg_file = f'cfg_{port}.json'
        with open(cfg_file, 'w') as f:
            json.dump(cfg, f)

        print(f"🚀 Starting Xray on port {port}...")
        p = subprocess.Popen([XRAY_PATH, 'run', '-c', cfg_file],
                           stdout=subprocess.DEVNULL,
                           stderr=subprocess.DEVNULL)

        if not wait_port(port):
            try:
                p.terminate()
                p.wait(timeout=2)
            except:
                p.kill()
            try:
                os.remove(cfg_file)
            except: pass
            return None

        ok, exit_ip = test_proxy_robust(port)
        
        try:
            p.terminate()
            p.wait(timeout=2)
        except:
            p.kill()
        p.wait(timeout=1)

        try:
            os.remove(cfg_file)
        except: pass

        if not ok:
            return None

        if is_russian_exit(exit_ip):
            return None

        exit_country = country_from_ip(exit_ip)
        num = next_id()
        name = f"{server_country}->{num}->{exit_country} SNI: {sni}"

        if '#' in link:
            link = link.split('#')[0]
        return link + '#' + name

    except Exception as e:
        print(f"⚠️ Proxy parse error: {str(e)[:100]}")
        return None

print(f"📂 Processing {INPUT}...")
if not os.path.exists(INPUT):
    print("❌ INPUT file not found")
    exit(0)

with open(INPUT) as f:
    links = [x.strip() for x in f if x.strip().startswith('vless://')]

if not links:
    print("❌ No VLESS links found")
    exit(0)

print(f"🚀 TOTAL: {len(links)} | workers={MAX_WORKERS} | geoip={geoip_available}")

alive = []
try:
    with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
        futures = [ex.submit(check_one, l) for l in links]
        for future in as_completed(futures):
            result = future.result()
            if result:
                alive.append(result)
except KeyboardInterrupt:
    print("⏹️ Interrupted")

print(f"✅ DONE. Alive NON-RU IPv4-only: {len(alive)}")

with open(OUTPUT_RAW, 'w') as f:
    f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")
    if alive:
        f.write('\n'.join(alive) + '\n')

if alive:
    b64_content = '\n'.join(alive)
    b64 = base64.b64encode(b64_content.encode()).decode()
    with open(OUTPUT_B64, 'w') as f:
        f.write(b64)
    print(f"💾 Saved {len(alive)} battle-tested NON-RU IPv4-only proxies")
else:
    print("❌ No working NON-RU IPv4-only proxies")

if geoip_available:
    try:
        country_reader.close()
        city_reader.close()
        asn_reader.close()
    except: pass
PYEOF
          
python3 proxy_checker.py

      - name: Commit & push results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          for i in {1..3}; do
            if git pull --rebase origin main || git pull --rebase origin master; then
              break
            fi
            echo "🔄 Pull attempt $i failed, retrying..."
            sleep 2
          done
          
          git add githubmirror/*.txt || true
          
          if git diff --staged --quiet; then
            echo "❌ No changes to commit"
            exit 0
          fi
          
          git commit -m "Update battle-tested NON-RU IPv4-only proxies [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          
          for i in {1..3}; do
            if git push origin main 2>/dev/null; then
              echo "✅ Pushed battle-tested updates (attempt $i)"
              exit 0
            fi
            echo "🔄 Push attempt $i failed, retrying..."
            git pull --rebase origin main || git pull --rebase origin master
            sleep 3
          done
          
          echo "❌ All push attempts failed"
          exit 1

name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: proxy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable IPv6
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install geoip2 --quiet

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare GeoLite2
        run: |
          curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
          curl -L -o GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb
          curl -L -o GeoLite2-ASN.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

          if [ ! -f githubmirror/26_ru_whitelist.txt ]; then
            echo "vless://uuid@1.1.1.1:443?security=reality&pbk=ABC&sid=123&sni=www.google.com#test" > githubmirror/26_ru_whitelist.txt
          fi

      - name: Kill old Xray
        run: pkill xray || true

      - name: Run checker
        run: |
          python3 <<'PY'
import subprocess
import time
import json
import urllib.parse
import os
import socket
import ipaddress
import base64
from geoip2 import database
from concurrent.futures import ThreadPoolExecutor, as_completed
from threading import Lock

XRAY = "./xray"
INPUT = "githubmirror/26_ru_whitelist.txt"
OUT_RAW = "githubmirror/26_proxy_subscription_raw.txt"
OUT_B64 = "githubmirror/26_proxy_subscription_base64.txt"

try:
    country = database.Reader("GeoLite2-Country.mmdb")
except Exception:
    print("Failed to load GeoLite2-Country.mmdb")
    exit(1)

FLAGS = {
    'DE': '🇩🇪DE', 'NL': '🇳🇱NL', 'US': '🇺🇸US',
    'GB': '🇬🇧GB', 'FR': '🇫🇷FR', 'CA': '🇨🇦CA', 'SG': '🇸🇬SG'
}

def is_ipv4(ip):
    try:
        return ipaddress.ip_address(ip).version == 4
    except:
        return False

def flag(ip):
    try:
        r = country.country(ip)
        if r.country.iso_code:
            return FLAGS.get(r.country.iso_code, f"🌍{r.country.iso_code}")
    except:
        pass
    return "🌍??"

def resolve(h):
    try:
        return socket.gethostbyname(h)
    except:
        return h

def free_port():
    s = socket.socket()
    s.bind(('', 0))
    p = s.getsockname()[1]
    s.close()
    return p

def wait_port(p):
    t = time.time()
    while time.time() - t < 15:
        try:
            socket.create_connection(("127.0.0.1", p), 1).close()
            return True
        except:
            time.sleep(0.2)
    return False

def test_proxy(port):
    try:
        ip = subprocess.check_output([
            "curl", "-s", "--max-time", "10", "-4",
            "-x", f"socks5h://127.0.0.1:{port}",
            "https://api.ipify.org"
        ], text=True, stderr=subprocess.DEVNULL).strip()

        if not is_ipv4(ip):
            return False, None

        code = subprocess.check_output([
            "curl", "-s", "--max-time", "8", "-4",
            "-x", f"socks5h://127.0.0.1:{port}",
            "-o", "/dev/null", "-w", "%{http_code}",
            "https://www.cloudflare.com"
        ], text=True, stderr=subprocess.DEVNULL).strip()

        if code not in ["200", "301", "302"]:
            return False, None

        if flag(ip).startswith("🇷🇺"):
            return False, None

        return True, ip
    except:
        return False, None

counter = 0
lock = Lock()

def next_num():
    global counter
    with lock:
        counter += 1
        return counter

def build(link):
    try:
        u = urllib.parse.urlparse(link)
        if u.scheme != "vless":
            return None

        q = urllib.parse.parse_qs(u.query)
        port = free_port()

        sni = q.get("sni", ["www.google.com"])[0]
        sec = q.get("security", ["none"])[0]
        net = q.get("type", ["tcp"])[0]

        user = {"id": u.username, "encryption": "none"}
        stream = {"network": net}

        if sec == "reality" and "pbk" in q:
            stream["security"] = "reality"
            stream["realitySettings"] = {
                "serverName": sni,
                "publicKey": q["pbk"][0],
                "shortId": q.get("sid", [""])[0]
            }

        cfg = {
            "inbounds": [{
                "listen": "127.0.0.1",
                "port": port,
                "protocol": "socks",
                "settings": {"udp": True}
            }],
            "outbounds": [{
                "protocol": "vless",
                "settings": {
                    "vnext": [{
                        "address": u.hostname,
                        "port": int(u.port or 443),
                        "users": [user]
                    }]
                },
                "streamSettings": stream
            }]
        }

        cf = f"cfg_{port}.json"
        with open(cf, "w") as f:
            json.dump(cfg, f, indent=2)

        p = subprocess.Popen([XRAY, "run", "-c", cf],
                            stdout=subprocess.DEVNULL,
                            stderr=subprocess.DEVNULL)

        if not wait_port(port):
            p.kill()
            try:
                os.remove(cf)
            except:
                pass
            return None

        time.sleep(2)
        ok, ip = test_proxy(port)
        p.kill()
        try:
            os.remove(cf)
        except:
            pass

        if not ok:
            return None

        server_flag = flag(resolve(u.hostname))
        exit_flag = flag(ip)
        n = next_num()

        name = f"{server_flag}→{n}→{exit_flag} SNI:{sni}"
        return link.split("#")[0] + "#" + name

    except Exception:
        return None

if not os.path.exists(INPUT):
    print("No input file found")
    exit(0)

with open(INPUT, 'r') as f:
    links = [l.strip() for l in f if l.startswith("vless://")]

alive = []

with ThreadPoolExecutor(max_workers=10) as ex:
    futures = [ex.submit(build, l) for l in links]
    for f in as_completed(futures):
        r = f.result()
        if r:
            alive.append(r)

with open(OUT_RAW, "w") as f:
    f.write("\n".join(alive))

if alive:
    b64_data = "\n".join(alive)
    b64 = base64.b64encode(b64_data.encode()).decode()
    with open(OUT_B64, "w") as f:
        f.write(b64)

country.close()
print("DONE", len(alive))
PY

      - name: Commit results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git pull --rebase origin ${{ github.ref_name }} || true
          git add githubmirror/*.txt || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update VLESS proxies [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push || true

name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt
          : > githubmirror/config.yaml

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      # ---------- Xray check (НЕ МЕНЯЛ) ----------
      - name: Check VLESS via Xray and build raw subscription
        run: |
          python3 - <<'EOF'
          import subprocess, time, json, urllib.parse, os, urllib.request
          INPUT = "githubmirror/26_ru_whitelist.txt"
          OUTPUT_RAW = "githubmirror/26_proxy_subscription_raw.txt"
          RUNNER_IP = os.environ.get("RUNNER_IP", "")
          TEST_URLS = ["https://api.ipify.org","http://cp.cloudflare.com","https://www.instagram.com/"]

          def exit_ip():
              for url in TEST_URLS:
                  try:
                      out = subprocess.check_output(
                          ["curl","-s","--max-time","8","-x","socks5h://127.0.0.1:1080",url],
                          text=True
                      ).strip()
                      if out:
                          return out
                  except:
                      pass
              return None

          def country(ip):
              try:
                  with urllib.request.urlopen(f"https://ipapi.co/{ip}/country/") as r:
                      return r.read().decode().strip()
              except:
                  return "Unknown"

          if not os.path.exists(INPUT):
              exit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.startswith("vless://")]

          for link in links:
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              stream = {"network": q.get("type", ["tcp"])[0]}
              sec = q.get("security", ["none"])[0]
              sni = q.get("sni", [""])[0]

              if sec == "reality" and "pbk" in q:
                  stream["security"] = "reality"
                  stream["realitySettings"] = {
                      "serverName": sni,
                      "publicKey": q["pbk"][0],
                      "shortId": q.get("sid", [""])[0],
                      "fingerprint": "chrome"
                  }

              cfg = {
                  "inbounds":[{"listen":"127.0.0.1","port":1080,"protocol":"socks","settings":{"udp":False}}],
                  "outbounds":[
                      {
                          "protocol":"vless",
                          "settings":{"vnext":[{"address":u.hostname,"port":u.port or 443,"users":[{"id":u.username,"encryption":"none","flow":q.get("flow", [""])[0]}]}]},
                          "streamSettings": stream
                      }
                  ]
              }

              with open("cfg.json","w") as f:
                  json.dump(cfg,f)

              p = subprocess.Popen(["./xray","run","-c","cfg.json"])
              time.sleep(3)
              ip = exit_ip()
              p.terminate()
              time.sleep(1)

              if not ip or ip == RUNNER_IP:
                  continue
              if country(ip) == "RU":
                  continue

              with open(OUTPUT_RAW,"a") as f:
                  f.write(link + "\n")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      # ---------- FIXED MIHOMO GENERATOR ----------
      - name: Generate FINAL Mihomo config.yaml (ETALON)
        run: |
          INPUT="githubmirror/26_proxy_subscription_raw.txt"
          OUTPUT="githubmirror/config.yaml"

          url_decode() { printf '%b' "${1//%/\\x}"; }

          echo "proxies:" > "$OUTPUT"

          while read -r line; do
            BASE="${line%%#*}"
            FRAG="${line#*#}"
            [ "$FRAG" = "$line" ] && FRAG=""

            NAME=$(url_decode "$FRAG")

            HOST=$(echo "$BASE" | sed -n 's|vless://[^@]*@\([^:]*\):.*|\1|p')
            PORT=$(echo "$BASE" | sed -n 's|vless://[^@]*@[^:]*:\([0-9]*\).*|\1|p')
            UUID=$(echo "$BASE" | sed -n 's|vless://\([^@]*\)@.*|\1|p')

            TYPE=$(echo "$BASE" | sed -n 's|.*type=\([^&]*\).*|\1|p')
            FLOW=$(echo "$BASE" | sed -n 's|.*flow=\([^&]*\).*|\1|p')
            SNI=$(echo "$BASE" | sed -n 's|.*sni=\([^&]*\).*|\1|p')
            PBK=$(echo "$BASE" | sed -n 's|.*pbk=\([^&]*\).*|\1|p')
            SID=$(echo "$BASE" | sed -n 's|.*sid=\([^&]*\).*|\1|p')

            [ -z "$TYPE" ] && TYPE="tcp"
            [ -z "$NAME" ] && NAME="${HOST}:${PORT}"

            echo "  - name: \"$NAME\"" >> "$OUTPUT"
            echo "    type: vless" >> "$OUTPUT"
            echo "    server: $HOST" >> "$OUTPUT"
            echo "    port: $PORT" >> "$OUTPUT"
            echo "    uuid: \"$UUID\"" >> "$OUTPUT"
            echo "    network: \"$TYPE\"" >> "$OUTPUT"
            echo "    flow: \"$FLOW\"" >> "$OUTPUT"
            echo "    servername: \"$SNI\"" >> "$OUTPUT"
            echo "    client-fingerprint: chrome" >> "$OUTPUT"
            echo "    encryption: \"none\"" >> "$OUTPUT"
            echo "    tls: true" >> "$OUTPUT"
            echo "    udp: true" >> "$OUTPUT"
            echo "    reality-opts:" >> "$OUTPUT"
            echo "      public-key: \"$PBK\"" >> "$OUTPUT"
            [ -n "$SID" ] && echo "      short-id: \"$SID\"" >> "$OUTPUT"
          done < "$INPUT"

          echo "" >> "$OUTPUT"
          echo "proxy-groups:" >> "$OUTPUT"
          echo "  - name: auto" >> "$OUTPUT"
          echo "    type: select" >> "$OUTPUT"
          echo "    proxies:" >> "$OUTPUT"

          while read -r line; do
            FRAG="${line#*#}"
            NAME=$(url_decode "$FRAG")
            [ -z "$NAME" ] && continue
            echo "      - \"$NAME\"" >> "$OUTPUT"
          done < "$INPUT"

          echo "" >> "$OUTPUT"
          echo "rules:" >> "$OUTPUT"
          echo "  - MATCH,auto" >> "$OUTPUT"

      - name: Commit and push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/
          git diff --cached --quiet || git commit -m "Fix Mihomo config to constructor-compatible format"
          git pull --rebase https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} main || true
          git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} HEAD:main

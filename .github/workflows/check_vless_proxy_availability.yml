name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: proxy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install geoip2 requests --quiet

      - name: Download Xray with retry
        run: |
          for i in {1..3}; do
            XRAY_VER=$(curl -s --retry 3 https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name) && \
            curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip" && \
            unzip -o xray.zip xray geoip.dat geosite.dat && \
            chmod +x xray && ls -la xray && break
            echo "Retry $i/3 failed, waiting..."
            sleep 3
          done || { echo "❌ Xray download failed"; exit 1; }

      - name: Download GeoLite2 databases
        run: |
          echo "📥 Downloading GeoLite2 databases..."
          curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
          curl -L -o GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb
          curl -L -o GeoLite2-ASN.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
          ls -la GeoLite2-*.mmdb
          echo "✅ GeoLite2 databases ready"

      - name: Copy local GeoLite2 (fallback)
        run: |
          cp geolite2/GeoLite2-*.mmdb ./ 2>/dev/null || echo "No local GeoLite2 found"

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt
          test -f githubmirror/26_ru_whitelist.txt || \
            echo "vless://uuid@1.1.1.1:443?security=reality&pbk=ABC...&sid=123&sni=www.google.com#test" > githubmirror/26_ru_whitelist.txt

      - name: Kill old Xray processes
        run: pkill xray || true

      - name: Check VLESS via Xray
        run: |
          cat > proxy_checker.py << 'PYEOF'
import subprocess
import time
import json
import urllib.parse
import os
import socket
import ipaddress
import base64
import re
from concurrent.futures import ThreadPoolExecutor, as_completed
from threading import Lock
from datetime import datetime, timezone

try:
    import geoip2.database
    GEOIP_AVAILABLE = True
except ImportError:
    GEOIP_AVAILABLE = False

XRAY_PATH = "./xray"
INPUT = 'githubmirror/26_ru_whitelist.txt'
OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
OUTPUT_B64 = 'githubmirror/26_proxy_subscription_base64.txt'

IP_TEST_URLS = ['https://api.ipify.org', 'https://ifconfig.me/ip', 'https://ipapi.co/ip']
MAX_WORKERS = 12

FLAGS = {
    'DE': '🇩🇪DE', 'NL': '🇳🇱NL', 'US': '🇺🇸US', 'SG': '🇸🇬SG', 'GB': '🇬🇧GB', 'CA': '🇨🇦CA', 
    'FR': '🇫🇷FR', 'CH': '🇨🇭CH', 'SE': '🇸🇪SE', 'FI': '🇫🇮FI', 'NO': '🇳🇴NO', 'IE': '🇮🇪IE',
    'AU': '🇦🇺AU', 'JP': '🇯🇵JP', 'KR': '🇰🇷KR', 'HK': '🇭🇰HK', 'TW': '🇹🇼TW'
}

print("🔄 Initializing proxy checker with 3x GeoLite2...")

country_reader = city_reader = asn_reader = None
if GEOIP_AVAILABLE:
    try:
        country_reader = geoip2.database.Reader('GeoLite2-Country.mmdb')
        city_reader = geoip2.database.Reader('GeoLite2-City.mmdb')
        asn_reader = geoip2.database.Reader('GeoLite2-ASN.mmdb')
        print("✅ All 3 GeoLite2 databases loaded")
    except Exception as e:
        print(f"⚠️ GeoLite2 partial load: {e}")

lock = Lock()
counter = [0]

def next_id():
    with lock:
        counter[0] += 1
        return counter[0]

def is_ip_address(host):
    if not host or not isinstance(host, str):
        return False
    pattern = r'^(?:(?:25[0-5]|2[4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[4][0-9]|[01]?[0-9][0-9]?)$'
    return bool(re.match(pattern, host))

def resolve_hostname_to_ip(hostname):
    try:
        return socket.gethostbyname(hostname)
    except:
        return hostname

def get_server_country(hostname_or_ip):
    try:
        if is_ip_address(hostname_or_ip):
            ip = hostname_or_ip
        else:
            ip = resolve_hostname_to_ip(hostname_or_ip)
        return get_country_from_ip(ip)
    except:
        return '🌍??'

def get_country_from_ip(ip):
    if not is_ip_address(ip):
        return '🌍??'
    
    try:
        if country_reader:
            resp = country_reader.country(ip)
            if resp.country.iso_code:
                return FLAGS.get(resp.country.iso_code, f'🌍{resp.country.iso_code}')
    except:
        pass
    
    try:
        if city_reader:
            resp = city_reader.city(ip)
            if resp.country.iso_code:
                return FLAGS.get(resp.country.iso_code, f'🌍{resp.country.iso_code}')
    except:
        pass
    
    try:
        if asn_reader:
            resp = asn_reader.asn(ip)
            if resp.country.iso_code:
                return FLAGS.get(resp.country.iso_code, f'🌍{resp.country.iso_code}')
            elif resp.autonomous_system_organization:
                org = resp.autonomous_system_organization.lower()
                if any(x in org for x in ['netherlands', 'nederland']):
                    return '🇳🇱NL'
                elif any(x in org for x in ['germany', 'deutsche']):
                    return '🇩🇪DE'
    except:
        pass
    
    return '🌍??'

def valid_ip(ip):
    try:
        ipaddress.ip_address(ip.strip())
        return True
    except:
        return False

def is_ipv6(ip):
    try:
        return ipaddress.ip_address(ip.strip()).version == 6
    except:
        return False

def get_exit_ip(port):
    for url in IP_TEST_URLS:
        try:
            cmd = ['curl', '-s', '--max-time', '10', '-x', f'socks5h://127.0.0.1:{port}', url]
            ip = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=12).strip()
            if valid_ip(ip) and not is_ipv6(ip):
                return ip
        except:
            continue
    return None

def test_proxy(port):
    try:
        cmd = ['curl', '-s', '--max-time', '8', '-x', f'socks5h://127.0.0.1:{port}', 
               '-o', '/dev/null', '-w', '%{http_code}', 'https://www.cloudflare.com']
        code = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=10).strip()
        if code not in ['200', '301', '302']:
            return False, None
    except:
        return False, None
    
    exit_ip = get_exit_ip(port)
    if not exit_ip:
        return False, None
    
    country = get_country_from_ip(exit_ip)
    if country.startswith('🇷🇺'):
        return False, None
    
    return True, exit_ip

def get_free_port():
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(('', 0))
    port = s.getsockname()[1]
    s.close()
    return port

def wait_port(port, timeout=15):
    start = time.time()
    while time.time() - start < timeout:
        try:
            sock = socket.create_connection(("127.0.0.1", port), timeout=1)
            sock.close()
            return True
        except:
            time.sleep(0.2)
    return False

def validate_reality_params(pbk, sid):
    if not pbk or len(pbk) < 40:
        return False
    if not sid or len(sid) > 16:
        return False
    return True

def check_one(link):
    cfg_file = None
    p = None
    try:
        u = urllib.parse.urlparse(link)
        if u.scheme != 'vless':
            return None

        q = urllib.parse.parse_qs(u.query)
        pbk = q.get('pbk', [''])[0]
        sid = q.get('sid', [''])[0]
        
        if not validate_reality_params(pbk, sid):
            return None

        sni = q.get('sni', ['www.google.com'])[0]
        fp = q.get('fp', ['chrome'])[0]
        port_num = int(u.port or 443)

        if not (1 <= port_num <= 65535):
            return None

        socks_port = get_free_port()
        cfg = {
            "inbounds": [{
                "listen": "127.0.0.1",
                "port": socks_port,
                "protocol": "socks",
                "settings": {"udp": False}
            }],
            "outbounds": [{
                "protocol": "vless",
                "settings": {
                    "vnext": [{
                        "address": u.hostname,
                        "port": port_num,
                        "users": [{"id": u.username, "encryption": "none"}]
                    }]
                },
                "streamSettings": {
                    "network": "tcp",
                    "security": "reality",
                    "realitySettings": {
                        "dest": "www.google.com:443",
                        "serverNames": [sni],
                        "shortIds": [sid],
                        "fingerprint": fp,
                        "publicKey": pbk
                    }
                }
            }]
        }

        cfg_file = f'cfg_{socks_port}.json'
        with open(cfg_file, 'w') as f:
            json.dump(cfg, f)

        p = subprocess.Popen([XRAY_PATH, 'run', '-c', cfg_file],
                           stdout=subprocess.DEVNULL,
                           stderr=subprocess.DEVNULL)

        if not wait_port(socks_port):
            return None

        time.sleep(2)
        success, exit_ip = test_proxy(socks_port)
        
        if success and exit_ip:
            server_country = get_server_country(u.hostname)
            exit_country = get_country_from_ip(exit_ip)
            proxy_number = next_id()
            name = f"{server_country}→{proxy_number}→{exit_country} SNI: {sni}"
            
            clean_link = link.split('#')[0]
            return f"{clean_link}#{name}"

        return None

    except Exception:
        return None
    
    finally:
        if p:
            try:
                p.terminate()
                p.wait(timeout=3)
            except:
                p.kill()
        if cfg_file and os.path.exists(cfg_file):
            os.unlink(cfg_file)

print("📂 Reading input...")
if not os.path.exists(INPUT):
    print("❌ No input file")
    exit(1)

with open(INPUT) as f:
    links = [line.strip() for line in f if line.strip().startswith('vless://')]

print(f"🚀 Testing {len(links)} proxies | {MAX_WORKERS} workers | 3x GeoLite2: {'✅' if country_reader else '❌'}")

alive = []
with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
    futures = [executor.submit(check_one, link) for link in links]
    for future in as_completed(futures):
        result = future.result()
        if result:
            alive.append(result)
            print(f"✅ Working proxy #{len(alive)}")

print(f"✅ Found {len(alive)} NON-RU proxies")

timestamp = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
with open(OUTPUT_RAW, 'w') as f:
    f.write(f"# Updated: {timestamp}\n")
    if alive:
        f.write('\n'.join(alive) + '\n')

if alive:
    b64_content = '\n'.join(alive)
    b64 = base64.b64encode(b64_content.encode()).decode()
    with open(OUTPUT_B64, 'w') as f:
        f.write(b64)

if country_reader:
    country_reader.close()
if city_reader:
    city_reader.close()
if asn_reader:
    asn_reader.close()

os.system("pkill xray || true")
PYEOF
          python3 proxy_checker.py

      - name: Commit results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          for i in {1..3}; do
            if git pull --rebase 2>/dev/null; then break; fi
            echo "Pull retry $i/3..."
            sleep 2
          done
          
          git add githubmirror/*.txt || true
          if git diff --staged --quiet; then echo "ℹ️ No changes"; exit 0; fi
          
          git commit -m "Update VLESS proxies [$(date -u +'%Y-%m-%d %H:%M UTC')] (${{ github.run_number }})"
          
          for i in {1..3}; do
            if git push 2>/dev/null; then echo "✅ Pushed"; exit 0; fi
            echo "Push retry $i/3..."
            sleep 3
          done
          echo "❌ Push failed"; exit 1

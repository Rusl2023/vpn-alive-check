name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip
          pip install geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray and build raw subscription
        run: |
          python3 <<'EOF'
          import subprocess
          import time
          import json
          import urllib.parse
          import os
          import geoip2.database

          INPUT_FILE = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_FILE = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')

          # Используем локальные файлы GeoLite2 из репозитория
          reader = geoip2.database.Reader('geolite2/GeoLite2-Country.mmdb')

          FLAGS = {
              'RU':'🇷🇺','KZ':'🇰🇿','PL':'🇵🇱','HU':'🇭🇺',
              'US':'🇺🇸','NL':'🇳🇱','DE':'🇩🇪','FR':'🇫🇷'
          }

          def get_country_flag(ip_or_hostname):
              try:
                  # ip_or_hostname может быть hostname или IP
                  import socket
                  ip = socket.gethostbyname(ip_or_hostname)
                  response = reader.country(ip)
                  return FLAGS.get(response.country.iso_code, '🏳️')
              except:
                  return '🏳️'

          TEST_URLS = [
              'https://api.ipify.org',
              'http://cp.cloudflare.com',
              'https://www.instagram.com/'
          ]

          def exit_ip():
              for url in TEST_URLS:
                  try:
                      out = subprocess.check_output(
                          ['curl','-s','--max-time','8','--socks5-hostname','127.0.0.1:1080',url],
                          text=True
                      ).strip()
                      if out:
                          return out
                  except:
                      pass
              return None

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(0)

          with open(INPUT_FILE) as f:
              links = [l.strip() for l in f if l.startswith('vless://')]

          ok = 0

          for link in links:
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              sni = q.get('sni',[''])[0]
              stream = {'network': q.get('type',['tcp'])[0]}

              if q.get('security',[''])[0]=='reality' and 'pbk' in q:
                  stream['security'] = 'reality'
                  stream['realitySettings'] = {
                      'serverName': sni,
                      'publicKey': q['pbk'][0],
                      'shortId': q.get('sid',[''])[0],
                      'fingerprint': 'chrome'
                  }

              cfg = {
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": 1080,
                      "protocol": "socks",
                      "settings": {"udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": u.hostname,
                              "port": u.port or 443,
                              "users": [{
                                  "id": u.username,
                                  "encryption": "none",
                                  "flow": q.get('flow',[''])[0]
                              }]
                          }]
                      },
                      "streamSettings": stream
                  }]
              }

              with open("cfg.json","w") as f:
                  json.dump(cfg,f)

              p = subprocess.Popen(
                  ['./xray','-c','cfg.json'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              time.sleep(4)
              ip_out = exit_ip()
              p.terminate()
              time.sleep(1)

              if not ip_out or ip_out==RUNNER_IP:
                  continue

              in_flag = get_country_flag(u.hostname)
              out_flag = get_country_flag(ip_out)

              final_name = f"in {in_flag} RusL exit {out_flag} {sni}"
              final_link = link.split('#')[0] + '#' + final_name

              with open(OUTPUT_FILE,'a') as f:
                  f.write(final_link + '\n')

              ok +=1

          reader.close()
          print(f"OK proxies: {ok}")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git commit -m "Auto update VLESS subscription ($(date -u))" || exit 0
          git pull --rebase origin main || true
          git push

name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -la xray

      - name: Copy GeoLite2 databases from repo
        run: |
          cp geolite2/GeoLite2-*.mmdb ./
          ls -la GeoLite2-*.mmdb || echo "No GeoLite2 databases found"
          echo "✅ Using local GeoLite2 databases"

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Check VLESS via Xray
        run: |
          python3 << 'EOF'
          import subprocess, time, json, urllib.parse, os, socket, ipaddress, base64
          import geoip2.database
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          from datetime import datetime, timezone

          XRAY_PATH = os.path.join(os.getcwd(), "xray")
          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          OUTPUT_B64 = 'githubmirror/26_proxy_subscription_base64.txt'

          COUNTRY_DB = 'GeoLite2-Country.mmdb'
          CITY_DB = 'GeoLite2-City.mmdb'
          ASN_DB = 'GeoLite2-ASN.mmdb'

          IP_TEST_URLS = [
              'https://api.ipify.org',
              'https://ifconfig.me/ip',
              'https://ipapi.co/ip'
          ]

          HTTP_TEST_URL = 'http://example.com'
          HTTPS_TEST_URL = 'https://www.cloudflare.com/cdn-cgi/trace'
          MAX_WORKERS = 6

          FLAGS = {
              'DE':'🇩🇪DE','NL':'🇳🇱NL','US':'🇺🇸US','SG':'🇸🇬SG','GB':'🇬🇧GB',
              'FR':'🇫🇷FR','PL':'🇵🇱PL','SE':'🇸🇪SE','FI':'🇫🇮FI','NO':'🇳🇴NO',
              'CA':'🇨🇦CA','JP':'🇯🇵JP','KR':'🇰🇷KR','CH':'🇨🇭CH','IE':'🇮🇪IE'
          }

          print("Loading GeoLite2 databases...")
          try:
              country_reader = geoip2.database.Reader(COUNTRY_DB)
              city_reader = geoip2.database.Reader(CITY_DB)
              asn_reader = geoip2.database.Reader(ASN_DB)
              print("✅ GeoLite2 databases loaded")
          except Exception as e:
              print(f"❌ GeoLite2 error: {e}")
              exit(1)

          lock = Lock()
          counter = 0

          def next_id():
              global counter
              with lock:
                  counter += 1
                  return counter

          def valid_ip(x):
              try:
                  ipaddress.ip_address(x.strip())
                  return True
              except:
                  return False

          def resolve(host):
              try:
                  info = socket.getaddrinfo(host, None, 0, 0, socket.SOL_TCP)
                  for i in info:
                      ip = i[4][0]
                      if valid_ip(ip):
                          return ip
                  return host
              except:
                  return host

          def get_raw_iso_country(ip):
              """🔥 МАКСИМАЛЬНАЯ ТОЧНОСТЬ: сырой ISO код из GeoLite2"""
              ip = ip.strip()
              if not valid_ip(ip):
                  return None
              
              try:
                  r = country_reader.country(ip)
                  iso_code = r.country.iso_code
                  if iso_code:
                      return iso_code
              except: pass
              
              try:
                  r = city_reader.city(ip)
                  iso_code = r.country.iso_code
                  if iso_code:
                      return iso_code
              except: pass
              
              return None

          def country_from_ip(ip):
              raw_iso = get_raw_iso_country(ip)
              if not raw_iso:
                  return '🌍??'
              return FLAGS.get(raw_iso, f'🌍{raw_iso}')

          def is_russian_exit(exit_ip):
              """🚫 100% ТОЧНЫЙ ФИЛЬТР ПО ISO КОДУ 'RU'"""
              raw_iso = get_raw_iso_country(exit_ip)
              return raw_iso == 'RU'

          def get_free_port():
              s = socket.socket()
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port

          def wait_port(port, timeout=15):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy_robust(port):
              exit_ip = None
              for i, url in enumerate(IP_TEST_URLS, 1):
                  try:
                      ip = subprocess.check_output([
                          'curl', '-s', '--max-time', '6', 
                          '-x', f'socks5h://127.0.0.1:{port}', url
                      ], text=True, stderr=subprocess.DEVNULL, timeout=8).strip()
                      if valid_ip(ip) and len(ip) >= 7:
                          exit_ip = ip
                          print(f"🌐 IP [{i}]: {ip}")
                          break
                  except:
                      continue
              
              if not exit_ip:
                  return False, None

              try:
                  http_code = subprocess.check_output([
                      'curl', '-s', '--max-time', '6', '-x', f'socks5h://127.0.0.1:{port}',
                      '-o', '/dev/null', '-w', '%{http_code}', HTTP_TEST_URL
                  ], text=True, stderr=subprocess.DEVNULL, timeout=8).strip()
                  if http_code != '200':
                      return False, None
              except:
                  return False, None

              try:
                  https_code = subprocess.check_output([
                      'curl', '-s', '--max-time', '6', '-x', f'socks5h://127.0.0.1:{port}',
                      '-o', '/dev/null', '-w', '%{http_code}', HTTPS_TEST_URL
                  ], text=True, stderr=subprocess.DEVNULL, timeout=8).strip()
                  if https_code not in ['200', '403']:
                      return False, None
              except:
                  return False, None

              return True, exit_ip

          def check_one(link):
              try:
                  port = get_free_port()
                  u = urllib.parse.urlparse(link)
                  if u.scheme != 'vless':
                      return None
                      
                  q = urllib.parse.parse_qs(u.query)

                  sni = q.get('sni', ['unknown'])[0]
                  fp = q.get('fp', ['chrome'])[0]
                  
                  server_ip = resolve(u.hostname)
                  server_country = country_from_ip(server_ip)

                  # ✅ ИСПРАВЛЕНО: ПРЯМАЯ поддержка XHTTP без замены
                  network = q.get('type', ['tcp'])[0]
                  
                  sec = q.get('security', ['none'])[0]

                  stream = {'network': network}
                  if sec == 'reality' and 'pbk' in q:
                      stream.update({
                          'security': 'reality',
                          'realitySettings': {
                              'serverName': sni,
                              'publicKey': q['pbk'][0],
                              'shortId': q.get('sid', [''])[0],
                              'fingerprint': fp
                          }
                      })
                  elif sec == 'tls':
                      stream.update({
                          'security': 'tls',
                          'tlsSettings': {
                              'serverName': sni,
                              'allowInsecure': True,
                              'fingerprint': fp
                          }
                      })

                  user = {'id': u.username, 'encryption': 'none'}
                  flow = q.get('flow', [''])[0]
                  if flow:
                      user['flow'] = flow

                  cfg = {
                      'inbounds': [{
                          'listen': '127.0.0.1',
                          'port': port,
                          'protocol': 'socks',
                          'settings': {'udp': False}
                      }],
                      'outbounds': [{
                          'protocol': 'vless',
                          'settings': {
                              'vnext': [{
                                  'address': u.hostname,
                                  'port': int(u.port or 443),
                                  'users': [user]
                              }]
                          },
                          'streamSettings': stream
                      }]
                  }

                  cfg_file = f'cfg_{port}.json'
                  with open(cfg_file, 'w') as f:
                      json.dump(cfg, f)

                  p = subprocess.Popen([XRAY_PATH, 'run', '-c', cfg_file],
                                     stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL)

                  if not wait_port(port):
                      try:
                          p.terminate()
                          p.wait(timeout=2)
                      except:
                          p.kill()
                      try:
                          os.remove(cfg_file)
                      except: pass
                      return None

                  ok, exit_ip = test_proxy_robust(port)
                  
                  try:
                      p.terminate()
                      p.wait(timeout=2)
                  except:
                      p.kill()
                  p.wait(timeout=1)

                  try:
                      os.remove(cfg_file)
                  except: pass

                  if not ok:
                      return None

                  if is_russian_exit(exit_ip):
                      print(f"🚫 RU BLOCKED: {exit_ip}")
                      return None

                  exit_country = country_from_ip(exit_ip)
                  num = next_id()
                  name = f"{server_country}→{num}→{exit_country} SNI: {sni}"

                  if '#' in link:
                      link = link.split('#')[0]
                  return link + '#' + name

              except Exception as e:
                  print(f"Error checking proxy: {e}")
                  return None

          print(f"Processing {INPUT}...")
          if not os.path.exists(INPUT):
              print("❌ INPUT file not found")
              exit(0)

          with open(INPUT) as f:
              links = [x.strip() for x in f if x.strip().startswith('vless://')]

          if not links:
              print("❌ No VLESS links found")
              exit(0)

          print(f"TOTAL: {len(links)} | workers={MAX_WORKERS}")

          alive = []
          try:
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                  futures = [ex.submit(check_one, l) for l in links]
                  for future in as_completed(futures):
                      result = future.result()
                      if result:
                          alive.append(result)
          except KeyboardInterrupt:
              print("Interrupted")

          print(f"DONE. Alive NON-RU: {len(alive)}")

          with open(OUTPUT_RAW, 'w') as f:
              f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")
              if alive:
                  f.write('\n'.join(alive) + '\n')

          if alive:
              b64_content = '\n'.join(alive)
              b64 = base64.b64encode(b64_content.encode()).decode()
              with open(OUTPUT_B64, 'w') as f:
                  f.write(b64)
              print(f"✅ Saved {len(alive)} NON-RU proxies")
          else:
              print("❌ No working NON-RU proxies")

          country_reader.close()
          city_reader.close()
          asn_reader.close()
          EOF

      - name: Commit & push results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add githubmirror/*.txt || true
          if git diff --staged --quiet; then
            echo "❌ No changes to commit"
          else
            git commit -m "Update NON-RU proxy subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "✅ Pushed NON-RU updates"
          fi

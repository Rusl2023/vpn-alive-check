name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vless-subscription-update
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray (BYPASS ONLY MODE with XHTTP/GHTTP support)
        run: |
          python3 <<'EOF'
          import subprocess
          import time
          import json
          import urllib.parse
          import os
          import threading
          import socket
          import random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from collections import defaultdict

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')
          
          # Список сайтов для проверки обхода блокировок (заблокированные в РФ)
          BLOCKED_SITES = [
              'https://www.instagram.com/',
              'https://www.facebook.com/',
              'https://twitter.com/',
              'https://www.youtube.com/',
              'https://t.me/',
              'https://www.google.com/search?q=test'
          ]
          
          CONTROL_SITE = 'https://api.ipify.org?format=text'
          
          XRAY = './xray'
          MAX_WORKERS = 8
          MIN_BYPASS_SCORE = 2
          
          active_processes = []
          lock = threading.Lock()
          country_cache = {}
          transport_stats = defaultdict(int)  # Статистика по типам транспорта
          
          def cleanup():
              with lock:
                  for p in active_processes:
                      try:
                          p.terminate()
                          p.wait(timeout=1)
                      except:
                          try:
                              p.kill()
                          except:
                              pass
                  active_processes.clear()
          
          def get_free_port():
              s = socket.socket()
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port
          
          def wait_port(host, port, timeout=10):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection((host, port), timeout=1):
                          return True
                  except:
                      time.sleep(0.3)
              return False
          
          def test_url_through_proxy(port, url):
              """Проверяет доступность URL через прокси"""
              try:
                  result = subprocess.run(
                      ['curl', '-s', '--max-time', '5', 
                       '-x', f'socks5h://127.0.0.1:{port}', 
                       '-o', '/dev/null', 
                       '-w', '%{http_code}',
                       url],
                      text=True, stderr=subprocess.DEVNULL,
                      timeout=7
                  )
                  
                  code = result.stdout.strip()
                  if code in ['200', '301', '302', '307', '308']:
                      return True
                  return bool(code)
              except:
                  return False
          
          def check_bypass_capability(port):
              """
              Проверяет, может ли прокси обходить блокировки.
              Возвращает True, если прокси открывает заблокированные сайты.
              """
              control_ok = test_url_through_proxy(port, CONTROL_SITE)
              if not control_ok:
                  return False
              
              test_sites = random.sample(BLOCKED_SITES, min(3, len(BLOCKED_SITES)))
              success_count = 0
              for site in test_sites:
                  if test_url_through_proxy(port, site):
                      success_count += 1
                  time.sleep(0.2)
              
              return success_count >= MIN_BYPASS_SCORE
          
          def country(ip):
              if ip in country_cache:
                  return country_cache[ip]
              try:
                  result = subprocess.run(
                      ['curl', '-s', '--max-time', '2', 
                       f'http://ip-api.com/json/{ip}?fields=countryCode'],
                      capture_output=True, text=True
                  )
                  data = json.loads(result.stdout)
                  cc = data.get('countryCode', 'Unknown')
                  country_cache[ip] = cc
                  return cc
              except:
                  return 'Unknown'
          
          def is_good_ip(ip):
              if not ip:
                  return False
              if ip == RUNNER_IP:
                  return False
              return True
          
          def parse_vless_params(link):
              """Парсит VLESS ссылку и возвращает все параметры"""
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)
              
              params = {
                  'host': u.hostname,
                  'port': u.port or 443,
                  'id': u.username,
                  'network': q.get('type', ['tcp'])[0].lower(),
                  'security': q.get('security', ['none'])[0].lower(),
                  'sni': q.get('sni', [''])[0],
                  'fp': q.get('fp', ['chrome'])[0],
                  'pbk': q.get('pbk', [''])[0] if 'pbk' in q else None,
                  'sid': q.get('sid', [''])[0] if 'sid' in q else '',
                  'flow': q.get('flow', [''])[0],
                  'path': q.get('path', ['/'])[0],
                  'mode': q.get('mode', ['auto'])[0],
                  'host_header': q.get('host', [''])[0],
                  'service_name': q.get('serviceName', [''])[0],
                  'alpn': q.get('alpn', [''])[0],
                  'allow_insecure': q.get('allowInsecure', ['0'])[0] == '1',
                  'extra': q.get('extra', [''])[0]
              }
              return params
          
          def create_xray_config(port, params):
              """Создает конфиг Xray с поддержкой всех транспортов"""
              
              # Определяем транспорт
              network = params['network']
              
              # Нормализуем название транспорта для статистики
              transport_display = network
              if network in ['xhttp', 'ghttp']:
                  transport_display = 'xhttp/ghttp'
              
              stream = {}
              
              # XHTTP и GHTTP - оба обрабатываем как xhttp
              if network in ['xhttp', 'ghttp']:
                  stream['network'] = 'xhttp'
                  stream['xhttpSettings'] = {
                      'path': params['path'],
                      'mode': params['mode']
                  }
                  if params['host_header']:
                      stream['xhttpSettings']['host'] = params['host_header']
                  if params['extra']:
                      try:
                          stream['xhttpSettings']['extra'] = json.loads(params['extra'])
                      except:
                          pass
              
              # Обычный HTTP
              elif network == 'http':
                  stream['network'] = 'http'
                  stream['httpSettings'] = {
                      'path': params['path']
                  }
                  if params['host_header']:
                      stream['httpSettings']['host'] = [params['host_header']]
              
              # WebSocket
              elif network == 'ws':
                  stream['network'] = 'ws'
                  stream['wsSettings'] = {
                      'path': params['path']
                  }
                  if params['host_header']:
                      stream['wsSettings']['headers'] = {'Host': params['host_header']}
              
              # gRPC
              elif network == 'grpc':
                  stream['network'] = 'grpc'
                  stream['grpcSettings'] = {
                      'serviceName': params['service_name'] or params['path']
                  }
              
              # TCP (по умолчанию)
              else:
                  stream['network'] = 'tcp'
                  if params['path'] and params['path'] != '/':
                      stream['tcpSettings'] = {
                          'header': {
                              'type': 'http',
                              'request': {'path': [params['path']]}
                          }
                      }
              
              # Настройки безопасности
              if params['security'] == 'reality' and params['pbk']:
                  stream['security'] = 'reality'
                  stream['realitySettings'] = {
                      'serverName': params['sni'],
                      'publicKey': params['pbk'],
                      'shortId': params['sid'],
                      'fingerprint': params['fp']
                  }
              elif params['security'] == 'tls':
                  stream['security'] = 'tls'
                  stream['tlsSettings'] = {
                      'serverName': params['sni'],
                      'allowInsecure': params['allow_insecure'],
                      'fingerprint': params['fp']
                  }
                  if params['alpn']:
                      stream['tlsSettings']['alpn'] = params['alpn'].split(',')
              
              # Пользователь
              user = {'id': params['id'], 'encryption': 'none'}
              if params['flow']:
                  user['flow'] = params['flow']
              
              return {
                  'inbounds': [{
                      'listen': '127.0.0.1',
                      'port': port,
                      'protocol': 'socks',
                      'settings': {'udp': False}
                  }],
                  'outbounds': [{
                      'protocol': 'vless',
                      'settings': {
                          'vnext': [{
                              'address': params['host'],
                              'port': params['port'],
                              'users': [user]
                          }]
                      },
                      'streamSettings': stream
                  }]
              }, transport_display
          
          def check_one(link):
              process = None
              cfg_file = None
              transport_type = 'unknown'
              
              try:
                  params = parse_vless_params(link)
                  transport_type = params['network']
                  
                  # Для статистики нормализуем xhttp/ghttp
                  stats_transport = transport_type
                  if transport_type in ['xhttp', 'ghttp']:
                      stats_transport = 'xhttp/ghttp'
                  
                  port = get_free_port()
                  
                  # Создаем конфиг с поддержкой всех транспортов
                  cfg, display_transport = create_xray_config(port, params)
                  
                  cfg_file = f'cfg_{port}.json'
                  with open(cfg_file, 'w') as f:
                      json.dump(cfg, f)
                  
                  process = subprocess.Popen(
                      [XRAY, 'run', '-c', cfg_file],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
                  
                  with lock:
                      active_processes.append(process)
                  
                  time.sleep(1.5)
                  
                  # Получаем выходной IP
                  ip = None
                  try:
                      ip = subprocess.check_output(
                          ['curl', '-s', '--max-time', '4', 
                           '-x', f'socks5h://127.0.0.1:{port}', 
                           CONTROL_SITE],
                          text=True, stderr=subprocess.DEVNULL
                      ).strip()
                  except:
                      pass
                  
                  if ip and is_good_ip(ip):
                      country_code = country(ip)
                      
                      # Проверяем способность обходить блокировки
                      print(f"🔄 Testing [{display_transport}] {params['host']}:{params['port']}...")
                      bypass_ok = check_bypass_capability(port)
                      
                      if bypass_ok:
                          transport_stats[stats_transport] += 1
                          print(f"✅ BYPASS OK [{display_transport}] {params['host']}:{params['port']} {ip} → {country_code}")
                          return link
                      else:
                          print(f"❌ NO BYPASS [{display_transport}] {params['host']}:{params['port']} {ip} → {country_code}")
                  else:
                      print(f"✗ [{display_transport}] {params['host']}:{params['port']} no IP")
                  
              except Exception as e:
                  print(f"✗ [{transport_type}] {link[:50]}... error: {str(e)[:50]}")
              finally:
                  if process:
                      try:
                          process.terminate()
                          process.wait(timeout=0.5)
                      except:
                          try:
                              process.kill()
                          except:
                              pass
                  with lock:
                      if process and process in active_processes:
                          try:
                              active_processes.remove(process)
                          except:
                              pass
                  if cfg_file and os.path.exists(cfg_file):
                      try:
                          os.remove(cfg_file)
                      except:
                          pass
              return None
          
          if not os.path.exists(INPUT):
              print(f"Input file {INPUT} not found")
              raise SystemExit(0)
          
          with open(INPUT, 'r') as f:
              links = [l.strip() for l in f if l.strip().startswith('vless://')]
          
          total_links = len(links)
          print(f"\n{'='*60}")
          print(f"🚀 BYPASS MODE ACTIVATED (with XHTTP/GHTTP support)")
          print(f"📊 TOTAL: {total_links} | workers={MAX_WORKERS}")
          print(f"🔒 Testing access to blocked sites: {len(BLOCKED_SITES)} URLs")
          print(f"🎯 Requirement: at least {MIN_BYPASS_SCORE}/3 blocked sites accessible")
          print(f"{'='*60}\n")
          
          # Write header
          with open(OUTPUT_RAW, 'w') as f:
              f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")
              f.write(f"# BYPASS-READY PROXIES (XHTTP/GHTTP supported)\n")
          
          alive = []
          start_time = time.time()
          processed = 0
          
          try:
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                  futures = [ex.submit(check_one, link) for link in links]
                  for future in as_completed(futures):
                      processed += 1
                      try:
                          result = future.result(timeout=25)
                          if result:
                              alive.append(result)
                      except Exception as e:
                          print(f"Future error: {e}")
                      
                      if processed % 10 == 0:
                          elapsed = time.time() - start_time
                          print(f"📈 Progress: {processed}/{total_links} ({processed/total_links*100:.0f}%) in {elapsed:.0f}s | BYPASS OK: {len(alive)}")
                      
                      if time.time() - start_time > 900:
                          print("⏰ MAX TOTAL TIME reached")
                          break
                          
          finally:
              cleanup()
          
          print(f"\n{'='*60}")
          print(f"✅ SCAN COMPLETE")
          print(f"   • Total tested: {total_links}")
          print(f"   • Working proxies: {processed}")
          print(f"   • BYPASS-READY: {len(alive)}")
          
          if transport_stats:
              print(f"\n📊 STATS BY TRANSPORT TYPE:")
              for t, count in sorted(transport_stats.items(), key=lambda x: x[1], reverse=True):
                  print(f"   • {t}: {count}")
          
          print(f"{'='*60}")
          
          if alive:
              with open(OUTPUT_RAW, 'a') as f:
                  f.write('\n'.join(alive) + '\n')
              print(f"💾 Saved {len(alive)} bypass-capable proxies to file")
          else:
              print("⚠️ No bypass-capable proxies found")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Debug output
        run: |
          echo "📊 BYPASS-READY PROXIES SUMMARY:"
          TOTAL_LINES=$(wc -l < githubmirror/26_proxy_subscription_raw.txt)
          echo "   • Raw file lines: $TOTAL_LINES"
          if [ $TOTAL_LINES -gt 2 ]; then
            COUNT=$((TOTAL_LINES - 2))
            echo "   • Active proxies: $COUNT"
          else
            echo "   • Active proxies: 0"
          fi
          echo "   • Base64 size: $(wc -c < githubmirror/26_proxy_subscription_base64.txt) bytes"
          echo ""
          echo "📋 First 3 proxies:"
          head -3 githubmirror/26_proxy_subscription_raw.txt || echo "File empty"

      - name: Commit & push results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git pull --rebase || true
          git add githubmirror/*.txt || true
          if git diff --staged --quiet; then
            echo "❌ No changes to commit"
          else
            TOTAL_LINES=$(wc -l < githubmirror/26_proxy_subscription_raw.txt)
            if [ $TOTAL_LINES -gt 2 ]; then
              COUNT=$((TOTAL_LINES - 2))
              git commit -m "Update BYPASS-READY proxies [$(date -u +'%Y-%m-%d %H:%M UTC')] ($COUNT active)"
            else
              git commit -m "Update BYPASS-READY proxies [$(date -u +'%Y-%m-%d %H:%M UTC')] (none)"
            fi
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || true
            echo "✅ Pushed bypass-capable proxies"
          fi

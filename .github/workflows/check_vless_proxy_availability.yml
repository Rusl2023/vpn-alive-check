name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install requests geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray and build raw subscription
        run: |
          python3 <<'EOF'
          import subprocess, json, urllib.parse, os, time, requests

          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')
          XRAY_BIN = './xray'
          TEST_URLS = [
              'https://api.ipify.org',
              'http://cp.cloudflare.com',
              'https://www.instagram.com/'
          ]

          def exit_ip(max_attempts=10, delay=1):
              proxies = {'http':'socks5h://127.0.0.1:1080','https':'socks5h://127.0.0.1:1080'}
              for _ in range(max_attempts):
                  for url in TEST_URLS:
                      try:
                          r = requests.get(url, proxies=proxies, timeout=5)
                          if r.status_code == 200 and r.text.strip():
                              return r.text.strip()
                      except: pass
                  time.sleep(delay)
              return None

          if not os.path.exists(INPUT):
              raise SystemExit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.startswith('vless://')]

          ok = 0
          for link in links:
              try:
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni', [''])[0]

                  cfg = {
                      'inbounds':[{'listen':'127.0.0.1','port':1080,'protocol':'socks','settings':{'udp':False}}],
                      'outbounds':[{
                          'protocol':'vless',
                          'settings':{'vnext':[{
                              'address': u.hostname,
                              'port': u.port or 443,
                              'users':[{'id': u.username,'encryption':'none','flow': q.get('flow', [''])[0]}]
                          }]},
                          'streamSettings':{
                              'network': q.get('type',['tcp'])[0],
                              'security': q.get('security',['none'])[0],
                              'realitySettings': {
                                  'serverName': sni,
                                  'publicKey': q.get('pbk',[''])[0],
                                  'shortId': q.get('sid',[''])[0],
                                  'fingerprint':'chrome'
                              }
                          }
                      }]
                  }

                  with open('cfg.json','w') as f:
                      json.dump(cfg,f)

                  p = subprocess.Popen([XRAY_BIN,'run','-c','cfg.json'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  ip = exit_ip()
                  p.terminate()
                  time.sleep(0.5)

                  if not ip or ip == RUNNER_IP:
                      continue

                  name = f"exit {ip} {sni}"
                  with open(OUTPUT_RAW, 'a') as f:
                      f.write(link.split('#')[0] + f"#{name}\n")
                  ok += 1
              except:
                  continue

          print(f"OK proxies: {ok}")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Debug output
        run: |
          echo "RAW lines:" && wc -l githubmirror/26_proxy_subscription_raw.txt
          echo "BASE64 size:" && wc -c githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push changes (safe)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git commit -m "Auto update VLESS subscription ($(date -u))" || exit 0
          git pull --rebase origin main
          git push

name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: proxy-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -la xray

      - name: Copy GeoLite2 databases
        run: |
          cp geolite2/GeoLite2-*.mmdb ./ || echo "No GeoLite2 databases found"
          ls -la GeoLite2-*.mmdb || echo "✅ Using bundled GeoLite2"
          echo "✅ GeoLite2 ready"

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Check VLESS via Xray
        run: |
          cat > proxy_checker.py << 'PYEOF'
import subprocess

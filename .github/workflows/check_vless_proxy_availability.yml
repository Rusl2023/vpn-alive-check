name: "Check VPN keys via Xray (v2rayNG/NekoBox/Karing style - FIXED)"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: proxy-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq unzip python3 python3-pip wget
          pip3 install -q requests

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Xray version: $XRAY_VER"
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray
          chmod +x xray
          ./xray version

      - name: Setup and Prepare
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt
          : > debug.log

      - name: Download and Parse subscription
        run: |
          echo "📥 Downloading..."
          curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/HMAO_Surgutcity_01.txt" \
            > subscription.txt
            
          echo "📋 Preview:"
          head -10 subscription.txt
          
          python3 -c "
import re
links = re.findall(r'(vless://[^#\n\s]+)', open('subscription.txt').read())
print(f'Found {len(links)} VLESS')
open('vless_links.txt', 'w').write('\n'.join(links) + '\n')
          "

      - name: Check VLESS via Xray
        run: |
          python3 << 'EOF'
import subprocess
import time
import json
import urllib.parse
import os
import socket
import base64
from concurrent.futures import ThreadPoolExecutor, as_completed
from datetime import datetime, timezone
import re

XRAY_PATH = "./xray"
VLESS_FILE = "vless_links.txt"

def parse_vless(link):
    try:
        clean_link = link.split('#')[0]
        u = urllib.parse.urlparse(clean_link)
        if u.scheme != 'vless': return None
        params = urllib.parse.parse_qs(u.query)
        return {
            'add': u.hostname,
            'port': int(u.port or 443),
            'id': u.username,
            'net': params.get('type', ['tcp'])[0],
            'type': params.get('security', ['none'])[0],
            'sni': params.get('sni', [''])[0],
            'fp': params.get('fp', ['chrome'])[0],
            'pbk': params.get('pbk', [''])[0],
            'sid': params.get('sid', [''])[0],
            'flow': params.get('flow', [''])[0]
        }
    except: return None

def generate_xray_config(config, local_port):
    stream = {'network': config['net'], 'security': 'none'}
    
    if config['type'] == 'tls':
        stream['security'] = 'tls'
        stream['tlsSettings'] = {
            'serverName': config['sni'],
            'fingerprint': config['fp'],
            'allowInsecure': True
        }
    elif config['type'] == 'reality':
        stream['security'] = 'reality'
        stream['realitySettings'] = {
            'serverName': config['sni'],
            'publicKey': config['pbk'],
            'shortId': config['sid'],
            'fingerprint': config['fp']
        }
    
    return {
        "inbounds": [{
            "listen": "127.0.0.1",
            "port": local_port,
            "protocol": "socks",
            "settings": {"auth": "noauth", "udp": False}
        }],
        "outbounds": [{
            "protocol": "vless",
            "settings": {
                "vnext": [{
                    "address": config['add'],
                    "port": config['port'],
                    "users": [{"id": config['id'], "encryption": "none", "flow": config['flow']}]
                }]
            },
            "streamSettings": stream
        }]
    }

def get_free_port():
    s = socket.socket()
    s.bind(('', 0))
    port = s.getsockname()[1]
    s.close()
    return port

def wait_port(port):
    for _ in range(40):
        try:
            socket.create_connection(("127.0.0.1", port), 0.5)
            return True
        except: time.sleep(0.2)
    return False

def test_proxy(port):
    urls = ['http://www.gstatic.com/generate_204', 'http://cp.cloudflare.com/generate_204']
    for url in urls:
        try:
            cmd = ['curl', '-s', '--max-time', '6', '-x', f'socks5h://127.0.0.1:{port}', 
                   '-o', '/dev/null', '-w', '%{http_code}']
            result = subprocess.run(cmd, capture_output=True, text=True, timeout=8)
            if result.returncode == 0 and result.stdout.strip() in ('204', '200'):
                return True
        except: continue
    return False

def check_one(link):
    try:
        config = parse_vless(link)
        if not config: return None
        
        port = get_free_port()
        cfg = generate_xray_config(config, port)
        cfg_file = f'cfg_{port}.json'
        
        with open(cfg_file, 'w') as f:
            json.dump(cfg, f)
            
        p = subprocess.Popen([XRAY_PATH, 'run', '-c', cfg_file], 
                           stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        
        time.sleep(3)
        
        if wait_port(port):
            if test_proxy(port):
                p.kill()
                os.remove(cfg_file)
                print(f"✅ LIVE: {config['add']}:{config['port']}")
                return link
        
        p.kill()
        p.wait(2)
        try: os.remove(cfg_file)
        except: pass
    except Exception as e:
        print(f"⚠️ {str(e)[:50]}")
    return None

with open(VLESS_FILE) as f:
    links = [l.strip() for l in f if l.strip()]

print(f"Testing {len(links)} VLESS keys")

alive = []
with ThreadPoolExecutor(max_workers=3) as ex:
    futures = [ex.submit(check_one, l) for l in links[:15]]
    for f in as_completed(futures):
        r = f.result()
        if r: alive.append(r)

print(f"✅ Alive: {len(alive)}")

with open('githubmirror/26_proxy_subscription_raw.txt', 'w') as f:
    f.write(f"# Alive [{datetime.now(timezone.utc)}]\n")
    for p in alive: f.write(p + '\n')

if alive:
    b64 = base64.b64encode(('\n'.join(alive)).encode()).decode()
    with open('githubmirror/26_proxy_subscription_base64.txt', 'w') as f:
        f.write(b64)
EOF

      - name: Debug and Commit
        run: |
          echo "=== DEBUG ==="
          ls -la githubmirror/
          head -3 githubmirror/26_proxy_subscription_raw.txt || echo "Empty"
          echo "VLESS:"; wc -l vless_links.txt || true
          sudo pkill -9 xray || true
          rm -f cfg_*.json *.txt xray.zip || true
          
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add githubmirror/*.txt
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update VPN keys [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi

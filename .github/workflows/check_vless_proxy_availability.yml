name: Check VPN keys via Xray (v2rayNG/NekoBox/Karing style)

on:
  schedule:
    - cron: '0 */3 * * *'  # каждые 3 часа
  workflow_dispatch:

concurrency:
  group: proxy-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -la xray

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Download subscription & Check via Xray (v2rayNG style)
        run: |
          # Скачиваем ключи из подписки
          curl -s "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/HMAO_Surgutcity_01.txt" > subscription.txt
          
          python3 << 'EOF'
          import subprocess, time, json, urllib.parse, os, socket, base64, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          from datetime import datetime, timezone

          XRAY_PATH = os.path.join(os.getcwd(), "xray")
          SUB_FILE = 'subscription.txt'

          # Читаем все ключи из подписки (vless/vmess/ss/trojan)
          with open(SUB_FILE) as f:
              all_links = [x.strip() for x in f if x.strip() and x.strip().startswith(('vless://','vmess://','ss://','trojan://'))]

          if not all_links:
              print("❌ No VPN links found")
              exit(0)

          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          OUTPUT_B64 = 'githubmirror/26_proxy_subscription_base64.txt'

          TEST_URL = 'http://www.google.com/gen_204'  # Как в v2rayNG/NekoBox/Karing
          MAX_WORKERS = 10
          TIMEOUT = 10

          lock = Lock()
          counter = 0

          def next_id():
              global counter
              with lock:
                  counter += 1
                  return counter

          def get_free_port():
              s = socket.socket()
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port

          def wait_port(port, timeout=15):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy(port):
              # Тест задержки как в клиентах: HTTP GET через socks5 к gen_204 (204 response)
              try:
                  cmd = [
                      'curl', '-s', '--max-time', str(TIMEOUT), 
                      '-x', f'socks5h://127.0.0.1:{port}', 
                      '-o', '/dev/null', '-w', '%{http_code}|%{time_total}'
                  ]
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=TIMEOUT+2)
                  
                  if result.returncode == 0:
                      output = result.stdout.strip()
                      if output.startswith(('204', '200')):
                          latency = float(output.split('|')[1]) * 1000  # ms
                          print(f"✅ Latency: {latency:.0f}ms")
                          return True, latency
              except:
                  pass
              print("❌ Test failed")
              return False, None

          def check_one(link):
              try:
                  port = get_free_port()
                  
                  # Генерируем config для Xray (поддержка vless/vmess/ss/trojan)
                  u = urllib.parse.urlparse(link.split('#')[0])  # Убираем #name
                  
                  cfg = {
                      'inbounds': [{
                          'listen': '127.0.0.1',
                          'port': port,
                          'protocol': 'socks',
                          'settings': {'udp': False}
                      }],
                      'outbounds': [{
                          'tag': 'proxy',
                          'protocol': u.scheme.replace('://', ''),
                          'settings': {'servers': [{'address': u.hostname, 'port': int(u.port or 443)}]},
                          'streamSettings': {'network': 'tcp'}  # Базовый TCP
                      }]
                  }

                  cfg_file = f'cfg_{port}.json'
                  with open(cfg_file, 'w') as f:
                      json.dump(cfg, f, indent=2)

                  # Запускаем Xray
                  p = subprocess.Popen([XRAY_PATH, 'run', '-c', cfg_file],
                                     stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL)

                  if not wait_port(port, 10):
                      p.terminate(); p.wait(timeout=2)
                      try: os.remove(cfg_file)
                      except: pass
                      return None

                  # Тест задержки (3 попытки как "true delay" в NekoBox)
                  ok = False
                  for attempt in range(3):
                      is_ok, lat = test_proxy(port)
                      if is_ok:
                          ok = True
                          break
                      time.sleep(1)

                  # Останавливаем
                  try:
                      p.terminate()
                      p.wait(timeout=3)
                  except:
                      p.kill()
                  p.wait(timeout=1)
                  try: os.remove(cfg_file)
                  except: pass

                  if ok:
                      num = next_id()
                      name = f"ID:{num}"
                      return link + f"#{name}"
                  
              except Exception as e:
                  print(f"⚠️ Error: {str(e)[:50]}")
              return None

          print(f"🚀 Testing {len(all_links)} keys | URL: {TEST_URL}")

          alive = []
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
              futures = [ex.submit(check_one, l) for l in all_links]
              for future in as_completed(futures):
                  result = future.result()
                  if result:
                      alive.append(result)

          print(f"✅ Alive: {len(alive)}")

          # Сохраняем raw
          with open(OUTPUT_RAW, 'w') as f:
              f.write(f"# VPN alive check (v2rayNG style) {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")
              for proxy in alive:
                  f.write(proxy + '\n')

          # Base64
          if alive:
              b64_content = '\n'.join(alive)
              b64 = base64.b64encode(b64_content.encode()).decode()
              with open(OUTPUT_B64, 'w') as f:
                  f.write(b64)

          EOF

      - name: Commit & push results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          sudo pkill -f xray || true
          rm -f cfg_*.json subscription.txt || true
          git add githubmirror/*.txt || true

          if git diff --staged --quiet; then
            echo "❌ No changes"
            exit 0
          fi

          git commit -m "Update alive VPN keys [$(date -u +'%Y-%m-%d %H:%M UTC')]"

          git pull --rebase origin main || true
          git push origin main || git push --force-with-lease origin main

          echo "✅ Done"

              'CH': '🇨🇭CH', 'CI': '🇨🇮CI', 'CK': '🇨🇰CK', 'CL': '🇨🇱CL', 'CM': '🇨🇲CM', 'CN': '🇨🇳CN',
              'CO': '🇨🇴CO', 'CR': '🇨🇷CR', 'CU': '🇨🇺CU', 'CV': '🇨🇻CV', 'CW': '🇨🇼CW', 'CX': '🇨🇽CX',
              'CY': '🇨🇾CY', 'CZ': '🇨🇿CZ', 'DE': '🇩🇪DE', 'DJ': '🇩🇯DJ', 'DK': '🇩🇰DK', 'DM': '🇩🇲DM',
              'DO': '🇩🇴DO', 'DZ': '🇩🇿DZ', 'EC': '🇪🇨EC', 'EE': '🇪🇪EE', 'EG': '🇪🇬EG', 'EH': '🇪🇭EH',
              'ER': '🇪🇷ER', 'ES': '🇪🇸ES', 'ET': '🇪🇹ET', 'FI': '🇫🇮FI', 'FJ': '🇫🇯FJ', 'FK': '🇫🇰FK',
              'FM': '🇫🇲FM', 'FO': '🇫🇴FO', 'FR': '🇫🇷FR', 'GA': '🇬🇦GA', 'GB': '🇬🇧GB', 'GD': '🇬🇩GD',
              'GE': '🇬🇪GE', 'GF': '🇬🇫GF', 'GG': '🇬🇬GG', 'GH': '🇬🇭GH', 'GI': '🇬🇮GI', 'GL': '🇬🇱GL',
              'GM': '🇬🇲GM', 'GN': '🇬🇳GN', 'GP': '🇬🇵GP', 'GQ': '🇬🇶GQ', 'GR': '🇬🇷GR', 'GS': '🇬🇸GS',
              'GT': '🇬🇹GT', 'GU': '🇬🇺GU', 'GW': '🇬🇼GW', 'GY': '🇬🇾GY', 'HK': '🇭🇰HK', 'HM': '🇭🇲HM',
              'HN': '🇭🇳HN', 'HR': '🇭🇷HR', 'HT': '🇭🇹HT', 'HU': '🇭🇺HU', 'ID': '🇮🇩ID', 'IE': '🇮🇪IE',
              'IL': '🇮🇱IL', 'IM': '🇮🇲IM', 'IN': '🇮🇳IN', 'IO': '🇮🇴IO', 'IQ': '🇮🇶IQ', 'IR': '🇮🇷IR',
              'IS': '🇮🇸IS', 'IT': '🇮🇹IT', 'JE': '🇯🇪JE', 'JM': '🇯🇲JM', 'JO': '🇯🇴JO', 'JP': '🇯🇵JP',
              'KE': '🇰🇪KE', 'KG': '🇰🇬KG', 'KH': '🇰🇭KH', 'KI': '🇰🇮KI', 'KM': '🇰🇲KM', 'KN': '🇰🇳KN',
              'KP': '🇰🇵KP', 'KR': '🇰🇷KR', 'KW': '🇰🇼KW', 'KY': '🇰🇾KY', 'KZ': '🇰🇿KZ', 'LA': '🇱🇦LA',
              'LB': '🇱🇧LB', 'LC': '🇱🇨LC', 'LI': '🇱🇮LI', 'LK': '🇱🇰LK', 'LR': '🇱🇷LR', 'LS': '🇱🇸LS',
              'LT': '🇱🇹LT', 'LU': '🇱🇺LU', 'LV': '🇱🇻LV', 'LY': '🇱🇾LY', 'MA': '🇲🇦MA', 'MC': '🇲🇨MC',
              'MD': '🇲🇩MD', 'ME': '🇲🇪ME', 'MF': '🇲🇫MF', 'MG': '🇲🇬MG', 'MH': '🇲🇭MH', 'MK': '🇲🇰MK',
              'ML': '🇲🇱ML', 'MM': '🇲🇲MM', 'MN': '🇲🇳MN', 'MO': '🇲🇴MO', 'MP': '🇲🇵MP', 'MQ': '🇲🇶MQ',
              'MR': '🇲🇷MR', 'MS': '🇲🇸MS', 'MT': '🇲🇹MT', 'MU': '🇲🇺MU', 'MV': '🇲🇻MV', 'MW': '🇲🇼MW',
              'MX': '🇲🇽MX', 'MY': '🇲🇾MY', 'MZ': '🇲🇿MZ', 'NA': '🇳🇦NA', 'NC': '🇳🇨NC', 'NE': '🇳🇪NE',
              'NF': '🇳🇫NF', 'NG': '🇳🇬NG', 'NI': '🇳🇮NI', 'NL': '🇳🇱NL', 'NO': '🇳🇴NO', 'NP': '🇳🇵NP',
              'NR': '🇳🇷NR', 'NU': '🇳🇺NU', 'NZ': '🇳🇿NZ', 'OM': '🇴🇲OM', 'PA': '🇵🇦PA', 'PE': '🇵🇪PE',
              'PF': '🇵🇫PF', 'PG': '🇵🇬PG', 'PH': '🇵🇭PH', 'PK': '🇵🇰PK', 'PL': '🇵🇱PL', 'PM': '🇵🇲PM',
              'PN': '🇵🇳PN', 'PR': '🇵🇷PR', 'PS': '🇵🇸PS', 'PT': '🇵🇹PT', 'PW': '🇵🇼PW', 'PY': '🇵🇾PY',
              'QA': '🇶🇦QA', 'RE': '🇷🇪RE', 'RO': '🇷🇴RO', 'RS': '🇷🇸RS', 'RU': '🇷🇺RU', 'RW': '🇷🇼RW',
              'SA': '🇸🇦SA', 'SB': '🇸🇧SB', 'SC': '🇸🇨SC', 'SD': '🇸🇩SD', 'SE': '🇸🇪SE', 'SG': '🇸🇬SG',
              'SH': '🇸🇭SH', 'SI': '🇸🇮SI', 'SJ': '🇸🇯SJ', 'SK': '🇸🇰SK', 'SL': '🇸🇱SL', 'SM': '🇸🇲SM',
              'SN': '🇸🇳SN', 'SO': '🇸🇴SO', 'SR': '🇸🇷SR', 'SS': '🇸🇸SS', 'ST': '🇸🇹ST', 'SV': '🇸🇻SV',
              'SX': '🇸🇽SX', 'SY': '🇸🇾SY', 'SZ': '🇸🇿SZ', 'TC': '🇹🇨TC', 'TD': '🇹🇩TD', 'TF': '🇹🇫TF',
              'TG': '🇹🇬TG', 'TH': '🇹🇭TH', 'TJ': '🇹🇯TJ', 'TK': '🇹🇰TK', 'TL': '🇹🇱TL', 'TM': '🇹🇲TM',
              'TN': '🇹🇳TN', 'TO': '🇹🇴TO', 'TR': '🇹🇷TR', 'TT': '🇹🇹TT', 'TV': '🇹🇻TV', 'TW': '🇹🇼TW',
              'TZ': '🇹🇿TZ', 'UA': '🇺🇦UA', 'UG': '🇺🇬UG', 'UM': '🇺🇲UM', 'US': '🇺🇸US', 'UY': '🇺🇾UY',
              'UZ': '🇺🇿UZ', 'VA': '🇻🇦VA', 'VC': '🇻🇨VC', 'VE': '🇻🇪VE', 'VG': '🇻🇬VG', 'VI': '🇻🇮VI',
              'VN': '🇻🇳VN', 'VU': '🇻🇺VU', 'WF': '🇼🇫WF', 'WS': '🇼🇸WS', 'YE': '🇾🇪YE', 'YT': '🇾🇹YT',
              'ZA': '🇿🇦ZA', 'ZM': '🇿🇲ZM', 'ZW': '🇿🇼ZW',

              # ==== ДОБАВЛЕНО (редкие/служебные коды) ====
              'XK': '🇽🇰XK',  # Kosovo
              '??': '🌍??'   # fallback
           }

          dns_cache = {}
          seen = set()
          lock = Lock()
          counter = 0
          country_reader = None

          def next_id():
              global counter
              with lock:
                  counter += 1
                  return counter

          def load_set(url):
              try:
                  return set(requests.get(url, timeout=20).text.lower().split())
              except:
                  return set()

          def load_cidr(url):
              out = []
              try:
                  for line in requests.get(url, timeout=20).text.splitlines():
                      try:
                          out.append(ipaddress.ip_network(line.strip(), strict=False))
                      except:
                          pass
              except:
                  pass
              return out

          def ip_in(ip, networks):
              try:
                  ip_obj = ipaddress.ip_address(ip)
                  return any(ip_obj in net for net in networks)
              except:
                  return False

          def resolve(hostname):
              if hostname in dns_cache:
                  return dns_cache[hostname]
              try:
                  ip = socket.gethostbyname(hostname)
                  dns_cache[hostname] = ip
                  return ip
              except:
                  dns_cache[hostname] = None
                  return None

          def tcp_check(ip, port):
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.settimeout(TIMEOUT)
                  result = s.connect_ex((ip, port)) == 0
                  s.close()
                  return result
              except:
                  return False

          def get_country(ip):
              try:
                  r = country_reader.country(ip)
                  return r.country.iso_code or "??"
              except:
                  return "??"

          def get_flag(cc):
              return FLAGS.get(cc, FLAGS['??'])

          def download_and_parse():
              all_links = []
              for url in CONFIG_URLS:
                  try:
                      resp = requests.get(url, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
                      content = resp.text
                      links = re.findall(r'(vless://[^\s#]+)', content)
                      print(f"[+] {url.split('/')[-1]}: {len(links)} VLESS")
                      all_links.extend(links)
                  except Exception as e:
                      print(f"[-] Error fetching {url}: {e}")
              all_links = list(dict.fromkeys(all_links))
              print(f"[✓] Total unique VLESS: {len(all_links)}")
              return all_links

          def parse_vless(link):
              try:
                  clean = link.split('#')[0]
                  u = urllib.parse.urlparse(clean)
                  if u.scheme != 'vless':
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      'hostname': u.hostname,
                      'port': int(u.port) if u.port else 443,
                      'id': u.username,
                      'net': q.get('type', ['tcp'])[0],
                      'security': q.get('security', ['none'])[0],
                      'sni': q.get('sni', [''])[0],
                      'fp': q.get('fp', ['chrome'])[0],
                      'pbk': q.get('pbk', [''])[0],
                      'sid': q.get('sid', [''])[0],
                      'flow': q.get('flow', [''])[0],
                      'original': link
                  }
              except:
                  return None

          def build_xray_cfg(cfg, local_port):
              stream = {'network': cfg['net'], 'security': 'none'}
              if cfg['security'] == 'tls':
                  stream['security'] = 'tls'
                  stream['tlsSettings'] = {
                      'serverName': cfg['sni'],
                      'fingerprint': cfg['fp'],
                      'allowInsecure': True
                  }
              elif cfg['security'] == 'reality':
                  stream['security'] = 'reality'
                  stream['realitySettings'] = {
                      'serverName': cfg['sni'],
                      'publicKey': cfg['pbk'],
                      'shortId': cfg['sid'],
                      'fingerprint': cfg['fp']
                  }
              return {
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",
                      "settings": {"auth": "noauth", "udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": cfg['hostname'],
                              "port": cfg['port'],
                              "users": [{"id": cfg['id'], "encryption": "none", "flow": cfg['flow']}]
                          }]
                      },
                      "streamSettings": stream
                  }]
              }

          def get_free_port():
              with socket.socket() as s:
                  s.bind(('', 0))
                  return s.getsockname()[1]

          def wait_port(port, retries=40):
              for _ in range(retries):
                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=0.5)
                      return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy(port):
              urls = [
                  'http://www.gstatic.com/generate_204',
                  'http://cp.cloudflare.com/generate_204'
              ]
              for url in urls:
                  try:
                      cmd = [
                          'curl', '-s', '--max-time', '6',
                          '-x', f'socks5h://127.0.0.1:{port}',
                          '-o', '/dev/null', '-w', '%{http_code}',
                          url
                      ]
                      res = subprocess.run(cmd, capture_output=True, text=True, timeout=8)
                      if res.returncode == 0 and res.stdout.strip() in ('200', '204'):
                          return True
                  except:
                      continue
              return False

          def get_exit_ip(port):
              try:
                  cmd = [
                      'curl', '-s', '--max-time', '8',
                      '-x', f'socks5h://127.0.0.1:{port}',
                      'https://api.ipify.org'
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=10)
                  if res.returncode == 0 and res.stdout.strip():
                      return res.stdout.strip()
              except:
                  pass
              return None

          def check_one(link):
              try:
                  cfg = parse_vless(link)
                  if not cfg:
                      return None

                  # 🔒 ФИЛЬТР ПО ПОРТУ 443 (добавлено по запросу)
                  if cfg['port'] != 443:
                      return None

                  if cfg['flow'] != 'xtls-rprx-vision':
                      return None
                  if cfg['fp'] not in ALLOWED_FP:
                      return None

                  ip = resolve(cfg['hostname'])
                  if not ip or not tcp_check(ip, cfg['port']):
                      return None

                  sni = cfg['sni'].lower()
                  if not (sni in sni_wl or ip in ip_wl or ip_in(ip, cidr_wl)):
                      return None

                  key = (cfg['hostname'], cfg['port'], sni)
                  with lock:
                      if key in seen:
                          return None
                      seen.add(key)

                  local_port = get_free_port()
                  xray_cfg = build_xray_cfg(cfg, local_port)
                  cfg_file = f'cfg_{local_port}.json'
                  with open(cfg_file, 'w') as f:
                      json.dump(xray_cfg, f)

                  proc = subprocess.Popen(
                      [XRAY, 'run', '-c', cfg_file],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
                  time.sleep(3)

                  if not wait_port(local_port) or not test_proxy(local_port):
                      proc.kill()
                      try: os.remove(cfg_file)
                      except: pass
                      return None

                  exit_ip = get_exit_ip(local_port)
                  proc.kill()
                  proc.wait(2)
                  try: os.remove(cfg_file)
                  except: pass

                  if exit_ip:
                      cc = get_country(exit_ip)
                      if cc == "RU":
                          return None
                      exit_flag = get_flag(cc)
                  else:
                      exit_flag = FLAGS['??']

                  server_flag = get_flag(get_country(ip))
                  num = next_id()
                  sni_disp = cfg['sni'] if cfg['sni'] else cfg['hostname']
                  star = "⭐" if cfg['net'] == 'xhttp' else ""
                  name = f"{star}{server_flag}→{num}→{exit_flag} SNI:{sni_disp}"

                  base = link.split("#")[0]
                  return f"{base}#{name}"

              except Exception as e:
                  print(f"[!] Error: {link[:60]}... -> {e}")
                  return None

          # ==================== MAIN ====================
          print("🌍 Loading GeoIP database...")
          country_reader = geoip2.database.Reader(GEO_DB)

          print("📥 Loading Russian whitelists...")
          sni_wl = load_set(RU_SNI)
          ip_wl = load_set(RU_IP)
          cidr_wl = load_cidr(RU_CIDR)
          print(f"✓ SNI:{len(sni_wl)} IP:{len(ip_wl)} CIDR:{len(cidr_wl)}")

          print("🔗 Downloading configs...")
          links = download_and_parse()
          random.shuffle(links)

          print(f"🔍 Testing {len(links)} links with {MAX_WORKERS} workers...")
          results = []
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = [executor.submit(check_one, l) for l in links]
              for f in as_completed(futures):
                  r = f.result()
                  if r:
                      results.append(r)

          print(f"✅ FINAL: {len(results)} working configs")

          os.makedirs("githubmirror", exist_ok=True)
          with open("githubmirror/26_proxy_subscription_raw.txt", "w") as f:
              f.write(f'# Alive [{datetime.now(timezone.utc)}]\n')
              for line in results:
                  f.write(line + "\n")

          with open("githubmirror/26_proxy_subscription_base64.txt", "w") as f:
              if results:
                  f.write(base64.b64encode('\n'.join(results).encode()).decode())
              else:
                  f.write("")

          country_reader.close()
          print("📦 Done. Files written to githubmirror/")
          PYTHON_EOF
          
      - name: Upload to Yandex Disk (REAL PATH)
        if: always()
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
        run: |
          echo "📤 Uploading to Yandex Disk..."
          
          # 🔑 Ваш реальный путь к папке (с кодированием пробела как %20)
          # Папка "My Github Uploader" в корне диска
          BASE_PATH="/My%20Github%20Uploader"
          
          # Функция загрузки с отладкой
          upload() {
            local FILE=$1
            local NAME=$2
            local FULL_PATH="${BASE_PATH}/${NAME}"
            
            [ ! -f "$FILE" ] && { echo "⚠️ Not found: $FILE"; return 1; }
            
            echo "⬆️ Getting upload URL for $NAME..."
            echo "   Path: $FULL_PATH"
            
            # Шаг 1: Получаем URL для загрузки
            RESP=$(curl -s -w "\n%{http_code}" -X GET \
              -H "Authorization: OAuth $YANDEX_TOKEN" \
              "https://cloud-api.yandex.net/v1/disk/resources/upload?path=${FULL_PATH}&overwrite=true")
            
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            
            echo "📡 HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Error getting URL (HTTP $HTTP_CODE): $BODY"
              return 1
            fi
            
            UPLOAD_URL=$(echo "$BODY" | jq -r '.href // empty' 2>/dev/null)
            if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
              echo "❌ No href in response: $BODY"
              return 1
            fi
            
            echo "⬆️ Uploading $NAME to $UPLOAD_URL..."
            
            # Шаг 2: Загружаем файл по полученной ссылке
            UPLOAD_RESP=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "$UPLOAD_URL")
            
            UPLOAD_CODE=$(echo "$UPLOAD_RESP" | tail -n1)
            
            if [ "$UPLOAD_CODE" = "201" ] || [ "$UPLOAD_CODE" = "200" ]; then
              echo "✅ Uploaded: $NAME"
              return 0
            else
              echo "❌ Upload failed (HTTP $UPLOAD_CODE): $UPLOAD_RESP"
              return 1
            fi
          }
          
          # Загружаем файлы
          upload "githubmirror/26_proxy_subscription_raw.txt" "sub_raw.txt"
          RAW_STATUS=$?
          
          upload "githubmirror/26_proxy_subscription_base64.txt" "sub_b64.txt"
          B64_STATUS=$?
          
          # Ждём обработки Яндексом
          sleep 5
          
          # Получаем публичные ссылки (используем ваш известный public_id)
          echo "🔗 Generating public links..."
          
          # Ваш public_id папки (из ссылки https://disk.yandex.ru/d/nafCaIUjiui54w)
          PUBLIC_ID="nafCaIUjiui54w"
          
          # Формируем прямые ссылки на файлы (формат: /i/{public_id}/{filename})
          RAW_LINK="https://disk.yandex.ru/i/${PUBLIC_ID}/sub_raw.txt"
          B64_LINK="https://disk.yandex.ru/i/${PUBLIC_ID}/sub_b64.txt"
          
          # Проверяем, что файлы доступны (опционально)
          echo "🔍 Checking links..."
          if curl -s -f -I "$RAW_LINK" >/dev/null 2>&1; then
            echo "✅ RAW link is accessible"
          else
            echo "⚠️ RAW link may not be public yet"
          fi
          
          echo ""
          echo "═══════════════════════════════════════"
          echo "📋 ССЫЛКИ ДЛЯ КЛИЕНТОВ (копируйте):"
          echo "═══════════════════════════════════════"
          echo "✅ RAW:  $RAW_LINK"
          echo "✅ B64:  $B64_LINK"
          echo "═══════════════════════════════════════"
          
          # Сохраняем ссылки в файл для истории
          echo "🔗 Yandex Disk Links" > githubmirror/yandex_links.txt
          echo "Updated: $(date -u +'%Y-%m-%d %H:%M UTC')" >> githubmirror/yandex_links.txt
          echo "Public ID: $PUBLIC_ID" >> githubmirror/yandex_links.txt
          echo "RAW: $RAW_LINK" >> githubmirror/yandex_links.txt
          echo "B64: $B64_LINK" >> githubmirror/yandex_links.txt
          
          # Выводим итоговый статус
          if [ $RAW_STATUS -eq 0 ] && [ $B64_STATUS -eq 0 ]; then
            echo "🎉 All files uploaded successfully!"
          else
            echo "⚠️ Some uploads failed. Check logs above."
          fi
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/*.txt
          git commit -m "🔄 Update: $(date +'%Y-%m-%d %H:%M UTC') [${{ github.run_number }}]" || exit 0
          git push

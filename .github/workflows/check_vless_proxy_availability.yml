              'MR': '🇲🇷MR', 'MS': '🇲🇸MS', 'MT': '🇲🇹MT', 'MU': '🇲🇺MU', 'MV': '🇲🇻MV', 'MW': '🇲🇼MW',
              'MX': '🇲🇽MX', 'MY': '🇲🇾MY', 'MZ': '🇲🇿MZ', 'NA': '🇳🇦NA', 'NC': '🇳🇨NC', 'NE': '🇳🇪NE',
              'NF': '🇳🇫NF', 'NG': '🇳🇬NG', 'NI': '🇳🇮NI', 'NL': '🇳🇱NL', 'NO': '🇳🇴NO', 'NP': '🇳🇵NP',
              'NR': '🇳🇷NR', 'NU': '🇳🇺NU', 'NZ': '🇳🇿NZ', 'OM': '🇴🇲OM', 'PA': '🇵🇦PA', 'PE': '🇵🇪PE',
              'PF': '🇵🇫PF', 'PG': '🇵🇬PG', 'PH': '🇵🇭PH', 'PK': '🇵🇰PK', 'PL': '🇵🇱PL', 'PM': '🇵🇲PM',
              'PN': '🇵🇳PN', 'PR': '🇵🇷PR', 'PS': '🇵🇸PS', 'PT': '🇵🇹PT', 'PW': '🇵🇼PW', 'PY': '🇵🇾PY',
              'QA': '🇶🇦QA', 'RE': '🇷🇪RE', 'RO': '🇷🇴RO', 'RS': '🇷🇸RS', 'RU': '🇷🇺RU', 'RW': '🇷🇼RW',
              'SA': '🇸🇦SA', 'SB': '🇸🇧SB', 'SC': '🇸🇨SC', 'SD': '🇸🇩SD', 'SE': '🇸🇪SE', 'SG': '🇸🇬SG',
              'SH': '🇸🇭SH', 'SI': '🇸🇮SI', 'SJ': '🇸🇯SJ', 'SK': '🇸🇰SK', 'SL': '🇸🇱SL', 'SM': '🇸🇲SM',
              'SN': '🇸🇳SN', 'SO': '🇸🇴SO', 'SR': '🇸🇷SR', 'SS': '🇸🇸SS', 'ST': '🇸🇹ST', 'SV': '🇸🇻SV',
              'SX': '🇸🇽SX', 'SY': '🇸🇾SY', 'SZ': '🇸🇿SZ', 'TC': '🇹🇨TC', 'TD': '🇹🇩TD', 'TF': '🇹🇫TF',
              'TG': '🇹🇬TG', 'TH': '🇹🇭TH', 'TJ': '🇹🇯TJ', 'TK': '🇹🇰TK', 'TL': '🇹🇱TL', 'TM': '🇹🇲TM',
              'TN': '🇹🇳TN', 'TO': '🇹🇴TO', 'TR': '🇹🇷TR', 'TT': '🇹🇹TT', 'TV': '🇹🇻TV', 'TW': '🇹🇼TW',
              'TZ': '🇹🇿TZ', 'UA': '🇺🇦UA', 'UG': '🇺🇬UG', 'UM': '🇺🇲UM', 'US': '🇺🇸US', 'UY': '🇺🇾UY',
              'UZ': '🇺🇿UZ', 'VA': '🇻🇦VA', 'VC': '🇻🇨VC', 'VE': '🇻🇪VE', 'VG': '🇻🇬VG', 'VI': '🇻🇮VI',
              'VN': '🇻🇳VN', 'VU': '🇻🇺VU', 'WF': '🇼🇫WF', 'WS': '🇼🇸WS', 'YE': '🇾🇪YE', 'YT': '🇾🇹YT',
              'ZA': '🇿🇦ZA', 'ZM': '🇿🇲ZM', 'ZW': '🇿🇼ZW',
              'XK': '🇽🇰XK', '??': '🌍??'
          }

          dns_cache = {}
          lock = Lock()
          country_reader = None

          def load_set(url):
              try:
                  return set(requests.get(url, timeout=20).text.lower().split())
              except:
                  return set()

          def load_cidr(url):
              out = []
              try:
                  for line in requests.get(url, timeout=20).text.splitlines():
                      try:
                          out.append(ipaddress.ip_network(line.strip(), strict=False))
                      except:
                          pass
              except:
                  pass
              return out

          def load_sni_from_configs(url):
              try:
                  resp = requests.get(url, timeout=20).text
                  snis = set()
                  for line in resp.splitlines():
                      match = re.search(r'sni=([^&?#\s]+)', line.lower())
                      if match:
                          snis.add(match.group(1).strip())
                  return snis
              except Exception as e:
                  print(f"[-] Error loading extra SNI from {url}: {e}")
                  return set()

          def load_white_ips_and_cidrs_from_json(url):
              try:
                  resp = requests.get(url, timeout=25)
                  resp.raise_for_status()
                  data = resp.json()
                  all_ips = set()
                  cidr_list = []
                  for entry in data:
                      if not isinstance(entry, dict):
                          continue
                      if 'cidr' in entry:
                          try:
                              cidr_obj = ipaddress.ip_network(entry['cidr'], strict=False)
                              cidr_list.append(cidr_obj)
                          except Exception:
                              pass
                      if 'ips' in entry and isinstance(entry['ips'], list):
                          for ip_str in entry['ips']:
                              ip_clean = str(ip_str).strip()
                              if ip_clean:
                                  all_ips.add(ip_clean)
                  print(f"✓ Loaded from openlibrecommunity/subnets.json → CIDRs: {len(cidr_list)} | Unique IPs: {len(all_ips)}")
                  return all_ips, cidr_list
              except Exception as e:
                  print(f"[-] Error loading subnets.json: {e}")
                  return set(), []

          def ip_in(ip, networks):
              try:
                  ip_obj = ipaddress.ip_address(ip)
                  return any(ip_obj in net for net in networks)
              except:
                  return False

          def resolve(hostname):
              if hostname in dns_cache:
                  return dns_cache[hostname]
              try:
                  ip = socket.gethostbyname(hostname)
                  dns_cache[hostname] = ip
                  return ip
              except:
                  dns_cache[hostname] = None
                  return None

          def tcp_check(ip, port):
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.settimeout(TIMEOUT)
                  result = s.connect_ex((ip, port)) == 0
                  s.close()
                  return result
              except:
                  return False

          def get_country(ip):
              try:
                  r = country_reader.country(ip)
                  return r.country.iso_code or "??"
              except:
                  return "??"

          def get_flag(cc):
              return FLAGS.get(cc, FLAGS['??'])

          def download_and_parse():
              all_links = []
              for url in CONFIG_URLS:
                  try:
                      resp = requests.get(url, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
                      content = resp.text
                      links = re.findall(r'(vless://[^\s#]+)', content)
                      print(f"[+] {url.split('/')[-1]}: {len(links)} VLESS")
                      all_links.extend(links)
                  except Exception as e:
                      print(f"[-] Error fetching {url}: {e}")
              all_links = list(dict.fromkeys(all_links))
              print(f"[✓] Total unique VLESS: {len(all_links)}")
              return all_links

          def parse_vless(link):
              try:
                  clean = link.split('#')[0]
                  u = urllib.parse.urlparse(clean)
                  if u.scheme != 'vless':
                      return None
                  q = urllib.parse.parse_qs(u.query)
                  return {
                      'hostname': u.hostname,
                      'port': int(u.port) if u.port else 443,
                      'id': u.username,
                      'net': q.get('type', ['tcp'])[0],
                      'security': q.get('security', ['none'])[0],
                      'sni': q.get('sni', [''])[0],
                      'fp': q.get('fp', ['chrome'])[0],
                      'pbk': q.get('pbk', [''])[0],
                      'sid': q.get('sid', [''])[0],
                      'flow': q.get('flow', [''])[0],
                      'original': link
                  }
              except:
                  return None

          def build_xray_cfg(cfg, local_port):
              stream = {'network': cfg['net'], 'security': 'none'}
              if cfg['security'] == 'tls':
                  stream['security'] = 'tls'
                  stream['tlsSettings'] = {
                      'serverName': cfg['sni'],
                      'fingerprint': cfg['fp'],
                      'allowInsecure': True
                  }
              elif cfg['security'] == 'reality':
                  stream['security'] = 'reality'
                  stream['realitySettings'] = {
                      'serverName': cfg['sni'],
                      'publicKey': cfg['pbk'],
                      'shortId': cfg['sid'],
                      'fingerprint': cfg['fp']
                  }
              return {
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",
                      "settings": {"auth": "noauth", "udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": cfg['hostname'],
                              "port": cfg['port'],
                              "users": [{"id": cfg['id'], "encryption": "none", "flow": cfg['flow']}]
                          }]
                      },
                      "streamSettings": stream
                  }]
              }

          def get_free_port():
              with socket.socket() as s:
                  s.bind(('', 0))
                  return s.getsockname()[1]

          def wait_port(port, retries=40):
              for _ in range(retries):
                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=0.5)
                      return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy(port):
              urls = [
                  'http://www.gstatic.com/generate_204',
                  'https://api.ip.sb/geoip',
                  'http://connectivitycheck.gstatic.com/generate_204',
                  'http://captive.apple.com/hotspot-detect.html'
              ]
              for url in urls:
                  try:
                      cmd = [
                          'curl', '-s', '--max-time', '6',
                          '-x', f'socks5h://127.0.0.1:{port}',
                          '-o', '/dev/null', '-w', '%{http_code}',
                          url
                      ]
                      res = subprocess.run(cmd, capture_output=True, text=True, timeout=8)
                      if res.returncode == 0 and res.stdout.strip() in ('200', '204'):
                          return True
                  except:
                      continue
              return False

          def get_exit_ip(port):
              try:
                  cmd = [
                      'curl', '-s', '--max-time', '8',
                      '-x', f'socks5h://127.0.0.1:{port}',
                      'https://api.ipify.org'
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=10)
                  if res.returncode == 0 and res.stdout.strip():
                      return res.stdout.strip()
              except:
                  pass
              return None

          # ============ ЗАГРУЗКА БЕЛЫХ СПИСКОВ ============
          sni_wl = load_set(RU_SNI)
          ip_wl = load_set(RU_IP)
          cidr_wl = load_cidr(RU_CIDR)

          # Дополнительные SNI из конфигов igareck
          extra_sni = load_sni_from_configs(CONFIG_URLS[7])  # WHITE-SNI-RU-all.txt
          sni_wl = sni_wl | extra_sni
          print(f"✓ + Extra SNI from igareck WHITE-SNI: {len(extra_sni)} (total SNI: {len(sni_wl)})")

          # Дополнительные CIDR из escapingworm
          cidr_extra = load_cidr(EXTRA_CIDR_URL)
          cidr_wl.extend(cidr_extra)
          print(f"✓ + Extra CIDR from escapingworm: {len(cidr_extra)} (total CIDR: {len(cidr_wl)})")

          # subnets.json от openlibrecommunity (и точные IP, и CIDR)
          white_ips_set, white_cidrs = load_white_ips_and_cidrs_from_json(WHITE_IP_URL)

          def check_one(link):
              try:
                  cfg = parse_vless(link)
                  if not cfg:
                      return None
                  if cfg['port'] != 443:
                      return None
                  allowed_flows = {'xtls-rprx-vision', 'xtls-rprx-vision-udp443', '', None, 'xtls-rprx-origin'}
                  if cfg['flow'] not in allowed_flows:
                      return None
                  if cfg['fp'] not in ALLOWED_FP:
                      return None
                  ip = resolve(cfg['hostname'])
                  if not ip or not tcp_check(ip, cfg['port']):
                      return None

                  sni = cfg['sni'].lower() if cfg['sni'] else ''
                  is_white = (
                      sni in sni_wl or
                      ip in ip_wl or
                      ip_in(ip, cidr_wl) or
                      ip in white_ips_set or
                      ip_in(ip, white_cidrs)
                  )
                  if not is_white:
                      return None
                  return cfg
              except:
                  return None

          # ============ СКАЧИВАЕМ И ПАРСИМ ВСЕ ССЫЛКИ ============
          links = download_and_parse()
          print(f"Начинаем быструю фильтрацию {len(links)} ссылок...")
          valid_cfgs = []
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = {executor.submit(check_one, link): link for link in links}
              for future in as_completed(futures):
                  res = future.result()
                  if res:
                      valid_cfgs.append(res)
          print(f"После быстрой фильтрации: {len(valid_cfgs)} конфигов")

          # ============ ТЕСТИРОВАНИЕ ЧЕРЕЗ XRAY ============
          country_reader = geoip2.database.Reader(GEO_DB)
          good_links = []
          lock = Lock()

          def test_cfg(cfg):
              local_port = get_free_port()
              xray_cfg = build_xray_cfg(cfg, local_port)
              cfg_path = f"/tmp/xray_{local_port}.json"
              with open(cfg_path, 'w') as f:
                  json.dump(xray_cfg, f)
              proc = subprocess.Popen([XRAY, 'run', '-c', cfg_path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  if not wait_port(local_port, 20):
                      return None
                  if not test_proxy(local_port):
                      return None
                  exit_ip = get_exit_ip(local_port)
                  if not exit_ip:
                      return None
                  cc = get_country(exit_ip)
                  flag = get_flag(cc)
                  if cc == 'RU':
                      return None
                  # Формируем итоговую ссылку с флагом
                  mark = f"{flag} {cc} | {cfg['hostname']}"
                  link_with_flag = cfg['original'] + '#' + mark
                  return link_with_flag
              except Exception as e:
                  return None
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=3)
                  except:
                      proc.kill()
                  os.remove(cfg_path)

          print(f"Запускаем Xray-тест для {len(valid_cfgs)} кандидатов...")
          tested = []
          with ThreadPoolExecutor(max_workers=min(20, len(valid_cfgs))) as executor:
              futures = {executor.submit(test_cfg, cfg): cfg for cfg in valid_cfgs}
              for i, future in enumerate(as_completed(futures), 1):
                  link = future.result()
                  if link:
                      tested.append(link)
                      print(f"[{i}/{len(valid_cfgs)}] ✅ {link.split('#')[1] if '#' in link else link}")
          print(f"✅ Успешно прошли Xray: {len(tested)}")

          # ============ ДЕДУПЛИКАЦИЯ ПО HOSTNAME+SNI+UUID ============
          dedup = {}
          for link in tested:
              cfg = parse_vless(link)
              if not cfg:
                  continue
              key = (cfg['hostname'], cfg['sni'], cfg['id'])
              if key not in dedup:
                  dedup[key] = link
          final_links = list(dedup.values())
          print(f"После дедупликации: {len(final_links)} уникальных прокси")

          # ============ СОХРАНЕНИЕ ============
          raw_path = "githubmirror/26_proxy_subscription_raw.txt"
          b64_path = "githubmirror/26_proxy_subscription_base64.txt"

          with open(raw_path, 'w', encoding='utf-8') as f:
              for link in final_links:
                  f.write(link + '\n')

          b64_content = base64.b64encode('\n'.join(final_links).encode('utf-8')).decode('utf-8')
          with open(b64_path, 'w', encoding='utf-8') as f:
              f.write(b64_content)

          print(f"Сохранено: {raw_path} ({len(final_links)} строк)")
          print(f"Сохранено: {b64_path} ({len(b64_content)} символов base64)")
          PYTHON_EOF
          - name: Commit and push updated files
          run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git diff --staged --quiet || git commit -m "🔄 Auto-update proxy list [skip ci]"
          git push

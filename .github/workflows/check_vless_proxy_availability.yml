name: RU MAX FILTER (FINAL)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ru-max-final
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq unzip python3 python3-pip
          pip3 install -q requests geoip2

      - name: Download Xray
        run: |
          set -e
          echo "🔍 Fetching latest Xray version..."
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          if [ -z "$XRAY_VER" ] || [ "$XRAY_VER" = "null" ]; then
            echo "❌ Failed to get Xray version"
            exit 1
          fi
          echo "✅ Version: $XRAY_VER"
          URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          echo "⬇️ Downloading: $URL"
          curl -L --fail --retry 3 -o xray.zip "$URL"
          echo "📦 Checking archive..."
          file xray.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Download GeoLite2 Country
        run: |
          curl -L -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Prepare output directory
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: RUN Python filter & checker
        run: |
          python3 << 'PYTHON_EOF'

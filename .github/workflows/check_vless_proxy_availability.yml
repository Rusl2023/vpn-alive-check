              'MW': '🇲🇼MW', 'MX': '🇲🇽MX', 'MY': '🇲🇾MY', 'MZ': '🇲🇿MZ', 'NA': '🇳🇦NA',
              'NC': '🇳🇨NC', 'NE': '🇳🇪NE', 'NF': '🇳🇫NF', 'NG': '🇳🇬NG', 'NI': '🇳🇮NI',
              'NL': '🇳🇱NL', 'NO': '🇳🇴NO', 'NP': '🇳🇵NP', 'NR': '🇳🇷NR', 'NU': '🇳🇺NU',
              'NZ': '🇳🇿NZ', 'OM': '🇴🇲OM', 'PA': '🇵🇦PA', 'PE': '🇵🇪PE', 'PF': '🇵🇫PF',
              'PG': '🇵🇬PG', 'PH': '🇵🇭PH', 'PK': '🇵🇰PK', 'PL': '🇵🇱PL', 'PM': '🇵🇲PM',
              'PN': '🇵🇳PN', 'PR': '🇵🇷PR', 'PS': '🇵🇸PS', 'PT': '🇵🇹PT', 'PW': '🇵🇼PW',
              'PY': '🇵🇾PY', 'QA': '🇶🇦QA', 'RE': '🇷🇪RE', 'RO': '🇷🇴RO', 'RS': '🇷🇸RS',
              'RU': '🇷🇺RU', 'RW': '🇷🇼RW', 'SA': '🇸🇦SA', 'SB': '🇸🇧SB', 'SC': '🇸🇨SC',
              'SD': '🇸🇩SD', 'SE': '🇸🇪SE', 'SG': '🇸🇬SG', 'SH': '🇸🇭SH', 'SI': '🇸🇮SI',
              'SJ': '🇸🇯SJ', 'SK': '🇸🇰SK', 'SL': '🇸🇱SL', 'SM': '🇸🇲SM', 'SN': '🇸🇳SN',
              'SO': '🇸🇴SO', 'SR': '🇸🇷SR', 'SS': '🇸🇸SS', 'ST': '🇸🇹ST', 'SV': '🇸🇻SV',
              'SX': '🇸🇽SX', 'SY': '🇸🇾SY', 'SZ': '🇸🇿SZ', 'TC': '🇹🇨TC', 'TD': '🇹🇩TD',
              'TF': '🇹🇫TF', 'TG': '🇹🇬TG', 'TH': '🇹🇭TH', 'TJ': '🇹🇯TJ', 'TK': '🇹🇰TK',
              'TL': '🇹🇱TL', 'TM': '🇹🇲TM', 'TN': '🇹🇳TN', 'TO': '🇹🇴TO', 'TR': '🇹🇷TR',
              'TT': '🇹🇹TT', 'TV': '🇹🇻TV', 'TW': '🇹🇼TW', 'TZ': '🇹🇿TZ', 'UA': '🇺🇦UA',
              'UG': '🇺🇬UG', 'UM': '🇺🇲UM', 'US': '🇺🇸US', 'UY': '🇺🇾UY', 'UZ': '🇺🇿UZ',
              'VA': '🇻🇦VA', 'VC': '🇻🇨VC', 'VE': '🇻🇪VE', 'VG': '🇻🇬VG', 'VI': '🇻🇮VI',
              'VN': '🇻🇳VN', 'VU': '🇻🇺VU', 'WF': '🇼🇫WF', 'WS': '🇼🇸WS', 'YE': '🇾🇪YE',
              'YT': '🇾🇹YT', 'ZA': '🇿🇦ZA', 'ZM': '🇿🇲ZM', 'ZW': '🇿🇼ZW'
          }
          def get_flag(cc):
              if not cc:
                  return "🌍"
              return FLAGS.get(cc, f"🌍{cc}")

          # =======================
          # RU FILTER
          # =======================

          def is_ru_ip(ip):
              try:
                  r=country_reader.country(ip)
                  return r.country.iso_code=="RU"
              except:
                  return False

          def is_ru_asn(ip):
              try:
                  r=asn_reader.asn(ip)
                  org=(r.autonomous_system_organization or "").lower()
                  if "ru" in org or "russia" in org:
                      return True
              except:
                  pass
              return False

          def resolve_all(host):
              ips=[]
              try:
                  for r in socket.getaddrinfo(host,None):
                      ip=r[4][0]
                      if ip not in ips:
                          ips.append(ip)
              except:
                  pass
              return ips

          def is_ru_host(host):
              if host.endswith(".ru"):
                  return True
              ips=resolve_all(host)
              for ip in ips:
                  if is_ru_ip(ip) or is_ru_asn(ip):
                      return True
              return False

          # =======================

          counter=0
          lock=Lock()

          def next_num():
              global counter
              with lock:
                  counter+=1
                  return counter

          def get_country(ip):
              try:
                  r=country_reader.country(ip)
                  return r.country.iso_code
              except:
                  return None

          def free_port():
              s=socket.socket()
              s.bind(('',0))
              p=s.getsockname()[1]
              s.close()
              return p

          def wait_port(p):
              for _ in range(60):
                  try:
                      socket.create_connection(("127.0.0.1",p),1)
                      return True
                  except:
                      time.sleep(0.2)
              return False

          def test_exit(p):
              try:
                  ip=subprocess.check_output(
                      ['curl','-s','--max-time','12','-x',f'socks5h://127.0.0.1:{p}','https://api.ipify.org'],
                      text=True).strip()
                  return ip
              except:
                  return None

          def check(link):
              u=urllib.parse.urlparse(link)
              q=urllib.parse.parse_qs(u.query)

              host=u.hostname

              # RU host block
              if is_ru_host(host):
                  return None

              port=free_port()

              cfg={
                  "inbounds":[{"listen":"127.0.0.1","port":port,"protocol":"socks"}],
                  "outbounds":[{
                      "protocol":"vless",
                      "settings":{
                          "vnext":[{
                              "address":host,
                              "port":u.port or 443,
                              "users":[{"id":u.username,"encryption":"none"}]
                          }]
                      }
                  }]
              }

              f=f"cfg_{port}.json"
              open(f,"w").write(json.dumps(cfg))

              p=subprocess.Popen([XRAY_PATH,'run','-c',f],
                                 stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL)

              if not wait_port(port):
                  p.kill()
                  return None

              exit_ip=test_exit(port)
              p.kill()

              if not exit_ip:
                  return None

              # RU exit block
              if is_ru_ip(exit_ip) or is_ru_asn(exit_ip):
                  return None

              server_ip=None
              try:
                  server_ip=socket.gethostbyname(host)
              except:
                  pass

              server_cc=get_country(server_ip)
              exit_cc=get_country(exit_ip)

              name=f"{get_flag(server_cc)}→{next_num()}→{get_flag(exit_cc)} SNI: {q.get('sni',[''])[0]}"

              link=link.split('#')[0]+"#"+name
              return link

          if not os.path.exists(INPUT):
              raise SystemExit

          with open(INPUT) as f:
              links=[l.strip() for l in f if l.startswith("vless://")]

          alive=[]
          with ThreadPoolExecutor(max_workers=6) as ex:
              futures=[ex.submit(check,l) for l in links]
              for fut in as_completed(futures):
                  r=fut.result()
                  if r: alive.append(r)

          if alive:
              with open(OUTPUT_RAW,"w") as f:
                  f.write("# updated "+datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")+"\n")
                  f.write("\n".join(alive))

          EOF

      - name: Base64
        run: |
          if grep -q "^vless://" githubmirror/26_proxy_subscription_raw.txt; then
            base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt
          fi

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add githubmirror/*.txt
          if ! git diff --staged --quiet; then
            git commit -m "update"
            git push
          fi

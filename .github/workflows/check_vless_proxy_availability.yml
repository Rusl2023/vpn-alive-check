name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare files (always overwrite)
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt
          : > githubmirror/config.yaml

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray and build raw subscription
        run: |
          python3 - <<'EOF'
          import subprocess, time, json, urllib.parse, os, urllib.request

          INPUT = "githubmirror/26_ru_whitelist.txt"
          OUTPUT_RAW = "githubmirror/26_proxy_subscription_raw.txt"
          RUNNER_IP = os.environ.get("RUNNER_IP", "")
          TEST_URLS = ["https://api.ipify.org","http://cp.cloudflare.com","https://www.instagram.com/"]

          def exit_ip():
              for url in TEST_URLS:
                  try:
                      out = subprocess.check_output(
                          ["curl","-s","--max-time","8","-x","socks5h://127.0.0.1:1080",url],
                          text=True
                      ).strip()
                      if out:
                          return out
                  except:
                      pass
              return None

          def country(ip):
              try:
                  with urllib.request.urlopen(f"https://ipapi.co/{ip}/country/") as r:
                      return r.read().decode().strip()
              except:
                  return "Unknown"

          if not os.path.exists(INPUT):
              print(f"[WARN] Input file {INPUT} not found, skipping check")
              exit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.strip().startswith("vless://")]

          for link in links:
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)
              stream = {"network": q.get("type", ["tcp"])[0]}
              sec = q.get("security", ["none"])[0]
              sni = q.get("sni", [""])[0]

              if sec == "tls" and sni:
                  stream["security"] = "tls"
                  stream["tlsSettings"] = {"serverName": sni}
              if sec == "reality" and "pbk" in q:
                  stream["security"] = "reality"
                  stream["realitySettings"] = {
                      "serverName": sni,
                      "publicKey": q["pbk"][0],
                      "shortId": q.get("sid", [""])[0]
                  }

              cfg = {
                  "inbounds":[{"listen":"127.0.0.1","port":1080,"protocol":"socks","settings":{"udp":False}}],
                  "outbounds":[
                      {
                          "protocol":"vless",
                          "settings":{"vnext":[{"address":u.hostname,"port":u.port or 443,"users":[{"id":u.username,"encryption":"none","flow":q.get("flow", [""])[0]}]}]},
                          "streamSettings": stream,
                          "tag": "vless_out"
                      },
                      {"protocol":"freedom","tag":"direct"}
                  ]
              }

              with open("cfg.json","w") as f:
                  json.dump(cfg,f)

              p = subprocess.Popen(["./xray","run","-c","cfg.json"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(3)
              ip = exit_ip()
              p.terminate()
              time.sleep(1)
              if not ip or ip == RUNNER_IP:
                  continue
              if country(ip) == "RU":
                  continue
              with open(OUTPUT_RAW,"a") as f:
                  f.write(link + "\n")
          print("Raw subscription ready")
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Generate clean Mihomo config.yaml
        run: |
          INPUT="githubmirror/26_proxy_subscription_raw.txt"
          OUTPUT="githubmirror/config.yaml"
          mkdir -p githubmirror
          : > "$OUTPUT"

          echo "inbounds:" >> "$OUTPUT"
          echo "  - listen: 0.0.0.0" >> "$OUTPUT"
          echo "    port: 7891" >> "$OUTPUT"
          echo "    protocol: socks" >> "$OUTPUT"
          echo "    settings:" >> "$OUTPUT"
          echo "      udp: false" >> "$OUTPUT"

          echo "port: 7890" >> "$OUTPUT"
          echo "socks-port: 7891" >> "$OUTPUT"
          echo "redir-port: 7892" >> "$OUTPUT"
          echo "allow-lan: false" >> "$OUTPUT"
          echo "log-level: info" >> "$OUTPUT"
          echo "external-controller: 127.0.0.1:9090" >> "$OUTPUT"
          echo "proxies:" >> "$OUTPUT"

          while read -r line; do
            HOST=$(echo "$line" | sed -n 's|vless://[^@]*@\([^:]*\):.*|\1|p')
            PORT=$(echo "$line" | sed -n 's|vless://[^@]*@[^:]*:\([0-9]*\).*|\1|p')
            UUID=$(echo "$line" | sed -n 's|vless://\([^@]*\)@.*|\1|p')
            TYPE=$(echo "$line" | sed -n 's|.*type=\([^&]*\).*|\1|p'); [ -z "$TYPE" ] && TYPE="tcp"
            FLOW=$(echo "$line" | sed -n 's|.*flow=\([^&]*\).*|\1|p')
            SNI=$(echo "$line" | sed -n 's|.*sni=\([^&]*\).*|\1|p')
            SEC=$(echo "$line" | sed -n 's|.*security=\([^&]*\).*|\1|p'); [ -z "$SEC" ] && SEC="none"

            TYPE=$(echo "$TYPE" | cut -d'#' -f1)
            FLOW=$(echo "$FLOW" | cut -d'#' -f1)
            SNI=$(echo "$SNI" | cut -d'#' -f1)
            SEC=$(echo "$SEC" | cut -d'#' -f1)

            echo "  - name: ${HOST}_${PORT}" >> "$OUTPUT"
            echo "    type: vless" >> "$OUTPUT"
            echo "    server: $HOST" >> "$OUTPUT"
            echo "    port: $PORT" >> "$OUTPUT"
            echo "    uuid: $UUID" >> "$OUTPUT"
            echo "    flow: $FLOW" >> "$OUTPUT"
            echo "    network: $TYPE" >> "$OUTPUT"

            if [ "$SEC" = "reality" ]; then
              PBK=$(echo "$line" | sed -n 's|.*pbk=\([^&]*\).*|\1|p' | cut -d'#' -f1)
              SID=$(echo "$line" | sed -n 's|.*sid=\([^&]*\).*|\1|p' | cut -d'#' -f1)
              echo "    security: reality" >> "$OUTPUT"
              echo "    realitySettings:" >> "$OUTPUT"
              echo "      serverName: $SNI" >> "$OUTPUT"
              echo "      publicKey: $PBK" >> "$OUTPUT"
              echo "      shortId: $SID" >> "$OUTPUT"
            else
              echo "    security: $SEC" >> "$OUTPUT"
            fi
          done < "$INPUT"

          echo "" >> "$OUTPUT"
          echo "outbounds:" >> "$OUTPUT"
          echo "  - protocol: vless" >> "$OUTPUT"
          echo "    tag: vless_out" >> "$OUTPUT"
          echo "    settings:" >> "$OUTPUT"
          echo "      vnext:" >> "$OUTPUT"
          echo "        - address: PLACEHOLDER_ADDRESS" >> "$OUTPUT"
          echo "          port: PLACEHOLDER_PORT" >> "$OUTPUT"
          echo "          users:" >> "$OUTPUT"
          echo "            - id: PLACEHOLDER_UUID" >> "$OUTPUT"
          echo "              flow: PLACEHOLDER_FLOW" >> "$OUTPUT"
          echo "    streamSettings:" >> "$OUTPUT"
          echo "      network: tcp" >> "$OUTPUT"
          echo "      security: reality" >> "$OUTPUT"
          echo "      realitySettings:" >> "$OUTPUT"
          echo "        serverName: PLACEHOLDER_SNI" >> "$OUTPUT"
          echo "        publicKey: PLACEHOLDER_PBK" >> "$OUTPUT"
          echo "        shortId: PLACEHOLDER_SID" >> "$OUTPUT"
          echo "  - protocol: freedom" >> "$OUTPUT"
          echo "    tag: direct" >> "$OUTPUT"

          echo "Mihomo config.yaml ready"

      - name: Commit and push subscription & Mihomo config safely
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          FILE_RAW="githubmirror/26_proxy_subscription_raw.txt"
          FILE_B64="githubmirror/26_proxy_subscription_base64.txt"
          FILE_CFG="githubmirror/config.yaml"

          MAX_SIZE=$((50 * 1024 * 1024)) # 50 MB
          for f in "$FILE_RAW" "$FILE_B64" "$FILE_CFG"; do
            if [ -f "$f" ] && [ $(stat -c%s "$f") -gt $MAX_SIZE ]; then
              echo "[WARN] File $f exceeds 50 MB, skipping commit"
              exit 0
            fi
          done

          git add "$FILE_RAW" "$FILE_B64" "$FILE_CFG"
          git diff --cached --quiet || git commit -m "Update VLESS subscription & Mihomo config (Xray verified)"
          git pull --rebase https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} main || true
          git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} HEAD:main

name: Check VLESS proxy availability via Xray (base64 subscription)
on:
  schedule:
    - cron: '0 * * * *'  # Каждый час ровно
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -la xray

      - name: Prepare files
        run: |
          mkdir -p githubmirror
          : > githubmirror/26_proxy_subscription_raw.txt
          : > githubmirror/26_proxy_subscription_base64.txt

      - name: Check VLESS via Xray
        run: |
          python3 << 'EOF'
          import subprocess, time, json, urllib.parse, os, socket
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          from datetime import datetime, timezone

          XRAY_PATH = os.path.join(os.getcwd(), "xray")
          INPUT = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
          
          IP_TEST_URL = 'https://api.ipify.org'
          HTTP_TEST_URL = 'http://example.com'
          HTTPS_TEST_URL = 'https://www.cloudflare.com/cdn-cgi/trace'

          MAX_WORKERS = 6
          MAX_TOTAL_TIME = 1500
          FUTURE_TIMEOUT = 40

          process_lock = Lock()
          print_lock = Lock()
          active_processes = []

          def cleanup():
              with process_lock:
                  for p in active_processes[:]:
                      try:
                          p.terminate()
                          p.wait(timeout=1)
                      except:
                          try: p.kill()
                          except: pass
                      if p in active_processes:
                          active_processes.remove(p)

          def get_free_port():
              s = socket.socket()
              s.bind(('', 0))
              port = s.getsockname()[1]
              s.close()
              return port

          def wait_port(port, timeout=12):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          return True
                  except:
                      time.sleep(0.2)
              return False

          def test_proxy_robust(port):
              """⭐ 3x10s: IP → HTTP → HTTPS"""
              try:
                  ip = subprocess.check_output(
                      ['curl', '-s', '--max-time', '10', '-x', f'socks5h://127.0.0.1:{port}', IP_TEST_URL],
                      text=True, stderr=subprocess.DEVNULL, timeout=12
                  ).strip()
                  if not ip or len(ip) < 7: return False, None
              except: return False, None

              try:
                  http_code = subprocess.check_output(
                      ['curl', '-s', '--max-time', '10', '-x', f'socks5h://127.0.0.1:{port}', 
                       '-o', '/dev/null', '-w', '%{http_code}', HTTP_TEST_URL],
                      text=True, stderr=subprocess.DEVNULL, timeout=12
                  ).strip()
                  if http_code != '200': return False, None
              except: return False, None

              try:
                  https_code = subprocess.check_output(
                      ['curl', '-s', '--max-time', '10', '-x', f'socks5h://127.0.0.1:{port}', 
                       '-o', '/dev/null', '-w', '%{http_code}', HTTPS_TEST_URL],
                      text=True, stderr=subprocess.DEVNULL, timeout=12
                  ).strip()
                  if https_code not in ['200', '403']: return False, None
                  return True, ip
              except: return False, None

          def check_one(link):
              port = get_free_port()
              u = urllib.parse.urlparse(link)
              q = urllib.parse.parse_qs(u.query)

              network = 'http' if q.get('type', ['tcp'])[0] == 'xhttp' else q.get('type', ['tcp'])[0]
              sec = q.get('security', ['none'])[0]
              sni = q.get('sni', [''])[0]
              fingerprint = q.get('fp', ['chrome'])[0]

              stream = {'network': network}
              if sec == 'reality' and 'pbk' in q:
                  stream.update({
                      'security': 'reality',
                      'realitySettings': {
                          'serverName': sni,
                          'publicKey': q['pbk'][0],
                          'shortId': q.get('sid', [''])[0],
                          'fingerprint': fingerprint
                      }
                  })
              elif sec == 'tls':
                  stream.update({
                      'security': 'tls',
                      'tlsSettings': {
                          'serverName': sni,
                          'allowInsecure': True,
                          'fingerprint': fingerprint
                      }
                  })

              cfg = {
                  'inbounds': [{
                      'listen': '127.0.0.1',
                      'port': port,
                      'protocol': 'socks',
                      'settings': {'udp': False}
                  }],
                  'outbounds': [{
                      'protocol': 'vless',
                      'settings': {
                          'vnext': [{
                              'address': u.hostname,
                              'port': u.port or 443,
                              'users': [{
                                  'id': u.username,
                                  'encryption': 'none',
                                  'flow': q.get('flow', [''])[0]
                              }]
                          }]
                      },
                      'streamSettings': stream
                  }]
              }

              cfg_file = f'cfg_{port}.json'
              with open(cfg_file, 'w') as f:
                  json.dump(cfg, f)

              p = subprocess.Popen([XRAY_PATH,'run','-c',cfg_file],
                                   stdout=subprocess.DEVNULL,
                                   stderr=subprocess.DEVNULL)

              with process_lock:
                  active_processes.append(p)

              result = None
              host = f"{u.hostname}:{u.port or 443}"

              if wait_port(port):
                  success, ip = test_proxy_robust(port)
                  if success:
                      result = link
                      with print_lock:
                          print(f"⭐ {host} SUPER (IP+HTTP+HTTPS: {ip})")
                  else:
                      with print_lock:
                          print(f"✗ {host} test fail")
              else:
                  with print_lock:
                      print(f"✗ {host} timeout")

              try:
                  p.terminate(); p.wait(timeout=2)
              except:
                  try: p.kill()
                  except: pass

              with process_lock:
                  if p in active_processes:
                      active_processes.remove(p)

              try: os.remove(cfg_file)
              except: pass

              return result

          if not os.path.exists(INPUT):
              print("❌ INPUT file not found")
              raise SystemExit(0)

          with open(INPUT) as f:
              links = [l.strip() for l in f if l.strip().startswith('vless://')]
              
          if not links:
              print("❌ No VLESS links found in file")
              raise SystemExit(0)

          total_links = len(links)
          print(f"TOTAL: {total_links} | Tests: IP(10s)+HTTP(10s)+HTTPS(10s) | Workers: {MAX_WORKERS}")

          with open(OUTPUT_RAW, 'w') as f:
              f.write(f"# updated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n")

          alive = []
          start = time.time()
          processed = 0

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
              futures = {ex.submit(check_one, l): l for l in links}
              
              for future in as_completed(futures):
                  try:
                      r = future.result(timeout=FUTURE_TIMEOUT)
                      if r:
                          alive.append(r)
                  except:
                      pass
                  
                  processed += 1
                  if processed % 10 == 0:
                      with print_lock:
                          print(f"📊 {processed}/{total_links} ({len(alive)} SUPER)")
                  
                  if time.time() - start > MAX_TOTAL_TIME:
                      print("⏰ GLOBAL TIMEOUT (25min)")
                      break

          cleanup()

          with open(OUTPUT_RAW,'a') as f:
              for l in alive:
                  f.write(l+"\n")

          elapsed = time.time() - start
          print(f"\n{'='*60}")
          print(f"⭐ FINAL RESULT | Total: {total_links} | Alive: {len(alive)} | Time: {elapsed:.1f}s")
          print(f"📁 Raw file now has: {len(open(OUTPUT_RAW).readlines())} lines")
          print(f"📁 SUPER proxies saved: {len(alive)}")
          print(f"{'='*60}")
          EOF

      - name: Debug files before commit
        run: |
          echo "=== RAW FILE DEBUG ==="
          echo "Lines in RAW: $(wc -l < githubmirror/26_proxy_subscription_raw.txt)"
          echo "Content preview:"
          head -10 githubmirror/26_proxy_subscription_raw.txt
          echo "Tail preview:"
          tail -5 githubmirror/26_proxy_subscription_raw.txt
          echo "=== ALL FILES ==="
          ls -la githubmirror/*.txt

      - name: Encode Base64
        run: |
          RAW="githubmirror/26_proxy_subscription_raw.txt"
          B64="githubmirror/26_proxy_subscription_base64.txt"
          
          if [ $(wc -l < "$RAW") -gt 1 ]; then
            PROXY_COUNT=$(tail -n +2 "$RAW" | wc -l)
            echo "📊 Found $PROXY_COUNT SUPER proxies"
            tail -n +2 "$RAW" | base64 -w 0 > "$B64"
            echo "✅ Base64 created: $PROXY_COUNT lines"
          else
            echo "⚠️ No SUPER proxies found"
            : > "$B64"
          fi
          echo "Final file sizes:"
          ls -la githubmirror/*.txt

      - name: ✅ Safe Git Commit & Push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          RAW="githubmirror/26_proxy_subscription_raw.txt"
          
          # Проверяем наличие рабочих прокси
          PROXY_COUNT=$(tail -n +2 "$RAW" 2>/dev/null | wc -l || echo "0")
          
          if [ "$PROXY_COUNT" -gt 0 ]; then
            echo "🚀 Preparing to commit $PROXY_COUNT SUPER proxies"
            
            # ✅ 1. Настраиваем git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # ✅ 2. ЧИСТЫЙ checkout текущего состояния main
            git checkout main 2>/dev/null || git checkout -b main
            git fetch origin
            git reset --hard origin/main
            
            # ✅ 3. Добавляем файлы
            git add githubmirror/*.txt
            
            # ✅ 4. Проверяем изменения
            if git diff --cached --quiet; then
              echo "⚠️ No changes to commit (files unchanged)"
              exit 0
            fi
            
            # ✅ 5. Commit с точным счетчиком
            git commit -m "⭐ Update: $PROXY_COUNT SUPER VLESS proxies
$(date +'%Y-%m-%d %H:%M UTC')

📊 Tested: $(wc -l < "$RAW") lines total
✅ Alive: $PROXY_COUNT SUPER (IP+HTTP+HTTPS)
📁 Files: githubmirror/*.txt"
            
            # ✅ 6. Безопасный push с force (перезапись)
            git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git HEAD:main --force-with-lease
            
            echo "✅ SUCCESS: Pushed $PROXY_COUNT SUPER proxies to main"
          else
            echo "⚠️ No SUPER proxies to commit (RAW has $(wc -l < "$RAW") lines)"
          fi

      - name: Final verification
        if: always()
        run: |
          echo "=== FINAL STATE ==="
          ls -la githubmirror/
          echo "RAW preview:"
          head -3 githubmirror/26_proxy_subscription_raw.txt || echo "RAW empty/missing"
          echo "=== Git status ==="
          git status
          git log --oneline -3 || echo "No commits"

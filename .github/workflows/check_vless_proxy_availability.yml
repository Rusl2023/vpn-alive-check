import json
import urllib.parse
import os
import socket
import ipaddress
import base64
import geoip2.database
from concurrent.futures import ThreadPoolExecutor, as_completed
from threading import Lock
from datetime import datetime, timezone

XRAY_PATH = "./xray"
INPUT = 'githubmirror/26_ru_whitelist.txt'
OUTPUT_RAW = 'githubmirror/26_proxy_subscription_raw.txt'
OUTPUT_B64 = 'githubmirror/26_proxy_subscription_base64.txt'

IP_TEST_URLS = ['https://api.ipify.org', 'https://ifconfig.me/ip', 'https://ipapi.co/ip']
TEST_SITES = ['https://x.com', 'https://www.cloudflare.com/cdn-cgi/trace', 'https://www.netflix.com']
MAX_WORKERS = 6
CURL_DELAY = 0.3

print("🔄 Loading GeoLite2 databases...")
country_reader = city_reader = asn_reader = None
geoip_available = False

try:
    country_reader = geoip2.database.Reader('GeoLite2-Country.mmdb')
    city_reader = geoip2.database.Reader('GeoLite2-City.mmdb')
    asn_reader = geoip2.database.Reader('GeoLite2-ASN.mmdb')
    geoip_available = True
    print("✅ GeoLite2 databases loaded")
except Exception as e:
    print(f"⚠️ GeoLite2 unavailable: {e}")

lock = Lock()
counter = 0

def next_id():
    global counter
    with lock:
        counter += 1
        return counter

def is_ipv6(ip):
    try:
        addr = ipaddress.ip_address(ip.strip())
        return addr.version == 6
    except:
        return False

def valid_ip(x):
    try:
        ipaddress.ip_address(x.strip())
        return True
    except:
        return False

def resolve(host):
    try:
        info = socket.getaddrinfo(host, None, 0, 0, socket.SOL_TCP)
        for i in info:
            ip = i[4][0]
            if valid_ip(ip):
                return ip
        return host
    except:
        return host

def get_raw_iso_country(ip):
    if not geoip_available:
        return None
    ip = ip.strip()
    if not valid_ip(ip):
        return None
    try:
        if country_reader:
            r = country_reader.country(ip)
            iso_code = r.country.iso_code
            if iso_code:
                return iso_code
        if city_reader:
            r = city_reader.city(ip)
            iso_code = r.country.iso_code
            if iso_code:
                return iso_code
    except:
        pass
    return None


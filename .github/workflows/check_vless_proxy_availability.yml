name: Check VLESS proxy availability via Xray (base64 subscription)

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip python3 python3-pip
          python3 -m pip install --upgrade pip
          pip install geoip2

      - name: Download Xray
        run: |
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray

      - name: Prepare output files
        run: |
          mkdir -p githubmirror
          echo "# updated $(date -u)" > githubmirror/26_proxy_subscription_raw.txt

      - name: Get runner IP
        run: |
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Check VLESS via Xray and build raw subscription (10 threads)
        run: |
          python3 <<'EOF'
          import subprocess
          import time
          import json
          import urllib.parse
          import os
          import geoip2.database
          import socket
          from concurrent.futures import ThreadPoolExecutor, as_completed

          INPUT_FILE = 'githubmirror/26_ru_whitelist.txt'
          OUTPUT_FILE = 'githubmirror/26_proxy_subscription_raw.txt'
          RUNNER_IP = os.environ.get('RUNNER_IP', '')

          THREADS = 10
          BASE_PORT = 1080

          reader = geoip2.database.Reader('geolite2/GeoLite2-Country.mmdb')

          FLAGS = { ...same as before... }

          IP_CHECK_URLS = ["https://api.ipify.org", "https://ipinfo.io/ip"]
          HTML_CHECK_URLS = ["https://www.netflix.com", "https://www.instagram.com"]

          def get_country_flag(host):
              try:
                  ip = socket.gethostbyname(host)
                  return FLAGS.get(reader.country(ip).country.iso_code, '🏳️')
              except:
                  return '🏳️'

          def test_proxy(link, idx):
              port = BASE_PORT + idx
              try:
                  u = urllib.parse.urlparse(link)
                  q = urllib.parse.parse_qs(u.query)
                  sni = q.get('sni',[''])[0]

                  cfg = {
                      "inbounds":[{"listen":"127.0.0.1","port":port,"protocol":"socks","settings":{"udp":False}}],
                      "outbounds":[{"protocol":"vless",
                                     "settings":{"vnext":[{"address":u.hostname,"port":u.port or 443,"users":[{"id":u.username,"encryption":"none"}]}]},
                                     "streamSettings":{"network": q.get('type',['tcp'])[0]}}]
                  }

                  fname = f"cfg_{port}.json"
                  with open(fname,"w") as f:
                      json.dump(cfg,f)

                  p = subprocess.Popen(['./xray','-c',fname],
                                       stdout=subprocess.DEVNULL,
                                       stderr=subprocess.DEVNULL)
                  time.sleep(2)

                  # 1️⃣ Проверка IP
                  out_ip = None
                  for ip_url in IP_CHECK_URLS:
                      try:
                          resp = subprocess.check_output(
                              ['curl','-s','--max-time','6','--socks5-hostname',f'127.0.0.1:{port}', ip_url],
                              text=True
                          ).strip()
                          if resp and resp != RUNNER_IP:
                              out_ip = resp
                              break
                      except:
                          continue

                  # Если IP не получен — прокси мёртв
                  if not out_ip:
                      p.terminate()
                      time.sleep(1)
                      return None

                  # 2️⃣ Проверка открытия сайтов
                  html_ok = False
                  for site in HTML_CHECK_URLS:
                      try:
                          resp = subprocess.check_output(
                              ['curl','-s','--max-time','8','--socks5-hostname',f'127.0.0.1:{port}', site],
                              text=True
                          ).strip()
                          if resp:
                              html_ok = True
                              break
                      except:
                          continue

                  p.terminate()
                  time.sleep(1)

                  # Если ни один сайт не открылся — прокси мёртв
                  if not html_ok:
                      return None

                  in_flag = get_country_flag(u.hostname)
                  out_flag = get_country_flag(out_ip)
                  name = f"in {in_flag} RusL exit {out_flag} {sni}"
                  return link.split('#')[0] + '#' + name

              except:
                  return None

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(0)

          with open(INPUT_FILE) as f:
              links = [l.strip() for l in f if l.startswith('vless://')]

          results = []
          with ThreadPoolExecutor(max_workers=THREADS) as ex:
              futures = [ex.submit(test_proxy, link, i) for i, link in enumerate(links)]
              for f in as_completed(futures):
                  r = f.result()
                  if r:
                      results.append(r)

          with open(OUTPUT_FILE,'a') as f:
              for r in results:
                  f.write(r+'\n')

          print("OK proxies:", len(results))
          reader.close()
          EOF

      - name: Encode subscription to Base64
        run: |
          base64 -w 0 githubmirror/26_proxy_subscription_raw.txt > githubmirror/26_proxy_subscription_base64.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add githubmirror/26_proxy_subscription_raw.txt githubmirror/26_proxy_subscription_base64.txt
          git commit -m "Auto update VLESS subscription ($(date -u))" || exit 0
          git pull --rebase origin main || true
          git push

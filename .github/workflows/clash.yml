          def decode_base64(data):
              data = data.strip()
              padding = (-len(data)) % 4
              if padding:
                  data += "=" * padding
              try:
                  return base64.b64decode(data).decode("utf-8", errors="ignore")
              except:
                  return ""

          def parse_vless(uri):
              try:
                  parsed = urlparse(uri)
                  name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                  proxy = {
                      "name": name, "type": "vless", "server": parsed.hostname,
                      "port": parsed.port or 443, "uuid": parsed.username or "",
                      "udp": True, "skip-cert-verify": True, "encryption": "none",
                  }
                  if parsed.query:
                      query = parse_qs(parsed.query)
                      security = query.get("security", [""])[0]
                      if security == "tls":
                          proxy["tls"] = True
                      elif security == "reality":
                          proxy["tls"] = True
                          proxy["reality-opts"] = {}
                          if "pbk" in query:
                              proxy["reality-opts"]["public-key"] = query["pbk"][0]
                          if "sid" in query:
                              proxy["reality-opts"]["short-id"] = query["sid"][0]
                      if "sni" in query:
                          proxy["sni"] = query["sni"][0]
                      if "flow" in query:
                          proxy["flow"] = query["flow"][0]
                      if "fp" in query:
                          proxy["client-fingerprint"] = query["fp"][0]
                      if "type" in query:
                          t = query["type"][0]
                          if t == "ws":
                              proxy["network"] = "ws"
                              proxy["ws-opts"] = {
                                  "path": query.get("path", ["/"])[0],
                                  "headers": {"Host": query.get("host", [parsed.hostname])[0]}
                              }
                          elif t == "grpc":
                              proxy["network"] = "grpc"
                              proxy["grpc-opts"] = {
                                  "grpc-service-name": query.get("serviceName", [""])[0]
                              }
                          elif t == "tcp":
                              proxy["network"] = "tcp"
                  return proxy
              except Exception as e:
                  print(f"  ⚠️ Error parsing VLESS: {e}")
                  return None

          def parse_vmess(uri):
              try:
                  b64_part = uri[len("vmess://"):].strip()
                  decoded = decode_base64(b64_part)
                  vmess_json = json.loads(decoded)
                  proxy = {
                      "name": vmess_json.get("ps", "VMess"),
                      "type": "vmess",
                      "server": vmess_json.get("add", ""),
                      "port": int(vmess_json.get("port", 0)),
                      "uuid": vmess_json.get("id", ""),
                      "alterId": int(vmess_json.get("aid", 0)),
                      "cipher": vmess_json.get("scy", "auto"),
                      "network": vmess_json.get("net", "tcp"),
                      "udp": True,
                  }
                  net = vmess_json.get("net", "tcp")
                  if net == "ws":
                      proxy["ws-opts"] = {"path": vmess_json.get("path", "/"), "headers": {"Host": vmess_json.get("host", vmess_json.get("add", ""))}}
                  elif net == "grpc":
                      proxy["grpc-opts"] = {"grpc-service-name": vmess_json.get("path", "")}
                  if vmess_json.get("tls") == "tls":
                      proxy["tls"] = True
                      proxy["skip-cert-verify"] = True
                      proxy["sni"] = vmess_json.get("sni", vmess_json.get("add", ""))
                  return proxy
              except Exception as e:
                  print(f"  ⚠️ Error parsing VMess: {e}")
                  return None

          def parse_trojan(uri):
              try:
                  parsed = urlparse(uri)
                  name = unquote(parsed.fragment) if parsed.fragment else "Trojan"
                  proxy = {
                      "name": name, "type": "trojan", "server": parsed.hostname,
                      "port": parsed.port or 443, "password": parsed.username or "",
                      "udp": True, "skip-cert-verify": True,
                  }
                  if parsed.query:
                      query = parse_qs(parsed.query)
                      if "sni" in query: proxy["sni"] = query["sni"][0]
                      if "type" in query:
                          t = query["type"][0]
                          if t == "ws":
                              proxy["network"] = "ws"
                              proxy["ws-opts"] = {"path": query.get("path", ["/"])[0], "headers": {"Host": query.get("host", [parsed.hostname])[0]}}
                          elif t == "grpc":
                              proxy["network"] = "grpc"
                              proxy["grpc-opts"] = {"grpc-service-name": query.get("serviceName", [""])[0]}
                  return proxy
              except Exception as e:
                  print(f"  ⚠️ Error parsing Trojan: {e}")
                  return None

          def parse_shadowsocks(uri):
              try:
                  if "#" in uri:
                      uri_part, name_part = uri.split("#", 1)
                      name = unquote(name_part)
                  else:
                      uri_part, name = uri, "Shadowsocks"
                  uri_part = uri_part[len("ss://"):]
                  if "@" not in uri_part: return None
                  userinfo, server_port = uri_part.split("@", 1)
                  try:
                      decoded = decode_base64(userinfo)
                      cipher, password = decoded.split(":", 1)
                  except:
                      cipher, password = ("aes-256-gcm", userinfo) if ":" not in userinfo else userinfo.split(":", 1)
                  server, port = server_port.rsplit(":", 1)
                  return {"name": name, "type": "ss", "server": server, "port": int(port), "cipher": cipher, "password": password, "udp": True}
              except Exception as e:
                  print(f"  ⚠️ Error parsing SS: {e}")
                  return None

          def parse_hysteria2(uri):
              try:
                  parsed = urlparse(uri)
                  name = unquote(parsed.fragment) if parsed.fragment else "Hysteria2"
                  proxy = {"name": name, "type": "hysteria2", "server": parsed.hostname, "port": parsed.port or 443, "password": parsed.username or "", "skip-cert-verify": True}
                  if parsed.query:
                      q = parse_qs(parsed.query)
                      if "auth" in q and not proxy["password"]: proxy["password"] = q["auth"][0]
                      if "sni" in q: proxy["sni"] = q["sni"][0]
                  return proxy
              except Exception as e:
                  print(f"  ⚠️ Error parsing Hysteria2: {e}")
                  return None

          def parse_tuic(uri):
              try:
                  parsed = urlparse(uri)
                  name = unquote(parsed.fragment) if parsed.fragment else "Tuic"
                  uuid = password = ""
                  if parsed.username and ":" in parsed.username:
                      uuid, password = parsed.username.split(":", 1)
                  else:
                      uuid = parsed.username or ""
                  proxy = {"name": name, "type": "tuic", "server": parsed.hostname, "port": parsed.port or 443, "uuid": uuid, "password": password, "udp": True, "skip-cert-verify": True}
                  if parsed.query and "sni" in parse_qs(parsed.query):
                      proxy["sni"] = parse_qs(parsed.query)["sni"][0]
                  return proxy
              except Exception as e:
                  print(f"  ⚠️ Error parsing Tuic: {e}")
                  return None

          def parse_proxies_from_text(text):
              proxies = []
              parsers = {
                  "vless://": parse_vless,
                  "vmess://": parse_vmess,
                  "trojan://": parse_trojan,
                  "ss://": parse_shadowsocks,
                  "hysteria2://": parse_hysteria2,
                  "hy2://": parse_hysteria2,
                  "tuic://": parse_tuic,
              }
              for line in text.strip().splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  for prefix, parser in parsers.items():
                      if line.startswith(prefix):
                          proxy = parser(line)
                          if proxy:
                              proxies.append(proxy)
                          break
              return proxies

          def fix_duplicate_names(proxies):
              name_counts = {}
              fixed = []
              for proxy in proxies:
                  name = proxy["name"]
                  if name in name_counts:
                      name_counts[name] += 1
                      proxy["name"] = f"{name} ({name_counts[name]})"
                  else:
                      name_counts[name] = 1
                  fixed.append(proxy)
              return fixed

          def detect_country(proxy):
              name = (proxy.get("name") or "").lower()
              for flag, keywords in COUNTRY_MAP.items():
                  for kw in keywords:
                      if kw.lower() in name:
                          return flag
              return "🌍"

          def filter_alive_proxies(proxies):
              if not CHECK_ALIVE:
                  print(f"⏭️  Проверка доступности отключена — оставляем все {len(proxies)} серверов")
                  return proxies
              alive = []
              print(f"🔍 Проверяем {len(proxies)} серверов...")
              return alive

          def build_proxy_groups(proxies):
              if not proxies:
                  return []
              
              all_names = [p["name"] for p in proxies]
              by_country = defaultdict(list)
              for p in proxies:
                  country = detect_country(p)
                  by_country[country].append(p["name"])
              
              groups = []
              
              groups.append({
                  "name": "🚀 Auto",
                  "type": "url-test",
                  "proxies": all_names,
                  "url": "http://www.gstatic.com/generate_204",
                  "interval": 300,
                  "tolerance": 150,
                  "lazy": True
              })
              
              groups.append({
                  "name": "🎯 Manual",
                  "type": "select",
                  "proxies": ["🚀 Auto"] + all_names
              })
              
              country_names = {
                  '🇺🇸': '🇺🇸 USA', '🇳🇱': '🇳🇱 Netherlands', '🇩🇪': '🇩🇪 Germany',
                  '🇬🇧': '🇬🇧 UK', '🇫🇷': '🇫🇷 France', '🇵🇱': '🇵🇱 Poland',
                  '🇷🇴': '🇷🇴 Romania', '🇸🇪': '🇸🇪 Sweden', '🇫🇮': '🇫🇮 Finland',
                  '🇱🇻': '🇱🇻 Latvia', '🇰🇿': '🇰🇿 Kazakhstan', '🇲🇩': '🇲🇩 Moldova',
                  '🇨🇦': '🇨🇦 Canada', '🇯🇵': '🇯🇵 Japan', '🇸🇬': '🇸🇬 Singapore',
                  '🇭🇰': '🇭🇰 Hong Kong', '🇹🇼': '🇹🇼 Taiwan', '🇰🇷': '🇰🇷 Korea',
                  '🇦🇺': '🇦🇺 Australia', '🇹🇷': '🇹🇷 Turkey', '🇮🇳': '🇮🇳 India',
                  '🌍': '🌍 Other'
              }
              
              for flag, names in by_country.items():
                  if len(names) >= 1:
                      group_name = country_names.get(flag, f"{flag} Servers")
                      if len(names) > 1:
                          groups.append({
                              "name": group_name,
                              "type": "url-test",
                              "proxies": names,
                              "url": "http://www.gstatic.com/generate_204",
                              "interval": 300,
                              "tolerance": 150
                          })
                      else:
                          groups.append({
                              "name": group_name,
                              "type": "select",
                              "proxies": names
                          })
              
              special_groups = [
                  "📱 Telegram",
                  "📺 Streaming",
                  "🌐 Social",
                  "🔍 Google",
                  "💻 Dev",
                  "🎮 Games",
              ]
              
              for name in special_groups:
                  groups.append({
                      "name": name,
                      "type": "select",
                      "proxies": ["🚀 Auto", "DIRECT"] + all_names
                  })
              
              groups.append({
                  "name": "BLOCK",
                  "type": "select",
                  "proxies": ["REJECT", "REJECT-DROP", "DIRECT"]
              })
              
              return groups

          def validate_rules(rules, proxies, groups):
              valid_names = {"DIRECT", "REJECT", "REJECT-DROP", "PASS"}
              for p in proxies:
                  valid_names.add(p["name"])
              for g in groups:
                  valid_names.add(g["name"])
              
              invalid = []
              for rule in rules:
                  parts = rule.split(",")
                  if len(parts) >= 2:
                      target = parts[-1]
                      if target not in valid_names and not target.startswith("no-resolve"):
                          invalid.append((rule, target))
              
              return invalid

          def main():
              print("=" * 60)
              print("🏗️  MIHOMO CONSTRUCTOR (GitHub Actions Edition)")
              print("=" * 60)
              
              print(f"\n📥 Загрузка подписки: {SOURCE_URL}")
              try:
                  response = requests.get(SOURCE_URL, timeout=30)
                  response.raise_for_status()
                  content = response.text
              except Exception as e:
                  print(f"❌ Ошибка загрузки: {e}")
                  return 1
              
              print("🔍 Парсинг ссылок...")
              all_proxies = parse_proxies_from_text(content)
              print(f"📊 Найдено прокси: {len(all_proxies)}")
              
              if not all_proxies:
                  print("❌ Не найдено ни одной ссылки!")
                  return 1
              
              alive_proxies = filter_alive_proxies(all_proxies)
              if not alive_proxies:
                  print("❌ Все серверы недоступны!")
                  return 1
              
              fixed_proxies = fix_duplicate_names(alive_proxies)
              
              stats = defaultdict(int)
              for p in fixed_proxies:
                  stats[p["type"]] += 1
              print("\n📈 Статистика по типам:")
              for t, c in stats.items():
                  print(f"   {t}: {c}")
              
              reality_count = sum(1 for p in fixed_proxies if p.get("reality-opts"))
              print(f"   🔐 Reality: {reality_count}")
              
              print("\n🔧 Создание proxy-groups...")
              groups = build_proxy_groups(fixed_proxies)

name: Update Clash Config (Mihomo Constructor)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Run Mihomo Constructor
        run: |
          cat > constructor.py << 'PYEOF'
          import requests
          import yaml
          import base64
          import json
          from urllib.parse import urlparse, parse_qs, unquote
          from datetime import datetime, timezone

          SOURCE_URL = "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt"
          OUTPUT_FILE = "config.yaml"

          def decode_base64(data):
              data = data.strip()
              padding = (-len(data)) % 4
              if padding:
                  data += "=" * padding
              try:
                  return base64.b64decode(data).decode("utf-8", errors="ignore")
              except:
                  return ""

          def parse_vless(uri):
              try:
                  parsed = urlparse(uri)
                  name = unquote(parsed.fragment) if parsed.fragment else f"VLESS {parsed.hostname}"
                  
                  proxy = {
                      "name": name,
                      "type": "vless",
                      "server": parsed.hostname,
                      "port": int(parsed.port) if parsed.port else 443,
                      "uuid": parsed.username or "",
                      "udp": True,
                      "skip-cert-verify": True,
                      "network": "tcp",
                      "encryption": "none"
                  }

                  if parsed.query:
                      q = parse_qs(parsed.query)
                      security = q.get("security", [""])[0]

                      if security in ["tls", "reality"]:
                          proxy["tls"] = True

                      if security == "reality":
                          proxy["reality-opts"] = {}
                          pbk = q.get("pbk") or q.get("publickey")
                          if pbk:
                              proxy["reality-opts"]["public-key"] = pbk[0]
                          sid = q.get("sid") or q.get("shortid")
                          if sid:
                              proxy["reality-opts"]["short-id"] = sid[0]

                      sni = q.get("sni") or q.get("servername")
                      if sni:
                          proxy["servername"] = sni[0]

                      if "flow" in q:
                          proxy["flow"] = q["flow"][0]
                      if "fp" in q or "fingerprint" in q:
                          proxy["client-fingerprint"] = (q.get("fp") or q.get("fingerprint"))[0]

                      t = q.get("type", ["tcp"])[0]
                      if t == "ws":
                          proxy["network"] = "ws"
                          proxy["ws-opts"] = {
                              "path": q.get("path", ["/"])[0],
                              "headers": {"Host": q.get("host", [proxy.get("servername") or parsed.hostname])[0]}
                          }
                      elif t == "grpc":
                          proxy["network"] = "grpc"
                          proxy["grpc-opts"] = {"grpc-service-name": q.get("serviceName", [""])[0]}

                  return proxy
              except Exception as e:
                  print(f"⚠️ VLESS parse error: {e}")
                  return None

          def parse_proxies_from_text(text):
              proxies = []
              parsers = {
                  "vless://": parse_vless,
                  "vmess://": lambda x: None,
                  "trojan://": lambda x: None,
                  "ss://": lambda x: None,
              }
              for line in text.strip().splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  for prefix, parser in parsers.items():
                      if line.lower().startswith(prefix):
                          p = parser(line)
                          if p:
                              proxies.append(p)
                          break
              return proxies

          def fix_duplicate_names(proxies):
              seen = {}
              for p in proxies:
                  base = p["name"]
                  if base in seen:
                      seen[base] += 1
                      p["name"] = f"{base} ({seen[base]})"
                  else:
                      seen[base] = 1
              return proxies

          def main():
              print("🚀 Загрузка подписки...")
              r = requests.get(SOURCE_URL, timeout=60)
              r.raise_for_status()
              
              proxies = parse_proxies_from_text(r.text)
              print(f"📊 Найдено прокси: {len(proxies)}")
              
              proxies = fix_duplicate_names(proxies)

              config = {
                  "mode": "rule",
                  "tproxy-port": 7894,
                  "tun": {
                      "enable": True,
                      "device": "clash-tun",
                      "stack": "gvisor",
                      "auto-route": False,
                      "auto-redirect": False,
                      "auto-detect-interface": False
                  },
                  "ipv6": False,
                  "log-level": "warning",
                  "allow-lan": True,
                  "unified-delay": True,
                  "tcp-concurrent": True,
                  "external-controller": "0.0.0.0:9090",
                  "external-ui": "./ui",
                  "external-ui-url": "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip",

                  "dns": {
                      "enable": True,
                      "listen": "0.0.0.0:7874",
                      "ipv6": False,
                      "default-nameserver": ["9.9.9.9", "149.112.112.112"],
                      "nameserver": [
                          "https://dns.quad9.net/dns-query",
                          "https://dns10.quad9.net/dns-query"
                      ],
                      "nameserver-policy": {
                          "+.lan": "system",
                          "*.lan": "system",
                          "msftconnecttest.com": "system",
                          "msftncsi.com": "system",
                          "kion.ru": "system"
                      },
                      "enhanced-mode": "fake-ip",
                      "fake-ip-range": "198.18.0.0/15",
                      "fake-ip-filter-mode": "whitelist",
                      "fake-ip-filter": [
                          "*.4pda.to", "*.4pda.ws", "ip.wtf", "*.ip.wtf",
                          "workspace.turns.goog", "*.workspace.turns.goog",
                          "meet.turns.goog", "*.meet.turns.goog",
                          "meet.google.com", "*.meet.google.com"
                      ]
                  },

                  "keep-alive-idle": 15,
                  "keep-alive-interval": 15,

                  "profile": {
                      "store-selected": True,
                      "store-fake-ip": True
                  },

                  "routing-mark": 2,

                  "sniffer": {
                      "enable": True,
                      "force-dns-mapping": True,
                      "parse-pure-ip": True,
                      "sniff": {
                          "HTTP": {"ports": [80, 8080, 8880], "override-destination": True},
                          "TLS": {"ports": [443, 8443]}
                      },
                      "skip-domain": [
                          "Mijia Cloud", "+.lan", "+.msftncsi.com",
                          "+.openwrt.org", "+.vsean.net", "cudy.net"
                      ]
                  },

                  "proxies": proxies,

                  "proxy-groups": [
                      {"name": "AI", "type": "fallback", "interval": 300, "include-all": True, "exclude-filter": "🇷🇺|Russia|Россия|Беларусь|Казахстан"},
                      {"name": "PROXY", "type": "url-test", "interval": 300, "include-all": True, "exclude-filter": "🇷🇺|Russia|Россия|Kazakhstan"},
                      {"name": "PROXY-RU", "type": "url-test", "interval": 60, "include-all": True, "filter": "🇷🇺|Russia|Россия"},
                      {"name": "YOUTUBE", "type": "url-test", "interval": 30, "proxies": ["PROXY-RU", "PROXY"]},
                      {"name": "INSTAGRAM", "type": "fallback", "proxies": ["PROXY", "PROXY-RU"]}
                  ],

                  "rules": [
                      "DOMAIN-KEYWORD,4pda,PROXY",
                      "DOMAIN-SUFFIX,ip.wtf,PROXY",
                      "RULE-SET,telegram,PROXY",
                      "RULE-SET,trae,PROXY",
                      "RULE-SET,tik-tok,PROXY",
                      "RULE-SET,whatsapp,PROXY",
                      "RULE-SET,google-ai,PROXY",
                      "RULE-SET,adobe,PROXY",
                      "RULE-SET,claude,AI",
                      "RULE-SET,discord-domain,PROXY",
                      "RULE-SET,facebook,INSTAGRAM",
                      "RULE-SET,github,PROXY",
                      "RULE-SET,youtube,YOUTUBE",
                      "RULE-SET,instagram,INSTAGRAM",
                      "RULE-SET,openai,AI",
                      "RULE-SET,ru-blocked,PROXY",
                      "RULE-SET,itdog-ru,PROXY",
                      "MATCH,GLOBAL"
                  ]
              }

              header = f"# Mihomo Config (ssclash)\n# Generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n# Proxies: {len(proxies)}\n\n"

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write(header)
                  yaml.dump(config, f, allow_unicode=True, sort_keys=False, default_flow_style=False)

              print(f"✅ config.yaml успешно обновлён ({len(proxies)} прокси)")
              return 0

          if __name__ == "__main__":
              main()
          PYEOF
          python constructor.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add config.yaml
          
          if git diff --staged --quiet; then
            echo "⚪ Нет изменений"
          else
            git commit -m "🔄 Auto update config [$(date +'%Y-%m-%d %H:%M')]"
            git push
            echo "✅ Обновлено и запушено"
          fi

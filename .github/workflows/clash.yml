name: Update Clash Config (Mihomo Constructor)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Run Mihomo Constructor
        run: |
          cat > constructor.py << 'PYEOF'
          import requests
          import yaml
          import base64
          import json
          import re
          from urllib.parse import urlparse, parse_qs, unquote, quote
          from datetime import datetime, timezone

          SOURCE_URL = "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt"
          OUTPUT_FILE = "config.yaml"

          def parse_vless(uri):
              try:
                  if not uri.startswith('vless://'):
                      return None
                  
                  # Убираем префикс
                  uri_part = uri[8:]
                  
                  # Разделяем на основную часть и фрагмент (имя)
                  if '#' in uri_part:
                      main_part, fragment = uri_part.rsplit('#', 1)
                      name = unquote(fragment).strip()
                  else:
                      main_part = uri_part
                      name = "VLESS"
                  
                  # Разделяем uuid@host:port?params
                  if '@' not in main_part:
                      print(f"⚠️ Нет @ в URI: {uri[:50]}...")
                      return None
                  
                  uuid_part, host_port_query = main_part.split('@', 1)
                  uuid = uuid_part
                  
                  # ВАЖНО: Сначала отделяем параметры запроса
                  if '?' in host_port_query:
                      host_port, query_string = host_port_query.split('?', 1)
                  else:
                      host_port = host_port_query
                      query_string = ''
                  
                  # Теперь парсим host:port
                  if ':' not in host_port:
                      print(f"⚠️ Нет : в host:port: {host_port}")
                      return None
                  
                  # Обрабатываем IPv6 и обычные адреса
                  if host_port.startswith('['):
                      # IPv6
                      match = re.match(r'\[([^\]]+)\]:(\d+)', host_port)
                      if match:
                          host = match.group(1)
                          port = int(match.group(2))
                      else:
                          return None
                  else:
                      # Обычный host:port
                      parts = host_port.rsplit(':', 1)
                      host = parts[0]
                      port = int(parts[1])
                  
                  proxy = {
                      "name": name if name else f"VLESS {host}:{port}",
                      "type": "vless",
                      "server": host,
                      "port": port,
                      "uuid": uuid,
                      "udp": True,
                      "skip-cert-verify": True,
                      "network": "tcp",
                      "encryption": "none"
                  }
                  
                  # Парсим параметры
                  if query_string:
                      params = parse_qs(query_string)
                      
                      # Security (tls/reality)
                      security = params.get('security', ['none'])[0]
                      if security == 'tls':
                          proxy['tls'] = True
                      elif security == 'reality':
                          proxy['tls'] = True
                          proxy['reality-opts'] = {}
                          
                          # Public key
                          if 'pbk' in params:
                              proxy['reality-opts']['public-key'] = params['pbk'][0]
                          
                          # Short ID
                          if 'sid' in params:
                              proxy['reality-opts']['short-id'] = params['sid'][0]
                      
                      # SNI
                      if 'sni' in params:
                          proxy['servername'] = params['sni'][0]
                      elif 'servername' in params:
                          proxy['servername'] = params['servername'][0]
                      
                      # Flow
                      if 'flow' in params:
                          proxy['flow'] = params['flow'][0]
                      
                      # Fingerprint
                      if 'fp' in params:
                          proxy['client-fingerprint'] = params['fp'][0]
                      elif 'fingerprint' in params:
                          proxy['client-fingerprint'] = params['fingerprint'][0]
                      
                      # Type (transport)
                      if 'type' in params:
                          net_type = params['type'][0]
                          proxy['network'] = net_type
                          
                          if net_type == 'ws':
                              proxy['ws-opts'] = {}
                              if 'path' in params:
                                  proxy['ws-opts']['path'] = params['path'][0]
                              if 'host' in params:
                                  proxy['ws-opts']['headers'] = {'Host': params['host'][0]}
                              elif 'sni' in params:
                                  proxy['ws-opts']['headers'] = {'Host': params['sni'][0]}
                          
                          elif net_type == 'grpc':
                              proxy['grpc-opts'] = {}
                              if 'serviceName' in params:
                                  proxy['grpc-opts']['grpc-service-name'] = params['serviceName'][0]
                              elif 'path' in params:
                                  proxy['grpc-opts']['grpc-service-name'] = params['path'][0]
                              else:
                                  proxy['grpc-opts']['grpc-service-name'] = ''
                  
                  # Проверяем обязательные поля
                  if not proxy.get('uuid'):
                      print(f"⚠️ Нет UUID: {uri[:50]}...")
                      return None
                  
                  return proxy
                  
              except Exception as e:
                  print(f"⚠️ VLESS parse error: {e}")
                  print(f"  URI: {uri[:100]}...")
                  import traceback
                  traceback.print_exc()
                  return None

          def parse_proxies_from_text(text):
              proxies = []
              lines = text.strip().splitlines()
              print(f"📄 Всего строк в подписке: {len(lines)}")
              
              for line in lines:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  
                  if line.lower().startswith('vless://'):
                      p = parse_vless(line)
                      if p:
                          proxies.append(p)
                          print(f"✅ Добавлен: {p['name']} ({p['server']}:{p['port']})")
                      else:
                          print(f"❌ Не распарсен: {line[:80]}...")
                  elif line.lower().startswith('vmess://'):
                      print(f"⏭️ Пропущен VMess: {line[:50]}...")
                  elif line.lower().startswith('trojan://'):
                      print(f"⏭️ Пропущен Trojan: {line[:50]}...")
                  elif line.lower().startswith('ss://'):
                      print(f"⏭️ Пропущен Shadowsocks: {line[:50]}...")
                  else:
                      print(f"❓ Неизвестный протокол: {line[:50]}...")
              
              return proxies

          def fix_duplicate_names(proxies):
              seen = {}
              for p in proxies:
                  base = p["name"]
                  if base in seen:
                      seen[base] += 1
                      p["name"] = f"{base} ({seen[base]})"
                  else:
                      seen[base] = 1
              return proxies

          def main():
              print("🚀 Загрузка подписки...")
              try:
                  r = requests.get(SOURCE_URL, timeout=60)
                  r.raise_for_status()
                  print(f"📥 Загружено байт: {len(r.text)}")
              except Exception as e:
                  print(f"❌ Ошибка загрузки: {e}")
                  return 1
              
              proxies = parse_proxies_from_text(r.text)
              print(f"\n📊 Найдено рабочих прокси: {len(proxies)}")
              
              if len(proxies) == 0:
                  print("⚠️ ВНИМАНИЕ: Не найдено ни одного прокси!")
                  print("Проверьте ссылку на подписку")
                  return 1
              
              proxies = fix_duplicate_names(proxies)

              # Конфигурация для Mihomo/Clash.Meta
              config = {
                  "mode": "rule",
                  "mixed-port": 7890,
                  "allow-lan": True,
                  "log-level": "info",
                  "ipv6": False,
                  
                  "tun": {
                      "enable": False,
                      "stack": "gvisor",
                      "auto-route": False
                  },
                  
                  "dns": {
                      "enable": True,
                      "listen": "0.0.0.0:53",
                      "ipv6": False,
                      "enhanced-mode": "fake-ip",
                      "fake-ip-range": "198.18.0.1/16",
                      "nameserver": [
                          "8.8.8.8",
                          "1.1.1.1",
                          "9.9.9.9"
                      ],
                      "fallback": [
                          "tls://8.8.8.8",
                          "tls://1.1.1.1"
                      ]
                  },
                  
                  "proxies": proxies,
                  
                  "proxy-groups": [
                      {
                          "name": "🚀 Auto",
                          "type": "url-test",
                          "proxies": [p["name"] for p in proxies[:10]],
                          "url": "https://www.google.com/generate_204",
                          "interval": 300,
                          "tolerance": 50
                      },
                      {
                          "name": "🌍 Proxy",
                          "type": "select",
                          "proxies": ["🚀 Auto"] + [p["name"] for p in proxies]
                      },
                      {
                          "name": "🎯 Direct",
                          "type": "select",
                          "proxies": ["DIRECT", "🌍 Proxy"]
                      }
                  ],
                  
                  "rules": [
                      "MATCH,🌍 Proxy"
                  ]
              }

              # Сохраняем
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  yaml.dump(config, f, allow_unicode=True, sort_keys=False, default_flow_style=False, indent=2)

              print(f"\n✅ {OUTPUT_FILE} создан успешно!")
              print(f"   Прокси: {len(proxies)}")
              return 0

          if __name__ == "__main__":
              exit(main())
          PYEOF
          python constructor.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add config.yaml
          
          if git diff --staged --quiet; then
            echo "⚪ Нет изменений"
          else
            git commit -m "🔄 Auto update config [$(date +'%Y-%m-%d %H:%M')]"
            git push
            echo "✅ Обновлено и запушено"
          fi

name: Sync Karing Android, Windows, Geo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [karing_release]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # ---------------- iOS links ----------------
      - name: Update iOS links in README
        run: |
          sed -i '/^## iOS/i ## iOS\\n- [Karing](https://apps.apple.com/us/app/karing/id6472431552)\\n- [Hiddify Proxy VPN](https://apps.apple.com/us/app/hiddify-proxy-vpn/id6596777532)\\n' README.md || true

      # ---------------- Android ----------------
      - name: Fetch latest Karing Android release
        run: |
          curl -s "https://api.github.com/repos/KaringX/karing/releases/latest" > release_android.json

      - name: Extract Android version and URLs
        run: |
          ANDROID_VERSION=$(jq -r '.tag_name // empty' release_android.json)
          ARM64_URL=$(jq -r '.assets[]? | select(.name | contains("android_arm64-v8a.apk")) | .browser_download_url // empty' release_android.json)
          ARMV7_URL=$(jq -r '.assets[]? | select(.name | contains("android_armeabi-v7a.apk")) | .browser_download_url // empty' release_android.json)
          echo "Android version: $ANDROID_VERSION"
          echo "ARM64 URL: $ARM64_URL"
          echo "ARMV7 URL: $ARMV7_URL"

      - name: Clean old Android APKs
        run: |
          rm -rf apk
          mkdir -p apk

      - name: Download Android APKs
        run: |
          if [ -n "$ARM64_URL" ]; then curl -L "$ARM64_URL" -o apk/karing_android_arm64-v8a.apk; fi
          if [ -n "$ARMV7_URL" ]; then curl -L "$ARMV7_URL" -o apk/karing_android_armeabi-v7a.apk; fi

      - name: Download latest Hiddify Android APK
        run: |
          HIDDIFY_ANDROID_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-app/releases/latest | jq -r '.assets[]? | select(.name | test("Hiddify-Android-universal\\.apk$")) | .browser_download_url // empty')
          if [ -n "$HIDDIFY_ANDROID_URL" ]; then
            curl -L "$HIDDIFY_ANDROID_URL" -o apk/Hiddify-Android-universal.apk
            echo "Hiddify Android: $HIDDIFY_ANDROID_URL"
          fi

      - name: Download latest NekoBox Android APK
        run: |
          NEKOBOX_ANDROID_URL=$(curl -s https://api.github.com/repos/starifly/NekoBoxForAndroid/releases/latest | jq -r '.assets[]? | select(.name | test("arm64-v8a\\.apk$")) | .browser_download_url // empty')
          if [ -n "$NEKOBOX_ANDROID_URL" ]; then
            curl -L "$NEKOBOX_ANDROID_URL" -o apk/NekoBox-Android-arm64-v8a.apk
            echo "NekoBox Android: $NEKOBOX_ANDROID_URL"
          fi

      - name: Generate Android SHA256SUMS (proper format)
        run: |
          if [ -d apk ] && ls apk/*.apk >/dev/null 2>&1; then
            cd apk
            sha256sum *.apk | sed 's/  / */g' > SHA256SUMS
            cd ..
            echo "Android SHA256SUMS generated correctly"
          fi

      # ---------------- Windows ----------------
      - name: Fetch latest Karing Windows release
        run: |
          curl -s "https://api.github.com/repos/KaringX/karing/releases/latest" > release_windows.json

      - name: Extract Windows version and URLs
        run: |
          WIN_VERSION=$(jq -r '.tag_name // empty' release_windows.json)
          X64_URL=$(jq -r '.assets[]? | select(.name | contains("windows_x64.exe")) | .browser_download_url // empty' release_windows.json)
          X86_URL=$(jq -r '.assets[]? | select(.name | contains("windows_x86.exe")) | .browser_download_url // empty' release_windows.json)
          echo "Windows version: $WIN_VERSION"

      - name: Clean old Windows files
        run: |
          rm -rf windows
          mkdir -p windows

      - name: Download Windows EXEs
        run: |
          if [ -n "$X64_URL" ]; then curl -L "$X64_URL" -o windows/karing_windows_x64.exe; fi
          if [ -n "$X86_URL" ]; then curl -L "$X86_URL" -o windows/karing_windows_x86.exe; fi

      - name: Download latest Hiddify Windows installer
        run: |
          HIDDIFY_WINDOWS_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-app/releases/latest | jq -r '.assets[]? | select(.name | test("Hiddify-Windows-Setup-x64\\.exe$")) | .browser_download_url // empty')
          if [ -n "$HIDDIFY_WINDOWS_URL" ]; then
            curl -L "$HIDDIFY_WINDOWS_URL" -o windows/Hiddify-Windows-Setup-x64.exe
            echo "Hiddify Windows: $HIDDIFY_WINDOWS_URL"
          fi

      - name: Generate Windows SHA256SUMS (proper format)
        run: |
          if [ -d windows ] && ls windows/*.exe >/dev/null 2>&1; then
            cd windows
            sha256sum *.exe | sed 's/  / */g' > SHA256SUMS
            cd ..
            echo "Windows SHA256SUMS generated correctly"
          fi

      # ---------------- GeoLite2 ---------------- (остаётся без изменений)
      - name: Fetch latest GeoLite2 release
        run: |
          curl -s "https://api.github.com/repos/P3TERX/GeoLite.mmdb/releases/latest" > release_geolite.json

      - name: Extract GeoLite2 URLs
        run: |
          ASN_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-ASN.mmdb")) | .browser_download_url // empty' release_geolite.json)
          CITY_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-City.mmdb")) | .browser_download_url // empty' release_geolite.json)
          COUNTRY_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-Country.mmdb")) | .browser_download_url // empty' release_geolite.json)

      - name: Clean old GeoLite2
        run: |
          rm -rf geolite2
          mkdir -p geolite2

      - name: Download GeoLite2
        run: |
          if [ -n "$ASN_URL" ]; then curl -L "$ASN_URL" -o geolite2/GeoLite2-ASN.mmdb; fi
          if [ -n "$CITY_URL" ]; then curl -L "$CITY_URL" -o geolite2/GeoLite2-City.mmdb; fi
          if [ -n "$COUNTRY_URL" ]; then curl -L "$COUNTRY_URL" -o geolite2/GeoLite2-Country.mmdb; fi

      - name: Generate GeoLite2 SHA256SUMS (proper format)
        run: |
          if [ -d geolite2 ] && ls geolite2/*.mmdb >/dev/null 2>&1; then
            cd geolite2
            sha256sum *.mmdb | sed 's/  / */g' > SHA256SUMS
            cd ..
          fi

      # ---------------- GeoIP / Geosite ----------------
      - name: Clean old GeoIP / Geosite
        run: |
          rm -rf geoip
          mkdir -p geoip

      - name: Download GeoIP / Geosite latest
        run: |
          curl -L "https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geoip.dat" -o geoip/geoip.dat || true
          curl -L "https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geosite.dat" -o geoip/geosite.dat || true

      - name: Generate GeoIP SHA256SUMS (proper format)
        run: |
          if [ -d geoip ] && ls geoip/* >/dev/null 2>&1; then
            cd geoip
            sha256sum * | sed 's/  / */g' > SHA256SUMS
            cd ..
          fi

      # ---------------- Update README ----------------
      - name: Update README with new links
        run: |
          # Android section
          sed -i '/## Karing (Android)/,/^## /s|$|\\\n- [Hiddify Android](https://github.com/Rusl2023/vpn-alive-check/raw/main/apk/Hiddify-Android-universal.apk)|g' README.md || true
          sed -i '/## Karing (Android)/,/^## /s|$|\\\n- [NekoBox Android](https://github.com/Rusl2023/vpn-alive-check/raw/main/apk/NekoBox-Android-arm64-v8a.apk)|g' README.md || true
          
          # Windows section  
          sed -i '/## Karing (Windows)/,/^## /s|$|\\\n- [Hiddify Windows](https://github.com/Rusl2023/vpn-alive-check/raw/main/windows/Hiddify-Windows-Setup-x64.exe)|g' README.md || true

      # ---------------- Commit & Push ----------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/ windows/ geolite2/ geoip/ README.md || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync latest Karing apps + Geo files"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

name: Sync Karing Android, Windows, Geo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [karing_release]

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # ---------------- iOS ----------------
      - name: Ensure iOS section in README
        run: |
          set -e
          touch README.md
          if ! grep -q '^## iOS' README.md; then
            echo "" >> README.md
            echo "## iOS" >> README.md
            echo "- [Karing](https://apps.apple.com/us/app/karing/id6472431552)" >> README.md
            echo "- [Hiddify Proxy VPN](https://apps.apple.com/us/app/hiddify-proxy-vpn/id6596777532)" >> README.md
            echo "" >> README.md
          fi

      # ---------------- Download files (но не коммитим их) ----------------
      - name: Prepare directories
        run: |
          rm -rf apk windows geolite2 geoip
          mkdir -p apk windows geolite2 geoip

      # Android
      - name: Download Karing Android APKs
        run: |
          set -e
          ANDROID_VERSION=$(curl -s https://api.github.com/repos/KaringX/karing/releases/latest | jq -r '.tag_name // empty')
          echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV

          ARM64_URL=$(curl -s https://api.github.com/repos/KaringX/karing/releases/latest | jq -r '.assets[]? | select(.name | contains("android_arm64-v8a.apk")) | .browser_download_url // empty')
          ARMV7_URL=$(curl -s https://api.github.com/repos/KaringX/karing/releases/latest | jq -r '.assets[]? | select(.name | contains("android_armeabi-v7a.apk")) | .browser_download_url // empty')

          if [ -n "$ARM64_URL" ]; then curl -L "$ARM64_URL" -o apk/karing_android_arm64-v8a.apk; fi
          if [ -n "$ARMV7_URL" ]; then curl -L "$ARMV7_URL" -o apk/karing_android_armeabi-v7a.apk; fi

      - name: Download Hiddify & NekoBox Android
        run: |
          set -e
          HIDDIFY_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-app/releases/latest | jq -r '.assets[]? | select(.name | test("Hiddify-Android-universal\\.apk$")) | .browser_download_url // empty')
          NEKOBOX_URL=$(curl -s https://api.github.com/repos/starifly/NekoBoxForAndroid/releases/latest | jq -r '.assets[]? | select(.name | test("arm64-v8a\\.apk$")) | .browser_download_url // empty')

          if [ -n "$HIDDIFY_URL" ]; then curl -L "$HIDDIFY_URL" -o apk/Hiddify-Android-universal.apk; fi
          if [ -n "$NEKOBOX_URL" ]; then curl -L "$NEKOBOX_URL" -o apk/NekoBox-Android-arm64-v8a.apk; fi

      # Windows
      - name: Download Karing Windows
        run: |
          set -e
          WIN_VERSION=$(curl -s https://api.github.com/repos/KaringX/karing/releases/latest | jq -r '.tag_name // empty')
          echo "WIN_VERSION=$WIN_VERSION" >> $GITHUB_ENV

          X64_URL=$(curl -s https://api.github.com/repos/KaringX/karing/releases/latest | jq -r '.assets[]? | select(.name | contains("windows_x64.exe")) | .browser_download_url // empty')
          if [ -n "$X64_URL" ]; then curl -L "$X64_URL" -o windows/karing_windows_x64.exe; fi

      - name: Download Hiddify Windows
        run: |
          set -e
          HIDDIFY_WIN_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-app/releases/latest | jq -r '.assets[]? | select(.name | test("Hiddify-Windows-Setup-x64\\.exe$")) | .browser_download_url // empty')
          if [ -n "$HIDDIFY_WIN_URL" ]; then curl -L "$HIDDIFY_WIN_URL" -o windows/Hiddify-Windows-Setup-x64.exe; fi

      # Geo files
      - name: Download GeoLite2
        run: |
          set -e
          curl -s https://api.github.com/repos/P3TERX/GeoLite.mmdb/releases/latest > geolite.json
          ASN_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-ASN.mmdb")) | .browser_download_url // empty' geolite.json)
          CITY_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-City.mmdb")) | .browser_download_url // empty' geolite.json)
          COUNTRY_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-Country.mmdb")) | .browser_download_url // empty' geolite.json)

          if [ -n "$ASN_URL" ]; then curl -L "$ASN_URL" -o geolite2/GeoLite2-ASN.mmdb; fi
          if [ -n "$CITY_URL" ]; then curl -L "$CITY_URL" -o geolite2/GeoLite2-City.mmdb; fi
          if [ -n "$COUNTRY_URL" ]; then curl -L "$COUNTRY_URL" -o geolite2/GeoLite2-Country.mmdb; fi

      - name: Download GeoIP/Geosite
        run: |
          set -e
          curl -L "https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geoip.dat" -o geoip/geoip.dat || true
          curl -L "https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geosite.dat" -o geoip/geosite.dat || true

      # ---------------- Update README ----------------
      - name: Update README
        run: |
          set -e
          # Версии
          sed -i "s|KARING_ANDROID_VERSION=.*|KARING_ANDROID_VERSION=${ANDROID_VERSION}|g" README.md || echo "KARING_ANDROID_VERSION=${ANDROID_VERSION}" >> README.md
          sed -i "s|KARING_WINDOWS_VERSION=.*|KARING_WINDOWS_VERSION=${WIN_VERSION}|g" README.md || echo "KARING_WINDOWS_VERSION=${WIN_VERSION}" >> README.md

          # Ссылки на дополнительные файлы (только ссылки, без хранения файлов)
          grep -q 'Hiddify-Android-universal.apk' README.md || echo "- [Hiddify Android](https://github.com/Rusl2023/vpn-alive-check/raw/main/apk/Hiddify-Android-universal.apk)" >> README.md
          grep -q 'NekoBox-Android-arm64-v8a.apk' README.md || echo "- [NekoBox Android](https://github.com/Rusl2023/vpn-alive-check/raw/main/apk/NekoBox-Android-arm64-v8a.apk)" >> README.md
          grep -q 'Hiddify-Windows-Setup-x64.exe' README.md || echo "- [Hiddify Windows](https://github.com/Rusl2023/vpn-alive-check/raw/main/windows/Hiddify-Windows-Setup-x64.exe)" >> README.md

      # ---------------- Commit only README ----------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update versions and links"
            git push origin HEAD:main
          fi

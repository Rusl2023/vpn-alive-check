name: Sync Karing Android, Windows, Geo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [karing_release]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # ---------------- iOS links ----------------
      - name: Update iOS links in README
        run: |
          sed -i '/^## iOS/i ## iOS' README.md || true
          grep -q 'https://apps.apple.com/us/app/karing/id6472431552' README.md || \
            sed -i '/## iOS/a - [Karing](https://apps.apple.com/us/app/karing/id6472431552)' README.md
          grep -q 'https://apps.apple.com/us/app/hiddify-proxy-vpn/id6596777532' README.md || \
            sed -i '/## iOS/a - [Hiddify Proxy VPN](https://apps.apple.com/us/app/hiddify-proxy-vpn/id6596777532)' README.md

      # ---------------- Android ----------------
      - name: Fetch latest Karing Android release
        run: |
          curl -s "https://api.github.com/repos/KaringX/karing/releases/latest" > release_android.json

      - name: Extract Android version and URLs
        run: |
          ANDROID_VERSION=$(jq -r '.tag_name // empty' release_android.json)
          ARM64_URL=$(jq -r '.assets[]? | select(.name | contains("android_arm64-v8a.apk")) | .browser_download_url // empty' release_android.json)
          ARMV7_URL=$(jq -r '.assets[]? | select(.name | contains("android_armeabi-v7a.apk")) | .browser_download_url // empty' release_android.json)
          echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
          echo "ARM64_URL=$ARM64_URL" >> $GITHUB_ENV
          echo "ARMV7_URL=$ARMV7_URL" >> $GITHUB_ENV
          echo "Android version: $ANDROID_VERSION"
          echo "ARM64 URL: $ARM64_URL"
          echo "ARMV7 URL: $ARMV7_URL"

      - name: Clean old Android APKs
        run: |
          rm -rf apk
          mkdir -p apk

      - name: Download Android APKs
        run: |
          if [ -n "$ARM64_URL" ]; then curl -L "$ARM64_URL" -o apk/karing_android_arm64-v8a.apk; else echo "ARM64 APK skipped"; fi
          if [ -n "$ARMV7_URL" ]; then curl -L "$ARMV7_URL" -o apk/karing_android_armeabi-v7a.apk; else echo "ARMV7 APK skipped"; fi

      - name: Download latest Hiddify Android APK
        run: |
          HIDDIFY_ANDROID_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-app/releases/latest | jq -r '.assets[]? | select(.name | test("Hiddify-Android-universal\\.apk$")) | .browser_download_url // empty')
          if [ -n "$HIDDIFY_ANDROID_URL" ]; then
            curl -L "$HIDDIFY_ANDROID_URL" -o apk/Hiddify-Android-universal.apk
            echo "HIDDIFY_ANDROID_URL=$HIDDIFY_ANDROID_URL" >> $GITHUB_ENV
          else
            echo "Hiddify Android APK skipped"
          fi

      - name: Download latest NekoBox Android APK
        run: |
          NEKOBOX_ANDROID_URL=$(curl -s https://api.github.com/repos/starifly/NekoBoxForAndroid/releases/latest | jq -r '.assets[]? | select(.name | test("arm64-v8a\\.apk$")) | .browser_download_url // empty')
          if [ -n "$NEKOBOX_ANDROID_URL" ]; then
            curl -L "$NEKOBOX_ANDROID_URL" -o apk/NekoBox-Android-arm64-v8a.apk
            echo "NEKOBOX_ANDROID_URL=$NEKOBOX_ANDROID_URL" >> $GITHUB_ENV
          else
            echo "NekoBox Android APK skipped"
          fi

      - name: Generate Android SHA256SUMS
        run: |
          if [ -d apk ] && [ "$(ls -A apk/*.apk 2>/dev/null)" ]; then
            sha256sum apk/*.apk > apk/SHA256SUMS
            ARM64_SHA=$(grep "arm64" apk/SHA256SUMS | awk '{print $1}' || echo "")
            ARMV7_SHA=$(grep "armeabi" apk/SHA256SUMS | awk '{print $1}' || echo "")
            echo "ARM64_SHA=$ARM64_SHA" >> $GITHUB_ENV
            echo "ARMV7_SHA=$ARMV7_SHA" >> $GITHUB_ENV
            echo "Android SHA256 generated"
          else
            echo "No Android APKs to hash"
          fi

      # ---------------- Windows ----------------
      - name: Fetch latest Karing Windows release
        run: |
          curl -s "https://api.github.com/repos/KaringX/karing/releases/latest" > release_windows.json

      - name: Extract Windows version and URLs
        run: |
          WIN_VERSION=$(jq -r '.tag_name // empty' release_windows.json)
          X64_URL=$(jq -r '.assets[]? | select(.name | contains("windows_x64.exe")) | .browser_download_url // empty' release_windows.json)
          X86_URL=$(jq -r '.assets[]? | select(.name | contains("windows_x86.exe")) | .browser_download_url // empty' release_windows.json)
          echo "WIN_VERSION=$WIN_VERSION" >> $GITHUB_ENV
          echo "X64_URL=$X64_URL" >> $GITHUB_ENV
          echo "X86_URL=$X86_URL" >> $GITHUB_ENV
          echo "Windows version: $WIN_VERSION"

      - name: Clean old Windows files
        run: |
          rm -rf windows
          mkdir -p windows

      - name: Download Windows EXEs
        run: |
          if [ -n "$X64_URL" ]; then curl -L "$X64_URL" -o windows/karing_windows_x64.exe; else echo "X64 EXE skipped"; fi
          if [ -n "$X86_URL" ]; then curl -L "$X86_URL" -o windows/karing_windows_x86.exe; else echo "X86 EXE skipped"; fi

      - name: Download latest Hiddify Windows installer
        run: |
          HIDDIFY_WINDOWS_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-app/releases/latest | jq -r '.assets[]? | select(.name | test("Hiddify-Windows-Setup-x64\\.exe$")) | .browser_download_url // empty')
          if [ -n "$HIDDIFY_WINDOWS_URL" ]; then
            curl -L "$HIDDIFY_WINDOWS_URL" -o windows/Hiddify-Windows-Setup-x64.exe
            echo "HIDDIFY_WINDOWS_URL=$HIDDIFY_WINDOWS_URL" >> $GITHUB_ENV
          else
            echo "Hiddify Windows installer skipped"
          fi

      - name: Generate Windows SHA256SUMS
        run: |
          if [ -d windows ] && [ "$(ls -A windows/*.exe 2>/dev/null)" ]; then
            sha256sum windows/*.exe > windows/SHA256SUMS
            X64_SHA=$(grep "x64" windows/SHA256SUMS | awk '{print $1}' || echo "")
            X86_SHA=$(grep "x86" windows/SHA256SUMS | awk '{print $1}' || echo "")
            echo "X64_SHA=$X64_SHA" >> $GITHUB_ENV
            echo "X86_SHA=$X86_SHA" >> $GITHUB_ENV
          fi

      # ---------------- GeoLite2 ----------------
      - name: Fetch latest GeoLite2 release
        run: |
          curl -s "https://api.github.com/repos/P3TERX/GeoLite.mmdb/releases/latest" > release_geolite.json

      - name: Extract GeoLite2 URLs
        run: |
          ASN_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-ASN.mmdb")) | .browser_download_url // empty' release_geolite.json)
          CITY_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-City.mmdb")) | .browser_download_url // empty' release_geolite.json)
          COUNTRY_URL=$(jq -r '.assets[]? | select(.name | contains("GeoLite2-Country.mmdb")) | .browser_download_url // empty' release_geolite.json)
          echo "ASN_URL=$ASN_URL" >> $GITHUB_ENV
          echo "CITY_URL=$CITY_URL" >> $GITHUB_ENV
          echo "COUNTRY_URL=$COUNTRY_URL" >> $GITHUB_ENV

      - name: Clean old GeoLite2
        run: |
          rm -rf geolite2
          mkdir -p geolite2

      - name: Download GeoLite2
        run: |
          if [ -n "$ASN_URL" ]; then curl -L "$ASN_URL" -o geolite2/GeoLite2-ASN.mmdb; else echo "ASN skipped"; fi
          if [ -n "$CITY_URL" ]; then curl -L "$CITY_URL" -o geolite2/GeoLite2-City.mmdb; else echo "City skipped"; fi
          if [ -n "$COUNTRY_URL" ]; then curl -L "$COUNTRY_URL" -o geolite2/GeoLite2-Country.mmdb; else echo "Country skipped"; fi

      - name: Generate GeoLite2 SHA256SUMS
        run: |
          if [ -d geolite2 ] && [ "$(ls -A geolite2/*.mmdb 2>/dev/null)" ]; then
            sha256sum geolite2/*.mmdb > geolite2/SHA256SUMS
            ASN_SHA=$(grep "ASN" geolite2/SHA256SUMS | awk '{print $1}' || echo "")
            CITY_SHA=$(grep "City" geolite2/SHA256SUMS | awk '{print $1}' || echo "")
            COUNTRY_SHA=$(grep "Country" geolite2/SHA256SUMS | awk '{print $1}' || echo "")
            echo "ASN_SHA=$ASN_SHA" >> $GITHUB_ENV
            echo "CITY_SHA=$CITY_SHA" >> $GITHUB_ENV
            echo "COUNTRY_SHA=$COUNTRY_SHA" >> $GITHUB_ENV
          fi

      # ---------------- GeoIP / Geosite ----------------
      - name: Clean old GeoIP / Geosite
        run: |
          rm -rf geoip
          mkdir -p geoip

      - name: Download GeoIP / Geosite latest
        run: |
          curl -L "https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geoip.dat" -o geoip/geoip.dat || echo "GeoIP skipped"
          curl -L "https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geosite.dat" -o geoip/geosite.dat || echo "Geosite skipped"

      - name: Generate GeoIP SHA256SUMS
        run: |
          if [ -d geoip ] && [ "$(ls -A geoip/* 2>/dev/null)" ]; then
            sha256sum geoip/* > geoip/SHA256SUMS
            GEOIP_SHA=$(grep "geoip.dat" geoip/SHA256SUMS | awk '{print $1}' || echo "")
            GEOSITE_SHA=$(grep "geosite.dat" geoip/SHA256SUMS | awk '{print $1}' || echo "")
            echo "GEOIP_SHA=$GEOIP_SHA" >> $GITHUB_ENV
            echo "GEOSITE_SHA=$GEOSITE_SHA" >> $GITHUB_ENV
          fi

      # ---------------- Update README ----------------
      - name: Update README
        run: |
          sed -i "s|^KARING_ANDROID_VERSION=.*|KARING_ANDROID_VERSION=$ANDROID_VERSION|g" README.md || true
          sed -i "s|{{ARM64_SHA}}|$ARM64_SHA|g" README.md || true
          sed -i "s|{{ARMV7_SHA}}|$ARMV7_SHA|g" README.md || true
          sed -i "s|^KARING_WINDOWS_VERSION=.*|KARING_WINDOWS_VERSION=$WIN_VERSION|g" README.md || true
          sed -i "s|{{X64_SHA}}|$X64_SHA|g" README.md || true
          sed -i "s|{{X86_SHA}}|$X86_SHA|g" README.md || true
          sed -i "s|^GEOLITE2_ASN=.*|GEOLITE2_ASN=$ASN_SHA|g" README.md || true
          sed -i "s|^GEOLITE2_CITY=.*|GEOLITE2_CITY=$CITY_SHA|g" README.md || true
          sed -i "s|^GEOLITE2_COUNTRY=.*|GEOLITE2_COUNTRY=$COUNTRY_SHA|g" README.md || true
          sed -i "s|^GEOIP_SHA=.*|GEOIP_SHA=$GEOIP_SHA|g" README.md || true
          sed -i "s|^GEOSITE_SHA=.*|GEOSITE_SHA=$GEOSITE_SHA|g" README.md || true

      # ---------------- Commit & Push ----------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/ windows/ geolite2/ geoip/ README.md || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Karing Android v$ANDROID_VERSION, Windows v$WIN_VERSION, Geo files"
          fi

      - name: Push changes
        run: |
          git push origin HEAD:main

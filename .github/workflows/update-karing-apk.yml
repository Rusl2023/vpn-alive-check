name: Sync Karing Android APK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [karing_release]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch latest Karing release
        run: |
          curl -s https://api.github.com/repos/KaringX/karing/releases/latest > release.json

      - name: Extract version and URLs
        run: |
          VERSION=$(jq -r '.tag_name' release.json)
          ARM64_URL=$(jq -r '.assets[] | select(.name | contains("android_arm64-v8a.apk")) | .browser_download_url' release.json)
          ARMV7_URL=$(jq -r '.assets[] | select(.name | contains("android_armeabi-v7a.apk")) | .browser_download_url' release.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARM64_URL=$ARM64_URL" >> $GITHUB_ENV
          echo "ARMV7_URL=$ARMV7_URL" >> $GITHUB_ENV

      - name: Clean old APKs
        run: |
          rm -rf apk
          mkdir -p apk

      - name: Download APKs
        run: |
          curl -L "$ARM64_URL" -o apk/karing_android_arm64-v8a.apk
          curl -L "$ARMV7_URL" -o apk/karing_android_armeabi-v7a.apk

      - name: Generate SHA256SUMS
        run: |
          sha256sum apk/*.apk > apk/SHA256SUMS
          ARM64_SHA=$(grep arm64 apk/SHA256SUMS | awk '{print $1}')
          ARMV7_SHA=$(grep armeabi apk/SHA256SUMS | awk '{print $1}')
          echo "ARM64_SHA=$ARM64_SHA" >> $GITHUB_ENV
          echo "ARMV7_SHA=$ARMV7_SHA" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s|^KARING_VERSION=.*|KARING_VERSION=$VERSION|g" README.md
          sed -i "s|{{ARM64_SHA}}|$ARM64_SHA|g" README.md
          sed -i "s|{{ARMV7_SHA}}|$ARMV7_SHA|g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apk README.md
          git diff --cached --quiet || git commit -m "Update Karing APK $VERSION"

      - name: Push
        run: |
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} HEAD:main

name: Sync Karing Android, Windows & Geo

on:
  schedule:
    - cron: '0 0 * * *' # каждый день в полночь UTC
  workflow_dispatch:
  repository_dispatch:
    types: [karing_release]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 🔥 Разрешение на запись в репозиторий

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        # 🔥 Убрали persist-credentials: false — теперь токен работает для пуша

      # ---------------- Android ----------------
      - name: Fetch latest Karing Android release
        run: |
          curl -s https://api.github.com/repos/KaringX/karing/releases/latest > release_android.json

      - name: Extract Android version and URLs
        run: |
          ANDROID_VERSION=$(jq -r '.tag_name' release_android.json)
          ARM64_URL=$(jq -r '.assets[] | select(.name | contains("android_arm64-v8a.apk")) | .browser_download_url' release_android.json)
          ARMV7_URL=$(jq -r '.assets[] | select(.name | contains("android_armeabi-v7a.apk")) | .browser_download_url' release_android.json)
          echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
          echo "ARM64_URL=$ARM64_URL" >> $GITHUB_ENV
          echo "ARMV7_URL=$ARMV7_URL" >> $GITHUB_ENV

      - name: Clean old Android APKs
        run: |
          rm -rf apk
          mkdir -p apk

      - name: Download Android APKs
        run: |
          [ -n "$ARM64_URL" ] && curl -L "$ARM64_URL" -o apk/karing_android_arm64-v8a.apk || echo "ARM64 APK skipped"
          [ -n "$ARMV7_URL" ] && curl -L "$ARMV7_URL" -o apk/karing_android_armeabi-v7a.apk || echo "ARMV7 APK skipped"

      - name: Generate Android SHA256SUMS
        run: |
          if [ -d apk ] && [ "$(ls -A apk/*.apk 2>/dev/null)" ]; then
            sha256sum apk/*.apk > apk/SHA256SUMS
            ARM64_SHA=$(grep arm64 apk/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            ARMV7_SHA=$(grep armeabi apk/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            echo "ARM64_SHA=$ARM64_SHA" >> $GITHUB_ENV
            echo "ARMV7_SHA=$ARMV7_SHA" >> $GITHUB_ENV
          fi

      # ---------------- Windows ----------------
      - name: Fetch latest Karing Windows release
        run: |
          curl -s https://api.github.com/repos/KaringX/karing/releases/latest > release_windows.json

      - name: Extract Windows version and URLs
        run: |
          WIN_VERSION=$(jq -r '.tag_name' release_windows.json)
          X64_URL=$(jq -r '.assets[] | select(.name | contains("windows_x64.exe")) | .browser_download_url' release_windows.json)
          X86_URL=$(jq -r '.assets[] | select(.name | contains("windows_x86.exe")) | .browser_download_url' release_windows.json)
          echo "WIN_VERSION=$WIN_VERSION" >> $GITHUB_ENV
          echo "X64_URL=$X64_URL" >> $GITHUB_ENV
          echo "X86_URL=$X86_URL" >> $GITHUB_ENV

      - name: Clean old Windows files
        run: |
          rm -rf windows
          mkdir -p windows

      - name: Download Windows EXEs
        run: |
          [ -n "$X64_URL" ] && curl -L "$X64_URL" -o windows/karing_windows_x64.exe || echo "X64 EXE skipped"
          [ -n "$X86_URL" ] && curl -L "$X86_URL" -o windows/karing_windows_x86.exe || echo "X86 EXE skipped"

      - name: Generate Windows SHA256SUMS
        run: |
          if [ -d windows ] && [ "$(ls -A windows/*.exe 2>/dev/null)" ]; then
            sha256sum windows/*.exe > windows/SHA256SUMS
            X64_SHA=$(grep x64 windows/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            X86_SHA=$(grep x86 windows/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            echo "X64_SHA=$X64_SHA" >> $GITHUB_ENV
            echo "X86_SHA=$X86_SHA" >> $GITHUB_ENV
          fi

      # ---------------- GeoLite2 ----------------
      - name: Fetch latest GeoLite2 release
        run: |
          curl -s https://api.github.com/repos/P3TERX/GeoLite.mmdb/releases/latest > release_geolite.json

      - name: Extract GeoLite2 URLs
        run: |
          ASN_URL=$(jq -r '.assets[] | select(.name | contains("GeoLite2-ASN.mmdb")) | .browser_download_url' release_geolite.json)
          CITY_URL=$(jq -r '.assets[] | select(.name | contains("GeoLite2-City.mmdb")) | .browser_download_url' release_geolite.json)
          COUNTRY_URL=$(jq -r '.assets[] | select(.name | contains("GeoLite2-Country.mmdb")) | .browser_download_url' release_geolite.json)
          echo "ASN_URL=$ASN_URL" >> $GITHUB_ENV
          echo "CITY_URL=$CITY_URL" >> $GITHUB_ENV
          echo "COUNTRY_URL=$COUNTRY_URL" >> $GITHUB_ENV

      - name: Clean old GeoLite2
        run: |
          rm -rf geolite2
          mkdir -p geolite2

      - name: Download GeoLite2
        run: |
          [ -n "$ASN_URL" ] && curl -L "$ASN_URL" -o geolite2/GeoLite2-ASN.mmdb || echo "ASN skipped"
          [ -n "$CITY_URL" ] && curl -L "$CITY_URL" -o geolite2/GeoLite2-City.mmdb || echo "City skipped"
          [ -n "$COUNTRY_URL" ] && curl -L "$COUNTRY_URL" -o geolite2/GeoLite2-Country.mmdb || echo "Country skipped"

      - name: Generate GeoLite2 SHA256SUMS
        run: |
          if [ -d geolite2 ] && [ "$(ls -A geolite2/*.mmdb 2>/dev/null)" ]; then
            sha256sum geolite2/*.mmdb > geolite2/SHA256SUMS
            ASN_SHA=$(grep ASN geolite2/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            CITY_SHA=$(grep City geolite2/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            COUNTRY_SHA=$(grep Country geolite2/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            echo "ASN_SHA=$ASN_SHA" >> $GITHUB_ENV
            echo "CITY_SHA=$CITY_SHA" >> $GITHUB_ENV
            echo "COUNTRY_SHA=$COUNTRY_SHA" >> $GITHUB_ENV
          fi

      # ---------------- GeoIP / Geosite ----------------
      - name: Clean old GeoIP / Geosite
        run: |
          rm -rf geoip
          mkdir -p geoip

      - name: Download GeoIP / Geosite latest
        run: |
          curl -L https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geoip.dat -o geoip/geoip.dat || echo "GeoIP skipped"
          curl -L https://github.com/1andrevich/Re-filter-lists/releases/latest/download/geosite.dat -o geoip/geosite.dat || echo "Geosite skipped"

      - name: Generate GeoIP SHA256SUMS
        run: |
          if [ -d geoip ] && [ "$(ls -A geoip/* 2>/dev/null)" ]; then
            sha256sum geoip/* > geoip/SHA256SUMS
            GEOIP_SHA=$(grep geoip.dat geoip/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            GEOSITE_SHA=$(grep geosite.dat geoip/SHA256SUMS | awk '{print $1}' | tr -d '\r\n' || echo "")
            echo "GEOIP_SHA=$GEOIP_SHA" >> $GITHUB_ENV
            echo "GEOSITE_SHA=$GEOSITE_SHA" >> $GITHUB_ENV
          fi

      # ---------------- Update README ----------------
      - name: Update README
        run: |
          sed -i "s|^KARING_ANDROID_VERSION=.*|KARING_ANDROID_VERSION=$ANDROID_VERSION|g" README.md
          sed -i "s|{{ARM64_SHA}}|$ARM64_SHA|g" README.md
          sed -i "s|{{ARMV7_SHA}}|$ARMV7_SHA|g" README.md
          sed -i "s|^KARING_WINDOWS_VERSION=.*|KARING_WINDOWS_VERSION=$WIN_VERSION|g" README.md
          sed -i "s|{{X64_SHA}}|$X64_SHA|g" README.md
          sed -i "s|{{X86_SHA}}|$X86_SHA|g" README.md
          sed -i "s|^GEOLITE2_ASN=.*|GEOLITE2_ASN=$ASN_SHA|g" README.md
          sed -i "s|^GEOLITE2_CITY=.*|GEOLITE2_CITY=$CITY_SHA|g" README.md
          sed -i "s|^GEOLITE2_COUNTRY=.*|GEOLITE2_COUNTRY=$COUNTRY_SHA|g" README.md
          sed -i "s|^GEOIP_SHA=.*|GEOIP_SHA=$GEOIP_SHA|g" README.md
          sed -i "s|^GEOSITE_SHA=.*|GEOSITE_SHA=$GEOSITE_SHA|g" README.md

      # ---------------- Commit & Push 🔥 ----------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk windows geolite2 geoip README.md
          git commit -m "🔄 Update Karing $ANDROID_VERSION / $WIN_VERSION + Geo [$(date +'%Y-%m-%d %H:%M UTC')]" || exit 0
          git push

              'AS':'🇦🇸','AT':'🇦🇹','AU':'🇦🇺','AW':'🇦🇼','AX':'🇦🇽','AZ':'🇦🇿','BA':'🇧🇦','BB':'🇧🇧','BD':'🇧🇩','BE':'🇧🇪',
              'BF':'🇧🇫','BG':'🇧🇬','BH':'🇧🇭','BI':'🇧🇮','BJ':'🇧🇯','BL':'🇧🇱','BM':'🇧🇲','BN':'🇧🇳','BO':'🇧🇴','BQ':'🇧🇶',
              'BR':'🇧🇷','BS':'🇧🇸','BT':'🇧🇹','BV':'🇧🇻','BW':'🇧🇼','BY':'🇧🇾','BZ':'🇧🇿','CA':'🇨🇦','CC':'🇨🇨','CD':'🇨🇩',
              'CF':'🇨🇫','CG':'🇨🇬','CH':'🇨🇭','CI':'🇨🇮','CK':'🇨🇰','CL':'🇨🇱','CM':'🇨🇲','CN':'🇨🇳','CO':'🇨🇴','CR':'🇨🇷',
              'CU':'🇨🇺','CV':'🇨🇻','CW':'🇨🇼','CX':'🇨🇽','CY':'🇨🇾','CZ':'🇨🇿','DE':'🇩🇪','DJ':'🇩🇯','DK':'🇩🇰','DM':'🇩🇲',
              'DO':'🇩🇴','DZ':'🇩🇿','EC':'🇪🇨','EE':'🇪🇪','EG':'🇪🇬','EH':'🇪🇭','ER':'🇪🇷','ES':'🇪🇸','ET':'🇪🇹','FI':'🇫🇮',
              'FJ':'🇫🇯','FK':'🇫🇰','FM':'🇫🇲','FO':'🇫🇴','FR':'🇫🇷','GA':'🇬🇦','GB':'🇬🇧','GD':'🇬🇩','GE':'🇬🇪','GF':'🇬🇫',
              'GG':'🇬🇬','GH':'🇬🇭','GI':'🇬🇮','GL':'🇬🇱','GM':'🇬🇲','GN':'🇬🇳','GP':'🇬🇵','GQ':'🇬🇶','GR':'🇬🇷','GS':'🇬🇸',
              'GT':'🇬🇹','GU':'🇬🇺','GW':'🇬🇼','GY':'🇬🇾','HK':'🇭🇰','HM':'🇭🇲','HN':'🇭🇳','HR':'🇭🇷','HT':'🇭🇹','HU':'🇭🇺',
              'ID':'🇮🇩','IE':'🇮🇪','IL':'🇮🇱','IM':'🇮🇲','IN':'🇮🇳','IO':'🇮🇴','IQ':'🇮🇶','IR':'🇮🇷','IS':'🇮🇸','IT':'🇮🇹',
              'JE':'🇯🇪','JM':'🇯🇲','JO':'🇯🇴','JP':'🇯🇵','KE':'🇰🇪','KG':'🇰🇬','KH':'🇰🇭','KI':'🇰🇮','KM':'🇰🇲','KN':'🇰🇳',
              'KP':'🇰🇵','KR':'🇰🇷','KW':'🇰🇼','KY':'🇰🇾','KZ':'🇰🇿','LA':'🇱🇦','LB':'🇱🇧','LC':'🇱🇨','LI':'🇱🇮','LK':'🇱🇰',
              'LR':'🇱🇷','LS':'🇱🇸','LT':'🇱🇹','LU':'🇱🇺','LV':'🇱🇻','LY':'🇱🇾','MA':'🇲🇦','MC':'🇲🇨','MD':'🇲🇩','ME':'🇲🇪',
              'MF':'🇲🇫','MG':'🇲🇬','MH':'🇲🇭','MK':'🇲🇰','ML':'🇲🇱','MM':'🇲🇲','MN':'🇲🇳','MO':'🇲🇴','MP':'🇲🇵','MQ':'🇲🇶',
              'MR':'🇲🇷','MS':'🇲🇸','MT':'🇲🇹','MU':'🇲🇺','MV':'🇲🇻','MW':'🇲🇼','MX':'🇲🇽','MY':'🇲🇾','MZ':'🇲🇿','NA':'🇳🇦',
              'NC':'🇳🇨','NE':'🇳🇪','NF':'🇳🇫','NG':'🇳🇬','NI':'🇳🇮','NL':'🇳🇱','NO':'🇳🇴','NP':'🇳🇵','NR':'🇳🇷','NU':'🇳🇺',
              'NZ':'🇳🇿','OM':'🇴🇲','PA':'🇵🇦','PE':'🇵🇪','PF':'🇵🇫','PG':'🇵🇬','PH':'🇵🇭','PK':'🇵🇰','PL':'🇵🇱','PM':'🇵🇲',
              'PN':'🇵🇳','PR':'🇵🇷','PS':'🇵🇸','PT':'🇵🇹','PW':'🇵🇼','PY':'🇵🇾','QA':'🇶🇦','RE':'🇷🇪','RO':'🇷🇴','RS':'🇷🇸',
              'RU':'🇷🇺','RW':'🇷🇼','SA':'🇸🇦','SB':'🇸🇧','SC':'🇸🇨','SD':'🇸🇩','SE':'🇸🇪','SG':'🇸🇬','SH':'🇸🇭','SI':'🇸🇮',
              'SJ':'🇸🇯','SK':'🇸🇰','SL':'🇸🇱','SM':'🇸🇲','SN':'🇸🇳','SO':'🇸🇴','SR':'🇸🇷','SS':'🇸🇸','ST':'🇸🇹','SV':'🇸🇻',
              'SX':'🇸🇽','SY':'🇸🇾','SZ':'🇸🇿','TC':'🇹🇨','TD':'🇹🇩','TF':'🇹🇫','TG':'🇹🇬','TH':'🇹🇭','TJ':'🇹🇯','TK':'🇹🇰',
              'TL':'🇹🇱','TM':'🇹🇲','TN':'🇹🇳','TO':'🇹🇴','TR':'🇹🇷','TT':'🇹🇹','TV':'🇹🇻','TW':'🇹🇼','TZ':'🇹🇿','UA':'🇺🇦',
              'UG':'🇺🇬','UM':'🇺🇲','US':'🇺🇸','UY':'🇺🇾','UZ':'🇺🇿','VA':'🇻🇦','VC':'🇻🇨','VE':'🇻🇪','VG':'🇻🇬','VI':'🇻🇮',
              'VN':'🇻🇳','VU':'🇻🇺','WF':'🇼🇫','WS':'🇼🇸','YE':'🇾🇪','YT':'🇾🇹','ZA':'🇿🇦','ZM':'🇿🇲','ZW':'🇿🇼','??':'🌍'
          }

          start_time = time.time()
          dns_lock = threading.Lock()
          dns_cache = {}
          dns_fail_count = 0
          results_lock = threading.Lock()

          # Session only for downloading lists (not for proxy tests)
          http_session = requests.Session()
          retry_strategy = Retry(
              total=2,
              backoff_factor=0.4,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=["GET"]
          )
          adapter = HTTPAdapter(max_retries=retry_strategy)
          http_session.mount("https://", adapter)
          http_session.mount("http://", adapter)
          http_session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          })

          country_reader = None
          try:
              if os.path.exists(GEO_DB_FILE):
                  country_reader = geoip2.database.Reader(GEO_DB_FILE)
                  print("✓ GeoIP loaded successfully")
          except Exception as e:
              print(f"! GeoIP load error: {e}")

          def is_deadline_exceeded():
              return (time.time() - start_time) > GLOBAL_DEADLINE_SEC

          def remaining_time():
              return max(0, GLOBAL_DEADLINE_SEC - (time.time() - start_time))

          def load_cidrs(urls):
              nets = []
              for u in urls:
                  try:
                      resp = http_session.get(u, timeout=TIMEOUT_HTTP)
                      for line in resp.text.splitlines():
                          line = line.strip()
                          if line and not line.startswith('#'):
                              try:
                                  nets.append(ipaddress.ip_network(line, strict=False))
                              except ValueError:
                                  pass
                  except Exception as e:
                      print(f"[-] Failed loading CIDR list {u}: {e}")
              return nets

          def load_subnets_json(url):
              ips, cidrs = set(), []
              try:
                  data = http_session.get(url, timeout=TIMEOUT_HTTP).json()
                  for item in data:
                      if not isinstance(item, dict):
                          continue
                      if 'cidr' in item:
                          try:
                              cidrs.append(ipaddress.ip_network(item['cidr'], strict=False))
                          except Exception:
                              pass
                      if 'ips' in item and isinstance(item['ips'], list):
                          for ip_str in item['ips']:
                              if str(ip_str).strip():
                                  ips.add(str(ip_str).strip())
                  print(f"✓ Loaded subnets.json: {len(cidrs)} CIDRs, {len(ips)} IPs")
              except Exception as e:
                  print(f"[-] Failed loading subnets.json: {e}")
              return ips, cidrs

          def ip_in_nets(ip_str, nets_list):
              try:
                  ip_obj = ipaddress.ip_address(ip_str)
                  return any(ip_obj in net for net in nets_list)
              except Exception:
                  return False

          def resolve_dns(host):
              global dns_fail_count
              with dns_lock:
                  if host in dns_cache:
                      return dns_cache[host]
              try:
                  ip = socket.gethostbyname(host)
                  with dns_lock:
                      dns_cache[host] = ip
                  return ip
              except Exception:
                  with dns_lock:
                      dns_fail_count += 1
                      dns_cache[host] = None
                  return None

          def get_country_code(ip):
              if not country_reader or not ip:
                  return "??"
              try:
                  response = country_reader.country(ip)
                  return response.country.iso_code or "??"
              except Exception:
                  return "??"

          def get_flag(cc):
              return FLAGS.get(cc, '🌍')

          def tcp_probe(host, port, timeout=2.0):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except OSError:
                  return False

          def parse_vless(link):
              try:
                  if 'emailprotected' in link:
                      return None
                  clean_part = link.split('#')[0]
                  parsed_url = urllib.parse.urlparse(clean_part)
                  if parsed_url.scheme != 'vless' or not parsed_url.hostname:
                      return None
                  query_params = urllib.parse.parse_qs(parsed_url.query)
                  return {
                      'type': 'vless',
                      'hostname': parsed_url.hostname,
                      'port': int(parsed_url.port) if parsed_url.port else 443,
                      'id': parsed_url.username or '',
                      'net': query_params.get('type', ['tcp'])[0].lower(),
                      'security': query_params.get('security', ['none'])[0].lower(),
                      'sni': query_params.get('sni', [''])[0],
                      'fp': query_params.get('fp', ['chrome'])[0].lower(),
                      'pbk': query_params.get('pbk', [''])[0],
                      'sid': query_params.get('sid', [''])[0],
                      'flow': query_params.get('flow', [''])[0],
                      'path': query_params.get('path', ['/'])[0],
                      'serviceName': query_params.get('serviceName', [''])[0],
                      'original_link': link
                  }
              except Exception:
                  return None

          def parse_hy2(link):
              try:
                  if 'emailprotected' in link:
                      return None
                  clean_part = link.split('#')[0]
                  parsed_url = urllib.parse.urlparse(clean_part)
                  if parsed_url.scheme not in ('hysteria2', 'hy2') or not parsed_url.hostname:
                      return None
                  query_params = urllib.parse.parse_qs(parsed_url.query)
                  auth_val = (
                      parsed_url.username
                      or query_params.get('auth', [''])[0]
                      or query_params.get('password', [''])[0]
                  )
                  if not auth_val:
                      return None
                  return {
                      'type': 'hy2',
                      'hostname': parsed_url.hostname,
                      'port': int(parsed_url.port) if parsed_url.port else 443,
                      'auth': auth_val,
                      'sni': query_params.get('sni', [parsed_url.hostname])[0],
                      'insecure': query_params.get('insecure', ['0'])[0] in ('1', 'true', 'yes'),
                      'obfs': query_params.get('obfs', [''])[0],
                      'obfs_password': query_params.get('obfs-password', [''])[0],
                      'original_link': link
                  }
              except Exception:
                  return None

          def download_and_parse_links():
              all_parsed = []

              def fetch_source(url):
                  try:
                      r = http_session.get(url, timeout=TIMEOUT_HTTP)
                      text = r.text
                      vless_matches = re.findall(r'vless://[^\s#]+', text)
                      hy2_matches = re.findall(r'(?:hysteria2|hy2)://[^\s#]+', text)
                      configs = []
                      for m in vless_matches:
                          cfg = parse_vless(m)
                          if cfg:
                              configs.append(cfg)
                      for m in hy2_matches:
                          cfg = parse_hy2(m)
                          if cfg:
                              configs.append(cfg)
                      print(f"[+] Source {url.split('/')[-1]}: {len(configs)} valid")
                      return configs
                  except Exception as e:
                      print(f"[-] Error fetching {url}: {e}")
                      return []

              with ThreadPoolExecutor(max_workers=8) as executor:
                  futures = [executor.submit(fetch_source, url) for url in CONFIG_URLS]
                  for future in as_completed(futures):
                      all_parsed.extend(future.result())

              unique = {}
              for cfg in all_parsed:
                  key = f"{cfg['hostname']}:{cfg['port']}"
                  if cfg['type'] == 'vless':
                      key += f":{cfg['id'][:8]}"
                  else:
                      key += f":{cfg['auth'][:8]}"
                  if key not in unique:
                      unique[key] = cfg
              return list(unique.values())

          print("Loading Whitelists...")
          cidr_whitelist = load_cidrs(RU_CIDR_URLS)
          white_ips_set, white_cidrs_list = load_subnets_json(WHITE_IP_URL)
          all_white_networks = cidr_whitelist + white_cidrs_list
          print(f"Loaded Networks: {len(all_white_networks)}")

          def filter_config(cfg):
              if is_deadline_exceeded():
                  return None

              resolved_ip = resolve_dns(cfg['hostname'])
              if not resolved_ip:
                  return None

              is_white = resolved_ip in white_ips_set or ip_in_nets(resolved_ip, all_white_networks)
              if not is_white:
                  return None

              # Fast TCP probe – skip dead hosts early
              if not tcp_probe(resolved_ip, cfg['port'], timeout=2.0):
                  return None

              if cfg['type'] == 'vless':
                  if cfg['flow'] not in ALLOWED_FLOWS:
                      return None
                  if cfg['fp'] not in ALLOWED_FP:
                      return None
                  if cfg['net'] not in ALLOWED_NETWORKS:
                      return None
                  if cfg['security'] == 'reality' and (not cfg['pbk'] or not cfg['sni']):
                      return None

              cfg['resolved_ip'] = resolved_ip
              return cfg

          def build_xray_config_json(cfg, local_port):
              net_type = 'tcp' if cfg['net'] == 'raw' else cfg['net']
              stream_settings = {"network": net_type, "security": "none"}

              if cfg['security'] == 'reality':
                  stream_settings["security"] = "reality"
                  stream_settings["realitySettings"] = {
                      "serverName": cfg['sni'],
                      "publicKey": cfg['pbk'],
                      "shortId": cfg.get('sid', ''),
                      "fingerprint": cfg.get('fp', 'chrome'),
                      "spiderX": ""
                  }
              elif cfg['security'] == 'tls':
                  stream_settings["security"] = "tls"
                  stream_settings["tlsSettings"] = {
                      "serverName": cfg['sni'],
                      "fingerprint": cfg.get('fp', 'chrome')
                  }

              if cfg['net'] == 'grpc':
                  stream_settings["grpcSettings"] = {"serviceName": cfg.get('serviceName', '')}
              elif cfg['net'] in ('ws', 'xhttp'):
                  key = 'wsSettings' if cfg['net'] == 'ws' else 'xhttpSettings'
                  stream_settings[key] = {"path": cfg.get('path', '/')}

              return json.dumps({
                  "log": {"loglevel": "warning"},
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",
                      "settings": {"udp": False},
                      "sniffing": {"enabled": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": cfg['hostname'],
                              "port": cfg['port'],
                              "users": [{
                                  "id": cfg['id'],
                                  "encryption": "none",
                                  "flow": cfg.get('flow', '')
                              }]
                          }]
                      },
                      "streamSettings": stream_settings
                  }],
                  "routing": {"domainStrategy": "AsIs"}
              })

          def build_hy2_config_yaml(cfg, local_port):
              lines = [
                  f"server: {cfg['hostname']}:{cfg['port']}",
                  f'auth: "{cfg["auth"]}"',
                  "tls:",
                  f"  sni: {cfg['sni']}",
                  f"  insecure: {'true' if cfg['insecure'] else 'false'}",
                  "socks5:",
                  f"  listen: 127.0.0.1:{local_port}",
              ]
              if cfg.get('obfs') == 'salamander':
                  lines += [
                      "obfs:",
                      "  type: salamander",
                      "  salamander:",
                      f'    password: "{cfg.get("obfs_password", "")}"',
                  ]
              return "\n".join(lines) + "\n"

          def wait_for_port_open(port, max_wait_sec=5):
              deadline = time.time() + max_wait_sec
              while time.time() < deadline:
                  try:
                      with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                          sock.settimeout(0.4)
                          if sock.connect_ex(('127.0.0.1', port)) == 0:
                              return True
                  except Exception:
                      pass
                  time.sleep(0.12)
              return False

          def test_connectivity_via_socks(local_port, label=""):
              """Fresh session per test – avoids pool / env proxy pollution."""
              proxy = f"socks5h://127.0.0.1:{local_port}"
              proxies = {"http": proxy, "https": proxy}

              # Primary URL only – reduces total wait time dramatically
              urls = [
                  "https://api.ip.sb/geoip",
                  "https://ipinfo.io/json",
              ]

              for url in urls:
                  try:
                      with requests.Session() as session:
                          session.trust_env = False
                          resp = session.get(
                              url,
                              proxies=proxies,
                              timeout=(PROXY_CONNECT_TIMEOUT, PROXY_READ_TIMEOUT),
                              headers={"User-Agent": "hy2-checker/1.0"}
                          )
                      if resp.status_code != 200:
                          print(f"[{label}] HTTP {resp.status_code} from {url}")
                          continue
                      data = resp.json()
                      value = data.get("ip") or data.get("origin")
                      if isinstance(value, str) and value.strip():
                          ip = value.split(",")[0].strip()
                          print(f"[{label}] Exit IP via {url}: {ip}")
                          return ip
                  except Exception as e:
                      print(f"[{label}] {type(e).__name__}: {e}")
              return None

          def test_vless(cfg):
              if is_deadline_exceeded() or not os.path.exists(XRAY_BIN):
                  return None

              local_port = 0
              with socket.socket() as s:
                  s.bind(('', 0))
                  local_port = s.getsockname()[1]

              cfg_path = f"/tmp/xray_{local_port}.json"
              label = f"VL {cfg['hostname']}"
              proc = None

              try:
                  with open(cfg_path, 'w') as f:
                      f.write(build_xray_config_json(cfg, local_port))

                  proc = subprocess.Popen(
                      [XRAY_BIN, 'run', '-c', cfg_path],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  if not wait_for_port_open(local_port, TIMEOUT_PROCESS_START):
                      return None

                  exit_ip = test_connectivity_via_socks(local_port, label=label)
                  if not exit_ip:
                      return None

                  cc = get_country_code(exit_ip)
                  if cc == 'RU':
                      return None

                  flag = get_flag(cc)
                  mark = f"{flag} {cc} [VLESS] | {cfg['hostname']}"
                  return cfg['original_link'].split('#')[0] + '#' + mark

              except Exception as e:
                  print(f"[ERROR-VL] {cfg['hostname']}: {e}")
                  return None
              finally:
                  if proc is not None and proc.poll() is None:
                      proc.terminate()
                      try:
                          proc.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          proc.kill()
                  if os.path.exists(cfg_path):
                      try:
                          os.remove(cfg_path)
                      except Exception:
                          pass

          def test_hy2(cfg):
              if is_deadline_exceeded() or not os.path.exists(HYSTERIA_BIN):
                  return None

              local_port = 0
              with socket.socket() as s:
                  s.bind(('', 0))
                  local_port = s.getsockname()[1]

              cfg_path = f"/tmp/hy2_{local_port}.yaml"
              log_path = f"/tmp/hy2_{local_port}.log"
              label = f"HY2 {cfg['hostname']}"
              proc = None

              try:
                  with open(cfg_path, 'w', encoding='utf-8') as f:
                      f.write(build_hy2_config_yaml(cfg, local_port))

                  with open(log_path, 'w', encoding='utf-8') as log_file:
                      proc = subprocess.Popen(
                          [HYSTERIA_BIN, 'client', '-c', cfg_path],
                          stdout=log_file,
                          stderr=subprocess.STDOUT
                      )

                  if not wait_for_port_open(local_port, TIMEOUT_PROCESS_START_HY2):
                      # Optional: show last lines of log for diagnosis
                      if os.path.exists(log_path):
                          try:
                              with open(log_path, 'r', errors='ignore') as lf:
                                  snippet = lf.read()[-400:].strip()
                              if snippet and ("FATAL" in snippet or "error" in snippet.lower()):
                                  print(f"[{label}] Startup fail: {snippet}")
                          except Exception:
                              pass
                      return None

                  print(f"[{label}] SOCKS5 ready on :{local_port}")

                  exit_ip = test_connectivity_via_socks(local_port, label=label)
                  if not exit_ip:
                      print(f"[{label}] No exit IP")
                      return None

                  cc = get_country_code(exit_ip)
                  print(f"[{label}] GeoIP: {cc} ({exit_ip})")

                  if cc == 'RU':
                      print(f"[{label}] Rejected RU exit")
                      return None

                  flag = get_flag(cc)
                  mark = f"{flag} {cc} [HY2] | {cfg['hostname']}"
                  result = cfg['original_link'].split('#')[0] + '#' + mark
                  print(f"[SUCCESS-HY2] {result[:70]}...")
                  return result

              except Exception as e:
                  print(f"[ERROR-HY2] {cfg['hostname']}: {type(e).__name__}: {e}")
                  return None
              finally:
                  if proc is not None and proc.poll() is None:
                      proc.terminate()
                      try:
                          proc.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          proc.kill()
                  for path in (cfg_path, log_path):
                      if os.path.exists(path):
                          try:
                              os.remove(path)
                          except Exception:
                              pass

          def test_config(cfg):
              if cfg['type'] == 'vless':
                  return test_vless(cfg)
              if cfg['type'] == 'hy2':
                  return test_hy2(cfg)
              return None

          def test_in_batches(configs, batch_size=BATCH_SIZE):
              working = []
              total = len(configs)

              for start in range(0, total, batch_size):
                  if is_deadline_exceeded():
                      print("[!] Global deadline reached – stopping batches")
                      break

                  batch = configs[start:start + batch_size]
                  rem = remaining_time()
                  print(f"=== Batch {start // batch_size + 1}: {len(batch)} configs, remaining={int(rem)}s ===")

                  executor = ThreadPoolExecutor(max_workers=TEST_WORKERS)
                  futures = {executor.submit(test_config, cfg): cfg for cfg in batch}

                  try:
                      for future in as_completed(futures, timeout=max(5, rem - 10)):
                          try:
                              result = future.result(timeout=1)
                          except Exception as e:
                              cfg = futures[future]
                              print(f"[TEST ERROR] {cfg['type']} {cfg['hostname']}: {type(e).__name__}")
                              continue

                          if result:
                              with results_lock:
                                  working.append(result)
                              print(f"[+] Working: {result.split('#')[-1][:80]}")
                  except FuturesTimeoutError:
                      print("[!] Batch timeout – cancelling remaining futures")
                  finally:
                      for f in futures:
                          f.cancel()
                      executor.shutdown(wait=False, cancel_futures=True)

              return working

          # ====================== MAIN ======================
          print("Downloading and parsing configs...")
          all_configs = download_and_parse_links()
          print(f"Total unique configs: {len(all_configs)}")

          print("Filtering by white-list + TCP probe...")
          filtered = []
          with ThreadPoolExecutor(max_workers=MAX_WORKERS_FILTER) as executor:
              futures = {executor.submit(filter_config, cfg): cfg for cfg in all_configs}
              for future in as_completed(futures):
                  res = future.result()
                  if res:
                      filtered.append(res)
          print(f"After filter + TCP probe: {len(filtered)}")

          print("Testing connectivity in batches...")
          working = test_in_batches(filtered, batch_size=BATCH_SIZE)

          print(f"\n=== RESULTS ===")
          print(f"Working configs: {len(working)}")
          print(f"DNS fails: {dns_fail_count}")
          print(f"Time elapsed: {int(time.time() - start_time)}s")

          os.makedirs("results", exist_ok=True)
          with open("results/working_vless_hy2.txt", "w", encoding="utf-8") as f:
              for line in sorted(set(working)):
                  f.write(line + "\n")

          with open("results/stats.txt", "w", encoding="utf-8") as f:
              f.write(f"Updated: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}\n")
              f.write(f"Working: {len(working)}\n")
              f.write(f"DNS fails: {dns_fail_count}\n")
              f.write(f"Elapsed: {int(time.time() - start_time)}s\n")

          print("Saved results/working_vless_hy2.txt and results/stats.txt")
          PYEOF

          python checker.py

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update white-cidr working configs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

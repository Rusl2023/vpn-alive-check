name: Build Mihomo Config from Live VLESS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VPN_RAW_URL: "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt"
      OUTPUT_DIR: "githubmirror"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

      - name: Download raw VLESS subscription
        run: |
          curl -fsSL "$VPN_RAW_URL" -o "$OUTPUT_DIR/raw.txt"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip pyyaml

      - name: Generate Mihomo config.yaml
        run: |
          python3 - <<'EOF'
          import yaml
          import urllib.parse
          import re

          RAW = "${{ env.OUTPUT_DIR }}/raw.txt"
          OUT = "${{ env.OUTPUT_DIR }}/config.yaml"

          proxies = []
          proxy_names = []
          seen = set()

          class CustomDumper(yaml.SafeDumper):
              # Живые эмодзи и выборочные кавычки
              def represent_scalar(self, tag, value, style=None):
                  if isinstance(value, str) and any(0x1F1E6 <= ord(c) <= 0x1F1FF for c in value):
                      style = '"'
                  return super().represent_scalar(tag, value, style)

          def str_representer(dumper, data):
              # UUID (любой регистр), Flow, Fingerprint, Encryption — всегда в кавычках
              if re.fullmatch(r'(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', data) or \
                 data in ["xtls-rprx-vision", "chrome", "qq", "none", "tcp"]:
                  return dumper.represent_scalar('tag:yaml.org,2002:str', data, style='"')

              # Имена с эмодзи, пробелами или спецсимволами YAML — в кавычки
              if any(0x1F1E6 <= ord(c) <= 0x1F1FF for c in data) or any(c in data for c in ' []:#:*'):
                  return dumper.represent_scalar('tag:yaml.org,2002:str', data, style='"')

              # IP, домены и прочие ключи — без кавычек
              return dumper.represent_scalar('tag:yaml.org,2002:str', data)

          CustomDumper.add_representer(str, str_representer)

          with open(RAW, encoding='utf-8', errors='ignore') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('vless://'):
                      continue
                  u = urllib.parse.urlparse(line)
                  q = urllib.parse.parse_qs(u.query)
                  raw_name = u.fragment or f'{u.hostname}:{u.port}'
                  name = urllib.parse.unquote(raw_name)
                  if name in seen:
                      continue
                  seen.add(name)

                  proxy = {
                      "name": name,
                      "type": "vless",
                      "server": u.hostname,
                      "port": int(u.port),
                      "uuid": u.username,
                      "network": q.get("type", ["tcp"])[0],
                      "flow": q.get("flow", [""])[0],
                      "servername": q.get("sni", [""])[0],
                      "client-fingerprint": "chrome",
                      "encryption": "none",
                      "tls": True,
                      "udp": True,
                      "reality-opts": {
                          "public-key": q.get("pbk", [""])[0]
                      }
                  }

                  if name == ">>@oneclickvpnkeys::NL (3)":
                      proxy["client-fingerprint"] = "qq"

                  if "sid" in q:
                      proxy["reality-opts"]["short-id"] = q["sid"][0]

                  # tcp-opts и spiderx только для нужных доменов
                  if name.startswith("[OpenRay]") or "[SNI-RU]" in name:
                      if any(domain in name for domain in ["stats.vk-portal.net", "queuev4.vk.com"]):
                          proxy["reality-opts"]["spiderx"] = "/"
                          proxy["tcp-opts"] = {"header": {"type": "none"}}

                  proxies.append(proxy)
                  proxy_names.append(name)

          config = {
              "proxies": proxies,
              "proxy-groups": [{"name": "auto", "type": "select", "proxies": proxy_names}],
              "rules": ["MATCH,auto"]
          }

          with open(OUT, "w", encoding="utf-8") as f:
              yaml.dump(
                  config,
                  f,
                  allow_unicode=True,       # живые эмодзи
                  sort_keys=False,
                  Dumper=CustomDumper,
                  indent=2,
                  default_flow_style=False
              )
          EOF

      - name: Commit and push to generated-config
        run: |
          cd "$OUTPUT_DIR"
          git init
          git checkout -B generated-config
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "Auto update Mihomo config" || echo "No changes"
          git push -f origin generated-config

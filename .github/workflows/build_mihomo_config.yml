name: Build Mihomo Config from Live VLESS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VPN_RAW_URL: "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt"
      OUTPUT_DIR: "githubmirror"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

      - name: Download raw VLESS subscription
        run: |
          curl -fsSL "$VPN_RAW_URL" -o "$OUTPUT_DIR/raw.txt"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip pyyaml

      - name: Generate Mihomo config.yaml
        run: |
          python3 - <<'EOF'
          import yaml
          import urllib.parse
          import re

          RAW = "${{ env.OUTPUT_DIR }}/raw.txt"
          OUT = "${{ env.OUTPUT_DIR }}/config.yaml"

          proxies = []
          proxy_names = []
          seen_names = set()
          seen_servers = set()

          with open(RAW, encoding='utf-8', errors='ignore') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('vless://'): continue
                  u = urllib.parse.urlparse(line)
                  q = urllib.parse.parse_qs(u.query)
                  name = urllib.parse.unquote(u.fragment or f'{u.hostname}:{u.port}')

                  server_port = f'{u.hostname}:{u.port}'
                  if name in seen_names or server_port in seen_servers: continue
                  seen_names.add(name)
                  seen_servers.add(server_port)

                  proxy = {
                      "name": name,
                      "type": "vless",
                      "server": u.hostname,
                      "port": int(u.port),
                      "uuid": u.username,
                      "network": q.get("type", ["tcp"])[0],
                      "flow": q.get("flow", [""])[0],
                      "servername": q.get("sni", [""])[0],
                      "client-fingerprint": "chrome",
                      "encryption": "none",
                      "tls": True,
                      "udp": True,
                      "reality-opts": {
                          "public-key": q.get("pbk", [""])[0]
                      }
                  }

                  if "sid" in q:
                      proxy["reality-opts"]["short-id"] = q.get("sid")[0]

                  if name.startswith("[OpenRay]") or "[SNI-RU]" in name:
                      if any(domain in name for domain in ["stats.vk-portal.net", "queuev4.vk.com"]):
                          proxy["reality-opts"]["spiderx"] = "/"
                          proxy["tcp-opts"] = {"header": {"type": "none"}}

                  proxies.append(proxy)
                  proxy_names.append(name)

          # Создаем конфигурацию вручную
          config = {
              "proxies": proxies,
              "proxy-groups": [{"name": "auto", "type": "select", "proxies": proxy_names}],
              "rules": ["MATCH,auto"]
          }

          # Кастомный YAML-думпер для живых эмодзи
          class RealEmojiDumper(yaml.SafeDumper):
              pass

          def represent_str(dumper, data):
              # Если есть emoji-флаг или пробелы/спецсимволы — ставим кавычки
              if any(0x1F1E6 <= ord(c) <= 0x1F1FF for c in data) or ' ' in data or any(c in data for c in '[]:#*'):
                  return dumper.represent_scalar('tag:yaml.org,2002:str', data, style='"')
              # UUID и технические поля — в кавычки
              if '-' in data or data in ["chrome", "none", "vless", "tcp"]:
                  return dumper.represent_scalar('tag:yaml.org,2002:str', data, style='"')
              return dumper.represent_scalar('tag:yaml.org,2002:str', data)

          RealEmojiDumper.add_representer(str, represent_str)

          with open(OUT, "w", encoding="utf-8") as f:
              yaml.dump(config, f, Dumper=RealEmojiDumper, allow_unicode=True, sort_keys=False, indent=2, default_flow_style=False)
          EOF

      - name: Commit and push
        run: |
          cd "$OUTPUT_DIR"
          git init
          git checkout -b master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "Update: $(date +'%Y-%m-%d %H:%M')"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin master:generated-config

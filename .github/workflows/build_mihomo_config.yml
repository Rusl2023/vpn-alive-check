name: Build Mihomo Config from Live VLESS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VPN_RAW_URL: "https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt"
      OUTPUT_DIR: "githubmirror"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          mkdir -p "$OUTPUT_DIR"

      - name: Download raw VLESS subscription
        run: |
          curl -fsSL "$VPN_RAW_URL" -o "$OUTPUT_DIR/raw.txt"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip

      - name: Generate Mihomo config.yaml
        run: |
          python3 - <<'EOF'
          import json
          import urllib.parse
          import os

          RAW = os.environ['OUTPUT_DIR'] + "/raw.txt"
          OUT = os.environ['OUTPUT_DIR'] + "/config.yaml"

          proxies = []
          seen_names = []

          # Формируем список только из текущего raw-файла
          with open(RAW, encoding='utf-8', errors='ignore') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('vless://'): 
                      continue
                  u = urllib.parse.urlparse(line)
                  q = urllib.parse.parse_qs(u.query)
                  name = urllib.parse.unquote(u.fragment or f'{u.hostname}:{u.port}')

                  # Исключаем 'auto' и дубликаты
                  if name == "auto" or name in seen_names: 
                      continue
                  seen_names.append(name)

                  proxy = {
                      "name": name,
                      "type": "vless",
                      "server": u.hostname,
                      "port": int(u.port),
                      "uuid": u.username,
                      "network": q.get("type", ["tcp"])[0],
                      "flow": q.get("flow", [""])[0],
                      "servername": q.get("sni", [""])[0],
                      "client-fingerprint": "chrome",
                      "encryption": "none",
                      "tls": True,
                      "udp": True,
                      "reality-opts": {
                          "public-key": q.get("pbk", [""])[0]
                      }
                  }

                  if "sid" in q:
                      proxy["reality-opts"]["short-id"] = q.get("sid")[0]

                  if name.startswith("[OpenRay]") or "[SNI-RU]" in name:
                      if any(domain in name for domain in ["stats.vk-portal.net", "queuev4.vk.com"]):
                          proxy["reality-opts"]["spiderx"] = "/"
                          proxy["tcp-opts"] = {"header": {"type": "none"}}

                  proxies.append(proxy)

          with open(OUT, "w", encoding="utf-8") as f:
              # Прокси
              f.write("proxies:\n")
              for p in proxies:
                  f.write(f"  - name: {json.dumps(p['name'], ensure_ascii=False)}\n")
                  f.write(f"    type: {json.dumps(p['type'])}\n")
                  f.write(f"    server: {p['server']}\n")
                  f.write(f"    port: {p['port']}\n")
                  f.write(f"    uuid: {json.dumps(p['uuid'])}\n")
                  f.write(f"    network: {json.dumps(p['network'])}\n")
                  f.write(f"    flow: {json.dumps(p['flow'])}\n")
                  f.write(f"    servername: {json.dumps(p['servername'])}\n")
                  if "client-fingerprint" in p:
                      f.write(f"    client-fingerprint: {json.dumps(p['client-fingerprint'])}\n")
                  f.write(f"    encryption: {json.dumps(p['encryption'])}\n")
                  f.write(f"    tls: {str(p['tls']).lower()}\n")
                  f.write(f"    udp: {str(p['udp']).lower()}\n")
                  f.write(f"    reality-opts:\n")
                  f.write(f"      public-key: {json.dumps(p['reality-opts']['public-key'])}\n")
                  if "short-id" in p["reality-opts"]:
                      f.write(f"      short-id: {json.dumps(p['reality-opts']['short-id'])}\n")
                  if "spiderx" in p["reality-opts"]:
                      f.write(f"      spiderx: {json.dumps(p['reality-opts']['spiderx'])}\n")
                  if "tcp-opts" in p:
                      f.write(f"    tcp-opts:\n      header:\n        type: {json.dumps(p['tcp-opts']['header']['type'])}\n")
                  f.write("\n")

              # Proxy-groups с кавычками
              f.write("proxy-groups:\n")
              f.write('  - name: "auto"\n')
              f.write('    type: "select"\n')
              f.write('    proxies:\n')
              for n in seen_names:
                  f.write(f"      - {json.dumps(n, ensure_ascii=False)}\n")

              # Правила: Россия напрямую, остальные через auto
              f.write("\nrules:\n")
              f.write("  - GEOIP,RU,DIRECT\n")
              f.write("  - DOMAIN-SUFFIX,ru,DIRECT\n")
              f.write("  - MATCH,auto\n")
          EOF

      - name: Commit and push
        run: |
          cd "$OUTPUT_DIR"
          git init
          git checkout -b master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "Update: $(date +'%Y-%m-%d %H:%M')"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin master:generated-config

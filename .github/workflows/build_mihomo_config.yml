name: Build Mihomo Config from Live VLESS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VPN_RAW_URL: https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt
      IPLIST_REPO: rekryt/iplist
      OUTPUT_DIR: githubmirror

    steps:
      # ---------------- Set up directories ----------------
      - name: Set up directories
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          : > ${{ env.OUTPUT_DIR }}/26_proxy_subscription_raw.txt
          : > ${{ env.OUTPUT_DIR }}/26_proxy_subscription_merged.txt
          : > ${{ env.OUTPUT_DIR }}/config.yaml

      # ---------------- Download raw proxy subscription ----------------
      - name: Download raw proxy subscription
        run: |
          curl -sSL ${{ env.VPN_RAW_URL }} -o ${{ env.OUTPUT_DIR }}/26_proxy_subscription_raw.txt

      # ---------------- Checkout iplist repository ----------------
      - name: Checkout iplist
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IPLIST_REPO }}
          path: iplist
          persist-credentials: false

      # ---------------- Merge domain groups ----------------
      - name: Merge Domain Groups
        run: |
          RAW="${{ env.OUTPUT_DIR }}/26_proxy_subscription_raw.txt"
          MERGED="${{ env.OUTPUT_DIR }}/26_proxy_subscription_merged.txt"
          : > "$MERGED"

          # добавляем все прокси из raw
          cat "$RAW" >> "$MERGED"

          # добавляем группы доменов из iplist
          if [ -d "iplist/config" ]; then
            for GROUP in iplist/config/*; do
              if [ -d "$GROUP" ]; then
                for FILE in "$GROUP"/*; do
                  while IFS= read -r DOMAIN || [ -n "$DOMAIN" ]; do
                    echo "DOMAIN,$DOMAIN,PROXY" >> "$MERGED"
                  done < "$FILE"
                done
              fi
            done
          fi

          # добавляем только необходимые правила
          echo "GEOIP,ru,DIRECT" >> "$MERGED"
          echo "MATCH,auto" >> "$MERGED"

      # ---------------- Generate Mihomo Config ----------------
      - name: Generate Final Mihomo Config
        run: |
          RAW="${{ env.OUTPUT_DIR }}/26_proxy_subscription_merged.txt"
          OUTPUT="${{ env.OUTPUT_DIR }}/config.yaml"

          TMP_PY=$(mktemp)
          cat << 'EOF' > "$TMP_PY"
import yaml
import urllib.parse
import os

RAW = os.environ['RAW']
OUTPUT = os.environ['OUTPUT']

proxies = []
proxy_groups = [{'name':'auto','type':'select','proxies':[]}]

rules = []

with open(RAW, encoding='utf-8', errors='ignore') as f:
    for line in f:
        line = line.strip()
        if not line or line.startswith('#'):
            continue
        if line.startswith('vless://'):
            u = urllib.parse.urlparse(line)
            q = urllib.parse.parse_qs(u.query)
            stream_type = q.get('type',['tcp'])[0]
            flow = q.get('flow',[''])[0]
            sni = q.get('sni',[''])[0]
            pbk = q.get('pbk',[''])[0] if 'pbk' in q else ''
            sid = q.get('sid',[''])[0] if 'sid' in q else ''
            name = u.username if u.username else f'{u.hostname}:{u.port}'
            proxy = {
                'name': name,
                'type': 'vless',
                'server': u.hostname,
                'port': int(u.port),
                'uuid': u.username,
                'network': stream_type,
                'flow': flow,
                'servername': sni,
                'client-fingerprint': 'chrome',
                'encryption': 'none',
                'tls': True,
                'udp': True,
                'reality-opts': {'public-key': pbk}
            }
            if sid:
                proxy['reality-opts']['short-id'] = sid
            proxies.append(proxy)
            proxy_groups[0]['proxies'].append(name)
        else:
            rules.append(line)

rules.insert(0,'GEOIP,ru,DIRECT')
rules.append('MATCH,auto')

cfg = {'proxies': proxies, 'proxy-groups': proxy_groups, 'rules': rules}

with open(OUTPUT,'w', encoding='utf-8') as f:
    yaml.safe_dump(cfg, f, default_flow_style=True)
EOF

          RAW="$RAW" OUTPUT="$OUTPUT" python3 "$TMP_PY"
          rm -f "$TMP_PY"

      # ---------------- Commit and Push to generated-config ----------------
      - name: Commit and Push Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd ${{ env.OUTPUT_DIR }}
          git init
          git checkout -b generated-config
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add config.yaml 26_proxy_subscription_merged.txt
          git commit -m "Update generated Mihomo config [skip ci]" || echo "No changes to commit"
          git push -u origin generated-config --force

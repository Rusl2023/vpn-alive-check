name: Build Mihomo Config from Live VLESS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VPN_REPO: Rusl2023/vpn-alive-check
      IPLIST_REPO: rekryt/iplist
      OUTPUT_DIR: githubmirror

    steps:
      - name: Checkout self repo
        uses: actions/checkout@v4

      - name: Set up output directory
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          : > ${{ env.OUTPUT_DIR }}/config.yaml
          : > ${{ env.OUTPUT_DIR }}/26_proxy_subscription_merged.txt

      - name: Checkout vpn-alive-check
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VPN_REPO }}
          path: vpn-alive-check
          persist-credentials: false

      - name: Checkout iplist
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IPLIST_REPO }}
          path: iplist
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip pyyaml

      # ---------------- Merge domain groups and geo rules ----------------
      - name: Merge Domain Groups and Geo Rules
        run: |
          RAW="vpn-alive-check/githubmirror/26_proxy_subscription_raw.txt"
          MERGED="${{ env.OUTPUT_DIR }}/26_proxy_subscription_merged.txt"
          : > "$MERGED"

          # добавляем все прокси из raw
          if [ -f "$RAW" ]; then
            cat "$RAW" >> "$MERGED"
          fi

          # добавляем группы доменов из iplist
          if [ -d "iplist/config" ]; then
            for GROUP in iplist/config/*; do
              if [ -d "$GROUP" ]; then
                for FILE in "$GROUP"/*; do
                  while IFS= read -r DOMAIN || [ -n "$DOMAIN" ]; do
                    echo "DOMAIN,$DOMAIN,PROXY" >> "$MERGED"
                  done < "$FILE"
                done
              fi
            done
          fi

          # добавляем geoip.dat и geosite.dat, если существуют
          if [ -f "vpn-alive-check/geoip/geoip.dat" ]; then
            echo "GEOIP,ru,DIRECT" >> "$MERGED"
            cat vpn-alive-check/geoip/geoip.dat >> "$MERGED"
          fi
          if [ -f "vpn-alive-check/geoip/geosite.dat" ]; then
            cat vpn-alive-check/geoip/geosite.dat >> "$MERGED"
          fi

      # ---------------- Generate Mihomo Config ----------------
      - name: Generate Final Mihomo Config
        run: |
          RAW="${{ env.OUTPUT_DIR }}/26_proxy_subscription_merged.txt"
          OUTPUT="${{ env.OUTPUT_DIR }}/config.yaml"

          TMP_PY=$(mktemp)
          echo "import yaml, os, urllib.parse" > "$TMP_PY"
          echo "RAW=os.environ['RAW']" >> "$TMP_PY"
          echo "OUTPUT=os.environ['OUTPUT']" >> "$TMP_PY"
          echo "proxies=[]; proxy_groups=[{'name':'auto','type':'select','proxies':[]}]; rules=[]" >> "$TMP_PY"
          echo "with open(RAW, encoding='utf-8', errors='ignore') as f:" >> "$TMP_PY"
          echo "    for line in f:" >> "$TMP_PY"
          echo "        line=line.strip()" >> "$TMP_PY"
          echo "        if not line or line.startswith('#'): continue" >> "$TMP_PY"
          echo "        if line.startswith('vless://'):" >> "$TMP_PY"
          echo "            u=urllib.parse.urlparse(line); q=urllib.parse.parse_qs(u.query)" >> "$TMP_PY"
          echo "            proxy={'name':u.username or f'{u.hostname}:{u.port}', 'type':'vless'," >> "$TMP_PY"
          echo "                   'server':u.hostname,'port':int(u.port),'uuid':u.username," >> "$TMP_PY"
          echo "                   'network':q.get('type',['tcp'])[0],'flow':q.get('flow',[''])[0]," >> "$TMP_PY"
          echo "                   'servername':q.get('sni',[''])[0],'client-fingerprint':'chrome'," >> "$TMP_PY"
          echo "                   'encryption':'none','tls':True,'udp':True,'reality-opts':{'public-key':q.get('pbk',[''])[0]}}" >> "$TMP_PY"
          echo "            if 'sid' in q: proxy['reality-opts']['short-id']=q['sid'][0]" >> "$TMP_PY"
          echo "            proxies.append(proxy); proxy_groups[0]['proxies'].append(proxy['name'])" >> "$TMP_PY"
          echo "        else: rules.append(line)" >> "$TMP_PY"
          echo "rules.insert(0,'GEOIP,ru,DIRECT'); rules.append('MATCH,auto')" >> "$TMP_PY"
          echo "cfg={'proxies':proxies,'proxy-groups':proxy_groups,'rules':rules}" >> "$TMP_PY"
          echo "with open(OUTPUT,'w',encoding='utf-8') as f: yaml.safe_dump(cfg,f,default_flow_style=False)" >> "$TMP_PY"

          RAW="$RAW" OUTPUT="$OUTPUT" python3 "$TMP_PY"
          rm -f "$TMP_PY"

      # ---------------- Commit and Push to generated-config ----------------
      - name: Commit and Push Generated Files
        run: |
          ls -l ${{ env.OUTPUT_DIR }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd ${{ env.OUTPUT_DIR }}
          git init
          git checkout -b generated-config
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # добавляем только реально существующие файлы
          for f in config.yaml 26_proxy_subscription_merged.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Update generated Mihomo config [skip ci]" || echo "No changes to commit"
          git push -u origin generated-config --force

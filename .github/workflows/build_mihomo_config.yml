name: Build Mihomo Config from Live VLESS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VPN_RAW_URL: https://raw.githubusercontent.com/Rusl2023/vpn-alive-check/refs/heads/main/githubmirror/26_proxy_subscription_raw.txt
      OUTPUT_DIR: githubmirror

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

      - name: Download raw VLESS subscription
        run: |
          curl -fsSL "$VPN_RAW_URL" -o "$OUTPUT_DIR/raw.txt"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip pyyaml

      - name: Generate Mihomo config.yaml
        run: |
          PY="$OUTPUT_DIR/gen.py"
          : > "$PY"
          echo "import yaml" >> "$PY"
          echo "import urllib.parse" >> "$PY"
          echo "RAW = '$OUTPUT_DIR/raw.txt'" >> "$PY"
          echo "OUT = '$OUTPUT_DIR/config.yaml'" >> "$PY"
          echo "proxies = []" >> "$PY"
          echo "proxy_names = []" >> "$PY"
          echo "seen = set()" >> "$PY"
          echo "with open(RAW, encoding='utf-8', errors='ignore') as f:" >> "$PY"
          echo "    for line in f:" >> "$PY"
          echo "        line = line.strip()" >> "$PY"
          echo "        if not line.startswith('vless://'):" >> "$PY"
          echo "            continue" >> "$PY"
          echo "        u = urllib.parse.urlparse(line)" >> "$PY"
          echo "        q = urllib.parse.parse_qs(u.query)" >> "$PY"
          echo "        raw_name = u.fragment or f'{u.hostname}:{u.port}'" >> "$PY"
          echo "        name = urllib.parse.unquote(raw_name)" >> "$PY"
          echo "        if name in seen:" >> "$PY"
          echo "            continue" >> "$PY"
          echo "        seen.add(name)" >> "$PY"
          echo "        proxy = {" >> "$PY"
          echo "            'name': name," >> "$PY"
          echo "            'type': 'vless'," >> "$PY"
          echo "            'server': u.hostname," >> "$PY"
          echo "            'port': int(u.port)," >> "$PY"
          echo "            'uuid': u.username," >> "$PY"
          echo "            'network': q.get('type', ['tcp'])[0]," >> "$PY"
          echo "            'flow': q.get('flow', [''])[0]," >> "$PY"
          echo "            'servername': q.get('sni', [''])[0]," >> "$PY"
          echo "            'client-fingerprint': 'chrome'," >> "$PY"
          echo "            'encryption': 'none'," >> "$PY"
          echo "            'tls': True," >> "$PY"
          echo "            'udp': True," >> "$PY"
          echo "            'reality-opts': {" >> "$PY"
          echo "                'public-key': q.get('pbk', [''])[0]" >> "$PY"
          echo "            }" >> "$PY"
          echo "        }" >> "$PY"
          echo "        if 'sid' in q:" >> "$PY"
          echo "            proxy['reality-opts']['short-id'] = q['sid'][0]" >> "$PY"
          echo "        proxies.append(proxy)" >> "$PY"
          echo "        proxy_names.append(name)" >> "$PY"
          echo "config = {" >> "$PY"
          echo "    'proxies': proxies," >> "$PY"
          echo "    'proxy-groups': [{" >> "$PY"
          echo "        'name': 'auto'," >> "$PY"
          echo "        'type': 'select'," >> "$PY"
          echo "        'proxies': proxy_names" >> "$PY"
          echo "    }]," >> "$PY"
          echo "    'rules': [" >> "$PY"
          echo "        'GEOIP,RU,DIRECT'," >> "$PY"
          echo "        'DOMAIN-SUFFIX,ru,DIRECT'," >> "$PY"
          echo "        'MATCH,auto'" >> "$PY"
          echo "    ]" >> "$PY"
          echo "}" >> "$PY"
          echo "with open(OUT, 'w', encoding='utf-8') as f:" >> "$PY"
          echo "    yaml.safe_dump(config, f, allow_unicode=True, sort_keys=False)" >> "$PY"

          python3 "$PY"

      - name: Commit and push to generated-config
        run: |
          cd "$OUTPUT_DIR"
          git init
          git checkout -B generated-config
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "Auto update Mihomo config" || echo "No changes"
          git push -f origin generated-config
